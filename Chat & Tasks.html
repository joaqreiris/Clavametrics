      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">URL *</label><input type="text" id="pinLinkUrl" placeholder="https://…" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none;box-sizing:border-box"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">Name *</label><input type="text" id="pinLinkName" placeholder="File name…" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none;box-sizing:border-box"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">Type</label>
        <select id="pinLinkType" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none">
          <option value="">Other</option><option value="pdf">PDF</option><option value="image">Image</option><option value="spreadsheet">Spreadsheet</option><option value="video">Video</option>
        </select>
      </div>`;
  }
}

function handlePinFileSelect(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pinModalFile = file;
  const preview = document.getElementById('pinUploadPreview');
  if (preview) {
    const { icon, color } = fileTypeIcon(getFileCategory(file));
    preview.innerHTML = `<div class="pending-att"><div class="pending-att-inner"><div class="pending-att-ic" style="color:${color}"><i class="ti ${icon}"></i></div><div class="pending-att-info"><div class="pending-att-name">${esc(file.name)}</div><div class="pending-att-size">${formatFileSize(file.size)}</div></div></div></div>`;
  }
  const area = document.getElementById('pinUploadArea');
  if (area) area.style.borderColor = 'var(--cm-accent)';
}

async function savePinModal() {
  const btn = document.getElementById('pinModalSaveBtn');
  if (pinModalTab === 'upload') {
    if (!pinModalFile) { alert('Select a file first.'); return; }
    if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }
    try {
      const safeName = pinModalFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path     = `${currentUser.clubId}/pinned/${Date.now()}-${safeName}`;
      const { error: upErr } = await window.sb.storage.from('chat-attachments').upload(path, pinModalFile, { cacheControl: '3600', upsert: false });
      if (upErr) throw upErr;
      const { data: { publicUrl } } = window.sb.storage.from('chat-attachments').getPublicUrl(path);
      await pinFileDirectly(publicUrl, pinModalFile.name, getFileCategory(pinModalFile));
      closePinModal();
    } catch (err) {
      console.error('Pin upload error:', err);
      alert('Error uploading: ' + (err.message || err));
    } finally {
      if (btn) { btn.textContent = 'Pin'; btn.disabled = false; }
    }
  } else {
    const url  = (document.getElementById('pinLinkUrl')?.value  || '').trim();
    const name = (document.getElementById('pinLinkName')?.value || '').trim();
    const type = document.getElementById('pinLinkType')?.value  || null;
    if (!url)  { document.getElementById('pinLinkUrl')?.focus(); return; }
    if (!name) { document.getElementById('pinLinkName')?.focus(); return; }
    await pinFileDirectly(url, name, type);
    closePinModal();
  }
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeNewTask(); closeTaskDetail(); closeDmPicker(); closePinModal(); }
});
document.getElementById('msgInput')?.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput')?.addEventListener('input', e => {
  clearTimeout(urlDetectTimer);
  const url = extractUrl(e.target.value);
  if (url) {
    urlDetectTimer = setTimeout(() => detectAndPreviewUrl(url), 700);
  } else if (draftLinkPreview) {
    clearLinkPreview();
  }
});

boot();

  async function ctInitTeamSwitch() {
    const prof = await window.getProfile();
    const bucket = (prof?.role || prof?.club_role || '').toLowerCase();
    let full = bucket === 'admin' || bucket === 'owner';
    if (!full && window.isSuperAdmin) { try { full = await window.isSuperAdmin(); } catch {} }
    let teams = await window.getTeams(currentUser.clubId);
    if (!full) { let mine=[]; try{mine=(await window.sb.rpc('my_team_ids')).data||[];}catch{} const s=new Set(mine); teams=teams.filter(t=>s.has(t.id)); }
    const sel = document.getElementById('ctTeamSelect');
    if (!sel) return;
    if (!teams.length) { sel.innerHTML='<option value="">Sin categorías</option>'; return; }
    const saved = sessionStorage.getItem('cal_active_team');
    currentUser.teamId = (saved && teams.some(t=>t.id===saved)) ? saved : teams[0].id;
    sel.innerHTML = teams.map(t=>`<option value="${t.id}" ${t.id===currentUser.teamId?'selected':''}>${t.name}</option>`).join('');
  }
  window.ctOnTeamChange = function(){ currentUser.teamId=document.getElementById('ctTeamSelect').value; sessionStorage.setItem('cal_active_team',currentUser.teamId); location.reload(); };
</script>
