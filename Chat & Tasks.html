    return `<div class="conv" style="margin:2px 0;${self ? 'opacity:.7' : 'cursor:pointer'}"${self ? '' : ` onclick="toggleGroupMember('${m.id}')"`}>
      ${window.cmAvatarHtml(m, 30)}
      <div class="body"><div class="name-row"><span class="name">${esc(name)}${self ? ' · ' + esc(tt('chat_tasks.you_label', 'you')) : ''}</span></div><div class="preview">${esc(m.job_title || m.role || '')}</div></div>
      <i class="ti ${on ? 'ti-circle-check-filled' : 'ti-circle'}" style="font-size:18px;color:${on ? 'var(--cm-accent)' : 'var(--cm-fg-faint)'};flex-shrink:0"></i>
    </div>`;
  }).join('');
}
function toggleGroupMember(id) {
  if (id === currentUser.id) return;   // self is managed via create / leave
  if (groupDraft.members.has(id)) groupDraft.members.delete(id); else groupDraft.members.add(id);
  renderGroupPicker();
}
async function saveGroup() {
  const name = (document.getElementById('groupNameInput').value || '').trim();
  if (!name) { alert(tt('chat_tasks.group_name_required', 'Enter a group name.')); return; }
  const memberIds = [...groupDraft.members];
  if (memberIds.filter(id => id !== currentUser.id).length === 0) { alert(tt('chat_tasks.group_needs_member', 'Add at least one member.')); return; }
  const saveBtn = document.getElementById('groupSaveBtn');
  saveBtn.disabled = true;
  try {
    if (!groupDraft.editing) {
      const { data: g, error } = await window.sb.from('chat_groups')
        .insert({ club_id: currentUser.clubId, name, created_by: currentUser.id })
        .select('id').single();
      if (error) throw error;
      const rows = memberIds.map(pid => ({ group_id: g.id, profile_id: pid, club_id: currentUser.clubId }));
      const { error: mErr } = await window.sb.from('chat_group_members').insert(rows);
      if (mErr) throw mErr;
      await loadGroups();
      document.getElementById('groupModalOverlay').classList.add('hidden');
      renderConvList();
      selectConv('cg:' + g.id);
    } else {
      const g = groups.find(x => x.id === groupDraft.editing);
      if (g && g.created_by === currentUser.id && name !== g.name) {
        await window.sb.from('chat_groups').update({ name }).eq('id', g.id);
      }
      const cur = new Set(g ? g.members : []);
      const add = memberIds.filter(id => !cur.has(id));
      const removeIds = [...cur].filter(id => !groupDraft.members.has(id));
      if (add.length) await window.sb.from('chat_group_members').insert(add.map(pid => ({ group_id: g.id, profile_id: pid, club_id: currentUser.clubId })));
      for (const pid of removeIds) await window.sb.from('chat_group_members').delete().eq('group_id', g.id).eq('profile_id', pid);
      await loadGroups();
      document.getElementById('groupModalOverlay').classList.add('hidden');
      renderConvList();
      updateChatHeader();
    }
  } catch (err) {
    console.error('saveGroup failed:', err);
    alert(tt('chat_tasks.group_save_failed', 'Could not save the group.'));
  } finally {
    saveBtn.disabled = false;
  }
}
async function deleteOrLeaveGroup() {
  const g = groups.find(x => x.id === groupDraft.editing);
  if (!g) return;
  const iAmCreator = g.created_by === currentUser.id;
  const msg = iAmCreator ? tt('chat_tasks.confirm_delete_group', 'Delete this group for everyone?')
                         : tt('chat_tasks.confirm_leave_group', 'Leave this group?');
  if (!confirm(msg)) return;
  try {
    if (iAmCreator) await window.sb.from('chat_groups').delete().eq('id', g.id);
    else await window.sb.from('chat_group_members').delete().eq('group_id', g.id).eq('profile_id', currentUser.id);
  } catch (err) {
    console.error('deleteOrLeaveGroup failed:', err);
    alert(tt('chat_tasks.group_save_failed', 'Could not save the group.'));
    return;
  }
  document.getElementById('groupModalOverlay').classList.add('hidden');
  const wasActive = activeConv === 'cg:' + g.id;
  await loadGroups();
  if (wasActive) { activeConv = 'group'; renderedIds.clear(); messages = []; await loadMessages(); updateChatHeader(); }
  renderConvList();
}

// ── TASKS ──
const STATUS_COL = { pending:'backlog', in_progress:'inprogress', cancelled:'blocked', done:'done' };
let activeTaskFilter = 'all';

function getFilteredTasks() {
  const myId = currentUser?.id;
  switch (activeTaskFilter) {
    case 'mine':     return allTasks.filter(t => t.assigned_to === myId && t.status !== 'cancelled');
    case 'overdue':  return allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done' && t.status !== 'cancelled');
    case 'today':    return allTasks.filter(t => t.due_date && isToday(t.due_date) && t.status !== 'done' && t.status !== 'cancelled');
    case 'matchday': return allTasks.filter(t => t.category === 'match_day' && t.status !== 'cancelled');
    case 'medical':  return allTasks.filter(t => t.category === 'medical'   && t.status !== 'cancelled');
    case 'routine':  return allTasks.filter(t => t.category === 'routine'   && t.status !== 'cancelled');
    default:         return allTasks.filter(t => t.status !== 'cancelled');
  }
}

function updatePillCounts() {
  const myId = currentUser?.id;
  const el = (id, n) => { const e = document.getElementById(id); if (e) e.textContent = n; };
  el('pillCtAll',      allTasks.filter(t => t.status !== 'cancelled').length);
  el('pillCtMine',     allTasks.filter(t => t.assigned_to === myId && t.status !== 'cancelled').length);
  el('pillCtOverdue',  allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done' && t.status !== 'cancelled').length);
  el('pillCtToday',    allTasks.filter(t => t.due_date && isToday(t.due_date) && t.status !== 'done' && t.status !== 'cancelled').length);
  el('pillCtMatchday', allTasks.filter(t => t.category === 'match_day' && t.status !== 'cancelled').length);
  el('pillCtMedical',  allTasks.filter(t => t.category === 'medical'   && t.status !== 'cancelled').length);
  el('pillCtRoutine',  allTasks.filter(t => t.category === 'routine'   && t.status !== 'cancelled').length);
}

async function loadTasks() {
  let _tkQ = window.sb.from('tasks')
    .select('id,title,description,status,priority,due_date,assigned_to,assigned_to_name,assigned_roles,created_by,category')
    .eq('club_id', currentUser.clubId);
  if (currentUser.teamId) _tkQ = _tkQ.eq('team_id', currentUser.teamId);
  const { data } = await _tkQ.order('created_at', { ascending: false });
  allTasks = data || [];
  renderKanban(getFilteredTasks());
  updatePillCounts();
  renderChatRightTasks();
  updateTasksBadge();
}

function renderKanban(tasks) {
  if (!tasks) tasks = getFilteredTasks();
  const cols   = { backlog: document.getElementById('colBacklog'), inprogress: document.getElementById('colInprogress'), blocked: document.getElementById('colBlocked'), done: document.getElementById('colDone') };
  const counts = { backlog: 0, inprogress: 0, blocked: 0, done: 0 };

  Object.values(cols).forEach(c => { if (c) c.innerHTML = ''; });

  for (const t of tasks) {
    const key = STATUS_COL[t.status] || 'backlog';
    counts[key]++;
    const col = cols[key];
    if (!col) continue;
    const el = document.createElement('div');
    el.innerHTML = renderTaskCardHTML(t);
    col.appendChild(el.firstChild);
  }

  document.getElementById('ctBacklog').textContent    = counts.backlog;
  document.getElementById('ctInprogress').textContent = counts.inprogress;
  document.getElementById('ctBlocked').textContent    = counts.blocked;
  document.getElementById('ctDone').textContent       = counts.done;

  const open = allTasks.filter(t => t.status !== 'done' && t.status !== 'cancelled').length;
  const overdue = allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done').length;
  const today   = allTasks.filter(t => t.due_date && isToday(t.due_date)   && t.status !== 'done').length;
  let sub = tt('chat_tasks.sub_open', `${open} open`, { n: open });
  if (today)   sub += ' · ' + tt('chat_tasks.sub_due_today', `${today} due today`, { n: today });
  if (overdue) sub += ' · ' + tt('chat_tasks.sub_overdue', `${overdue} overdue`, { n: overdue });
  document.getElementById('tasksSub').textContent = sub;
}

// ── Role → people resolution + per-role color (assign-by-role rendering) ──
// Colores estables por rol, usando tokens semánticos existentes del design system.
const ROLE_COLORS = {
  owner:        { bg:'var(--cm-accent-soft)', bd:'var(--cm-border)',      fg:'var(--cm-accent)'  },
  admin:        { bg:'var(--cm-warning-bg)',  bd:'var(--cm-warning-bd)',  fg:'var(--cm-warning)' },
  coach:        { bg:'var(--cm-info-bg)',     bd:'var(--cm-info-bd)',     fg:'var(--cm-info)'    },
  physio:       { bg:'var(--cm-danger-bg)',   bd:'var(--cm-danger-bd)',   fg:'var(--cm-danger)'  },
  analyst:      { bg:'var(--cm-violet-bg)',   bd:'var(--cm-violet-bd)',   fg:'var(--cm-violet)'  },
  nutritionist: { bg:'var(--cm-success-bg)',  bd:'var(--cm-success-bd)',  fg:'var(--cm-success)' },
  staff:        { bg:'var(--cm-bg-soft)',     bd:'var(--cm-border-soft)', fg:'var(--cm-fg-muted)'},
};
function roleColor(role) { return ROLE_COLORS[(role || '').toLowerCase()] || ROLE_COLORS.staff; }
// Resolve a roles array → active-team people with those roles (deduped by id).
function resolveRoleNames(roles) {
  const want = new Set((roles || []).map(r => (r || '').toLowerCase()));
  const seen = new Set(), out = [];
  for (const m of (members || [])) {
    const r = (m.role || '').toLowerCase();
    if (want.has(r) && !seen.has(m.id)) { seen.add(m.id); out.push({ id: m.id, full_name: m.full_name || '?', role: r }); }
  }
  return out;
}
// Foot HTML for a role-assigned task: up to 3 person chips (colored by role) + "+N";
// roles matching nobody in the active team fall back to a grey role-label chip.
function roleAssigneeHTML(t) {
  const people = resolveRoleNames(t.assigned_roles);
  const chips = [];
  people.slice(0, 3).forEach(p => {
    const c = roleColor(p.role);
    chips.push(`<div class="av tn" title="${esc(p.full_name)} · ${esc(roleLabel(p.role))}" style="background:${c.bg};border:1px solid ${c.bd};color:${c.fg}">${initials(p.full_name)}</div>`);
  });
  if (people.length > 3) {
    const rest = people.slice(3).map(p => p.full_name).join(', ');
    chips.push(`<div class="av tn" title="${esc(rest)}" style="background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);color:var(--cm-fg-muted)">+${people.length - 3}</div>`);
  }
  const matched = new Set(people.map(p => p.role));
  (t.assigned_roles || []).forEach(r => {
    const rl = (r || '').toLowerCase();
    if (rl && !matched.has(rl)) {
      chips.push(`<div class="av tn" title="${esc(tt('chat_tasks.no_role_in_team', `No ${roleLabel(rl)} in this team`, { role: roleLabel(rl) }))}" style="width:auto;padding:0 7px;border-radius:9px;background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);color:var(--cm-fg-muted)">${esc(roleLabel(rl))}</div>`);
    }
  });
  return chips.join('');
}

function renderTaskCardHTML(t) {
  const prio = { urgent:'hi', high:'hi', medium:'md', low:'lo' }[t.priority] || 'lo';
  const due  = t.due_date ? formatDate(t.due_date) : '';
  const ov   = t.due_date && isOverdue(t.due_date) && t.status !== 'done';
  const tod  = t.due_date && isToday(t.due_date)   && t.status !== 'done';
  const done = t.status === 'done';
  return `<div class="tcard${done ? '" style="opacity:.6"' : '"'} onclick="openTaskDetail('${t.id}')">
    <div class="tcard-top">
      <span class="tcard-prio ${prio}"></span>
      <span class="title"${done ? ' style="text-decoration:line-through"' : ''}>${esc(t.title)}</span>
    </div>
    <div class="foot">
      ${due ? `<span class="due${ov?' overdue':tod?' today':''}">${esc(due)}</span>` : ''}
      <div class="grow"></div>
      ${ (t.assigned_roles && t.assigned_roles.length)
           ? `<div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end">${roleAssigneeHTML(t)}</div>`
           : (t.assigned_to_name ? `<div class="av tn" title="${esc(t.assigned_to_name)}">${initials(t.assigned_to_name)}</div>` : '') }
    </div>
  </div>`;
}

// ── TASK DETAIL ──
function openTaskDetail(taskId) {
  const t = allTasks.find(x => x.id === taskId);
  if (!t) return;
  // Populate the editable fields with the task's current values.
  document.getElementById('detailTitleInput').value = t.title || '';
  document.getElementById('detailDescInput').value  = t.description || '';
  document.getElementById('detailStatus').value     = t.status || 'pending';
  document.getElementById('detailDueInput').value   = t.due_date || '';
  document.getElementById('detailPriority').value   = t.priority || 'medium';
  document.getElementById('detailCategory').value   = t.category || 'general';
  // Assignment mode: role mode (with the task's roles preselected) if it carries roles,
  // otherwise "For me" / individual.
  if (t.assigned_roles && t.assigned_roles.length) {
    setDetailMode('roles', t.assigned_roles);
  } else {
    setDetailMode('me');
  }
  // Reset the delete confirmation state each time the modal opens.
  const _del = document.getElementById('detailDeleteBtn');
  if (_del) _del.textContent = tt('common.delete', 'Delete');
  _detailDeleteArmed = false;
  document.getElementById('detailPanel').dataset.taskId = taskId;
  loadTaskReminders(taskId, 'detailRemindersList');   // pending rows editable, sent ones shown as history
  document.getElementById('detailOverlay').classList.add('is-open');
  document.getElementById('detailPanel').classList.add('is-open');
}
function closeTaskDetail() {
  document.getElementById('detailOverlay').classList.remove('is-open');
  document.getElementById('detailPanel').classList.remove('is-open');
}
// ── Detail assignment mode (reuses the L1 model: "For me" vs "By role(s)") ──
let _detailMode = 'me';
function populateDetailRoleChips(preselected) {
  const box = document.getElementById('detailRoles');
  if (!box) return;
  const pre = new Set((preselected || []).map(r => (r || '').toLowerCase()));
  const roles = [...new Set((members || []).map(m => (m.role || '').trim()).filter(Boolean))].sort();
  box.innerHTML = '';
  if (!roles.length) { box.innerHTML = `<span style="font:var(--cm-body-sm);color:var(--cm-fg-muted)">${esc(tt('chat_tasks.no_staff_roles', 'No staff roles in this team.'))}</span>`; return; }
  roles.forEach(r => {
    const on = pre.has(r.toLowerCase());
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'role-chip cm-btn is-sm ' + (on ? 'is-primary is-on' : 'is-outline');
    b.dataset.role = r;
    b.textContent = roleLabel(r);
    b.onclick = () => {
      b.classList.toggle('is-on');
      const o = b.classList.contains('is-on');
      b.classList.toggle('is-primary', o);
      b.classList.toggle('is-outline', !o);
      const h = document.getElementById('detailRolesHint');
      if (h) h.textContent = '';
    };
    box.appendChild(b);
  });
}
function setDetailMode(mode, preselectedRoles) {
  _detailMode = mode;
  document.querySelectorAll('#detailModeSeg [data-mode]').forEach(btn => {
    const on = btn.dataset.mode === mode;
    btn.classList.toggle('is-primary', on);
    btn.classList.toggle('is-outline', !on);
  });
  const rolesField = document.getElementById('detailRolesField');
  const hint       = document.getElementById('detailRolesHint');
  if (rolesField) rolesField.style.display = (mode === 'roles') ? '' : 'none';
  if (mode === 'roles') {
    populateDetailRoleChips(preselectedRoles);
    if (hint) hint.textContent = currentUser.teamId ? '' : tt('chat_tasks.select_active_team_role_hint', 'Select an active team to assign by role.');
  }
}

async function saveDetail() {
  const taskId = document.getElementById('detailPanel').dataset.taskId;
  if (!taskId) return;
  const title = document.getElementById('detailTitleInput').value.trim();
  if (!title) { document.getElementById('detailTitleInput').focus(); alert(tt('chat_tasks.title_required', 'Title is required')); return; }

  // Assignment: strictly one or the other (never both).
  const mode = _detailMode || 'me';
  let assigned_to = null, assigned_to_name = null, assigned_roles = null;
  if (mode === 'roles') {
    if (!currentUser.teamId) { alert(tt('chat_tasks.select_active_team_role', 'Select an active team to assign by role')); return; }
    const roles = [...document.querySelectorAll('#detailRoles .role-chip.is-on')].map(el => el.dataset.role);
    if (!roles.length) {
      const h = document.getElementById('detailRolesHint');
      if (h) h.textContent = tt('chat_tasks.pick_at_least_one_role', 'Pick at least one role.');
      return;
    }
    assigned_roles = roles;
  } else {
    assigned_to      = currentUser.id;
    assigned_to_name = currentUser.name;
  }

  const patch = {
    title,
    description: document.getElementById('detailDescInput').value.trim() || null,
    due_date:    document.getElementById('detailDueInput').value || null,
    priority:    document.getElementById('detailPriority').value,
    category:    document.getElementById('detailCategory').value || 'general',
    status:      document.getElementById('detailStatus').value,
    assigned_to, assigned_to_name, assigned_roles,
    updated_at:  new Date().toISOString(),
  };
  const { error } = await window.sb.from('tasks').update(patch).eq('id', taskId);
  if (error) {
    console.error('Task update error:', error);
    alert(tt('chat_tasks.error_saving_task', 'Error saving task: ' + error.message, { msg: error.message }));
    return;
  }

  // Reminders: replace the PENDING ones, keep already-sent rows as history.
  try {
    await window.sb.from('task_reminders').delete().eq('task_id', taskId).is('sent_at', null);
    const { iso } = collectReminders('detailRemindersList');
    if (iso.length) {
      const { error: rErr } = await window.sb.from('task_reminders').insert(iso.map(remind_at => ({
        task_id: taskId, club_id: currentUser.clubId, remind_at, created_by: currentUser.id,
      })));
      if (rErr) console.warn('[reminders] insert failed:', rErr.message);
    }
  } catch (e) { console.warn('[reminders] failed:', e.message); }

  const t = allTasks.find(x => x.id === taskId);
  const _wasDone   = t && t.status === 'done';
  const _createdBy = t && t.created_by;
  if (t) Object.assign(t, patch);
  renderKanban();
  renderChatRightTasks();
  updateTasksBadge();

  // Notify everyone involved when a task transitions to done (not on every save of a done task).
  // Involved = creator + assignee(s); the person who completed it is always excluded.
  if (patch.status === 'done' && !_wasDone) {
    try {
      const ids = new Set();
      if (_createdBy)  ids.add(_createdBy);
      if (assigned_to) ids.add(assigned_to);
      if (assigned_roles && assigned_roles.length) {
        const want = new Set(assigned_roles.map(r => (r || '').toLowerCase()));
        (members || []).forEach(m => { if (want.has((m.role || '').toLowerCase())) ids.add(m.id); });
      }
      ids.delete(currentUser.id);
      const recipients = [...ids];
      if (recipients.length) {
        await window.sb.from('notifications').insert(recipients.map(uid => ({
          user_id: uid,
          club_id: currentUser.clubId,
          type:    'task_completed',
          title:   tt('chat_tasks.notif_task_completed', `Task completed: ${title}`, { title }),
          body:    tt('chat_tasks.notif_completed_by', `Completed by ${currentUser.name}`, { who: currentUser.name }),
          link:    '/Chat & Tasks.html',
        })));
      }
    } catch (e) { console.warn('[tasks] notify completed failed:', e.message); }
  }

  closeTaskDetail();
}

// Delete with a two-step inline confirm on the button (reset on modal open).
let _detailDeleteArmed = false;
async function deleteDetailTask() {
  const btn = document.getElementById('detailDeleteBtn');
  if (!_detailDeleteArmed) {
    _detailDeleteArmed = true;
    if (btn) btn.textContent = tt('chat_tasks.delete_confirm', "Delete this task? This can't be undone.");
    return;
  }
  const taskId = document.getElementById('detailPanel').dataset.taskId;
  if (!taskId) return;
  const { error } = await window.sb.from('tasks').delete().eq('id', taskId);
  if (error) {
    console.error('Task delete error:', error);
    alert(tt('chat_tasks.error_deleting_task', 'Error deleting task: ' + error.message, { msg: error.message }));
    return;
  }
  allTasks = allTasks.filter(x => x.id !== taskId);
  renderKanban();
  renderChatRightTasks();
  updateTasksBadge();
  closeTaskDetail();
}

// ── Task reminders UI (shared by New Task + Detail) ──
// Each reminder is one row with an absolute datetime-local. Presets are just
// shortcuts that prefill a row; everything is saved as an absolute remind_at.
function toLocalInputValue(d) {
  // Date → 'YYYY-MM-DDTHH:MM' in the user's LOCAL time (datetime-local format).
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function reminderRowHTML(value, sent) {
  if (sent) {
    return `<div class="rmd-row" data-sent="1" style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <input type="datetime-local" value="${value}" disabled style="flex:1;opacity:.55">
      <span style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted)">${esc(tt('chat_tasks.sent', 'sent'))}</span>
    </div>`;
  }
  return `<div class="rmd-row" style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
    <input type="datetime-local" class="rmd-input" value="${value}" style="flex:1">
    <button type="button" class="cm-btn is-outline is-sm" onclick="this.closest('.rmd-row').remove()" title="${esc(tt('chat_tasks.remove', 'Remove'))}"><i class="ti ti-x" style="font-size:13px"></i></button>
  </div>`;
}
function addReminderRow(listId, value) {
  const list = document.getElementById(listId);
  if (list) list.insertAdjacentHTML('beforeend', reminderRowHTML(value || '', false));
}
function addPresetReminder(listId, dueInputId, preset) {
  if (preset === 'custom') { addReminderRow(listId, ''); return; }
  const dueStr = document.getElementById(dueInputId)?.value || '';
  // Base = due date at 09:00 local, or now() when there's no due date.
  const base = dueStr ? new Date(dueStr + 'T09:00') : new Date();
  const d = new Date(base);
  if (preset === 'day')       d.setDate(d.getDate() - 1);
  else if (preset === 'hour') d.setHours(d.getHours() - 1);
  // 'due' → base as-is
  addReminderRow(listId, toLocalInputValue(d));
}
// Collect pending (non-sent) rows → { iso: [timestamptz…], hadPast: bool }.
// datetime-local is LOCAL wall-time; new Date(local).toISOString() gives the
// correct UTC instant so a "15:00" reminder fires at 15:00 the user's time.
function collectReminders(listId) {
  const rows = [...document.querySelectorAll(`#${listId} .rmd-row:not([data-sent]) .rmd-input`)];
  const iso = []; let hadPast = false;
  rows.forEach(inp => {
    const v = inp.value;
    if (!v) return;
    const d = new Date(v);
    if (isNaN(d.getTime())) return;
    if (d.getTime() < Date.now()) { hadPast = true; return; }
    iso.push(d.toISOString());
  });
  return { iso, hadPast };
}
async function loadTaskReminders(taskId, listId) {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';
  const { data } = await window.sb.from('task_reminders')
    .select('remind_at, sent_at').eq('task_id', taskId).order('remind_at');
  (data || []).forEach(r => {
    list.insertAdjacentHTML('beforeend',
      reminderRowHTML(toLocalInputValue(new Date(r.remind_at)), !!r.sent_at));
  });
}

async function saveNewTask() {
  const title = document.getElementById('newTaskTitle').value.trim();
  if (!title) { document.getElementById('newTaskTitle').focus(); return; }

  // Assignment mode: "me" (self, individual) or "roles" (staff role[], team-scoped).
  const mode = _newTaskMode || 'me';
  let assigned_to = null, assigned_to_name = null, assigned_roles = null;

  if (mode === 'roles') {
    // Role-assigned tasks need a team: the RLS role branch requires team_id IN my_team_ids().
    if (!currentUser.teamId) {
      alert(tt('chat_tasks.select_active_team_role_new', 'Select an active team before assigning a task by role.'));
      return;
    }
    const roles = [...document.querySelectorAll('#newTaskRoles .role-chip.is-on')].map(el => el.dataset.role);
    if (!roles.length) {
      const hint = document.getElementById('newTaskRolesHint');
      if (hint) hint.textContent = tt('chat_tasks.pick_at_least_one_role', 'Pick at least one role.');
      return;
    }
    assigned_roles = roles;
  } else {
    // "For me": force self-assignment (ignores the shelved person dropdown).
    assigned_to      = currentUser.id;
    assigned_to_name = currentUser.name;
  }

  const { data, error } = await window.sb.from('tasks').insert({
    club_id:          currentUser.clubId,
    created_by:       currentUser.id,
    created_by_name:  currentUser.name,
    assigned_to,
    assigned_to_name,
    assigned_roles,
    title,
    description: document.getElementById('newTaskDesc').value.trim() || null,
    due_date:    document.getElementById('newTaskDue').value || null,
    priority:    document.getElementById('newTaskPriority').value,
    category:    document.getElementById('newTaskCategory').value || 'general',
    status:      'pending',
    team_id:     currentUser.teamId || null
  }).select().single();
  if (error) {
    console.error('Task insert error:', error);
    alert(tt('chat_tasks.error_creating_task', 'Error creating task: ' + error.message, { msg: error.message }));
    return;
  }
  if (!data) {
    console.error('Task insert returned no data — check RLS policies on tasks table');
    return;
  }
  allTasks.unshift(data);
  renderKanban();
  renderChatRightTasks();
  updateTasksBadge();

  // Reminders → task_reminders (absolute times). Task already exists; failures are non-fatal.
  try {
    const { iso, hadPast } = collectReminders('newTaskRemindersList');
    if (iso.length) {
      const { error: rErr } = await window.sb.from('task_reminders').insert(iso.map(remind_at => ({
        task_id: data.id, club_id: currentUser.clubId, remind_at, created_by: currentUser.id,
      })));
      if (rErr) console.warn('[reminders] insert failed:', rErr.message);
    }
    if (hadPast) console.warn('[reminders] some reminder times were in the past and were skipped');
  } catch (e) { console.warn('[reminders] failed:', e.message); }

  // Notify assignees on creation (role-assigned only; "For me" is self → no notification).
  if (mode === 'roles' && assigned_roles && assigned_roles.length) {
    try {
      const want = new Set(assigned_roles.map(r => (r || '').toLowerCase()));
      const seen = new Set();
      const recipients = (members || []).filter(m => {
        const r = (m.role || '').toLowerCase();
        if (m.id === currentUser.id) return false;          // don't notify the creator
        if (!want.has(r) || seen.has(m.id)) return false;
        seen.add(m.id);
        return true;
      });
      if (recipients.length) {
        await window.sb.from('notifications').insert(recipients.map(m => ({
          user_id: m.id,
          club_id: currentUser.clubId,
          type:    'task_assigned',
          title:   tt('chat_tasks.notif_new_task', `New task: ${title}`, { title }),
          body:    tt('chat_tasks.notif_assigned_to_you', `Assigned to you · ${roleLabel(m.role)}`, { role: roleLabel(m.role) }),
          link:    '/Chat & Tasks.html',
        })));
      }
    } catch (e) { console.warn('[tasks] notify assignees failed:', e.message); }
  }

  closeNewTask();
}

// ── REALTIME ──
function subscribeRealtime() {
  // Limpiar canales viejos de esta página antes de re-suscribir (evita duplicados)
  try { window.sb.getChannels().filter(c => ['cm-chat-messages','cm-tasks'].includes(c.topic.replace('realtime:',''))).forEach(c => window.sb.removeChannel(c)); } catch(_){}
  window.sb.channel('cm-chat-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `club_id=eq.${currentUser.clubId}` }, handleNewMessage)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'channel_reads', filter: `club_id=eq.${currentUser.clubId}` }, handleReadReceipt)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'channel_reads', filter: `club_id=eq.${currentUser.clubId}` }, handleReadReceipt)
    .subscribe();

  window.sb.channel('cm-tasks')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tasks', filter: `club_id=eq.${currentUser.clubId}` }, payload => {
      const t = payload.new;
      if (!allTasks.find(x => x.id === t.id)) { allTasks.unshift(t); renderKanban(); renderChatRightTasks(); updateTasksBadge(); }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tasks', filter: `club_id=eq.${currentUser.clubId}` }, payload => {
      const t = payload.new;
      const i = allTasks.findIndex(x => x.id === t.id);
      if (i >= 0) allTasks[i] = t; else allTasks.unshift(t);
      renderKanban(); renderChatRightTasks(); updateTasksBadge();
    })
    .subscribe();
}

// Someone updated their read marker → refresh the read ticks if it affects the open conversation.
function handleReadReceipt(payload) {
  const r = payload.new;
  if (!r || r.user_id === currentUser.id) return;
  const relevant = (activeConv === 'group' || isCg(activeConv))
    ? r.channel_key === activeChannelKey()
    : (r.channel_key === currentUser.id && r.user_id === activeConv);
  if (!relevant) return;
  readState[r.user_id] = r.last_read_at;
  refreshReadTicks();
}

function handleNewMessage(payload) {
  const msg = payload.new;
  if (!msg) return;
  const isCgMsg = !!msg.group_id;                       // custom group message
  const isTeam  = !msg.recipient_id && !msg.group_id;   // team channel
  const isDm    = !!msg.recipient_id;                   // 1:1 DM

  // Ignore custom-group messages for groups I'm not a member of (defensive: covers the case
  // where realtime delivery isn't RLS-filtered — never surface a preview/unread to a non-member).
  if (isCgMsg && !groups.some(g => g.id === msg.group_id)) return;

  const inActive =
    (activeConv === 'group' && isTeam) ||
    (isCg(activeConv) && isCgMsg && cgId(activeConv) === msg.group_id) ||
    (isDm && !isCg(activeConv) && activeConv !== 'group' && (msg.sender_id === activeConv || msg.recipient_id === activeConv));

  // Sonido al recibir un mensaje entrante (nunca para los propios / eco optimista)
  if (msg.sender_id !== currentUser.id) playIncomingSound();

  if (inActive && !messages.find(m => m.id === msg.id)) {
    messages.push(msg); appendMsg(msg);
    // Viendo la conversación → marcar leído al instante para que el emisor vea el doble check.
    if (msg.sender_id !== currentUser.id) markChannelReadDb(activeChannelKey());
  }

  if (isDm) {
    const pid = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
    if (!dmLastMsg[pid] || msg.created_at > dmLastMsg[pid].created_at) dmLastMsg[pid] = msg;
  } else if (isCgMsg) {
    if (!groupLastMsg[msg.group_id] || msg.created_at > groupLastMsg[msg.group_id].created_at) groupLastMsg[msg.group_id] = msg;
  }

  if (msg.sender_id !== currentUser.id && !inActive) {
    if (isDm) dmUnread[msg.sender_id] = (dmUnread[msg.sender_id] || 0) + 1;
    else if (isCgMsg) groupUnread[msg.group_id] = (groupUnread[msg.group_id] || 0) + 1;
    updateUnreadBadge();
    renderConvList();
  }
}

// ── FILE ATTACHMENT ──
function handleAttachClick() { document.getElementById('fileInput').click(); }

function getFileCategory(file) {
  const t = file.type;
  if (t.startsWith('image/'))  return 'image';
  if (t === 'application/pdf') return 'pdf';
  if (t.includes('word') || t.includes('document')) return 'doc';
  if (t.includes('sheet') || t.includes('excel') || t.includes('spreadsheet')) return 'spreadsheet';
  if (t.startsWith('video/'))  return 'video';
  return 'other';
}

function formatFileSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Add a list of File objects to the composer's pending attachments (shared by the file picker,
// paste-from-clipboard and drag-and-drop paths). Enforces the size cap and re-renders the chips.
function addFilesToPending(files) {
  files = [...files].filter(Boolean);
  if (!files.length) return;
  const tooBig = [];
  files.forEach(file => {
    if (file.size > CHAT_MAX_FILE_MB * 1024 * 1024) { tooBig.push(file.name); return; }
    pendingAttachments.push({ file, name: file.name, size: file.size, type: getFileCategory(file) });
  });
  if (tooBig.length) {
    alert(tt('chat_tasks.file_too_large', `Too large (max ${CHAT_MAX_FILE_MB} MB): {names}`, { max: CHAT_MAX_FILE_MB, names: tooBig.join(', ') }));
  }
  renderPendingAtt();
}

function handleFileSelect(e) {
  const files = [...e.target.files];
  e.target.value = '';
  addFilesToPending(files);
}

function pendingAttChipHtml(f, i) {
  const { icon, color } = fileTypeIcon(f.type);
  const sizeStr = formatFileSize(f.size);
  const thumb = f.type === 'image'
    ? `<img src="${URL.createObjectURL(f.file)}" class="pending-att-thumb" alt="${esc(f.name)}">`
    : `<div class="pending-att-ic" style="color:${color}"><i class="ti ${icon}"></i></div>`;
  return `<div class="pending-att"><div class="pending-att-inner">${thumb}<div class="pending-att-info"><div class="pending-att-name">${esc(f.name)}</div><div class="pending-att-size">${sizeStr}</div></div><button class="pending-att-rm" onclick="removePendingAtt(${i})"><i class="ti ti-x"></i></button></div></div>`;
}

function renderPendingAtt() {
  const el = document.getElementById('pendingAtt');
  if (!el) return;
  if (!pendingAttachments.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.innerHTML = pendingAttachments.map((f, i) => pendingAttChipHtml(f, i)).join('');
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.gap = '6px';
}

function removePendingAtt(idx) {
  if (typeof idx === 'number') pendingAttachments.splice(idx, 1);
  else pendingAttachments = [];
  renderPendingAtt();
}

async function uploadAttachment(file) {
  const channelId = activeConv === 'group' ? 'group' : activeConv;
  const safeName  = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path      = `${currentUser.clubId}/${channelId}/${Date.now()}-${safeName}`;
  const { error } = await window.sb.storage.from('chat-attachments').upload(path, file, { cacheControl: '3600', upsert: false });
  if (error) { console.error('uploadAttachment failed:', error); throw error; }
  const { data: { publicUrl } } = window.sb.storage.from('chat-attachments').getPublicUrl(path);
  return { url: publicUrl };
}

// ── URL DETECTION / LINK PREVIEW ──
function extractUrl(text) {
  const m = text.match(/https?:\/\/[^\s]+/);
  return m ? m[0] : null;
}

function extractYoutubeId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?.*v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function detectAndPreviewUrl(url) {
  const ytId = extractYoutubeId(url);
  if (ytId) {
    let preview = { type: 'youtube', url, videoId: ytId };
    try {
      const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
      if (res.ok) { const d = await res.json(); preview.title = d.title; preview.author = d.author_name; }
    } catch {}
    draftLinkPreview = preview;
  } else if (/vimeo\.com\/\d+/.test(url)) {
    let preview = { type: 'vimeo', url };
    try {
      const res = await fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`);
      if (res.ok) { const d = await res.json(); preview.title = d.title; preview.thumbnail = d.thumbnail_url; preview.author = d.author_name; }
    } catch {}
    draftLinkPreview = preview;
  } else {
    let preview = { type: 'link', url };
    try {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 5000);
      const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { signal: controller.signal });
      if (res.ok) {
        const html = await res.text();
        const doc  = new DOMParser().parseFromString(html, 'text/html');
        const og   = (p) => doc.querySelector(`meta[property="${p}"]`)?.content || doc.querySelector(`meta[name="${p}"]`)?.content || '';
        preview.title       = og('og:title')       || doc.title || '';
        preview.description = og('og:description') || '';
        preview.image       = og('og:image')       || '';
      }
    } catch {}
    draftLinkPreview = preview;
  }
  renderDraftLinkPreview();
}

function renderDraftLinkPreview() {
  const el = document.getElementById('linkPreviewDraft');
  if (!el || !draftLinkPreview) return;
  const lp    = draftLinkPreview;
  const label = lp.title || (() => { try { return new URL(lp.url).hostname; } catch { return lp.url; } })();
  el.innerHTML = `<div class="lp-draft"><i class="ti ti-link" style="font-size:13px;color:var(--cm-fg-muted);flex-shrink:0"></i><div class="lp-draft-info"><div class="lp-draft-title">${esc(label)}</div><div class="lp-draft-url">${esc(lp.url)}</div></div><button class="lp-draft-rm" onclick="clearLinkPreview()"><i class="ti ti-x"></i></button></div>`;
  el.style.display = '';
}

function clearLinkPreview() {
  draftLinkPreview = null;
  const el = document.getElementById('linkPreviewDraft');
  if (el) { el.innerHTML = ''; el.style.display = 'none'; }
}

function handlePinFileSelect(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pinModalFile = file;
  const preview = document.getElementById('pinUploadPreview');
  if (preview) {
    const { icon, color } = fileTypeIcon(getFileCategory(file));
    preview.innerHTML = `<div class="pending-att"><div class="pending-att-inner"><div class="pending-att-ic" style="color:${color}"><i class="ti ${icon}"></i></div><div class="pending-att-info"><div class="pending-att-name">${esc(file.name)}</div><div class="pending-att-size">${formatFileSize(file.size)}</div></div></div></div>`;
  }

  if (area) area.style.borderColor = 'var(--cm-accent)';
}

async function savePinModal() {
  const btn = document.getElementById('pinModalSaveBtn');
  if (pinModalTab === 'upload') {
    if (!pinModalFile) { alert(tt('chat_tasks.select_file_first', 'Select a file first.')); return; }
    if (btn) { btn.textContent = tt('chat_tasks.uploading', 'Uploading…'); btn.disabled = true; }
    try {
      const safeName = pinModalFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path     = `${currentUser.clubId}/pinned/${Date.now()}-${safeName}`;
      const { error: upErr } = await window.sb.storage.from('chat-attachments').upload(path, pinModalFile, { cacheControl: '3600', upsert: false });
      if (upErr) throw upErr;
      const { data: { publicUrl } } = window.sb.storage.from('chat-attachments').getPublicUrl(path);
      await pinFileDirectly(publicUrl, pinModalFile.name, getFileCategory(pinModalFile));
      closePinModal();
    } catch (err) {
      console.error('Pin upload error:', err);
      alert(tt('chat_tasks.error_uploading', 'Error uploading: ' + (err.message || err), { msg: (err.message || err) }));
    } finally {
      if (btn) { btn.textContent = tt('chat_tasks.pin', 'Pin'); btn.disabled = false; }
    }
  } else {
    const url  = (document.getElementById('pinLinkUrl')?.value  || '').trim();
    const name = (document.getElementById('pinLinkName')?.value || '').trim();
    const type = document.getElementById('pinLinkType')?.value  || null;
    if (!url)  { document.getElementById('pinLinkUrl')?.focus(); return; }
    if (!name) { document.getElementById('pinLinkName')?.focus(); return; }
    await pinFileDirectly(url, name, type);
    closePinModal();
  }
}

// ── COMPOSER POPOVERS (emoji + mention) + create task ──
const COMPOSER_EMOJIS = ['😀','😁','😂','🤣','😊','😉','😍','😘','😎','🤔','😐','😴','😅','😬','😢','😭','😤','😡','🥳','🤩','👍','👎','👏','🙌','🙏','💪','🔥','✅','❌','⭐','✨','💯','⚽','🏆','🥅','📋','📌','📎','⏱️','📅','⚠️','❤️','🎯','🚀','👀','💬','🎉','☝️'];

function _composerCloseAllPops() {
  document.getElementById('emojiPop')?.classList.add('is-hidden');
  document.getElementById('mentionPop')?.classList.add('is-hidden');
}

// Insert text at the caret position of #msgInput, then restore focus past it.
function _composerInsertAtCursor(text) {
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end   = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, start) + text + inp.value.slice(end);
  const pos = start + text.length;
  inp.focus();
  try { inp.setSelectionRange(pos, pos); } catch (_) {}
}

function _openEmojiPop() {
  const pop = document.getElementById('emojiPop');
  if (!pop) return;
  if (!pop.dataset.built) {
    pop.innerHTML = `<div class="cmp-emoji-grid">${COMPOSER_EMOJIS.map(em => `<button type="button" data-emoji="${em}">${em}</button>`).join('')}</div>`;
    pop.querySelectorAll('button[data-emoji]').forEach(b => {
      b.addEventListener('click', () => { _composerInsertAtCursor(b.dataset.emoji); _composerCloseAllPops(); });
    });
    pop.dataset.built = '1';
  }
  pop.classList.remove('is-hidden');
}

function _openMentionPop() {
  const pop = document.getElementById('mentionPop');
  if (!pop) return;
  pop.innerHTML = members.length
    ? members.map((m, i) => {
        const name = window.cmDisplayName(m);
        return `<div class="cmp-m-item" data-mi="${i}">
          ${window.cmAvatarHtml(m, 26)}
          <div class="who"><div class="n">${esc(name)}</div><div class="r">${esc(m.job_title || m.role || '')}</div></div>
        </div>`;
      }).join('')
    : `<div class="cmp-m-empty">${esc(tt('chat_tasks.no_members', 'No members'))}</div>`;
  pop.querySelectorAll('.cmp-m-item').forEach(el => {
    el.addEventListener('click', () => {
      const m = members[+el.dataset.mi];
      if (m) {
        // If the user already typed an "@partial" token before the caret, strip
        // it first so we don't end up with "@@Name" / "@jo@Name".
        const inp = document.getElementById('msgInput');
        if (inp) {
          const caret  = inp.selectionStart ?? inp.value.length;
          const before = inp.value.slice(0, caret);
          const tok    = before.match(/(?:^|\s)(@[^\s]*)$/);
          if (tok) {
            const tokenStart = caret - tok[1].length;
            inp.value = inp.value.slice(0, tokenStart) + inp.value.slice(caret);
            try { inp.setSelectionRange(tokenStart, tokenStart); } catch (_) {}
          }
        }
        _composerInsertAtCursor('@' + (window.cmDisplayName(m) || '') + ' ');
      }
      _composerCloseAllPops();
    });
  });
  pop.classList.remove('is-hidden');
}

function toggleEmojiPop(e) {
  e?.stopPropagation();
  const wasHidden = document.getElementById('emojiPop')?.classList.contains('is-hidden');
  _composerCloseAllPops();
  if (wasHidden) _openEmojiPop();
}

function toggleMentionPop(e) {
  e?.stopPropagation();
  const wasHidden = document.getElementById('mentionPop')?.classList.contains('is-hidden');
  _composerCloseAllPops();
  if (wasHidden) _openMentionPop();
}

// Create task from composer text → reuse existing openNewTask() modal + insert.
function composerCreateTask(e) {
  e?.stopPropagation();
  _composerCloseAllPops();
  const title = (document.getElementById('msgInput')?.value || '').trim();
  openNewTask(title);
}

// Typing "@" at the start or after whitespace also opens the mention popover.
document.getElementById('msgInput')?.addEventListener('input', () => {
  const inp = document.getElementById('msgInput');
  const pos = inp.selectionStart ?? 0;
  const ch  = inp.value[pos - 1];
  const prev = pos >= 2 ? inp.value[pos - 2] : '';
  if (ch === '@' && (pos === 1 || /\s/.test(prev))) {
    if (document.getElementById('mentionPop')?.classList.contains('is-hidden')) {
      _composerCloseAllPops();
      _openMentionPop();
    }
  }
});

// One popover at a time; close on outside click and Esc.
document.addEventListener('click', e => {
  if (e.target.closest('#emojiPop, #mentionPop')) return;
  _composerCloseAllPops();
});
document.addEventListener('keydown', e => {

// ── COMPOSER: auto-grow (el texto baja de línea en vez de correrse a la derecha) ──
function autoGrowComposer() {
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
}

// ── SONIDO DE MENSAJE ENTRANTE ──
// Tono corto sintetizado con Web Audio (sin assets externos). El AudioContext se crea/reanuda
// perezosamente: los navegadores exigen un gesto de usuario previo, que en este flujo siempre
// existe (el usuario abrió/usó el chat) antes de que llegue el primer mensaje.
let _chatAudioCtx = null;
function playIncomingSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_chatAudioCtx) _chatAudioCtx = new AC();
    const ctx = _chatAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.14, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.34);
  } catch (_) { /* audio bloqueado / no soportado: silencioso */ }
}

// ── PEGAR CAPTURA / IMAGEN DESDE EL PORTAPAPELES ──
// Cubre "Impr Pant" en Windows y Cmd+Ctrl+Shift+4 en Mac → Cmd+V en el chat.
document.getElementById('msgInput')?.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const imgs = items.filter(it => it.kind === 'file' && it.type.startsWith('image/'));
  if (!imgs.length) return;
  e.preventDefault();
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const files = imgs.map((it, i) => {
    const blob = it.getAsFile();
    if (!blob) return null;
    const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
    // Los blobs del portapapeles suelen venir sin nombre → generamos uno legible.
    return blob.name && blob.name !== 'image.png'
      ? blob
      : new File([blob], `screenshot-${stamp}${imgs.length > 1 ? '-' + (i + 1) : ''}.${ext}`, { type: blob.type });
  });
  addFilesToPending(files);
});

// ── ARRASTRAR Y SOLTAR ARCHIVOS/CAPTURAS SOBRE EL COMPOSER ──
(function initComposerDnd() {
  const zone = document.getElementById('chatComposer');
  if (!zone) return;
  let depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  zone.addEventListener('dragenter', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth++; zone.classList.add('is-dragover');
  });
  zone.addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  });
  zone.addEventListener('dragleave', () => {
    if (--depth <= 0) { depth = 0; zone.classList.remove('is-dragover'); }
  });
  zone.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; zone.classList.remove('is-dragover');
    addFilesToPending(e.dataTransfer.files);
  });
})();
