<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat & Tasks — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D">
  <link rel="apple-touch-icon" href="/assets/clava-app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<style>
  body.cm { background: var(--cm-bg); }

  .hub-topbar { display:flex; align-items:center; gap:14px; height:56px; padding:0 24px; border-bottom:1px solid var(--cm-border); background:var(--cm-bg); position:sticky; top:0; z-index:50; }
  .hub-crumb { display:flex; align-items:center; gap:8px; color:var(--cm-fg-muted); font:var(--cm-body-sm); }
  .hub-crumb .ti { font-size:14px; }
  .hub-crumb .sep { color:var(--cm-fg-faint); }
  .hub-topbar .actions { margin-left:auto; display:flex; align-items:center; gap:8px; }

  /* Tabs */
  .ct-tabs { display:flex; gap:0; padding:0 24px; background:var(--cm-bg); border-bottom:1px solid var(--cm-border); }
  .ct-tab { padding:0 18px; height:46px; border:0; background:transparent; color:var(--cm-fg-muted); font:500 13.5px/1 var(--cm-font-sans); cursor:pointer; display:inline-flex; align-items:center; gap:7px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .ct-tab:hover { color:var(--cm-fg); }
  .ct-tab.is-on { color:var(--cm-fg-strong); border-bottom-color:var(--cm-accent); font-weight:600; }
  .ct-tab .ti { font-size:16px; }
  .ct-tab .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; background:var(--cm-danger); color:#fff; border-radius:999px; font:600 10px/1 var(--cm-font-mono); margin-left:2px; }

  /* === CHAT view === */
  .chat-layout { display:grid; grid-template-columns: 280px 1fr 320px; height:calc(100vh - 56px - 47px); }
  @media (max-width:1200px) { .chat-layout { grid-template-columns: 240px 1fr; } .chat-right { display:none; } }

  /* sidebar of conversations */
  .chat-side { border-right:1px solid var(--cm-border); background:var(--cm-surface); display:flex; flex-direction:column; overflow:hidden; }
  .chat-side-h { padding:12px 14px; border-bottom:1px solid var(--cm-border-soft); display:flex; align-items:center; gap:8px; }
  .chat-side-h h3 { font:600 13px/1 var(--cm-font-sans); color:var(--cm-fg-strong); letter-spacing:0.04em; text-transform:uppercase; }
  .chat-side-h h3 .ct { color:var(--cm-fg-faint); margin-left:6px; font-weight:500; }
  .chat-side-h button { margin-left:auto; width:26px; height:26px; border:1px solid var(--cm-border); background:transparent; border-radius:6px; cursor:pointer; color:var(--cm-fg-muted); display:flex; align-items:center; justify-content:center; }
  .chat-side-h button:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .chat-side-h button .ti { font-size:14px; }
  .chat-search { padding:10px 14px; border-bottom:1px solid var(--cm-border-soft); }
  .chat-search-input { width:100%; height:32px; padding:0 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:7px; font:var(--cm-body-sm); color:var(--cm-fg); outline:none; }
  .chat-list { flex:1; overflow-y:auto; padding:6px; }
  .chat-list-label { font:500 10.5px/1 var(--cm-font-mono); letter-spacing:0.08em; text-transform:uppercase; color:var(--cm-fg-muted); padding:10px 8px 6px; }
  .conv {
    display:flex; align-items:center; gap:10px;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:2px;
  }
  .conv:hover { background:var(--cm-bg-soft); }
  .conv.is-on { background:var(--cm-accent-soft); }
  .conv .av { width:34px; height:34px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; font:600 11.5px/1 var(--cm-font-sans); color:var(--cm-fg); flex-shrink:0; position:relative; }
  .conv .av.g { background:var(--cm-accent-soft); color:var(--cm-accent); border-color:transparent; }
  .conv .av.online::after { content:""; position:absolute; bottom:-1px; right:-1px; width:9px; height:9px; border-radius:50%; background:var(--cm-success); border:2px solid var(--cm-surface); }
  .conv .body { flex:1; min-width:0; }
  .conv .name-row { display:flex; align-items:baseline; }
  .conv .name { font:600 13.5px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .when { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); flex-shrink:0; }
  .conv .preview { font:500 11.5px/1.4 var(--cm-font-sans); color:var(--cm-fg-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .conv.is-on .preview { color:var(--cm-fg); }
  .conv .unread { min-width:18px; height:18px; border-radius:999px; background:var(--cm-accent); color:var(--cm-fg-on-accent); display:flex; align-items:center; justify-content:center; font:600 10px/1 var(--cm-font-mono); padding:0 4px; flex-shrink:0; }

  /* main chat */
  .chat-main { display:flex; flex-direction:column; min-width:0; background:var(--cm-bg); }
  .chat-h { padding:12px 18px; border-bottom:1px solid var(--cm-border); display:flex; align-items:center; gap:12px; background:var(--cm-surface); }
  .chat-h .av { width:36px; height:36px; border-radius:50%; background:var(--cm-accent-soft); color:var(--cm-accent); display:flex; align-items:center; justify-content:center; font:600 12px/1 var(--cm-font-sans); border:1px solid transparent; flex-shrink:0; }
  .chat-h .info { flex:1; min-width:0; }
  .chat-h .name { font:600 14.5px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .chat-h .meta { font:500 11.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:3px; display:flex; gap:8px; align-items:center; }
  .chat-h .meta .dot { width:6px; height:6px; border-radius:50%; background:var(--cm-success); }
  .chat-h .right { display:flex; gap:6px; }

  .chat-body { flex:1; overflow-y:auto; padding:24px 32px; display:flex; flex-direction:column; gap:14px; }
  .chat-day { text-align:center; font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-muted); letter-spacing:0.06em; text-transform:uppercase; margin:8px 0; position:relative; }
  .chat-day::before, .chat-day::after { content:""; position:absolute; top:50%; width:36%; height:1px; background:var(--cm-border); }
  .chat-day::before { left:0; }
  .chat-day::after { right:0; }

  .msg { display:flex; gap:10px; max-width:78%; position:relative; }
  .msg.me { align-self:flex-end; flex-direction:row-reverse; }
  .msg .mav { width:30px; height:30px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); color:var(--cm-fg); display:flex; align-items:center; justify-content:center; font:600 11px/1 var(--cm-font-sans); flex-shrink:0; }
  .msg.me .mav { background:var(--cm-accent); color:var(--cm-fg-on-accent); border:0; }
  .msg .bubble { background:var(--cm-surface); border:1px solid var(--cm-border-soft); border-radius:12px; padding:8px 12px; min-width:0; }
  .msg.me .bubble { background:var(--cm-accent); color:var(--cm-fg-on-accent); border-color:transparent; }
  .msg .who { font:600 11.5px/1 var(--cm-font-sans); color:var(--cm-fg-muted); margin-bottom:4px; }
  .msg.me .who { display:none; }
  .msg .text { font:var(--cm-body-sm); color:var(--cm-fg); }
  .msg.me .text { color:var(--cm-fg-on-accent); }
  .msg .time { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-faint); margin-top:4px; display:flex; gap:4px; align-items:center; }
  .msg.me .time { color:rgba(255,255,255,0.7); justify-content:flex-end; }
  .msg .time .ti { font-size:12px; color:#86EFAC; }

  /* attachments */
  .att { margin-top:6px; padding:8px 10px; border-radius:8px; background:var(--cm-bg-soft); border:1px solid var(--cm-border-soft); display:flex; align-items:center; gap:8px; cursor:pointer; }
  .att .ic { width:32px; height:32px; border-radius:6px; background:var(--cm-surface); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; color:var(--cm-fg-muted); flex-shrink:0; }
  .att .ic .ti { font-size:15px; }
  .att .t { font:500 12.5px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .att .s { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }

  /* task pill inside message */
  .task-pill { margin-top:6px; padding:9px 11px; border-radius:8px; background:var(--cm-warning-bg); border:1px solid var(--cm-warning-bd); }
  .task-pill .l { display:flex; align-items:center; gap:6px; font:600 11px/1 var(--cm-font-mono); letter-spacing:0.04em; text-transform:uppercase; color:var(--cm-warning); }
  .task-pill .l .ti { font-size:13px; }
  .task-pill .t { font:600 13px/1.3 var(--cm-font-sans); color:#7C2D12; margin-top:5px; }
  .task-pill .m { font:500 11.5px/1.2 var(--cm-font-mono); color:#9A3412; margin-top:4px; display:flex; gap:10px; }
  .task-pill .m span { display:inline-flex; align-items:center; gap:3px; }

  .chat-composer { padding:12px 24px 16px; border-top:1px solid var(--cm-border); background:var(--cm-surface); display:flex; align-items:center; gap:8px; position:relative; }
  .chat-comp-tools { display:flex; gap:4px; }
  .chat-comp-tools button { width:30px; height:30px; border:0; background:transparent; color:var(--cm-fg-muted); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .chat-comp-tools button:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .chat-comp-tools button .ti { font-size:17px; }
  /* Composer popovers (emoji + mention) */
  .cmp-pop { position:absolute; bottom:calc(100% + 6px); left:16px; z-index:60; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:10px; box-shadow:var(--cm-shadow-pop, 0 12px 40px rgba(0,0,0,.18)); padding:8px; }
  .cmp-pop.is-hidden { display:none; }
  .cmp-emoji { width:296px; }
  .cmp-emoji-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:2px; }
  .cmp-emoji-grid button { border:0; background:transparent; cursor:pointer; font-size:20px; line-height:1; padding:5px; border-radius:7px; }
  .cmp-emoji-grid button:hover { background:var(--cm-bg-soft); }
  .cmp-mention { width:264px; max-height:288px; overflow-y:auto; }
  .cmp-m-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .cmp-m-item:hover { background:var(--cm-bg-soft); }
  .cmp-m-item .av { width:26px; height:26px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; font:600 10.5px/1 var(--cm-font-sans); color:var(--cm-fg); flex-shrink:0; }
  .cmp-m-item .who { flex:1; min-width:0; }
  .cmp-m-item .who .n { font:500 12.5px/1.2 var(--cm-font-sans); color:var(--cm-fg); }
  .cmp-m-item .who .r { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .cmp-m-empty { padding:10px; color:var(--cm-fg-muted); font:500 12px/1 var(--cm-font-sans); }
  .chat-comp-input { flex:1; min-width:0; height:38px; padding:0 12px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); font:var(--cm-body); color:var(--cm-fg); outline:none; }
  .chat-comp-input:focus { border-color:var(--cm-accent); }
  .chat-send { width:38px; height:38px; border-radius:var(--cm-r-3); border:0; background:var(--cm-accent); color:var(--cm-fg-on-accent); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .chat-send .ti { font-size:16px; }

  /* right details rail */
  .chat-right { border-left:1px solid var(--cm-border); background:var(--cm-surface); overflow-y:auto; padding:18px 18px 24px; display:flex; flex-direction:column; gap:18px; }
  .cr-section { display:flex; flex-direction:column; gap:10px; }
  .cr-section h4 { font:600 11px/1 var(--cm-font-sans); letter-spacing:0.06em; text-transform:uppercase; color:var(--cm-fg-muted); }
  .cr-member { display:flex; align-items:center; gap:8px; padding:5px 0; }
  .cr-member .av { width:26px; height:26px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; font:600 10.5px/1 var(--cm-font-sans); color:var(--cm-fg); flex-shrink:0; }
  .cr-member .who { flex:1; min-width:0; }
  .cr-member .who .n { font:500 12.5px/1.2 var(--cm-font-sans); color:var(--cm-fg); }
  .cr-member .who .r { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .cr-member .dot { width:7px; height:7px; border-radius:50%; background:var(--cm-success); }
  .cr-member .dot.away { background:var(--cm-warning); }
  .cr-member .dot.off { background:var(--cm-fg-faint); }

  .cr-file { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px; background:var(--cm-bg-soft); border:1px solid var(--cm-border-soft); cursor:pointer; }
  .cr-file:hover { border-color:var(--cm-border-strong); }
  .cr-file .ic { width:26px; height:26px; border-radius:5px; background:var(--cm-surface); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; color:var(--cm-fg-muted); flex-shrink:0; }
  .cr-file .ic .ti { font-size:13px; }
  .cr-file .body { flex:1; min-width:0; }
  .cr-file .t { font:500 12px/1.2 var(--cm-font-sans); color:var(--cm-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cr-file .s { font:500 10px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }

  /* === TASKS view === */
  .tasks-page { padding:20px 24px 40px; max-width:1500px; }
  .tasks-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .tasks-bar h1 { font:600 22px/1 var(--cm-font-sans); letter-spacing:-0.02em; color:var(--cm-fg-strong); }
  .tasks-bar .sub { font:500 12px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-left:4px; }
  .tasks-bar .right { margin-left:auto; display:flex; gap:6px; }
  .tasks-pill { display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 10px; border-radius:999px; border:1px solid var(--cm-border); background:var(--cm-bg-soft); color:var(--cm-fg-muted); font:500 12px/1 var(--cm-font-sans); cursor:pointer; }
  .tasks-pill:hover { color:var(--cm-fg); border-color:var(--cm-border-strong); }
  .tasks-pill.is-on { background:var(--cm-accent-soft); color:var(--cm-fg-strong); border-color:var(--cm-border-strong); }
  .tasks-pill .ct { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-faint); }

  /* Kanban board */
  .kanban { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  @media (max-width:1100px) { .kanban { grid-template-columns:repeat(2,1fr); } }
  .col {
    background:var(--cm-surface);
    border:1px solid var(--cm-border);
    border-radius:var(--cm-r-4);
    box-shadow:var(--cm-shadow-1);
    display:flex; flex-direction:column;
    min-height:480px;
  }
  .col-h { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--cm-border-soft); }
  .col-h .dot { width:9px; height:9px; border-radius:50%; }
  .col-h .l { font:600 12px/1 var(--cm-font-sans); letter-spacing:0.06em; text-transform:uppercase; color:var(--cm-fg-strong); }
  .col-h .ct { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-left:auto; }
  .col-h button { width:24px; height:24px; border:0; background:transparent; border-radius:5px; color:var(--cm-fg-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .col-h button:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .col-body { padding:8px; display:flex; flex-direction:column; gap:7px; flex:1; }

  .tcard {
    background:var(--cm-surface);
    border:1px solid var(--cm-border-soft);
    border-radius:8px;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:8px;
    cursor:grab;
    transition:border-color 120ms, box-shadow 120ms;
  }
  .tcard:hover { border-color:var(--cm-border-strong); box-shadow:var(--cm-shadow-1); }
  .tcard-top { display:flex; align-items:flex-start; gap:8px; }
  .tcard-prio {
    width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px;
  }
  .tcard-prio.hi { background:var(--cm-danger); }
  .tcard-prio.md { background:var(--cm-warning); }
  .tcard-prio.lo { background:var(--cm-info); }
  .tcard .title { font:500 13px/1.35 var(--cm-font-sans); color:var(--cm-fg-strong); flex:1; min-width:0; }
  .tcard .tag-row { display:flex; flex-wrap:wrap; gap:4px; }
  .tcard .tag { display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 7px; border-radius:4px; background:var(--cm-bg-soft); border:1px solid var(--cm-border-soft); font:600 10px/1 var(--cm-font-mono); letter-spacing:0.04em; color:var(--cm-fg-muted); }
  .tcard .tag.match { background:var(--cm-danger-bg); color:var(--cm-danger); border-color:var(--cm-danger-bd); }
  .tcard .tag.medical { background:var(--cm-info-bg); color:var(--cm-info); border-color:var(--cm-info-bd); }
  .tcard .tag.gym { background:var(--cm-violet-bg); color:var(--cm-violet); border-color:var(--cm-violet-bd); }
  .tcard .tag.video { background:var(--cm-warning-bg); color:var(--cm-warning); border-color:var(--cm-warning-bd); }
  .tcard .tag.routine { background:var(--cm-success-bg); color:var(--cm-success); border-color:var(--cm-success-bd); }
  .tcard .foot { display:flex; align-items:center; gap:6px; font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-muted); }
  .tcard .foot .ti { font-size:13px; }
  .tcard .foot .due { padding:2px 6px; border-radius:4px; background:var(--cm-bg-soft); border:1px solid var(--cm-border-soft); }
  .tcard .foot .due.overdue { background:var(--cm-danger-bg); color:var(--cm-danger); border-color:var(--cm-danger-bd); }
  .tcard .foot .due.today { background:var(--cm-warning-bg); color:var(--cm-warning); border-color:var(--cm-warning-bd); }
  .tcard .foot .grow { flex:1; }
  .tcard .foot .av { width:22px; height:22px; border-radius:50%; background:var(--cm-bg-sunk); border:1.5px solid var(--cm-surface); display:flex; align-items:center; justify-content:center; font:600 9.5px/1 var(--cm-font-sans); color:var(--cm-fg); margin-left:-6px; }
  .tcard .foot .av:first-of-type { margin-left:0; }
  .tcard .foot .av.tn { background:var(--cm-accent-soft); color:var(--cm-accent); }

  .col-add {
    margin:0 8px 8px;
    padding:8px;
    border:1px dashed var(--cm-border); border-radius:7px;
    background:transparent;
    color:var(--cm-fg-muted);
    font:500 12px/1 var(--cm-font-sans);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .col-add:hover { border-color:var(--cm-accent); color:var(--cm-fg); }

  #tweaks-root { position: fixed; bottom: 16px; right: 16px; z-index: 1000; }

  /* New Task / Detail panels */
  .cm-panel-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; backdrop-filter:blur(3px); }
  .cm-panel-overlay.is-open { display:block; }
  .cm-panel { position:fixed; top:0; right:0; width:440px; max-width:100vw; height:100vh; background:var(--cm-surface); border-left:1px solid var(--cm-border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); z-index:201; }
  .cm-panel.is-open { transform:translateX(0); }
  .cm-panel-head { display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--cm-border); flex-shrink:0; }
  .cm-panel-head h3 { font:600 15px/1 var(--cm-font-sans); color:var(--cm-fg-strong); flex:1; }
  .cm-panel-head .close { width:28px; height:28px; border:1px solid var(--cm-border); background:transparent; border-radius:7px; cursor:pointer; color:var(--cm-fg-muted); display:flex; align-items:center; justify-content:center; }
  .cm-panel-head .close:hover { color:var(--cm-fg); background:var(--cm-bg-soft); }
  .cm-panel-body { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .cm-panel-foot { padding:14px 20px; border-top:1px solid var(--cm-border); display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; }
  .cm-field { display:flex; flex-direction:column; gap:5px; }
  .cm-field label { font:600 10.5px/1 var(--cm-font-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--cm-fg-muted); }
  .cm-field input, .cm-field select, .cm-field textarea { background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); padding:8px 10px; font:var(--cm-body); color:var(--cm-fg); outline:none; width:100%; }
  .cm-field input:focus, .cm-field select:focus, .cm-field textarea:focus { border-color:var(--cm-accent); }
  .cm-field textarea { resize:vertical; min-height:72px; }
  .cm-field .val { font:500 13px/1.4 var(--cm-font-sans); color:var(--cm-fg); }

  /* DM picker */
  .dm-picker-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:300; display:flex; align-items:center; justify-content:center; }
  .dm-picker-overlay.hidden { display:none !important; }
  .dm-picker { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-4); width:320px; max-height:420px; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--cm-shadow-2); }
  .dm-picker-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--cm-border); }
  .dm-picker-head h3 { font:600 13.5px/1 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .dm-picker-close { background:none; border:none; color:var(--cm-fg-muted); font-size:18px; cursor:pointer; line-height:1; }
  .dm-picker-search { margin:10px 12px; padding:7px 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:7px; color:var(--cm-fg); font:var(--cm-body-sm); outline:none; width:calc(100% - 24px); }
  .dm-picker-list { flex:1; overflow-y:auto; padding:4px 8px 10px; }

  .cr-section-head { display:flex; align-items:center; gap:6px; }
  .cr-section-head h4 { margin:0; }
  .cr-head-btn { background:none; border:none; color:var(--cm-fg-muted); cursor:pointer; padding:3px 5px; border-radius:5px; display:flex; align-items:center; justify-content:center; }
  .cr-head-btn:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .cr-unpin { background:none; border:none; color:var(--cm-fg-faint); cursor:pointer; padding:2px 4px; border-radius:4px; display:none; align-items:center; justify-content:center; flex-shrink:0; }
  .cr-file:hover .cr-unpin { display:flex; }
  .cr-unpin:hover { color:var(--cm-danger); background:var(--cm-danger-bg); }

  /* Pending attachment in composer */
  .pending-att { padding:5px 8px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:8px; }
  .pending-att-inner { display:flex; align-items:center; gap:8px; }
  .pending-att-thumb { width:34px; height:34px; object-fit:cover; border-radius:5px; flex-shrink:0; }
  .pending-att-ic { width:34px; height:34px; border-radius:6px; background:var(--cm-surface); border:1px solid var(--cm-border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pending-att-ic .ti { font-size:15px; }
  .pending-att-info { flex:1; min-width:0; }
  .pending-att-name { font:500 12px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pending-att-size { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .pending-att-rm { background:none; border:none; color:var(--cm-fg-faint); cursor:pointer; padding:3px; border-radius:4px; display:flex; flex-shrink:0; }
  .pending-att-rm:hover { color:var(--cm-danger); background:var(--cm-danger-bg); }
  .pending-att-rm .ti { font-size:12px; }

  /* Link preview draft (above composer input) */
  .lp-draft { display:flex; align-items:center; gap:8px; padding:5px 8px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:8px; }
  .lp-draft-info { flex:1; min-width:0; }
  .lp-draft-title { font:500 12px/1.2 var(--cm-font-sans); color:var(--cm-fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lp-draft-url { font:500 10px/1 var(--cm-font-mono); color:var(--cm-fg-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .lp-draft-rm { background:none; border:none; color:var(--cm-fg-faint); cursor:pointer; padding:3px; border-radius:4px; display:flex; flex-shrink:0; }
  .lp-draft-rm:hover { color:var(--cm-danger); background:var(--cm-danger-bg); }
  .lp-draft-rm .ti { font-size:12px; }

  /* Attachment image in message */
  .att-img-wrap { margin-top:6px; }
  .att-img { max-width:260px; max-height:180px; width:100%; object-fit:cover; border-radius:7px; cursor:pointer; display:block; }
  .att-img:hover { opacity:.9; }

  /* Link preview card in message */
  .link-preview { margin-top:6px; border-radius:8px; overflow:hidden; border:1px solid var(--cm-border-soft); background:var(--cm-surface); cursor:pointer; display:flex; flex-direction:column; max-width:300px; transition:border-color 120ms; }
  .link-preview:hover { border-color:var(--cm-border-strong); }
  .lp-img { width:100%; max-height:130px; object-fit:cover; display:block; }
  .lp-info { padding:8px 10px; }
  .lp-domain { font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-muted); display:flex; align-items:center; gap:4px; margin-bottom:4px; }
  .lp-title { font:600 12.5px/1.3 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .lp-desc { font:500 11px/1.4 var(--cm-font-sans); color:var(--cm-fg-muted); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  /* YouTube: horizontal */
  .link-preview.yt { flex-direction:row; max-width:320px; align-items:stretch; }
  .yt-thumb-wrap { width:110px; flex-shrink:0; position:relative; }
  .yt-thumb { width:110px; height:70px; object-fit:cover; display:block; }
  .yt-play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.3); }
  .yt-play .ti { font-size:20px; color:#fff; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .link-preview.yt .lp-info { padding:8px; flex:1; min-width:0; }

  /* Message hover actions */
  .msg-body { display:flex; align-items:flex-end; gap:4px; }
  .msg.me .msg-body { flex-direction:row-reverse; }
  .msg-actions { display:none; flex-shrink:0; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:7px; box-shadow:var(--cm-shadow-1); padding:1px; align-items:center; }
  .msg:hover .msg-actions { display:flex; }
  .msg-action-btn { width:26px; height:26px; border:0; background:transparent; border-radius:5px; cursor:pointer; color:var(--cm-fg-muted); display:flex; align-items:center; justify-content:center; }
  .msg-action-btn:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .msg-action-btn .ti { font-size:13px; }

  /* Pin options modal */
  .pin-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:400; align-items:center; justify-content:center; }
  .pin-modal-overlay.is-open { display:flex; }
  .pin-modal { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-4); width:340px; box-shadow:var(--cm-shadow-2); }
  .pin-modal-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--cm-border); }
  .pin-modal-head h3 { font:600 13.5px/1 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .pin-modal-close { background:none; border:none; color:var(--cm-fg-muted); font-size:20px; cursor:pointer; line-height:1; }
  .pin-modal-tabs { display:flex; border-bottom:1px solid var(--cm-border); }
  .pin-modal-tab { flex:1; height:40px; border:0; background:transparent; color:var(--cm-fg-muted); font:500 13px/1 var(--cm-font-sans); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .pin-modal-tab.is-on { color:var(--cm-fg-strong); border-bottom-color:var(--cm-accent); font-weight:600; }
  .pin-modal-body { padding:16px; display:flex; flex-direction:column; gap:10px; }
  .pin-modal-foot { padding:12px 16px; border-top:1px solid var(--cm-border); display:flex; gap:8px; justify-content:flex-end; }

  /* Pinned file download button */
  .cr-file-dl { background:none; border:none; color:var(--cm-fg-faint); cursor:pointer; padding:2px 4px; border-radius:4px; display:none; align-items:center; justify-content:center; flex-shrink:0; text-decoration:none; }
  .cr-file:hover .cr-file-dl { display:flex; }
  .cr-file-dl:hover { color:var(--cm-accent); background:var(--cm-accent-soft); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<script src="assets/global-search.js" defer></script>
</head>
<body class="cm">
<div class="hub-shell" data-screen-label="14 Chat & Tasks">
  <div id="hub-side-root"></div>

  <main class="hub-main">
    <div class="hub-topbar">
      <div style="display:flex;align-items:center;gap:7px">
        <i class="ti ti-users-group" style="font-size:16px;color:var(--cm-fg-muted)"></i>
        <select id="ctTeamSelect" onchange="ctOnTeamChange()" style="height:34px;padding:0 10px;background:var(--cm-surface);color:var(--cm-fg-strong);border:1px solid var(--cm-border);border-radius:8px;font:600 13px/1 var(--cm-font-sans);cursor:pointer"><option value="" data-i18n="common.loading">Loading…</option></select>
      </div>
      <div class="hub-crumb"><i class="ti ti-home"></i><span data-i18n="chat_tasks.workspace">Workspace</span><span class="sep">/</span><span style="color:var(--cm-fg-strong);font-weight:600" data-i18n="chat_tasks.breadcrumb">Chat &amp; tasks</span></div>
      <div class="hub-search"><i class="ti ti-search"></i><input data-i18n-ph="chat_tasks.search_players_sessions_microcycles" placeholder="Search players, sessions, microcycles…"></div>
      <div class="actions">
        <button class="cm-icon-btn"><i class="ti ti-bell"></i></button>
        <button class="cm-icon-btn" data-open-settings><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <div class="ct-tabs">
      <button class="ct-tab is-on" data-view="chat"><i class="ti ti-message-circle"></i><span data-i18n="chat_tasks.chat">Chat</span><span class="badge" id="chatBadge" style="display:none">0</span></button>
      <button class="ct-tab" data-view="tasks"><i class="ti ti-checklist"></i><span data-i18n="chat_tasks.tasks">Tasks</span><span class="badge" id="tasksBadge" style="display:none">0</span></button>
    </div>

    <!-- CHAT -->
    <section class="ct-view" data-view="chat">
      <div class="chat-layout">

        <aside class="chat-side">
          <div class="chat-side-h"><h3><span data-i18n="chat_tasks.inbox">Inbox</span> <span class="ct" id="inboxCount">0</span></h3><button data-i18n-attr="title:chat_tasks.new_dm" title="New DM" onclick="openDmPicker()"><i class="ti ti-edit"></i></button></div>
          <div class="chat-search"><input class="chat-search-input" data-i18n-ph="chat_tasks.search_messages_files" placeholder="Search messages, files…"></div>
          <div class="chat-list" id="chatList">
            <div style="padding:8px 12px;font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-faint)" data-i18n="common.loading">Loading…</div>
          </div>
        </aside>

        <section class="chat-main">
          <div class="chat-h" id="chatHeader">
            <div class="av"><i class="ti ti-hash"></i></div>
            <div class="info">
              <div class="name" data-i18n="chat_tasks.team_channel_name"># team</div>
              <div class="meta"><span class="dot"></span><span data-i18n="common.loading">Loading…</span></div>
            </div>
            <div class="right">
              <button class="cm-icon-btn"><i class="ti ti-search"></i></button>
              <button class="cm-icon-btn"><i class="ti ti-dots"></i></button>
            </div>
          </div>

          <div class="chat-body" id="chatBody">
            <div style="text-align:center;padding:48px;color:var(--cm-fg-muted);font-size:13px" data-i18n="common.loading">Loading…</div>

          </div>

          <div class="chat-composer" style="align-items:flex-end">
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.mp4,.mov" style="display:none" onchange="handleFileSelect(event)">
            <div class="chat-comp-tools">
              <button data-i18n-attr="title:chat_tasks.attach_file" title="Attach file" onclick="handleAttachClick()"><i class="ti ti-paperclip"></i></button>
              <button data-i18n-attr="title:chat_tasks.mention" title="Mention" onclick="toggleMentionPop(event)"><i class="ti ti-at"></i></button>
              <button data-i18n-attr="title:chat_tasks.emoji" title="Emoji" onclick="toggleEmojiPop(event)"><i class="ti ti-mood-smile"></i></button>
              <button data-i18n-attr="title:chat_tasks.create_task" title="Create task" onclick="composerCreateTask(event)"><i class="ti ti-flag-2"></i></button>
            </div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
              <div id="pendingAtt" style="display:none"></div>
              <div id="linkPreviewDraft" style="display:none"></div>
              <input class="chat-comp-input" id="msgInput" data-i18n-ph="chat_tasks.message_placeholder" placeholder="Message — Enter to send, Shift+Enter for newline">
            </div>
            <button class="chat-send" onclick="sendMessage()"><i class="ti ti-send"></i></button>
            <div class="cmp-pop cmp-emoji is-hidden" id="emojiPop"></div>
            <div class="cmp-pop cmp-mention is-hidden" id="mentionPop"></div>
          </div>
        </section>

        <aside class="chat-right">
          <div class="cr-section">
            <div class="cr-section-head">
              <h4 data-i18n="chat_tasks.about">About</h4>
              <button id="chatAboutEditBtn" class="cr-head-btn" style="display:none" onclick="startEditAbout()" data-i18n-attr="title:chat_tasks.edit_description" title="Edit description"><i class="ti ti-pencil" style="font-size:11px"></i></button>
            </div>
            <div id="chatAboutText" style="font:500 12.5px/1.45 var(--cm-font-sans);color:var(--cm-fg-muted)" data-i18n="common.loading">Loading…</div>
            <div id="chatAboutEditArea" style="display:none;flex-direction:column;gap:6px;margin-top:6px">
              <textarea id="chatAboutInput" rows="3" style="width:100%;padding:6px 8px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:6px;font:var(--cm-body-sm);color:var(--cm-fg);outline:none;resize:vertical"></textarea>
              <div style="display:flex;gap:6px;justify-content:flex-end">
                <button class="cm-btn is-outline is-sm" onclick="cancelEditAbout()" data-i18n="common.cancel">Cancel</button>
                <button class="cm-btn is-primary is-sm" onclick="saveAbout()" data-i18n="common.save">Save</button>
              </div>
            </div>
          </div>
          <div class="cr-section">
            <h4 id="chatRightMembersTitle" data-i18n="chat_tasks.members">Members</h4>
            <div id="chatRightMembers"></div>
          </div>
          <div class="cr-section">
            <div class="cr-section-head">
              <h4 id="pinnedFilesTitle" data-i18n="chat_tasks.pinned_files">Pinned files</h4>
              <button class="cr-head-btn" onclick="openPinFileForm()" data-i18n-attr="title:chat_tasks.pin_a_file" title="Pin a file"><i class="ti ti-plus" style="font-size:11px"></i></button>
            </div>
            <div id="pinFileForm" style="display:none;flex-direction:column;gap:6px;margin-top:4px">
              <input type="text" id="pinFileUrl" data-i18n-ph="chat_tasks.file_url_or_link" placeholder="File URL or link…" style="width:100%;padding:6px 8px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:6px;font:var(--cm-body-sm);color:var(--cm-fg);outline:none">
              <input type="text" id="pinFileName" data-i18n-ph="chat_tasks.file_name" placeholder="File name…" style="width:100%;padding:6px 8px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:6px;font:var(--cm-body-sm);color:var(--cm-fg);outline:none">
              <select id="pinFileType" style="width:100%;padding:6px 8px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:6px;font:var(--cm-body-sm);color:var(--cm-fg);outline:none">
                <option value="" data-i18n="chat_tasks.type_optional">Type (optional)</option>
                <option value="pdf" data-i18n="chat_tasks.type_pdf">PDF</option>
                <option value="image" data-i18n="chat_tasks.type_image">Image</option>
                <option value="spreadsheet" data-i18n="chat_tasks.type_spreadsheet">Spreadsheet</option>
                <option value="video" data-i18n="chat_tasks.type_video">Video</option>
                <option value="other" data-i18n="chat_tasks.type_other">Other</option>
              </select>
              <div style="display:flex;gap:6px;justify-content:flex-end">
                <button class="cm-btn is-outline is-sm" onclick="closePinFileForm()" data-i18n="common.cancel">Cancel</button>
                <button class="cm-btn is-primary is-sm" onclick="savePinFile()" data-i18n="chat_tasks.pin">Pin</button>
              </div>
            </div>
            <div id="pinnedFilesContainer"></div>
          </div>
          <div class="cr-section">
            <h4 id="chatRightTasksTitle" data-i18n="chat_tasks.open_tasks">Open tasks</h4>
            <div id="chatRightTasks" style="display:flex;flex-direction:column;gap:6px"></div>
          </div>
        </aside>

      </div>
    </section>

    <!-- TASKS -->
    <section class="ct-view" data-view="tasks" style="display:none">
      <div class="tasks-page">

        <div class="tasks-bar">
          <h1 data-i18n="chat_tasks.tasks">Tasks</h1>
          <span class="sub" id="tasksSub" data-i18n="common.loading">Loading…</span>
          <div class="right">
            <button class="tasks-pill is-on" data-filter="all"><span data-i18n="common.all">All</span><span class="ct" id="pillCtAll">—</span></button>
            <button class="tasks-pill" data-filter="mine"><span data-i18n="chat_tasks.mine">Mine</span><span class="ct" id="pillCtMine">—</span></button>
            <button class="tasks-pill" data-filter="overdue"><span data-i18n="chat_tasks.overdue">Overdue</span><span class="ct" id="pillCtOverdue">—</span></button>
            <button class="tasks-pill" data-filter="today"><span data-i18n="chat_tasks.due_today">Due today</span><span class="ct" id="pillCtToday">—</span></button>
            <button class="tasks-pill" data-filter="matchday"><span data-i18n="chat_tasks.filter_match_day">Match-day</span><span class="ct" id="pillCtMatchday">—</span></button>
            <button class="tasks-pill" data-filter="medical"><span data-i18n="chat_tasks.medical">Medical</span><span class="ct" id="pillCtMedical">—</span></button>
            <button class="tasks-pill" data-filter="routine"><span data-i18n="chat_tasks.routine">Routine</span><span class="ct" id="pillCtRoutine">—</span></button>
            <span style="width:1px;height:20px;background:var(--cm-border);margin:0 4px"></span>
            <button class="cm-btn is-outline is-sm"><i class="ti ti-filter" style="font-size:14px"></i><span data-i18n="chat_tasks.filter">Filter</span></button>
            <button class="cm-btn is-primary is-sm" onclick="openNewTask()"><i class="ti ti-plus" style="font-size:14px"></i><span data-i18n="chat_tasks.new_task">New task</span></button>
          </div>
        </div>

        <div class="kanban">

          <div class="col">
            <div class="col-h"><span class="dot" style="background:var(--cm-fg-muted)"></span><span class="l" data-i18n="chat_tasks.col_backlog">Backlog</span><span class="ct" id="ctBacklog">0</span><button><i class="ti ti-dots"></i></button></div>
            <div class="col-body" id="colBacklog"></div>
            <button class="col-add" onclick="openNewTask()"><i class="ti ti-plus" style="font-size:13px"></i><span data-i18n="chat_tasks.add_task">Add task</span></button>
          </div>

          <div class="col">
            <div class="col-h"><span class="dot" style="background:var(--cm-info)"></span><span class="l" data-i18n="chat_tasks.col_in_progress">In progress</span><span class="ct" id="ctInprogress">0</span><button><i class="ti ti-dots"></i></button></div>
            <div class="col-body" id="colInprogress"></div>
            <button class="col-add" onclick="openNewTask()"><i class="ti ti-plus" style="font-size:13px"></i><span data-i18n="chat_tasks.add_task">Add task</span></button>
          </div>

          <div class="col">
            <div class="col-h"><span class="dot" style="background:var(--cm-warning)"></span><span class="l" data-i18n="chat_tasks.col_blocked_review">Blocked / review</span><span class="ct" id="ctBlocked">0</span><button><i class="ti ti-dots"></i></button></div>
            <div class="col-body" id="colBlocked"></div>
            <button class="col-add" onclick="openNewTask()"><i class="ti ti-plus" style="font-size:13px"></i><span data-i18n="chat_tasks.add_task">Add task</span></button>
          </div>

          <div class="col">
            <div class="col-h"><span class="dot" style="background:var(--cm-success)"></span><span class="l" data-i18n="chat_tasks.col_done_7d">Done · 7d</span><span class="ct" id="ctDone">0</span><button><i class="ti ti-dots"></i></button></div>
            <div class="col-body" id="colDone"></div>
          </div>

        </div>
      </div>
    </section>

  </main>
</div>

<!-- DM Picker -->
<div class="dm-picker-overlay hidden" id="dmPickerOverlay" onclick="closeDmPicker(event)">
  <div class="dm-picker">
    <div class="dm-picker-head">
      <h3 data-i18n="chat_tasks.new_direct_message">New Direct Message</h3>
      <button class="dm-picker-close" onclick="closeDmPicker()">×</button>

<script>
// ── STATE ──
let currentUser = null;
let allTasks    = [];
let messages    = [];
let members     = [];
let activeConv  = 'group';
let pinnedFiles = [];
let dmLastMsg   = {};
let dmUnread    = {};
const renderedIds   = new Set();
let pendingAttachment = null;
let draftLinkPreview  = null;
let urlDetectTimer    = null;
let pinModalTab       = 'upload';
let pinModalFile      = null;

// ── i18n helper ──
function tt(key, fallbackEN, vars) {
  const v = (window.CM_I18N && CM_I18N.t) ? CM_I18N.t(key, vars) : null;
  return (v && v !== key) ? v : (fallbackEN != null ? fallbackEN : key);
}
function i18nLocale() { return (window.CM_I18N && CM_I18N.current) || 'en'; }

// ── UTILS ──
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name) {
  return (name || '').split(' ').slice(0,2).map(w => w[0] || '').join('').toUpperCase() || '?';
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString(i18nLocale(), { hour:'2-digit', minute:'2-digit' });
  return d.toLocaleDateString(i18nLocale(), { month:'short', day:'numeric' });
}
function formatDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00'), now = new Date();
  now.setHours(0,0,0,0);
  const diff = Math.round((d - now) / 86400000);
  if (diff === 0) return tt('chat_tasks.due_today_word', 'Today');
  if (diff === 1) return tt('chat_tasks.due_tomorrow', 'Tomorrow');
  const dateStr = d.toLocaleDateString(i18nLocale(), { month:'short', day:'numeric' });
  if (diff < 0)  return tt('chat_tasks.due_overdue', 'Overdue · ' + dateStr, { date: dateStr });
  return dateStr;
}
function isOverdue(str) { return str && new Date(str+'T00:00:00') < new Date(new Date().toDateString()); }
function isToday(str)   { return str && new Date(str+'T00:00:00').toDateString() === new Date().toDateString(); }

// ── TASK FILTER PILLS ──
document.querySelectorAll('.tasks-pill[data-filter]').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.tasks-pill[data-filter]').forEach(p => p.classList.remove('is-on'));
    pill.classList.add('is-on');
    activeTaskFilter = pill.dataset.filter;
    renderKanban(getFilteredTasks());
  });
});

// ── TABS ──
document.querySelectorAll('.ct-tabs .ct-tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.ct-tabs .ct-tab').forEach(o => o.classList.remove('is-on'));
  b.classList.add('is-on');
  const v = b.dataset.view;
  document.querySelectorAll('.ct-view').forEach(s => s.style.display = s.dataset.view === v ? '' : 'none');
}));

// ── ABOUT ──
async function loadAbout() {
  const { data } = await window.sb.from('clubs')
    .select('description').eq('id', currentUser.clubId).single();
  const text = data?.description || '';
  const el = document.getElementById('chatAboutText');
  if (el) el.textContent = text || tt('chat_tasks.no_description_yet', 'No description yet.');
  const editBtn = document.getElementById('chatAboutEditBtn');
  if (editBtn && ['admin','owner'].includes(currentUser?.role)) editBtn.style.display = '';
}

function startEditAbout() {
  const text = document.getElementById('chatAboutText').textContent;
  const inp = document.getElementById('chatAboutInput');
  const _noDesc = tt('chat_tasks.no_description_yet', 'No description yet.');
  if (inp) inp.value = (text === _noDesc || text === 'No description yet.') ? '' : text;
  document.getElementById('chatAboutText').style.display = 'none';
  const editBtn = document.getElementById('chatAboutEditBtn');
  if (editBtn) editBtn.style.display = 'none';
  const area = document.getElementById('chatAboutEditArea');
  if (area) area.style.display = 'flex';
  if (inp) inp.focus();
}

function cancelEditAbout() {
  document.getElementById('chatAboutText').style.display = '';
  const editBtn = document.getElementById('chatAboutEditBtn');
  if (editBtn && ['admin','owner'].includes(currentUser?.role)) editBtn.style.display = '';
  const area = document.getElementById('chatAboutEditArea');
  if (area) area.style.display = 'none';
}

async function saveAbout() {
  const text = (document.getElementById('chatAboutInput').value || '').trim();
  const { error } = await window.sb.from('clubs')
    .update({ description: text }).eq('id', currentUser.clubId);
  if (error) { console.error('About save error:', error); alert(tt('chat_tasks.error_saving_desc', 'Error saving description: ' + error.message, { msg: error.message })); return; }
  document.getElementById('chatAboutText').textContent = text || tt('chat_tasks.no_description_yet', 'No description yet.');
  cancelEditAbout();
}

// ── PINNED FILES ──
async function loadPinnedFiles() {
  let _pfQ = window.sb.from('pinned_files')
    .select('id,file_url,file_name,file_type,pinned_at')
    .eq('club_id', currentUser.clubId)
    .eq('conv_id', 'group');
  if (currentUser.teamId) _pfQ = _pfQ.eq('team_id', currentUser.teamId);
  const { data } = await _pfQ.order('pinned_at', { ascending: false });
  pinnedFiles = data || [];
  renderPinnedFiles();
}

function fileTypeIcon(type) {
  if (type === 'pdf')         return { icon: 'ti-file-type-pdf',   color: 'var(--cm-danger)' };
  if (type === 'image')       return { icon: 'ti-photo',            color: 'var(--cm-success)' };
  if (type === 'spreadsheet') return { icon: 'ti-file-spreadsheet', color: 'var(--cm-success)' };
  if (type === 'video')       return { icon: 'ti-video',            color: 'var(--cm-violet)' };
  return { icon: 'ti-file', color: 'var(--cm-fg-muted)' };
}

function renderPinnedFiles() {
  const container = document.getElementById('pinnedFilesContainer');
  const titleEl   = document.getElementById('pinnedFilesTitle');
  if (!container) return;
  if (titleEl) titleEl.textContent = pinnedFiles.length ? tt('chat_tasks.pinned_files_count', `Pinned files · ${pinnedFiles.length}`, { n: pinnedFiles.length }) : tt('chat_tasks.pinned_files', 'Pinned files');
  if (!pinnedFiles.length) {
    container.innerHTML = `<div style="font:500 11.5px/1 var(--cm-font-mono);color:var(--cm-fg-faint);padding:4px 0">${esc(tt('chat_tasks.no_pinned_files', 'No pinned files'))}</div>`;
    return;
  }
  container.innerHTML = pinnedFiles.map(f => {
    const { icon, color } = fileTypeIcon(f.file_type);
    return `<div class="cr-file">
      <div class="ic" style="color:${color}"><i class="ti ${icon}"></i></div>
      <div class="body"><div class="t">${esc(f.file_name)}</div><div class="s">${formatTime(f.pinned_at)}</div></div>
      <a href="${esc(f.file_url)}" download target="_blank" class="cr-file-dl" title="${esc(tt('chat_tasks.download', 'Download'))}"><i class="ti ti-download" style="font-size:12px"></i></a>
      <button class="cr-unpin" onclick="unpinFile('${f.id}')" title="${esc(tt('chat_tasks.unpin', 'Unpin'))}"><i class="ti ti-x" style="font-size:10px"></i></button>
    </div>`;
  }).join('');
}

function openPinFileForm() { openPinModal(); }

function closePinFileForm() {
  const form = document.getElementById('pinFileForm');
  if (!form) return;
  form.style.display = 'none';
  document.getElementById('pinFileUrl').value  = '';
  document.getElementById('pinFileName').value = '';
  document.getElementById('pinFileType').value = '';
}

async function savePinFile() {
  const url  = (document.getElementById('pinFileUrl').value  || '').trim();
  const name = (document.getElementById('pinFileName').value || '').trim();
  const type = document.getElementById('pinFileType').value;
  if (!url)  { document.getElementById('pinFileUrl').focus();  return; }
  if (!name) { document.getElementById('pinFileName').focus(); return; }
  const { data, error } = await window.sb.from('pinned_files').insert({
    club_id:   currentUser.clubId,
    conv_id:   'group',
    file_url:  url,
    file_name: name,
    file_type: type || null,
    pinned_by: currentUser.id,
    team_id:   currentUser.teamId || null
  }).select().single();
  if (error) { console.error('Pin file error:', error); alert(tt('chat_tasks.error_pinning_file', 'Error pinning file: ' + error.message, { msg: error.message })); return; }
  if (data) { pinnedFiles.unshift(data); renderPinnedFiles(); closePinFileForm(); }
}

async function unpinFile(id) {
  const { error } = await window.sb.from('pinned_files').delete().eq('id', id);
  if (error) { console.error('Unpin error:', error); return; }
  pinnedFiles = pinnedFiles.filter(f => f.id !== id);
  renderPinnedFiles();
}

// ── BOOT ──
async function boot() {
  const ok = await window.requireAuth();
  if (!ok) return;

  const [profile, club] = await Promise.all([window.getProfile(), window.getClub()]);
  const { data: { session } } = await window.sb.auth.getSession();

  currentUser = {
    id:     session.user.id,
    name:   profile?.full_name || session.user.email.split('@')[0],
    role:   profile?.role || '',
    clubId: profile?.club_id,
    teamId: null
  };
  await ctInitTeamSwitch();

  if (club) await window.applyClubTheme();
  await Promise.all([loadMembers(), loadMessages(), loadTasks(), loadAbout(), loadPinnedFiles()]);
  await loadDmPreviews();
  // Abrir conversación específica si viene de ?conv= (del panel de notificaciones)
  const _convParam = new URLSearchParams(location.search).get('conv');
  if (_convParam) { activeConv = _convParam; await loadMessages(); }
  renderConvList();
  updateChatHeader();
  subscribeRealtime();
  scrollToBottom();
}

// ── MEMBERS ──
async function loadMembers() {
  const { data: allProfiles } = await window.sb.from('profiles')
    .select('id, full_name, role, avatar_url')
    .eq('club_id', currentUser.clubId);
  let list = allProfiles || [];

  // Excluir SIEMPRE a los super-admins de la plataforma (no son staff del club)
  try {
    const { data: padmins } = await window.sb.from('platform_admins').select('user_id');
    const superIds = new Set((padmins || []).map(r => r.user_id));
    list = list.filter(p => !superIds.has(p.id));
  } catch (_) { /* si no se puede leer, seguir */ }

  // Filtrar por categoría vía member_teams (solo los asignados a la categoría activa, + uno mismo)
  if (currentUser.teamId) {
    try {
      const { data: mt } = await window.sb.from('member_teams')
        .select('profile_id')
        .eq('club_id', currentUser.clubId)
        .eq('team_id', currentUser.teamId);
      const assigned = new Set((mt || []).map(r => r.profile_id));
      list = list.filter(p => assigned.has(p.id) || p.id === currentUser.id);
    } catch (_) { /* si member_teams falla, mostrar todos los del club (sin super-admins) */ }
  }

  members = list;
  populateAssigneeSelects();
  renderChatRightMembers();
}

// ── MESSAGES ──
async function loadMessages() {
  let q = window.sb.from('messages').select('id,sender_id,recipient_id,content,created_at,sender_name,attachment_url,attachment_name,attachment_size,attachment_type,link_preview').eq('club_id', currentUser.clubId);
  if (activeConv === 'group') {
    q = q.is('recipient_id', null);
    if (currentUser.teamId) q = q.eq('team_id', currentUser.teamId);
  } else {
    q = q.or(`and(sender_id.eq.${currentUser.id},recipient_id.eq.${activeConv}),and(sender_id.eq.${activeConv},recipient_id.eq.${currentUser.id})`);
  }
  const { data } = await q.order('created_at', { ascending: true }).limit(100);
  messages = data || [];
  renderedIds.clear();
  renderMessages();
}

async function loadDmPreviews() {
  const { data } = await window.sb.from('messages')
    .select('sender_id, recipient_id, content, sender_name, created_at')
    .eq('club_id', currentUser.clubId)
    .not('recipient_id', 'is', null)
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .order('created_at', { ascending: false })
    .limit(300);
  dmLastMsg = {};
  for (const msg of data || []) {
    const pid = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
    if (!dmLastMsg[pid]) dmLastMsg[pid] = msg;
  }
}

function renderMessages() {
  const wrap = document.getElementById('chatBody');
  if (!messages.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:48px;color:var(--cm-fg-muted);font-size:13px">${esc(tt('chat_tasks.no_messages_yet', 'No messages yet.'))}</div>`;
    return;
  }
  let html = '', lastDay = '';
  for (const msg of messages) {
    const day = new Date(msg.created_at).toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const label = day === new Date().toDateString()
        ? tt('chat_tasks.day_today', 'Today')
        : new Date(msg.created_at).toLocaleDateString(i18nLocale(), { weekday:'short', month:'short', day:'numeric' });
      html += `<div class="chat-day">${label}</div>`;
    }
    html += renderMsgHTML(msg);
    renderedIds.add(msg.id);
  }
  wrap.innerHTML = html;
}

function renderMsgHTML(msg) {
  const isMe   = msg.sender_id === currentUser.id;
  const av     = initials(msg.sender_name || '?');
  const time   = formatTime(msg.created_at);
  const content = esc(msg.content || '').replace(/\n/g, '<br>');
  const attHTML = msg.attachment_url ? renderAttHTML(msg) : '';
  const lpHTML  = msg.link_preview   ? renderLpHTML(msg.link_preview) : '';
  return `<div class="msg${isMe ? ' me' : ''}" data-msg-id="${msg.id}">
    <div class="mav">${av}</div>
    <div class="msg-body">
      <div class="bubble">
        ${!isMe ? `<div class="who">${esc(msg.sender_name)}</div>` : ''}
        ${content ? `<div class="text">${content}</div>` : ''}
        ${attHTML}${lpHTML}
        <div class="time">${time}${isMe ? ' <i class="ti ti-checks"></i>' : ''}</div>
      </div>
      <div class="msg-actions">
        <button class="msg-action-btn" onclick="pinMsgFromHover('${msg.id}')" title="Pin"><i class="ti ti-pin"></i></button>
      </div>
    </div>
  </div>`;
}

function renderAttHTML(msg) {
  if (msg.attachment_type === 'image') {
    return `<div class="att-img-wrap"><img src="${esc(msg.attachment_url)}" class="att-img" loading="lazy" alt="${esc(msg.attachment_name || '')}" onclick="window.open('${esc(msg.attachment_url)}','_blank')"></div>`;
  }
  const { icon, color } = fileTypeIcon(msg.attachment_type);
  const size = formatFileSize(msg.attachment_size);
  return `<div class="att" onclick="window.open('${esc(msg.attachment_url)}','_blank')">
    <div class="ic" style="color:${color}"><i class="ti ${icon}"></i></div>
    <div><div class="t">${esc(msg.attachment_name || tt('chat_tasks.file_fallback', 'File'))}</div>${size ? `<div class="s">${size}</div>` : ''}</div>
    <i class="ti ti-download" style="margin-left:auto;font-size:13px;color:var(--cm-fg-muted)"></i>
  </div>`;
}

function renderLpHTML(lp) {
  if (!lp) return '';
  if (lp.type === 'youtube') {
    const thumb = `https://img.youtube.com/vi/${lp.videoId}/hqdefault.jpg`;
    return `<div class="link-preview yt" onclick="window.open('${esc(lp.url)}','_blank')">
      <div class="yt-thumb-wrap"><img src="${thumb}" class="yt-thumb" loading="lazy" alt=""><div class="yt-play"><i class="ti ti-player-play-filled"></i></div></div>
      <div class="lp-info"><div class="lp-domain"><i class="ti ti-brand-youtube" style="color:#FF0000;font-size:11px"></i> YouTube</div>${lp.title ? `<div class="lp-title">${esc(lp.title)}</div>` : ''}${lp.author ? `<div class="lp-desc">${esc(lp.author)}</div>` : ''}</div>
    </div>`;
  }
  if (lp.type === 'vimeo') {
    return `<div class="link-preview" onclick="window.open('${esc(lp.url)}','_blank')">
      ${lp.thumbnail ? `<img src="${esc(lp.thumbnail)}" class="lp-img" loading="lazy" alt="">` : ''}
      <div class="lp-info"><div class="lp-domain"><i class="ti ti-brand-vimeo" style="color:#1AB7EA;font-size:11px"></i> Vimeo</div>${lp.title ? `<div class="lp-title">${esc(lp.title)}</div>` : ''}${lp.author ? `<div class="lp-desc">${esc(lp.author)}</div>` : ''}</div>
    </div>`;
  }
  const domain = (() => { try { return new URL(lp.url).hostname.replace('www.', ''); } catch { return ''; } })();
  return `<div class="link-preview" onclick="window.open('${esc(lp.url)}','_blank')">
    ${lp.image ? `<img src="${esc(lp.image)}" class="lp-img" loading="lazy" alt="">` : ''}
    <div class="lp-info"><div class="lp-domain">${esc(domain)}</div>${lp.title ? `<div class="lp-title">${esc(lp.title)}</div>` : ''}${lp.description ? `<div class="lp-desc">${esc(lp.description.slice(0, 140))}</div>` : ''}</div>
  </div>`;
}

function appendMsg(msg) {
  if (renderedIds.has(msg.id)) return;
  renderedIds.add(msg.id);
  const wrap = document.getElementById('chatBody');
  const empty = wrap.querySelector('div[style*="padding:48px"]');
  if (empty) empty.remove();
  const tmp = document.createElement('div');
  tmp.innerHTML = renderMsgHTML(msg);
  while (tmp.firstChild) wrap.appendChild(tmp.firstChild);
  scrollToBottom();
}

function scrollToBottom() {
  const w = document.getElementById('chatBody');
  if (w) w.scrollTop = w.scrollHeight;
}

async function sendMessage() {
  if (!currentUser) return;
  const inp = document.getElementById('msgInput');
  const content = (inp.value || '').trim();
  if (!content && !pendingAttachment) return;

  let attData = {};
  if (pendingAttachment) {
    const sendBtn = document.querySelector('.chat-send');
    if (sendBtn) sendBtn.disabled = true;
    try {
      const { url } = await uploadAttachment(pendingAttachment.file);
      attData = { attachment_url: url, attachment_name: pendingAttachment.name, attachment_size: pendingAttachment.size, attachment_type: pendingAttachment.type };
    } catch (err) {
      console.error('Upload error:', err);
      alert(tt('chat_tasks.error_uploading_file', 'Error uploading file: ' + (err.message || err), { msg: (err.message || err) }));
      if (sendBtn) sendBtn.disabled = false;
      return;
    }
    if (sendBtn) sendBtn.disabled = false;
  }

  const lpData = draftLinkPreview ? { link_preview: draftLinkPreview } : {};

  inp.value = '';
  removePendingAtt();
  clearLinkPreview();

  const { data, error } = await window.sb.from('messages').insert({
    club_id:      currentUser.clubId,
    sender_id:    currentUser.id,
    sender_name:  currentUser.name,
    content:      content || null,
    message_type: Object.keys(attData).length ? 'file' : 'text',
    recipient_id: activeConv === 'group' ? null : activeConv,
    team_id: activeConv === 'group' ? (currentUser.teamId || null) : null,
    ...attData,
    ...lpData
  }).select().single();

  if (!error && data) {
    messages.push(data);
    appendMsg(data);
    if (activeConv !== 'group') { dmLastMsg[activeConv] = data; renderConvList(); }
  }
}

    : tt('chat_tasks.team_channel', 'Team channel');

  let html = `<div class="chat-list-label">${esc(tt('chat_tasks.channels', 'Channels'))}</div>
    <div class="conv${groupActive ? ' is-on' : ''}" onclick="selectConv('group')">
      <div class="av g"><i class="ti ti-hash"></i></div>
      <div class="body">
        <div class="name-row"><span class="name">${esc(tt('chat_tasks.team_channel_name', '# team'))}</span></div>
        <div class="preview">${esc(groupPreview)}</div>
      </div>

    <div class="chat-list-label" style="display:flex;align-items:center">

    </div>`;

      const lm = messages[messages.length - 1];
      preview = (lm.sender_id === currentUser.id ? _you : '') + (lm.content || '').slice(0, 38);

  if (activeConv === id) return;
  activeConv = id;
  if (id !== 'group') { delete dmUnread[id]; updateUnreadBadge(); }

  window.cmChatMarkRead?.(channelKey);
  window.sb?.from('channel_reads').upsert({
    user_id: currentUser.id, channel_key: channelKey, club_id: currentUser.clubId,
    last_read_at: new Date().toISOString()
  }, { onConflict: 'user_id,channel_key,club_id' });
  renderedIds.clear();
  messages = [];
  document.getElementById('chatBody').innerHTML = `<div style="text-align:center;padding:48px;color:var(--cm-fg-muted)">${esc(tt('common.loading', 'Loading…'))}</div>`;

}

// ── TASKS ──
const STATUS_COL = { pending:'backlog', in_progress:'inprogress', cancelled:'blocked', done:'done' };
let activeTaskFilter = 'all';

function getFilteredTasks() {
  const myId = currentUser?.id;
  switch (activeTaskFilter) {
    case 'mine':     return allTasks.filter(t => t.assigned_to === myId && t.status !== 'cancelled');
    case 'overdue':  return allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done' && t.status !== 'cancelled');
    case 'today':    return allTasks.filter(t => t.due_date && isToday(t.due_date) && t.status !== 'done' && t.status !== 'cancelled');
    case 'matchday': return allTasks.filter(t => t.category === 'match_day' && t.status !== 'cancelled');
    case 'medical':  return allTasks.filter(t => t.category === 'medical'   && t.status !== 'cancelled');
    case 'routine':  return allTasks.filter(t => t.category === 'routine'   && t.status !== 'cancelled');
    default:         return allTasks.filter(t => t.status !== 'cancelled');
  }
}

function updatePillCounts() {
  const myId = currentUser?.id;
  const el = (id, n) => { const e = document.getElementById(id); if (e) e.textContent = n; };
  el('pillCtAll',      allTasks.filter(t => t.status !== 'cancelled').length);
  el('pillCtMine',     allTasks.filter(t => t.assigned_to === myId && t.status !== 'cancelled').length);
  el('pillCtOverdue',  allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done' && t.status !== 'cancelled').length);
  el('pillCtToday',    allTasks.filter(t => t.due_date && isToday(t.due_date) && t.status !== 'done' && t.status !== 'cancelled').length);
  el('pillCtMatchday', allTasks.filter(t => t.category === 'match_day' && t.status !== 'cancelled').length);
  el('pillCtMedical',  allTasks.filter(t => t.category === 'medical'   && t.status !== 'cancelled').length);
  el('pillCtRoutine',  allTasks.filter(t => t.category === 'routine'   && t.status !== 'cancelled').length);
}

async function loadTasks() {
  let _tkQ = window.sb.from('tasks')
    .select('id,title,description,status,priority,due_date,assigned_to,assigned_to_name,assigned_roles,created_by,category')
    .eq('club_id', currentUser.clubId);
  if (currentUser.teamId) _tkQ = _tkQ.eq('team_id', currentUser.teamId);
  const { data } = await _tkQ.order('created_at', { ascending: false });
  allTasks = data || [];
  renderKanban(getFilteredTasks());
  updatePillCounts();
  renderChatRightTasks();
  updateTasksBadge();
}

function renderKanban(tasks) {
  if (!tasks) tasks = getFilteredTasks();
  const cols   = { backlog: document.getElementById('colBacklog'), inprogress: document.getElementById('colInprogress'), blocked: document.getElementById('colBlocked'), done: document.getElementById('colDone') };
  const counts = { backlog: 0, inprogress: 0, blocked: 0, done: 0 };

  Object.values(cols).forEach(c => { if (c) c.innerHTML = ''; });

  for (const t of tasks) {
    const key = STATUS_COL[t.status] || 'backlog';
    counts[key]++;
    const col = cols[key];
    if (!col) continue;
    const el = document.createElement('div');
    el.innerHTML = renderTaskCardHTML(t);
    col.appendChild(el.firstChild);
  }

  document.getElementById('ctBacklog').textContent    = counts.backlog;
  document.getElementById('ctInprogress').textContent = counts.inprogress;
  document.getElementById('ctBlocked').textContent    = counts.blocked;
  document.getElementById('ctDone').textContent       = counts.done;

  const open = allTasks.filter(t => t.status !== 'done' && t.status !== 'cancelled').length;
  const overdue = allTasks.filter(t => t.due_date && isOverdue(t.due_date) && t.status !== 'done').length;
  const today   = allTasks.filter(t => t.due_date && isToday(t.due_date)   && t.status !== 'done').length;
  let sub = tt('chat_tasks.sub_open', `${open} open`, { n: open });
  if (today)   sub += ' · ' + tt('chat_tasks.sub_due_today', `${today} due today`, { n: today });
  if (overdue) sub += ' · ' + tt('chat_tasks.sub_overdue', `${overdue} overdue`, { n: overdue });
  document.getElementById('tasksSub').textContent = sub;
}

// ── Role → people resolution + per-role color (assign-by-role rendering) ──
// Colores estables por rol, usando tokens semánticos existentes del design system.
const ROLE_COLORS = {
  owner:        { bg:'var(--cm-accent-soft)', bd:'var(--cm-border)',      fg:'var(--cm-accent)'  },
  admin:        { bg:'var(--cm-warning-bg)',  bd:'var(--cm-warning-bd)',  fg:'var(--cm-warning)' },
  coach:        { bg:'var(--cm-info-bg)',     bd:'var(--cm-info-bd)',     fg:'var(--cm-info)'    },
  physio:       { bg:'var(--cm-danger-bg)',   bd:'var(--cm-danger-bd)',   fg:'var(--cm-danger)'  },
  analyst:      { bg:'var(--cm-violet-bg)',   bd:'var(--cm-violet-bd)',   fg:'var(--cm-violet)'  },
  nutritionist: { bg:'var(--cm-success-bg)',  bd:'var(--cm-success-bd)',  fg:'var(--cm-success)' },
  staff:        { bg:'var(--cm-bg-soft)',     bd:'var(--cm-border-soft)', fg:'var(--cm-fg-muted)'},
};
function roleColor(role) { return ROLE_COLORS[(role || '').toLowerCase()] || ROLE_COLORS.staff; }
// Resolve a roles array → active-team people with those roles (deduped by id).
function resolveRoleNames(roles) {
  const want = new Set((roles || []).map(r => (r || '').toLowerCase()));
  const seen = new Set(), out = [];
  for (const m of (members || [])) {
    const r = (m.role || '').toLowerCase();
    if (want.has(r) && !seen.has(m.id)) { seen.add(m.id); out.push({ id: m.id, full_name: m.full_name || '?', role: r }); }
  }
  return out;
}
// Foot HTML for a role-assigned task: up to 3 person chips (colored by role) + "+N";
// roles matching nobody in the active team fall back to a grey role-label chip.
function roleAssigneeHTML(t) {
  const people = resolveRoleNames(t.assigned_roles);
  const chips = [];
  people.slice(0, 3).forEach(p => {
    const c = roleColor(p.role);
    chips.push(`<div class="av tn" title="${esc(p.full_name)} · ${esc(roleLabel(p.role))}" style="background:${c.bg};border:1px solid ${c.bd};color:${c.fg}">${initials(p.full_name)}</div>`);
  });
  if (people.length > 3) {
    const rest = people.slice(3).map(p => p.full_name).join(', ');
    chips.push(`<div class="av tn" title="${esc(rest)}" style="background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);color:var(--cm-fg-muted)">+${people.length - 3}</div>`);
  }
  const matched = new Set(people.map(p => p.role));
  (t.assigned_roles || []).forEach(r => {
    const rl = (r || '').toLowerCase();
    if (rl && !matched.has(rl)) {
      chips.push(`<div class="av tn" title="${esc(tt('chat_tasks.no_role_in_team', `No ${roleLabel(rl)} in this team`, { role: roleLabel(rl) }))}" style="width:auto;padding:0 7px;border-radius:9px;background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);color:var(--cm-fg-muted)">${esc(roleLabel(rl))}</div>`);
    }
  });
  return chips.join('');
}

function renderTaskCardHTML(t) {
  const prio = { urgent:'hi', high:'hi', medium:'md', low:'lo' }[t.priority] || 'lo';
  const due  = t.due_date ? formatDate(t.due_date) : '';
  const ov   = t.due_date && isOverdue(t.due_date) && t.status !== 'done';
  const tod  = t.due_date && isToday(t.due_date)   && t.status !== 'done';
  const done = t.status === 'done';
  return `<div class="tcard${done ? '" style="opacity:.6"' : '"'} onclick="openTaskDetail('${t.id}')">
    <div class="tcard-top">
      <span class="tcard-prio ${prio}"></span>
      <span class="title"${done ? ' style="text-decoration:line-through"' : ''}>${esc(t.title)}</span>
    </div>
    <div class="foot">
      ${due ? `<span class="due${ov?' overdue':tod?' today':''}">${esc(due)}</span>` : ''}
      <div class="grow"></div>
      ${ (t.assigned_roles && t.assigned_roles.length)
           ? `<div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end">${roleAssigneeHTML(t)}</div>`
           : (t.assigned_to_name ? `<div class="av tn" title="${esc(t.assigned_to_name)}">${initials(t.assigned_to_name)}</div>` : '') }

async function saveDetail() {
  const taskId = document.getElementById('detailPanel').dataset.taskId;
  if (!taskId) return;
  const title = document.getElementById('detailTitleInput').value.trim();
  if (!title) { document.getElementById('detailTitleInput').focus(); alert(tt('chat_tasks.title_required', 'Title is required')); return; }

  // Assignment: strictly one or the other (never both).
  const mode = _detailMode || 'me';
  let assigned_to = null, assigned_to_name = null, assigned_roles = null;
  if (mode === 'roles') {
    if (!currentUser.teamId) { alert(tt('chat_tasks.select_active_team_role', 'Select an active team to assign by role')); return; }
    const roles = [...document.querySelectorAll('#detailRoles .role-chip.is-on')].map(el => el.dataset.role);
    if (!roles.length) {
      const h = document.getElementById('detailRolesHint');
      if (h) h.textContent = tt('chat_tasks.pick_at_least_one_role', 'Pick at least one role.');
      return;
    }
    assigned_roles = roles;
  } else {
    assigned_to      = currentUser.id;
    assigned_to_name = currentUser.name;
  }

  const patch = {
    title,
    description: document.getElementById('detailDescInput').value.trim() || null,
    due_date:    document.getElementById('detailDueInput').value || null,
    priority:    document.getElementById('detailPriority').value,
    category:    document.getElementById('detailCategory').value || 'general',
    status:      document.getElementById('detailStatus').value,
    assigned_to, assigned_to_name, assigned_roles,
    updated_at:  new Date().toISOString(),
  };
  const { error } = await window.sb.from('tasks').update(patch).eq('id', taskId);
  if (error) {
    console.error('Task update error:', error);
    alert(tt('chat_tasks.error_saving_task', 'Error saving task: ' + error.message, { msg: error.message }));
    return;
  }

  // Reminders: replace the PENDING ones, keep already-sent rows as history.
  try {
    await window.sb.from('task_reminders').delete().eq('task_id', taskId).is('sent_at', null);
    const { iso } = collectReminders('detailRemindersList');
    if (iso.length) {
      const { error: rErr } = await window.sb.from('task_reminders').insert(iso.map(remind_at => ({
        task_id: taskId, club_id: currentUser.clubId, remind_at, created_by: currentUser.id,
      })));
      if (rErr) console.warn('[reminders] insert failed:', rErr.message);
    }
  } catch (e) { console.warn('[reminders] failed:', e.message); }

  const t = allTasks.find(x => x.id === taskId);
  const _wasDone   = t && t.status === 'done';
  const _createdBy = t && t.created_by;
  if (t) Object.assign(t, patch);
  renderKanban();
  renderChatRightTasks();
  updateTasksBadge();

  // Notify everyone involved when a task transitions to done (not on every save of a done task).
  // Involved = creator + assignee(s); the person who completed it is always excluded.
  if (patch.status === 'done' && !_wasDone) {
    try {
      const ids = new Set();
      if (_createdBy)  ids.add(_createdBy);
      if (assigned_to) ids.add(assigned_to);
      if (assigned_roles && assigned_roles.length) {
        const want = new Set(assigned_roles.map(r => (r || '').toLowerCase()));
        (members || []).forEach(m => { if (want.has((m.role || '').toLowerCase())) ids.add(m.id); });
      }
      ids.delete(currentUser.id);
      const recipients = [...ids];
      if (recipients.length) {
        await window.sb.from('notifications').insert(recipients.map(uid => ({
          user_id: uid,
          club_id: currentUser.clubId,
          type:    'task_completed',
          title:   tt('chat_tasks.notif_task_completed', `Task completed: ${title}`, { title }),
          body:    tt('chat_tasks.notif_completed_by', `Completed by ${currentUser.name}`, { who: currentUser.name }),
          link:    '/Chat & Tasks.html',
        })));
      }
    } catch (e) { console.warn('[tasks] notify completed failed:', e.message); }
  }

  closeTaskDetail();
}
