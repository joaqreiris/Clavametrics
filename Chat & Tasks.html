// ── Task reminders UI (shared by New Task + Detail) ──
// Each reminder is one row with an absolute datetime-local. Presets are just
// shortcuts that prefill a row; everything is saved as an absolute remind_at.
function toLocalInputValue(d) {
  // Date → 'YYYY-MM-DDTHH:MM' in the user's LOCAL time (datetime-local format).
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function reminderRowHTML(value, sent) {
  if (sent) {
    return `<div class="rmd-row" data-sent="1" style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <input type="datetime-local" value="${value}" disabled style="flex:1;opacity:.55">
      <span style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted)">${esc(tt('chat_tasks.sent', 'sent'))}</span>
    </div>`;
  }
  return `<div class="rmd-row" style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
    <input type="datetime-local" class="rmd-input" value="${value}" style="flex:1">
    <button type="button" class="cm-btn is-outline is-sm" onclick="this.closest('.rmd-row').remove()" title="${esc(tt('chat_tasks.remove', 'Remove'))}"><i class="ti ti-x" style="font-size:13px"></i></button>
  </div>`;
}
function addReminderRow(listId, value) {
  const list = document.getElementById(listId);
  if (list) list.insertAdjacentHTML('beforeend', reminderRowHTML(value || '', false));
}
function addPresetReminder(listId, dueInputId, preset) {
  if (preset === 'custom') { addReminderRow(listId, ''); return; }
  const dueStr = document.getElementById(dueInputId)?.value || '';
  // Base = due date at 09:00 local, or now() when there's no due date.
  const base = dueStr ? new Date(dueStr + 'T09:00') : new Date();
  const d = new Date(base);
  if (preset === 'day')       d.setDate(d.getDate() - 1);
  else if (preset === 'hour') d.setHours(d.getHours() - 1);
  // 'due' → base as-is
  addReminderRow(listId, toLocalInputValue(d));
}
// Collect pending (non-sent) rows → { iso: [timestamptz…], hadPast: bool }.
// datetime-local is LOCAL wall-time; new Date(local).toISOString() gives the
// correct UTC instant so a "15:00" reminder fires at 15:00 the user's time.
function collectReminders(listId) {
  const rows = [...document.querySelectorAll(`#${listId} .rmd-row:not([data-sent]) .rmd-input`)];
  const iso = []; let hadPast = false;
  rows.forEach(inp => {
    const v = inp.value;
    if (!v) return;
    const d = new Date(v);
    if (isNaN(d.getTime())) return;
    if (d.getTime() < Date.now()) { hadPast = true; return; }
    iso.push(d.toISOString());
  });
  return { iso, hadPast };
}
async function loadTaskReminders(taskId, listId) {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';
  const { data } = await window.sb.from('task_reminders')
    .select('remind_at, sent_at').eq('task_id', taskId).order('remind_at');
  (data || []).forEach(r => {
    list.insertAdjacentHTML('beforeend',
      reminderRowHTML(toLocalInputValue(new Date(r.remind_at)), !!r.sent_at));
  });
}

async function saveNewTask() {
  const title = document.getElementById('newTaskTitle').value.trim();
  if (!title) { document.getElementById('newTaskTitle').focus(); return; }

  // Assignment mode: "me" (self, individual) or "roles" (staff role[], team-scoped).
  const mode = _newTaskMode || 'me';
  let assigned_to = null, assigned_to_name = null, assigned_roles = null;

  if (mode === 'roles') {
    // Role-assigned tasks need a team: the RLS role branch requires team_id IN my_team_ids().
    if (!currentUser.teamId) {
      alert(tt('chat_tasks.select_active_team_role_new', 'Select an active team before assigning a task by role.'));
      return;
    }
    const roles = [...document.querySelectorAll('#newTaskRoles .role-chip.is-on')].map(el => el.dataset.role);
    if (!roles.length) {
      const hint = document.getElementById('newTaskRolesHint');
      if (hint) hint.textContent = tt('chat_tasks.pick_at_least_one_role', 'Pick at least one role.');
      return;
    }
    assigned_roles = roles;
  } else {
    // "For me": force self-assignment (ignores the shelved person dropdown).
    assigned_to      = currentUser.id;
    assigned_to_name = currentUser.name;
  }

  const { data, error } = await window.sb.from('tasks').insert({
    club_id:          currentUser.clubId,
    created_by:       currentUser.id,
    created_by_name:  currentUser.name,
    assigned_to,
    assigned_to_name,
    assigned_roles,
    title,
    description: document.getElementById('newTaskDesc').value.trim() || null,
    due_date:    document.getElementById('newTaskDue').value || null,
    priority:    document.getElementById('newTaskPriority').value,
    category:    document.getElementById('newTaskCategory').value || 'general',
    status:      'pending',
    team_id:     currentUser.teamId || null
  }).select().single();
  if (error) {
    console.error('Task insert error:', error);
    alert(tt('chat_tasks.error_creating_task', 'Error creating task: ' + error.message, { msg: error.message }));
    return;
  }
  if (!data) {
    console.error('Task insert returned no data — check RLS policies on tasks table');
    return;
  }
  allTasks.unshift(data);
  renderKanban();
  renderChatRightTasks();
  updateTasksBadge();

  // Reminders → task_reminders (absolute times). Task already exists; failures are non-fatal.
  try {
    const { iso, hadPast } = collectReminders('newTaskRemindersList');
    if (iso.length) {
      const { error: rErr } = await window.sb.from('task_reminders').insert(iso.map(remind_at => ({
        task_id: data.id, club_id: currentUser.clubId, remind_at, created_by: currentUser.id,
      })));
      if (rErr) console.warn('[reminders] insert failed:', rErr.message);
    }
    if (hadPast) console.warn('[reminders] some reminder times were in the past and were skipped');
  } catch (e) { console.warn('[reminders] failed:', e.message); }

  // Notify assignees on creation (role-assigned only; "For me" is self → no notification).
  if (mode === 'roles' && assigned_roles && assigned_roles.length) {
    try {
      const want = new Set(assigned_roles.map(r => (r || '').toLowerCase()));
      const seen = new Set();
      const recipients = (members || []).filter(m => {
        const r = (m.role || '').toLowerCase();
        if (m.id === currentUser.id) return false;          // don't notify the creator
        if (!want.has(r) || seen.has(m.id)) return false;
        seen.add(m.id);
        return true;
      });
      if (recipients.length) {
        await window.sb.from('notifications').insert(recipients.map(m => ({
          user_id: m.id,
          club_id: currentUser.clubId,
          type:    'task_assigned',
          title:   tt('chat_tasks.notif_new_task', `New task: ${title}`, { title }),
          body:    tt('chat_tasks.notif_assigned_to_you', `Assigned to you · ${roleLabel(m.role)}`, { role: roleLabel(m.role) }),
          link:    '/Chat & Tasks.html',
        })));
      }
    } catch (e) { console.warn('[tasks] notify assignees failed:', e.message); }
  }

  closeNewTask();
}

// ── REALTIME ──
function subscribeRealtime() {
  // Limpiar canales viejos de esta página antes de re-suscribir (evita duplicados)
  try { window.sb.getChannels().filter(c => ['cm-chat-messages','cm-tasks'].includes(c.topic.replace('realtime:',''))).forEach(c => window.sb.removeChannel(c)); } catch(_){}
  window.sb.channel('cm-chat-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `club_id=eq.${currentUser.clubId}` }, handleNewMessage)
    .subscribe();

  window.sb.channel('cm-tasks')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tasks', filter: `club_id=eq.${currentUser.clubId}` }, payload => {
      const t = payload.new;
      if (!allTasks.find(x => x.id === t.id)) { allTasks.unshift(t); renderKanban(); renderChatRightTasks(); updateTasksBadge(); }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tasks', filter: `club_id=eq.${currentUser.clubId}` }, payload => {
      const t = payload.new;
      const i = allTasks.findIndex(x => x.id === t.id);
      if (i >= 0) allTasks[i] = t; else allTasks.unshift(t);
      renderKanban(); renderChatRightTasks(); updateTasksBadge();
    })
    .subscribe();
}

function handleNewMessage(payload) {
  const msg = payload.new;
  if (!msg) return;
  const isGroup  = !msg.recipient_id;
  const inActive = (activeConv === 'group' && isGroup) ||
    (!isGroup && activeConv !== 'group' && (msg.sender_id === activeConv || msg.recipient_id === activeConv));
  if (inActive && !messages.find(m => m.id === msg.id)) { messages.push(msg); appendMsg(msg); }
  if (!isGroup) {
    const pid = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
    if (!dmLastMsg[pid] || msg.created_at > dmLastMsg[pid].created_at) dmLastMsg[pid] = msg;
  }
  if (msg.sender_id !== currentUser.id && !inActive) {
    if (!isGroup) dmUnread[msg.sender_id] = (dmUnread[msg.sender_id] || 0) + 1;
    updateUnreadBadge();
    renderConvList();
  }
}

// ── FILE ATTACHMENT ──
function handleAttachClick() { document.getElementById('fileInput').click(); }

function getFileCategory(file) {
  const t = file.type;
  if (t.startsWith('image/'))  return 'image';
  if (t === 'application/pdf') return 'pdf';
  if (t.includes('word') || t.includes('document')) return 'doc';
  if (t.includes('sheet') || t.includes('excel') || t.includes('spreadsheet')) return 'spreadsheet';
  if (t.startsWith('video/'))  return 'video';
  return 'other';
}

function formatFileSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pendingAttachment = { file, name: file.name, size: file.size, type: getFileCategory(file) };
  renderPendingAtt();
}

function renderPendingAtt() {
  const el = document.getElementById('pendingAtt');
  if (!el) return;
  if (!pendingAttachment) { el.innerHTML = ''; el.style.display = 'none'; return; }
  const f = pendingAttachment;
  const { icon, color } = fileTypeIcon(f.type);
  const sizeStr = formatFileSize(f.size);
  if (f.type === 'image') {
    const url = URL.createObjectURL(f.file);
    el.innerHTML = `<div class="pending-att"><div class="pending-att-inner"><img src="${url}" class="pending-att-thumb" alt="${esc(f.name)}"><div class="pending-att-info"><div class="pending-att-name">${esc(f.name)}</div><div class="pending-att-size">${sizeStr}</div></div><button class="pending-att-rm" onclick="removePendingAtt()"><i class="ti ti-x"></i></button></div></div>`;
  } else {
    el.innerHTML = `<div class="pending-att"><div class="pending-att-inner"><div class="pending-att-ic" style="color:${color}"><i class="ti ${icon}"></i></div><div class="pending-att-info"><div class="pending-att-name">${esc(f.name)}</div><div class="pending-att-size">${sizeStr}</div></div><button class="pending-att-rm" onclick="removePendingAtt()"><i class="ti ti-x"></i></button></div></div>`;
  }
  el.style.display = '';
}

function removePendingAtt() {
  pendingAttachment = null;
  const el = document.getElementById('pendingAtt');
  if (el) { el.innerHTML = ''; el.style.display = 'none'; }
}

async function uploadAttachment(file) {
  const channelId = activeConv === 'group' ? 'group' : activeConv;
  const safeName  = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path      = `${currentUser.clubId}/${channelId}/${Date.now()}-${safeName}`;
  const { error } = await window.sb.storage.from('chat-attachments').upload(path, file, { cacheControl: '3600', upsert: false });
  if (error) throw error;
  const { data: { publicUrl } } = window.sb.storage.from('chat-attachments').getPublicUrl(path);
  return { url: publicUrl };
}

// ── URL DETECTION / LINK PREVIEW ──
function extractUrl(text) {
  const m = text.match(/https?:\/\/[^\s]+/);
  return m ? m[0] : null;
}

function extractYoutubeId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?.*v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function detectAndPreviewUrl(url) {
  const ytId = extractYoutubeId(url);
  if (ytId) {
    let preview = { type: 'youtube', url, videoId: ytId };
    try {
      const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
      if (res.ok) { const d = await res.json(); preview.title = d.title; preview.author = d.author_name; }
    } catch {}
    draftLinkPreview = preview;
  } else if (/vimeo\.com\/\d+/.test(url)) {
    let preview = { type: 'vimeo', url };
    try {
      const res = await fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`);
      if (res.ok) { const d = await res.json(); preview.title = d.title; preview.thumbnail = d.thumbnail_url; preview.author = d.author_name; }
    } catch {}
    draftLinkPreview = preview;
  } else {
    let preview = { type: 'link', url };
    try {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 5000);
      const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { signal: controller.signal });
      if (res.ok) {
        const html = await res.text();
        const doc  = new DOMParser().parseFromString(html, 'text/html');
        const og   = (p) => doc.querySelector(`meta[property="${p}"]`)?.content || doc.querySelector(`meta[name="${p}"]`)?.content || '';
        preview.title       = og('og:title')       || doc.title || '';
        preview.description = og('og:description') || '';
        preview.image       = og('og:image')       || '';
      }
    } catch {}
    draftLinkPreview = preview;
  }
  renderDraftLinkPreview();
}

function renderDraftLinkPreview() {
  const el = document.getElementById('linkPreviewDraft');
  if (!el || !draftLinkPreview) return;
  const lp    = draftLinkPreview;
  const label = lp.title || (() => { try { return new URL(lp.url).hostname; } catch { return lp.url; } })();
  el.innerHTML = `<div class="lp-draft"><i class="ti ti-link" style="font-size:13px;color:var(--cm-fg-muted);flex-shrink:0"></i><div class="lp-draft-info"><div class="lp-draft-title">${esc(label)}</div><div class="lp-draft-url">${esc(lp.url)}</div></div><button class="lp-draft-rm" onclick="clearLinkPreview()"><i class="ti ti-x"></i></button></div>`;
  el.style.display = '';
}

function clearLinkPreview() {
  draftLinkPreview = null;
  const el = document.getElementById('linkPreviewDraft');
  if (el) { el.innerHTML = ''; el.style.display = 'none'; }
}

// ── PIN FROM MESSAGE ──
async function pinMsgFromHover(msgId) {
  const msg = messages.find(m => m.id === msgId);
  if (!msg) return;
  if (msg.attachment_url) {
    await pinFileDirectly(msg.attachment_url, msg.attachment_name, msg.attachment_type);
  } else {
    openPinModal();
  }
}

async function pinFileDirectly(url, name, type) {
  const convId = activeConv === 'group' ? 'group' : activeConv;
  const { data, error } = await window.sb.from('pinned_files').insert({
    club_id:   currentUser.clubId, conv_id: convId,
    file_url:  url, file_name: name || tt('chat_tasks.file_fallback', 'File'), file_type: type || null, pinned_by: currentUser.id
  }).select().single();
  if (error) { console.error('Pin error:', error); alert(tt('chat_tasks.error_pinning', 'Error pinning: ' + error.message, { msg: error.message })); return; }
  if (data) { pinnedFiles.unshift(data); renderPinnedFiles(); showToast(tt('chat_tasks.pinned_toast', 'Pinned')); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--cm-fg-strong);color:var(--cm-surface);padding:8px 16px;border-radius:8px;font:500 13px/1 var(--cm-font-sans);z-index:9999;pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

}

function closePinModal() {
  document.getElementById('pinModalOverlay').classList.remove('is-open');
  pinModalFile = null;
}

        <i class="ti ti-cloud-upload" style="font-size:28px;display:block;margin-bottom:8px"></i>
        <div style="font:500 12.5px/1.5 var(--cm-font-sans)">${esc(tt('chat_tasks.click_select_file', 'Click to select a file'))}<br><span style="font-size:11px;color:var(--cm-fg-faint)">${esc(tt('chat_tasks.upload_formats', 'PDF · DOCX · XLSX · PNG · JPG · MP4 · MOV'))}</span></div>
      </div>
      <input type="file" id="pinFileInputModal" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.mp4,.mov" style="display:none" onchange="handlePinFileSelect(event)">

      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">${esc(tt('chat_tasks.url_required', 'URL *'))}</label><input type="text" id="pinLinkUrl" placeholder="https://…" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none;box-sizing:border-box"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">${esc(tt('chat_tasks.name_required', 'Name *'))}</label><input type="text" id="pinLinkName" placeholder="${esc(tt('chat_tasks.file_name', 'File name…'))}" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none;box-sizing:border-box"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font:600 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cm-fg-muted)">${esc(tt('chat_tasks.type_label', 'Type'))}</label>
        <select id="pinLinkType" style="width:100%;padding:8px 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);font:var(--cm-body);color:var(--cm-fg);outline:none">
          <option value="">${esc(tt('chat_tasks.type_other', 'Other'))}</option><option value="pdf">${esc(tt('chat_tasks.type_pdf', 'PDF'))}</option><option value="image">${esc(tt('chat_tasks.type_image', 'Image'))}</option><option value="spreadsheet">${esc(tt('chat_tasks.type_spreadsheet', 'Spreadsheet'))}</option><option value="video">${esc(tt('chat_tasks.type_video', 'Video'))}</option>
        </select>
      </div>`;
  }
}

function handlePinFileSelect(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pinModalFile = file;
  const preview = document.getElementById('pinUploadPreview');
  if (preview) {
    const { icon, color } = fileTypeIcon(getFileCategory(file));
    preview.innerHTML = `<div class="pending-att"><div class="pending-att-inner"><div class="pending-att-ic" style="color:${color}"><i class="ti ${icon}"></i></div><div class="pending-att-info"><div class="pending-att-name">${esc(file.name)}</div><div class="pending-att-size">${formatFileSize(file.size)}</div></div></div></div>`;
  }
  const area = document.getElementById('pinUploadArea');
  if (area) area.style.borderColor = 'var(--cm-accent)';
}

async function savePinModal() {
  const btn = document.getElementById('pinModalSaveBtn');
  if (pinModalTab === 'upload') {
    if (!pinModalFile) { alert(tt('chat_tasks.select_file_first', 'Select a file first.')); return; }
    if (btn) { btn.textContent = tt('chat_tasks.uploading', 'Uploading…'); btn.disabled = true; }
    try {
      const safeName = pinModalFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path     = `${currentUser.clubId}/pinned/${Date.now()}-${safeName}`;
      const { error: upErr } = await window.sb.storage.from('chat-attachments').upload(path, pinModalFile, { cacheControl: '3600', upsert: false });
      if (upErr) throw upErr;
      const { data: { publicUrl } } = window.sb.storage.from('chat-attachments').getPublicUrl(path);
      await pinFileDirectly(publicUrl, pinModalFile.name, getFileCategory(pinModalFile));
      closePinModal();
    } catch (err) {
      console.error('Pin upload error:', err);
      alert(tt('chat_tasks.error_uploading', 'Error uploading: ' + (err.message || err), { msg: (err.message || err) }));
    } finally {
      if (btn) { btn.textContent = tt('chat_tasks.pin', 'Pin'); btn.disabled = false; }
    }
  } else {
    const url  = (document.getElementById('pinLinkUrl')?.value  || '').trim();
    const name = (document.getElementById('pinLinkName')?.value || '').trim();
    const type = document.getElementById('pinLinkType')?.value  || null;
    if (!url)  { document.getElementById('pinLinkUrl')?.focus(); return; }
    if (!name) { document.getElementById('pinLinkName')?.focus(); return; }
    await pinFileDirectly(url, name, type);
    closePinModal();
  }
}

// ── COMPOSER POPOVERS (emoji + mention) + create task ──
const COMPOSER_EMOJIS = ['😀','😁','😂','🤣','😊','😉','😍','😘','😎','🤔','😐','😴','😅','😬','😢','😭','😤','😡','🥳','🤩','👍','👎','👏','🙌','🙏','💪','🔥','✅','❌','⭐','✨','💯','⚽','🏆','🥅','📋','📌','📎','⏱️','📅','⚠️','❤️','🎯','🚀','👀','💬','🎉','☝️'];

function _composerCloseAllPops() {
  document.getElementById('emojiPop')?.classList.add('is-hidden');
  document.getElementById('mentionPop')?.classList.add('is-hidden');
}

// Insert text at the caret position of #msgInput, then restore focus past it.
function _composerInsertAtCursor(text) {
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end   = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, start) + text + inp.value.slice(end);
  const pos = start + text.length;
  inp.focus();
  try { inp.setSelectionRange(pos, pos); } catch (_) {}
}

function _openEmojiPop() {
  const pop = document.getElementById('emojiPop');
  if (!pop) return;
  if (!pop.dataset.built) {
    pop.innerHTML = `<div class="cmp-emoji-grid">${COMPOSER_EMOJIS.map(em => `<button type="button" data-emoji="${em}">${em}</button>`).join('')}</div>`;
    pop.querySelectorAll('button[data-emoji]').forEach(b => {
      b.addEventListener('click', () => { _composerInsertAtCursor(b.dataset.emoji); _composerCloseAllPops(); });
    });
    pop.dataset.built = '1';
  }
  pop.classList.remove('is-hidden');
}

function _openMentionPop() {
  const pop = document.getElementById('mentionPop');
  if (!pop) return;
  pop.innerHTML = members.length
    ? members.map((m, i) => {
        const name = m.full_name || '?';
        return `<div class="cmp-m-item" data-mi="${i}">
          <div class="av">${initials(name)}</div>
          <div class="who"><div class="n">${esc(name)}</div><div class="r">${esc(m.role || '')}</div></div>
        </div>`;
      }).join('')
    : `<div class="cmp-m-empty">${esc(tt('chat_tasks.no_members', 'No members'))}</div>`;
  pop.querySelectorAll('.cmp-m-item').forEach(el => {
    el.addEventListener('click', () => {
      const m = members[+el.dataset.mi];
      if (m) {
        // If the user already typed an "@partial" token before the caret, strip
        // it first so we don't end up with "@@Name" / "@jo@Name".
        const inp = document.getElementById('msgInput');
        if (inp) {
          const caret  = inp.selectionStart ?? inp.value.length;
          const before = inp.value.slice(0, caret);
          const tok    = before.match(/(?:^|\s)(@[^\s]*)$/);
          if (tok) {
            const tokenStart = caret - tok[1].length;
            inp.value = inp.value.slice(0, tokenStart) + inp.value.slice(caret);
            try { inp.setSelectionRange(tokenStart, tokenStart); } catch (_) {}
          }
        }
        _composerInsertAtCursor('@' + (m.full_name || '') + ' ');
      }
      _composerCloseAllPops();
    });
  });
  pop.classList.remove('is-hidden');
}

function toggleEmojiPop(e) {
  e?.stopPropagation();
  const wasHidden = document.getElementById('emojiPop')?.classList.contains('is-hidden');
  _composerCloseAllPops();
  if (wasHidden) _openEmojiPop();
}

function toggleMentionPop(e) {
  e?.stopPropagation();
  const wasHidden = document.getElementById('mentionPop')?.classList.contains('is-hidden');
  _composerCloseAllPops();
  if (wasHidden) _openMentionPop();
}

// Create task from composer text → reuse existing openNewTask() modal + insert.
function composerCreateTask(e) {
  e?.stopPropagation();
  _composerCloseAllPops();
  const title = (document.getElementById('msgInput')?.value || '').trim();
  openNewTask(title);
}

// Typing "@" at the start or after whitespace also opens the mention popover.
document.getElementById('msgInput')?.addEventListener('input', () => {
  const inp = document.getElementById('msgInput');
  const pos = inp.selectionStart ?? 0;
  const ch  = inp.value[pos - 1];
  const prev = pos >= 2 ? inp.value[pos - 2] : '';
  if (ch === '@' && (pos === 1 || /\s/.test(prev))) {
    if (document.getElementById('mentionPop')?.classList.contains('is-hidden')) {
      _composerCloseAllPops();
      _openMentionPop();
    }
  }
});

// One popover at a time; close on outside click and Esc.
document.addEventListener('click', e => {
  if (e.target.closest('#emojiPop, #mentionPop')) return;
  _composerCloseAllPops();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') _composerCloseAllPops();
});

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeNewTask(); closeTaskDetail(); closeDmPicker(); closePinModal(); }
});
document.getElementById('msgInput')?.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput')?.addEventListener('input', e => {
  clearTimeout(urlDetectTimer);
  const url = extractUrl(e.target.value);
  if (url) {
    urlDetectTimer = setTimeout(() => detectAndPreviewUrl(url), 700);
  } else if (draftLinkPreview) {
    clearLinkPreview();
  }
});

// Re-render JS-built chrome when the language changes (static nodes are handled
// by the sidebar's i18n runtime; only re-paint text, never touch realtime/scroll).
document.addEventListener('cm:langchanged', () => {
  if (!currentUser) return;
  try {
    renderConvList();
    updateChatHeader();
    renderMessages();
    renderChatRightMembers();
    renderChatRightTasks();
    renderPinnedFiles();
    renderKanban(getFilteredTasks());
    updatePillCounts();
  } catch (_) {}
});
