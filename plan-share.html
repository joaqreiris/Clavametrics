<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="plan_share.title_tab">Training plan — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#15803D">
<link rel="apple-touch-icon" href="/assets/clava-app-192.png">
<link rel="icon" href="/assets/clava-app-192.png">
<style>
  /* The club's colour brands the page chrome (top bar, crest ring, day rails).
     Links and actions keep the ClavaMetrics accent so they stay legible whatever
     colour the club picked. */
  :root{ --ps-club:#15803D; }
  html,body{background:var(--cm-bg,#0f1216)}
  body{-webkit-text-size-adjust:100%}
  .ps-wrap{max-width:720px;margin:0 auto;padding:0 14px 56px}

  /* ── Top bar: club crest + name, ClavaMetrics on the right ── */
  .ps-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 4px;margin:0 -14px 16px;padding-left:18px;padding-right:18px;
    background:color-mix(in srgb, var(--cm-surface) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--cm-border-soft,var(--cm-border))}
  .ps-top .crest{width:30px;height:30px;flex:none;border-radius:8px;object-fit:contain;background:var(--cm-bg-soft);
    padding:2px;box-shadow:inset 0 0 0 1px var(--cm-border-soft,var(--cm-border))}
  .ps-top .crest.is-mono{display:flex;align-items:center;justify-content:center;
    font:700 12px/1 var(--cm-font-sans);color:#fff;background:var(--ps-club);padding:0}
  .ps-top .club{font:600 14px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ps-top .by{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;
    font:500 11px/1 var(--cm-font-mono);letter-spacing:.04em;color:var(--cm-fg-faint)}
  .ps-top .by .mark{width:18px;height:18px;border-radius:5px;object-fit:contain;display:block}

  .ps-card{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4,14px);
    padding:16px;margin-bottom:12px}

  /* ── Hero: who this plan is for ── */
  .ps-hero{position:relative;overflow:hidden;padding-top:20px}
  .ps-hero::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--ps-club)}
  .ps-hero .who{display:flex;align-items:center;gap:13px}
  .ps-hero .av{width:52px;height:52px;flex:none;border-radius:50%;background:var(--cm-bg-soft);overflow:hidden;
    color:var(--cm-fg-strong);display:flex;align-items:center;justify-content:center;
    font:600 17px/1 var(--cm-font-sans);box-shadow:0 0 0 2px var(--cm-surface),0 0 0 4px color-mix(in srgb, var(--ps-club) 30%, transparent)}
  .ps-hero .av{position:relative}
  .ps-hero .av .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ps-hero .av img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
  .ps-hero .nm{min-width:0}
  .ps-hero .name{font:700 21px/1.15 var(--cm-font-sans);letter-spacing:-.02em;color:var(--cm-fg-strong)}
  .ps-hero .name .num{font-weight:500;color:var(--cm-fg-muted)}
  .ps-hero .sub{font:500 11px/1 var(--cm-font-mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--cm-fg-muted);margin-top:6px}
  .ps-hero .plan{margin-top:14px;font:600 16px/1.3 var(--cm-font-sans);color:var(--cm-fg-strong)}
  .ps-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ps-chip{font:500 10.5px/1 var(--cm-font-mono);letter-spacing:.05em;text-transform:uppercase;
    padding:6px 9px;border-radius:6px;background:var(--cm-bg-soft);color:var(--cm-fg-muted)}
  .ps-chip.is-status{background:rgba(21,128,61,.12);color:#15803D}
  .ps-chip.is-status.draft{background:var(--cm-bg-soft);color:var(--cm-fg-muted)}
  .ps-goal{display:flex;gap:7px;align-items:flex-start;margin-top:13px;padding-top:13px;
    border-top:1px solid var(--cm-border-soft,var(--cm-border));font:var(--cm-body-sm);color:var(--cm-fg)}
  .ps-goal i{color:var(--ps-club);font-size:15px;flex:none;margin-top:1px}

  /* ── Week at a glance ── */
  .ps-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .ps-stat{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:10px;padding:11px 12px}
  .ps-stat .v{font:700 19px/1 var(--cm-font-sans);letter-spacing:-.02em;color:var(--cm-fg-strong)}
  .ps-stat .l{font:500 9.5px/1.2 var(--cm-font-mono);letter-spacing:.07em;text-transform:uppercase;
    color:var(--cm-fg-muted);margin-top:6px}

  /* ── Phases ── */
  .ps-phases{display:flex;flex-wrap:wrap;gap:8px}
  .ps-phase{flex:1 1 150px;border:1px solid var(--cm-border);border-left-width:4px;border-radius:8px;
    padding:10px 12px;background:var(--cm-bg-soft)}
  .ps-phase .pn{font:600 13px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong)}
  .ps-phase .pw{font:500 10.5px/1 var(--cm-font-mono);color:var(--cm-fg-muted);margin-top:5px}
  .ps-phase .po{font:var(--cm-body-sm);color:var(--cm-fg-muted);margin-top:6px}

  .ps-sec-h{display:flex;align-items:center;gap:10px;margin:22px 2px 12px;
    font:600 11px/1 var(--cm-font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cm-fg-muted)}
  .ps-sec-h::after{content:'';flex:1;height:1px;background:var(--cm-border-soft,var(--cm-border))}

  /* ── Day ── */
  .ps-day{margin-bottom:18px}
  .ps-day-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 9px}
  .ps-day-h .dow{font:700 16px/1 var(--cm-font-sans);letter-spacing:-.01em;color:var(--cm-fg-strong);text-transform:capitalize}
  .ps-day-h .dom{font:500 13px/1 var(--cm-font-mono);color:var(--cm-fg-muted)}
  .ps-day-h .tot{margin-left:auto;font:500 10.5px/1 var(--cm-font-mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--cm-fg-muted)}
  .ps-rest{display:flex;align-items:center;gap:8px;padding:14px 16px;border-radius:12px;
    border:1px dashed var(--cm-border);color:var(--cm-fg-muted);font:var(--cm-body-sm)}
  .ps-rest i{font-size:17px}

  /* ── Block ── */
  .ps-block{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:12px;
    overflow:hidden;margin-bottom:9px}
  .ps-block-h{display:flex;align-items:center;gap:9px;padding:12px 14px;
    border-left:4px solid var(--cm-fg-faint);background:var(--cm-bg-soft)}
  .ps-block-h .bn{font:600 14.5px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong);flex:1;min-width:0}
  .ps-block-h .bt{font:500 10.5px/1 var(--cm-font-mono);letter-spacing:.05em;text-transform:uppercase;
    color:var(--cm-fg-muted);padding:5px 7px;border-radius:5px;background:var(--cm-surface);
    border:1px solid var(--cm-border-soft,var(--cm-border));flex:none}
  .ps-block-goal{display:flex;gap:7px;align-items:flex-start;padding:11px 14px 0;font:var(--cm-body-sm);color:var(--cm-fg)}
  .ps-block-goal i{color:var(--ps-club);font-size:14px;flex:none;margin-top:1px}
  .ps-block-notes{padding:8px 14px 0;font:var(--cm-body-sm);color:var(--cm-fg-muted)}

  /* ── Exercise ── */
  .ps-ex{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--cm-border-soft,var(--cm-border))}
  /* superset rows: A1/A2 tag + a rail joining the pair */
  .ps-ex-tag{display:inline-flex;align-items:center;height:17px;padding:0 5px;margin-right:5px;border-radius:4px;
    background:var(--ps-club);color:#fff;font:700 10.5px/1 var(--cm-font-mono);letter-spacing:.03em;vertical-align:1px}
  .ps-ex.has-next{padding-bottom:7px}
  .ps-ex.is-linked{border-top:0;padding-top:0}
  .ps-ex.is-linked .ps-ex-thumb{margin-top:0}
  .ps-ex.has-next .ps-ex-body,.ps-ex.is-linked .ps-ex-body{border-left:2px solid color-mix(in srgb, var(--ps-club) 35%, transparent);padding-left:10px}
  .ps-block-goal + .ps-ex,.ps-block-notes + .ps-ex{border-top:0;padding-top:11px}
  .ps-ex-thumb{width:60px;height:60px;flex:none;border-radius:10px;overflow:hidden;background:var(--cm-bg-soft);
    display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--cm-font-sans);
    color:var(--cm-fg-muted);position:relative;border:0;padding:0}
  .ps-ex-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ps-ex-thumb > .ti{font-size:22px;color:var(--cm-fg-faint)}
  .ps-ex-thumb.is-playable{cursor:zoom-in}
  .ps-ex-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(15,17,22,.28);color:#fff}
  .ps-ex-thumb .play i{font-size:22px}
  .ps-ex-body{flex:1;min-width:0}
  .ps-ex-name{font:600 14px/1.25 var(--cm-font-sans);color:var(--cm-fg-strong)}
  .ps-ex-sets{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .ps-set{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--cm-font-mono);
    padding:6px 8px;border-radius:6px;background:var(--cm-bg-soft);color:var(--cm-fg)}
  .ps-set .x{font-weight:700;color:var(--cm-fg-strong)}
  .ps-ex-extra{font:var(--cm-body-sm);color:var(--cm-fg-muted);margin-top:6px}
  .ps-watch{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:6px 10px;border-radius:7px;
    border:1px solid var(--cm-border);background:transparent;cursor:pointer;
    font:600 12px/1 var(--cm-font-sans);color:var(--cm-accent,#16A34A);text-decoration:none}
  .ps-watch:hover{background:var(--cm-bg-soft);border-color:var(--cm-accent,#16A34A)}
  .ps-watch i{font-size:14px}

  /* ── Video / image viewer ── */
  .ps-media{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.86);
    display:flex;align-items:center;justify-content:center;padding:22px}
  .ps-media-box{position:relative;width:100%;max-width:860px}
  .ps-media-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .ps-media-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ps-media-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .ps-media-cap{margin-top:10px;text-align:center;font:600 13px/1.3 var(--cm-font-sans);color:#fff}
  .ps-media-close{position:absolute;top:-42px;right:0;width:34px;height:34px;border-radius:9px;border:0;
    background:#fff;color:#15181D;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ps-media-close i{font-size:19px}

  /* ── States / footer ── */
  .ps-state{text-align:center;padding:64px 20px;color:var(--cm-fg-muted)}
  .ps-state i{font-size:40px;display:block;margin-bottom:14px;color:var(--cm-fg-faint)}
  .ps-state .t{font:600 17px/1.3 var(--cm-font-sans);color:var(--cm-fg-strong);margin-bottom:6px}
  .ps-foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:26px;
    font:500 10.5px/1 var(--cm-font-mono);letter-spacing:.06em;color:var(--cm-fg-faint);text-transform:uppercase}
  .ps-foot .mark{width:16px;height:16px;border-radius:4px;object-fit:contain;display:block}

  @media (max-width:520px){
    .ps-hero .name{font-size:19px}
    .ps-stats{gap:6px}
    .ps-stat{padding:10px}
    .ps-stat .v{font-size:17px}
    .ps-ex-thumb{width:52px;height:52px}
  }
  @media print{
    .ps-top{position:static;backdrop-filter:none}
    .ps-watch,.ps-media{display:none!important}
    .ps-block,.ps-card,.ps-stat{break-inside:avoid}
    .ps-block-h,.ps-hero::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body class="cm">
<div class="ps-wrap">
  <div class="ps-top" id="ps-top">
    <span class="crest is-mono" id="ps-crest">·</span>
    <span class="club" id="ps-club">ClavaMetrics</span>
    <span class="by"><img class="mark" src="assets/clava-app-192.png" alt="" width="18" height="18">ClavaMetrics</span>
  </div>
  <div id="ps-root">
    <div class="ps-state"><i class="ti ti-loader-2"></i><div data-i18n="plan_share.loading">Loading…</div></div>
  </div>
  <div class="ps-foot"><img class="mark" src="assets/clava-app-192.png" alt="" width="16" height="16"><span data-i18n="plan_share.powered_by">Powered by ClavaMetrics</span></div>
</div>

<script src="assets/i18n.js" defer></script>
<script>
(function(){
  'use strict';
  var SB_URL = 'https://xesrumijvdmqjrufgeka.supabase.co';
  var SB_KEY = 'sb_publishable_p4DBCWsAm9u-Wf5-_CP-Yw_MYh_3cR6';
  function tt(key, en, vars){
    if (window.CM_I18N && CM_I18N.t){ var v = CM_I18N.t(key, vars); if (v != null && v !== key) return v; }
    var s = (en != null ? en : key);
    if (vars) s = s.replace(/\{(\w+)\}/g, function(_, k){ return vars[k] != null ? vars[k] : '{'+k+'}'; });
    return s;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // Bloquea javascript:/data: en href — solo permite http(s) o rutas relativas.
  function safeUrl(u){ var s=String(u==null?'':u).trim(); return /^(https?:\/\/|\/|\.\/|#)/i.test(s) ? s : '#'; }
  function youtubeId(url){
    if (!url) return null;
    var m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  var TYPE_COLOR = { warmup:'#10B981', myo:'#A78BFA', mob:'#06B6D4', act:'#22C55E', str:'#DC2626', plyo:'#F59E0B', skills:'#3B82F6', field:'#15803D', cond:'#EA580C', cool:'#64748B', assess:'#0EA5E9' };
  var TYPE_LABEL_EN = { warmup:'Warm-up', myo:'Myofascial', mob:'Mobility', act:'Activation', str:'Strength', plyo:'Plyometrics', skills:'Skills', field:'On-field', cond:'Conditioning', cool:'Cooldown', assess:'Assessment' };
  var LOAD_COLOR = { low:'#16A34A', moderate:'#F59E0B', high:'#DC2626' };
  var LOAD_EN = { low:'Low', moderate:'Moderate', high:'High' };
  var FOCUS_EN = { 'strength':'Strength','power':'Power','return-to-perform':'Return to perform','prevention':'Prevention','custom':'Custom' };
  var STATUS_EN = { draft:'Draft', active:'Active', completed:'Completed', archived:'Archived' };

  var root = document.getElementById('ps-root');
  function initials(n){ return String(n||'—').split(/\s+/).map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2) || '—'; }

  function stateMsg(icon, title, body){
    root.innerHTML = '<div class="ps-state"><i class="ti '+icon+'"></i><div class="t">'+esc(title)+'</div><div>'+esc(body)+'</div></div>';
  }

  // ── Club branding: crest + colour on the page chrome ──
  // Very light colours would wash out against the white surface, so those fall
  // back to the ClavaMetrics green instead of an invisible rail.
  function isLightHex(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
    if (!m) return true;
    var n = parseInt(m[1], 16);
    var r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    return (0.2126*r + 0.7152*g + 0.0722*b) / 255 > 0.72;
  }
  // Idempotent: the page re-renders on language change, and by then the crest
  // placeholder may already have been swapped for the <img>.
  function applyClub(club){
    if (!club) return;
    var nameEl = document.getElementById('ps-club');
    var crest  = document.getElementById('ps-crest');
    if (club.primary_color && !isLightHex(club.primary_color)){
      document.documentElement.style.setProperty('--ps-club', club.primary_color);
    }
    var name = club.name || club.short_name || '';
    if (name && nameEl) nameEl.textContent = name;
    if (!crest) return;
    if (club.logo_url && crest.tagName !== 'IMG'){
      var img = new Image();
      img.id = 'ps-crest';
      img.className = 'crest';
      img.alt = name;
      img.referrerPolicy = 'no-referrer';
      img.onload = function(){ var c = document.getElementById('ps-crest'); if (c && c !== img) c.replaceWith(img); };
      img.src = safeUrl(club.logo_url);
    } else if (!club.logo_url && crest.tagName !== 'IMG'){
      crest.textContent = initials(name);
    }
  }

  // ── Sets: collapse identical consecutive sets into "3 × 8 reps · rest 90s" ──
  function setText(s){
    var parts = [];
    if (s.reps)  parts.push(esc(s.reps) + ' ' + tt('plan_share.reps','reps'));
    if (s.time)  parts.push(esc(s.time));
    if (s.load)  parts.push(esc(s.load));
    if (s.tempo) parts.push(esc(s.tempo));
    if (s.rest)  parts.push(tt('plan_share.rest','rest') + ' ' + esc(s.rest));
    return parts.join(' · ');
  }
  function renderSets(sets){
    if (!Array.isArray(sets) || !sets.length) return '';
    var runs = [];
    sets.forEach(function(s, i){
      var txt = setText(s) || (tt('plan_share.set','Set') + ' ' + (i+1));
      var last = runs[runs.length-1];
      if (last && last.txt === txt) last.n++;
      else runs.push({ txt: txt, n: 1, note: s.note || '' });
    });
    var chips = runs.map(function(r){
      var count = r.n > 1 ? '<span class="x">'+r.n+' ×</span> ' : '';
      return '<span class="ps-set">'+count+r.txt+'</span>';
    }).join('');
    var notes = runs.map(function(r){ return r.note ? esc(r.note) : ''; }).filter(Boolean);
    return '<div class="ps-ex-sets">'+chips+'</div>' +
      (notes.length ? '<div class="ps-ex-extra">'+notes.join(' · ')+'</div>' : '');
  }

  function renderExercise(ex, i, list){
    var yt = youtubeId(ex.videoUrl);
    var playable = !!(ex.videoUrl || ex.thumb);
    var inner = ex.thumb
      ? '<img src="'+esc(safeUrl(ex.thumb))+'" alt="" loading="lazy" referrerpolicy="no-referrer">'+(ex.videoUrl?'<span class="play"><i class="ti ti-player-play-filled"></i></span>':'')
      : '<i class="ti ti-barbell"></i>';   // no media — a quiet placeholder beats stray initials
    var thumb = playable
      ? '<button type="button" class="ps-ex-thumb is-playable" data-media="1">'+inner+'</button>'
      : '<span class="ps-ex-thumb">'+inner+'</span>';
    var extra = [];
    if (ex.side) extra.push(esc(ex.side));
    if (ex.flag) extra.push(esc(ex.flag));
    var watch = ex.videoUrl
      ? (yt ? '<button type="button" class="ps-watch" data-media="1"><i class="ti ti-player-play-filled"></i> '+tt('plan_share.watch_demo','Watch demo')+'</button>'
            : '<a class="ps-watch" href="'+esc(safeUrl(ex.videoUrl))+'" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> '+tt('plan_share.watch_demo','Watch demo')+'</a>')
      : '';
    var data = ' data-video="'+esc(safeUrl(ex.videoUrl||''))+'" data-thumb="'+esc(safeUrl(ex.thumb||''))+'" data-name="'+esc(ex.name||'')+'"';
    // Paired work (A1/A2): the label comes from the planner, and the rows sit
    // together so the athlete reads them as one round.
    var next = (list || [])[i + 1];
    var paired = !!(ex.link || (next && next.link));
    var tag = paired && ex.label ? '<span class="ps-ex-tag">'+esc(ex.label)+'</span> ' : '';
    return '<div class="ps-ex'+(ex.link?' is-linked':'')+(next && next.link?' has-next':'')+'"'+data+'>'+thumb+
      '<div class="ps-ex-body">'+
        '<div class="ps-ex-name">'+tag+esc(ex.name||'—')+'</div>'+
        renderSets(ex.sets)+
        (extra.length?'<div class="ps-ex-extra">'+extra.join(' · ')+'</div>':'')+
        watch+
      '</div></div>';
  }

  function renderBlock(b){
    var color = TYPE_COLOR[b.type] || 'var(--cm-fg-faint)';
    var typeLabel = tt('individual_planner.type_'+b.type, TYPE_LABEL_EN[b.type] || (b.type||''));
    var list = Array.isArray(b.exList) ? b.exList : (Array.isArray(b.exercises) ? b.exercises : []);
    var exHtml = list.map(renderExercise).join('');
    return '<div class="ps-block">'+
      '<div class="ps-block-h" style="border-left-color:'+color+'">'+
        '<span class="bn">'+esc(b.name||'—')+'</span>'+
        (b.dur?'<span class="bt">'+esc(b.dur)+"'</span>":'')+
        (typeLabel?'<span class="bt">'+esc(typeLabel)+'</span>':'')+
      '</div>'+
      (b.goal?'<div class="ps-block-goal"><i class="ti ti-target"></i><span>'+esc(b.goal)+'</span></div>':'')+
      (b.notes?'<div class="ps-block-notes">'+esc(b.notes)+'</div>':'')+
      exHtml+
    '</div>';
  }

  function blockMinutes(b){ var n = Number(b && b.dur); return isNaN(n) ? 0 : n; }
  function exCount(b){
    var list = Array.isArray(b.exList) ? b.exList : (Array.isArray(b.exercises) ? b.exercises : []);
    return list.length;
  }

  function renderDay(day){
    var blocks = Array.isArray(day.blocks) ? day.blocks : [];
    var head = '<div class="ps-day-h"><span class="dow">'+esc(day.dow||'')+'</span>'+
      '<span class="dom">'+esc(day.dom!=null?day.dom:'')+'</span>';
    if (day.rest || !blocks.length){
      if (!day.rest) return '';                       // skip empty non-rest days
      return '<div class="ps-day">'+head+'</div>'+
        '<div class="ps-rest"><i class="ti ti-bed"></i> '+tt('plan_share.rest_day','Rest day')+'</div></div>';
    }
    var mins = blocks.reduce(function(a,b){ return a + blockMinutes(b); }, 0);
    const word = blocks.length === 1 ? tt('plan_share.block', 'block') : tt('plan_share.blocks', 'blocks');
    head += '<span class="tot">'+blocks.length+' '+esc(word)+' · '+mins+"'</span></div>";
    return '<div class="ps-day">'+head+blocks.map(renderBlock).join('')+'</div>';
  }

  function render(data){
    applyClub(data.club);
    var plan = data.plan || {};
    var p = plan.player || {};
    var pname = ((p.first_name||'')+' '+(p.last_name||'')).trim() || plan.name || '—';
    var num = p.number ? ('#'+p.number) : '';
    var focus = plan.focus ? tt('individual_planner.focus_'+String(plan.focus).replace(/-/g,'_'), FOCUS_EN[plan.focus]||plan.focus) : '';
    var status = plan.status || 'draft';
    var statusLabel = tt('individual_planner.status_'+status, STATUS_EN[status]||status);
    var wk = tt('plan_share.week_of', 'Week {x} of {y}', { x: plan.programme_week||1, y: plan.programme_total_weeks||1 });

    var content = plan.content || {};
    var days = Array.isArray(content) ? content : (Array.isArray(content.days) ? content.days : []);
    var allBlocks = [];
    days.forEach(function(d){ (Array.isArray(d.blocks)?d.blocks:[]).forEach(function(b){ allBlocks.push(b); }); });
    var nDays = days.filter(function(d){ return !d.rest && Array.isArray(d.blocks) && d.blocks.length; }).length;
    var nMin  = allBlocks.reduce(function(a,b){ return a + blockMinutes(b); }, 0);
    var nEx   = allBlocks.reduce(function(a,b){ return a + exCount(b); }, 0);

    var html = '';
    html += '<div class="ps-card ps-hero">'+
      // Initials sit underneath the photo, so a photo that fails to load (expired
      // signature, offline) still leaves a proper avatar instead of an empty ring.
      '<div class="who"><div class="av"><span class="ini">'+esc(initials(pname))+'</span>'+
        (p.photo ? '<img src="'+esc(safeUrl(p.photo))+'" alt="" referrerpolicy="no-referrer">' : '')+'</div>'+
        '<div class="nm"><div class="name">'+esc(pname)+(num?' <span class="num">'+esc(num)+'</span>':'')+'</div>'+
        '<div class="sub">'+tt('plan_share.individual_sc','Individual S&C')+'</div></div></div>'+
      '<div class="plan">'+esc(plan.name||'—')+'</div>'+
      '<div class="ps-meta">'+
        (focus?'<span class="ps-chip">'+esc(focus)+'</span>':'')+
        '<span class="ps-chip">'+esc(wk)+'</span>'+
        '<span class="ps-chip is-status '+esc(status)+'">'+esc(statusLabel)+'</span>'+
      '</div>'+
      (plan.goal?'<div class="ps-goal"><i class="ti ti-target"></i><span>'+esc(plan.goal)+'</span></div>':'')+
    '</div>';

    if (allBlocks.length){
      html += '<div class="ps-stats">'+
        '<div class="ps-stat"><div class="v">'+nDays+'</div><div class="l">'+tt('plan_share.stat_days','Sessions')+'</div></div>'+
        '<div class="ps-stat"><div class="v">'+nMin+"'</div><div class=\"l\">"+tt('plan_share.stat_minutes','Minutes')+'</div></div>'+
        '<div class="ps-stat"><div class="v">'+nEx+'</div><div class="l">'+tt('plan_share.stat_exercises','Exercises')+'</div></div>'+
      '</div>';
    }

    var phases = Array.isArray(data.phases) ? data.phases : [];
    if (phases.length){
      html += '<div class="ps-card"><div class="ps-phases">'+phases.map(function(ph){
        var col = LOAD_COLOR[ph.load_level] || ph.color || 'var(--ps-club)';
        var wr = 'W'+(ph.week_start||1)+((ph.week_end&&ph.week_end!==ph.week_start)?'–'+ph.week_end:'');
        var load = ph.load_level ? tt('individual_planner.load_'+ph.load_level, LOAD_EN[ph.load_level]) : '';
        return '<div class="ps-phase" style="border-left-color:'+esc(col)+'">'+
          '<div class="pn">'+esc(ph.name||'')+'</div>'+
          '<div class="pw">'+esc(wr)+(load?' · '+esc(load):'')+'</div>'+
          (ph.objective?'<div class="po">'+esc(ph.objective)+'</div>':'')+
        '</div>';
      }).join('')+'</div></div>';
    }

    var dayHtml = days.map(renderDay).join('');
    html += '<div class="ps-sec-h">'+tt('plan_share.programme','Programme')+'</div>';
    html += dayHtml.trim() ? dayHtml
      : '<div class="ps-card"><div class="ps-rest"><i class="ti ti-calendar-off"></i> '+tt('plan_share.no_sessions','No sessions planned yet.')+'</div></div>';

    root.innerHTML = html;
  }

  // ── Media viewer (YouTube embed / image), closed with Esc, the X or the backdrop ──
  function openMedia(exEl){
    var video = exEl.getAttribute('data-video') || '';
    var thumb = exEl.getAttribute('data-thumb') || '';
    var name  = exEl.getAttribute('data-name') || '';
    var vid = youtubeId(video);
    if (!vid && video && video !== '#'){ window.open(video, '_blank', 'noopener'); return; }
    var inner = vid
      ? '<iframe src="https://www.youtube-nocookie.com/embed/'+esc(vid)+'?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>'
      : (thumb ? '<img src="'+esc(thumb)+'" alt="" referrerpolicy="no-referrer">' : '');
    if (!inner) return;
    var back = document.createElement('div');
    back.className = 'ps-media';
    back.innerHTML = '<div class="ps-media-box">'+
      '<button type="button" class="ps-media-close" aria-label="'+esc(tt('plan_share.close','Close'))+'"><i class="ti ti-x"></i></button>'+
      '<div class="ps-media-frame">'+inner+'</div>'+
      (name?'<div class="ps-media-cap">'+esc(name)+'</div>':'')+
    '</div>';
    function shut(){
      document.removeEventListener('keydown', onKey, true);
      var f = back.querySelector('iframe'); if (f) f.src = '';
      back.remove();
    }
    function onKey(e){ if (e.key === 'Escape'){ e.stopPropagation(); shut(); } }
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', function(e){ if (e.target === back || e.target.closest('.ps-media-close')) shut(); });
    document.body.appendChild(back);
  }
  root.addEventListener('click', function(e){
    var trigger = e.target.closest('[data-media]');
    if (!trigger) return;
    var exEl = trigger.closest('.ps-ex');
    if (exEl) openMedia(exEl);
  });

  function showUnavailable(){
    stateMsg('ti-link-off', tt('plan_share.unavailable_title','This link is unavailable'), tt('plan_share.unavailable_body','The plan may have been unshared or the link is incorrect.'));
  }

  async function load(){
    if (window.CM_I18N && CM_I18N.ready){ try { await CM_I18N.ready; } catch(_){} }
    var token = new URLSearchParams(location.search).get('token');
    if (!token){ showUnavailable(); return; }
    try {
      var res = await fetch(SB_URL+'/functions/v1/share-individual-plan?token='+encodeURIComponent(token), {
        method:'GET', headers:{ 'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY }
      });
      var data = await res.json();
      if (!data || !data.found){ showUnavailable(); return; }
      render(data);
    } catch (err){
      console.error('[plan-share] load failed', err);
      showUnavailable();
    }
  }

  // Re-render on language change (labels come from i18n)
  var _last = null;
  document.addEventListener('cm:langchanged', function(){ if (_last) render(_last); });
  var _origRender = render;
  render = function(d){ _last = d; _origRender(d); };
  window.__psRender = function(d){ render(d); };   // local preview hook

  if (document.readyState !== 'loading') load(); else document.addEventListener('DOMContentLoaded', load);
})();
</script>
