<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Schedule — ClavaMetrics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sh-bg:     #F8FAFC;
    --sh-surf:   #FFFFFF;
    --sh-border: #E2E8F0;
    --sh-fg:     #0F172A;
    --sh-fg-2:   #475569;
    --sh-fg-3:   #94A3B8;
    --sh-accent: #2563EB;
    --sh-r:      10px;
    --sh-font:   -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sh-mono:   'SF Mono', 'Fira Code', ui-monospace, monospace;
  }

  body {
    background: var(--sh-bg);
    color: var(--sh-fg);
    font-family: var(--sh-font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .sh-header {
    background: var(--sh-surf);
    border-bottom: 1px solid var(--sh-border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .sh-logo {
    width: 40px; height: 40px; border-radius: 50%;
    object-fit: contain;
    border: 1px solid var(--sh-border);
    flex-shrink: 0;
  }
  .sh-logo-fallback {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--sh-bg); border: 1px solid var(--sh-border);
    display: flex; align-items: center; justify-content: center;
    font: 700 16px/1 var(--sh-font); color: var(--sh-fg-3);
    flex-shrink: 0;
  }
  .sh-header-text { flex: 1; min-width: 0; }
  .sh-club-name { font: 700 16px/1.2 var(--sh-font); color: var(--sh-fg); }
  .sh-range { font: 500 12px/1.3 var(--sh-mono); color: var(--sh-fg-3); margin-top: 2px; }
  .sh-ics-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--sh-border); background: var(--sh-surf);
    color: var(--sh-fg-2); font: 500 13px/1 var(--sh-font);
    cursor: pointer; text-decoration: none; white-space: nowrap;
    flex-shrink: 0;
  }
  .sh-ics-btn:hover { border-color: var(--sh-accent); color: var(--sh-accent); }
  .sh-ics-btn .ti { font-size: 15px; }

  /* ── Content ── */
  .sh-main { padding: 20px 16px 64px; max-width: 600px; margin: 0 auto; }

  /* ── MC info banner ── */
  .sh-mc-banner {
    background: var(--sh-surf);
    border: 1px solid var(--sh-border);
    border-radius: var(--sh-r);
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .sh-mc-banner .ic {
    width: 36px; height: 36px; border-radius: 8px;
    background: #EFF6FF; color: #2563EB;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sh-mc-banner .ic .ti { font-size: 16px; }
  .sh-mc-name { font: 700 14px/1.2 var(--sh-font); color: var(--sh-fg); }
  .sh-mc-sub { font: 500 12px/1.3 var(--sh-mono); color: var(--sh-fg-3); margin-top: 2px; }

  /* ── Day group ── */
  .sh-day { margin-bottom: 12px; }
  .sh-day-label {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 6px;
  }
  .sh-day-date {
    background: var(--sh-surf);
    border: 1px solid var(--sh-border);
    border-radius: 8px;
    text-align: center;
    padding: 5px 10px;
    min-width: 52px;
    flex-shrink: 0;
  }
  .sh-day-date .m { font: 600 9px/1 var(--sh-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--sh-fg-3); }
  .sh-day-date .d { font: 700 18px/1 var(--sh-font); color: var(--sh-fg); margin-top: 2px; }
  .sh-day-date.is-today { border-color: var(--sh-accent); background: #EFF6FF; }
  .sh-day-date.is-today .m { color: var(--sh-accent); }
  .sh-day-date.is-today .d { color: var(--sh-accent); }
  .sh-day-dow {
    font: 600 13px/1 var(--sh-font); color: var(--sh-fg-2);
    flex: 1;
  }
  .sh-day-tag {
    font: 600 10px/1 var(--sh-mono); letter-spacing: 0.05em;
    padding: 3px 7px; border-radius: 5px;
    background: #FEF3C7; color: #92400E;
  }
  .sh-day-tag.is-md { background: #FEE2E2; color: #991B1B; }

  /* ── Event card ── */
  .sh-evt {
    background: var(--sh-surf);
    border: 1px solid var(--sh-border);
    border-radius: var(--sh-r);
    padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 8px;
    cursor: default;
  }
  .sh-evt-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sh-evt-icon .ti { font-size: 16px; }
  .sh-evt-body { flex: 1; min-width: 0; }
  .sh-evt-title { font: 700 14px/1.2 var(--sh-font); color: var(--sh-fg); }
  .sh-evt-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .sh-evt-time { font: 500 12px/1 var(--sh-mono); color: var(--sh-fg-3); display: flex; align-items: center; gap: 4px; }
  .sh-evt-time .ti { font-size: 12px; }
  .sh-evt-loc  { font: 500 12px/1 var(--sh-font); color: var(--sh-fg-3); display: flex; align-items: center; gap: 4px; }
  .sh-evt-loc .ti { font-size: 12px; }
  .sh-evt-type-badge {
    font: 600 10px/1 var(--sh-mono); letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px;
  }

  /* Type colors */
  .sh-evt.t-match       { border-left: 3px solid #EF4444; }
  .sh-evt.t-match .sh-evt-icon { background: #FEF2F2; color: #EF4444; }
  .sh-evt.t-match .sh-evt-type-badge { background: #FEF2F2; color: #B91C1C; }
  .sh-evt.t-training    { border-left: 3px solid #3B82F6; }
  .sh-evt.t-training .sh-evt-icon { background: #EFF6FF; color: #3B82F6; }
  .sh-evt.t-training .sh-evt-type-badge { background: #EFF6FF; color: #1D4ED8; }
  .sh-evt.t-gym         { border-left: 3px solid #8B5CF6; }
  .sh-evt.t-gym .sh-evt-icon { background: #F5F3FF; color: #8B5CF6; }
  .sh-evt.t-gym .sh-evt-type-badge { background: #F5F3FF; color: #6D28D9; }
  .sh-evt.t-recovery    { border-left: 3px solid #10B981; }
  .sh-evt.t-recovery .sh-evt-icon { background: #ECFDF5; color: #10B981; }
  .sh-evt.t-recovery .sh-evt-type-badge { background: #ECFDF5; color: #047857; }
  .sh-evt.t-travel      { border-left: 3px solid #F59E0B; }
  .sh-evt.t-travel .sh-evt-icon { background: #FFFBEB; color: #F59E0B; }
  .sh-evt.t-travel .sh-evt-type-badge { background: #FFFBEB; color: #B45309; }
  .sh-evt.t-other       { border-left: 3px solid #94A3B8; }
  .sh-evt.t-other .sh-evt-icon { background: #F1F5F9; color: #64748B; }
  .sh-evt.t-other .sh-evt-type-badge { background: #F1F5F9; color: #475569; }

  /* ── Rest day ── */
  .sh-rest {
    padding: 10px 0 2px;
    font: 500 12.5px/1 var(--sh-font);
    color: var(--sh-fg-3);
    font-style: italic;
  }

  /* ── Empty / error ── */
  .sh-empty {
    text-align: center; padding: 60px 20px;
    color: var(--sh-fg-3); font: 500 14px/1.6 var(--sh-font);
  }
  .sh-empty .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }
  .sh-empty strong { display: block; font: 700 18px/1.3 var(--sh-font); color: var(--sh-fg-2); margin-bottom: 8px; }

  /* ── Footer ── */
  .sh-footer {
    text-align: center; padding: 24px 16px;
    font: 500 11.5px/1.3 var(--sh-mono); color: var(--sh-fg-3);
  }
  .sh-footer a { color: var(--sh-accent); text-decoration: none; }

  /* ── Spinner ── */
  .sh-spinner {
    display: flex; align-items: center; justify-content: center;
    padding: 60px; color: var(--sh-fg-3);
  }
  .sh-spinner .ti { font-size: 32px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    .sh-ics-btn, .sh-footer { display: none !important; }
    body { background: #fff; }
    .sh-evt { break-inside: avoid; }
  }
</style>
</head>
<body>

<header class="sh-header">
  <div class="sh-logo-fallback" id="shLogoWrap">
    <i class="ti ti-shield-half" style="font-size:20px"></i>
  </div>
  <div class="sh-header-text">
    <div class="sh-club-name" id="shClubName">Loading…</div>
    <div class="sh-range" id="shRange"></div>
  </div>
  <a href="#" class="sh-ics-btn" id="shIcsBtn" style="display:none">
    <i class="ti ti-calendar-down"></i>Add to calendar
  </a>
</header>

<main class="sh-main" id="shMain">
  <div class="sh-spinner"><i class="ti ti-loader-2"></i></div>
</main>

<footer class="sh-footer">
  Powered by <a href="https://clavametrics.vercel.app" target="_blank">ClavaMetrics</a>
</footer>

<script>
(async () => {
  const SB_URL = 'https://xesrumijvdmqjrufgeka.supabase.co';
  const SB_KEY = 'sb_publishable_p4DBCWsAm9u-Wf5-_CP-Yw_MYh_3cR6';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const params = new URLSearchParams(location.search);
  const token  = params.get('token');

  const main   = document.getElementById('shMain');
  // Local calendar date (not UTC — avoids an off-by-one for users east of UTC).
  const _d = new Date();
  const today  = _d.getFullYear() + '-' + String(_d.getMonth()+1).padStart(2,'0') + '-' + String(_d.getDate()).padStart(2,'0');

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  // Escapa datos de DB (títulos/rival/ubicación) antes de inyectar a innerHTML — página pública.
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  function show404(msg) {
    document.title = 'Schedule not found — ClavaMetrics';
    main.innerHTML = `<div class="sh-empty">
      <i class="ti ti-calendar-off icon"></i>
      <strong>Schedule not found</strong>
      ${msg || 'This link may have expired or been revoked.'}
    </div>`;
  }

  if (!token) { show404('No token provided in the URL.'); return; }

  // Call RPC — anon access, SECURITY DEFINER function validates token
  const { data, error } = await sb.rpc('get_shared_calendar', { p_token: token });

  if (error || !data || data.error) {
    show404(data?.error === 'invalid_token' ? 'This link has expired or been revoked.' : null);
    return;
  }

  const club   = data.club   || {};
  const mc     = data.mc     || null;
  const events = data.events || [];
  const dateFrom = data.date_from;
  const dateTo   = data.date_to;

  // Header
  document.getElementById('shClubName').textContent = club.name || 'Player Schedule';
  if (dateFrom && dateTo) {
    const f = new Date(dateFrom + 'T12:00:00');
    const t = new Date(dateTo   + 'T12:00:00');
    document.getElementById('shRange').textContent =
      `${MONTHS[f.getMonth()]} ${f.getDate()} → ${MONTHS[t.getMonth()]} ${t.getDate()}, ${t.getFullYear()}`;
  }
  if (mc) document.title = `${club.name || 'Club'} · ${mc.name || 'Schedule'}`;
  else document.title = `${club.name || 'Club'} · Schedule`;

  // Club logo
  if (club.logo_url) {
    const img = document.createElement('img');
    img.className = 'sh-logo';
    img.src = club.logo_url;
    img.alt = club.name || 'Club';
    img.onerror = () => {};
    document.getElementById('shLogoWrap').replaceWith(img);
  }

  // MC banner
  let mcBannerHtml = '';
  if (mc) {
    const matchLabel = mc.match_date
      ? `MD: ${new Date(mc.match_date + 'T12:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}` + (mc.rival ? ` vs ${esc(mc.rival)}` : '')
      : '';
    mcBannerHtml = `<div class="sh-mc-banner">
      <div class="ic"><i class="ti ti-calendar-stats"></i></div>
      <div>
        <div class="sh-mc-name">${esc(mc.name || 'Microcycle')}</div>
        ${matchLabel ? `<div class="sh-mc-sub">${matchLabel}</div>` : ''}
      </div>
    </div>`;
  }

  // Build date range
  function daysInRange(from, to) {
    const days = [];
    let cur = new Date(from + 'T12:00:00');
    const end = new Date(to + 'T12:00:00');
    while (cur <= end) {
      days.push(cur.toISOString().slice(0,10));
      cur = new Date(cur.getTime() + 86400000);
    }
    return days;
  }

  const days = daysInRange(dateFrom, dateTo);

  // Group events by date
  const evtMap = {};
  events.forEach(e => {
    const d = (e.event_date || '').slice(0,10);
    if (!evtMap[d]) evtMap[d] = [];
    evtMap[d].push(e);
  });

  // Type → category mapping
  function typeClass(t) {
    if (!t) return 't-other';
    const f = t.toLowerCase();
    if (f === 'match') return 't-match';
    if (['gym'].includes(f)) return 't-gym';
    if (['recovery'].includes(f)) return 't-recovery';
    if (['travel','bus_departure','bus_arrival','hotel_checkin','hotel_checkout'].includes(f)) return 't-travel';
    if (['tactical','conditioning','walkthrough','other'].includes(f)) return 't-training';
    return 't-other';
  }
  function typeIcon(t) {
    const f = (t || '').toLowerCase();
    if (f === 'match') return 'ti-ball-football';
    if (f === 'gym') return 'ti-barbell';
    if (f === 'recovery') return 'ti-heart-rate-monitor';
    if (f === 'travel' || f.startsWith('bus')) return 'ti-plane';
    if (f.startsWith('hotel')) return 'ti-bed';
    if (f === 'breakfast' || f === 'lunch' || f === 'dinner') return 'ti-tools-kitchen';
    if (f === 'press') return 'ti-microphone';
    if (f === 'medical_check') return 'ti-stethoscope';
    if (f === 'physio') return 'ti-physotherapist';
    if (f === 'day_off') return 'ti-beach';
    return 'ti-soccer-field';
  }
  function typeLabel(t) {
    return (t || 'other').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  // Build event HTML
  function renderEvt(e) {
    const cat  = typeClass(e.event_type);
    const icon = typeIcon(e.event_type);
    const timeStr = e.start_time ? e.start_time.slice(0,5) : '';
    const dur  = e.duration_minutes ? `${e.duration_minutes}′` : '';
    const titleText = e.title || typeLabel(e.event_type);
    const oppLine = e.opponent
      ? `<span>vs ${esc(e.opponent)}${e.home_away ? ' · ' + (e.home_away === 'home' ? 'Home' : e.home_away === 'away' ? 'Away' : 'Neutral') : ''}</span>`
      : '';
    return `<div class="sh-evt ${cat}">
      <div class="sh-evt-icon"><i class="ti ${icon}"></i></div>
      <div class="sh-evt-body">
        <div class="sh-evt-title">${esc(titleText)}</div>
        <div class="sh-evt-meta">
          <span class="sh-evt-type-badge">${esc(typeLabel(e.event_type))}</span>
          ${timeStr ? `<span class="sh-evt-time"><i class="ti ti-clock"></i>${timeStr}${dur ? ' · ' + dur : ''}</span>` : dur ? `<span class="sh-evt-time">${dur}</span>` : ''}
          ${e.location ? `<span class="sh-evt-loc"><i class="ti ti-map-pin"></i>${esc(e.location)}</span>` : ''}
          ${oppLine}
        </div>
      </div>
    </div>`;
  }

  // MC match date offset label
  function mdTag(dateStr, mc) {
    if (!mc?.match_date) return '';
    const diff = Math.round((new Date(mc.match_date+'T12:00:00') - new Date(dateStr+'T12:00:00')) / 86400000);
    if (diff === 0) return '<span class="sh-day-tag is-md">MD</span>';
    if (diff > 0 && diff <= 10) return `<span class="sh-day-tag">MD-${diff}</span>`;
    if (diff < 0 && diff >= -3) return `<span class="sh-day-tag">MD+${Math.abs(diff)}</span>`;
    return '';
  }

  // Render all days
  let hasAnyEvent = false;
  let daysHtml = '';
  days.forEach(dateStr => {
    const d     = new Date(dateStr + 'T12:00:00');
    const isToday = dateStr === today;
    const evts  = evtMap[dateStr] || [];
    if (!evts.length) return; // skip days with no player events

    hasAnyEvent = true;
    const dayOfWeek = DAYS[d.getDay()];
    const dateClass = isToday ? 'sh-day-date is-today' : 'sh-day-date';

    daysHtml += `<div class="sh-day">
      <div class="sh-day-label">
        <div class="${dateClass}">
          <div class="m">${MONTHS[d.getMonth()].toUpperCase()}</div>
          <div class="d">${d.getDate()}</div>
        </div>
        <div class="sh-day-dow">${dayOfWeek}${isToday ? ' · Today' : ''}</div>
        ${mdTag(dateStr, mc)}
      </div>
      ${evts.map(renderEvt).join('')}
    </div>`;
  });

  if (!hasAnyEvent) {
    main.innerHTML = mcBannerHtml + `<div class="sh-empty">
      <i class="ti ti-calendar-event icon"></i>
      <strong>No events shared yet</strong>
      The coaching staff hasn't published any events for this period.
    </div>`;
    return;
  }

  main.innerHTML = mcBannerHtml + daysHtml;

  // "Add to calendar" — generate .ics
  const icsBtn = document.getElementById('shIcsBtn');
  if (icsBtn && events.length) {
    icsBtn.style.display = '';
    icsBtn.addEventListener('click', e => {
      e.preventDefault();
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0',
        `PRODID:-//ClavaMetrics//Player Schedule//EN`,
        `X-WR-CALNAME:${club.name || 'Club'} Schedule`,
        'X-WR-TIMEZONE:UTC',
      ];
      events.forEach(evt => {
        const d = (evt.event_date || '').slice(0,10).replace(/-/g,'');
        const uid = `${evt.id}@clavametrics`;
        const summary = (evt.title || typeLabel(evt.event_type)).replace(/[,;\\]/g, ' ');
        lines.push('BEGIN:VEVENT');
        lines.push(`UID:${uid}`);
        if (evt.start_time) {
          const t = evt.start_time.slice(0,5).replace(':','') + '00';
          lines.push(`DTSTART:${d}T${t}Z`);
          if (evt.duration_minutes) {
            const endMin = parseInt(evt.start_time.slice(0,2)) * 60 + parseInt(evt.start_time.slice(3,5)) + evt.duration_minutes;
            const endH = String(Math.floor(endMin/60) % 24).padStart(2,'0');
            const endM = String(endMin % 60).padStart(2,'0');
            lines.push(`DTEND:${d}T${endH}${endM}00Z`);
          } else {
            lines.push(`DTEND:${d}T${t}Z`);
          }
        } else {
          lines.push(`DTSTART;VALUE=DATE:${d}`);
          lines.push(`DTEND;VALUE=DATE:${d}`);
        }
        lines.push(`SUMMARY:${summary}`);
        if (evt.location) lines.push(`LOCATION:${evt.location.replace(/[,;\\]/g,' ')}`);
        if (evt.opponent) lines.push(`DESCRIPTION:vs ${evt.opponent}${evt.home_away ? ' ('+evt.home_away+')' : ''}`);
        lines.push('END:VEVENT');
      });
      lines.push('END:VCALENDAR');

      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `${(club.name || 'schedule').replace(/\s+/g,'-').toLowerCase()}.ics`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  }
})();
</script>

</body>
</html>
