<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="set_password.pageTitle">Set your password — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
<script src="assets/i18n.js" defer></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D">
  <link rel="apple-touch-icon" href="/assets/clava-app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<style>
  .sp-shell { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--cm-bg); padding:24px; }
  .sp-card { width:100%; max-width:400px; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:16px; padding:32px; box-shadow:0 24px 80px rgba(0,0,0,.12); }
  .sp-mark { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .sp-mark .name { font:600 14px/1 var(--cm-font-sans); letter-spacing:-0.01em; color:var(--cm-fg-strong); }
  .sp-mark .meta { font:500 11.5px/1.2 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:3px; }
  .sp-card h2 { font:600 20px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); margin:0 0 6px; letter-spacing:-0.01em; }
  .sp-card .sub { font:var(--cm-body-sm); color:var(--cm-fg-muted); margin:0 0 22px; }
  .sp-field { margin-bottom:14px; }
  .sp-label { display:block; font:500 12px/1 var(--cm-font-sans); color:var(--cm-fg-muted); margin-bottom:6px; }
  .sp-input { width:100%; height:40px; padding:0 12px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:8px; font:var(--cm-body-sm); color:var(--cm-fg); outline:none; box-sizing:border-box; }
  .sp-input:focus { border-color:var(--cm-accent); }
  .sp-alert { font:500 12.5px/1.4 var(--cm-font-sans); border-radius:8px; padding:10px 12px; margin:4px 0 14px; display:none; background:var(--cm-danger-bg,#FEF2F2); color:var(--cm-danger,#DC2626); }
  .sp-hint { font:500 11.5px/1.3 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:8px; }
</style>
</head>
<body>
  <div class="sp-shell">
    <div class="sp-card">
      <div class="sp-mark">
        <span class="cm-logo-mark"></span>
        <div>
          <div class="name">ClavaMetrics</div>
          <div class="meta" data-i18n="login.performanceOsForSport">Performance OS for sport</div>
        </div>
      </div>
      <h2 data-i18n="set_password.title">Set your password</h2>
      <p class="sub" data-i18n="set_password.sub">Almost done — choose a password to finish joining your club.</p>

      <div class="sp-field">
        <label class="sp-label" for="pw1" data-i18n="set_password.newPassword">New password</label>
        <input id="pw1" class="sp-input" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="sp-field">
        <label class="sp-label" for="pw2" data-i18n="set_password.confirmPassword">Confirm password</label>
        <input id="pw2" class="sp-input" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="sp-alert" id="spErr"></div>

      <button class="cm-btn is-primary is-lg is-block" id="spBtn">
        <span data-i18n="set_password.submit">Set password &amp; continue</span>
        <i class="ti ti-arrow-right" style="font-size:16px"></i>
      </button>
      <div class="sp-hint" data-i18n="set_password.hint">At least 8 characters.</div>
    </div>
  </div>

  <script>
  (async () => {
    const tt = (key, fallbackEN, vars) => { const v = (window.CM_I18N && CM_I18N.t) ? CM_I18N.t(key, vars) : null; return (v && v !== key) ? v : (fallbackEN != null ? fallbackEN : key); };
    const errEl = document.getElementById('spErr');
    const btn   = document.getElementById('spBtn');
    const showErr = m => { errEl.textContent = m; errEl.style.display = 'block'; };

    // Debe haber sesión activa (vino por el link de invitación)
    const { data: { session } } = await window.sb.auth.getSession();
    if (!session) { window.location.replace('Login.html'); return; }

    btn.addEventListener('click', async () => {
      errEl.style.display = 'none';
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      if (p1.length < 8) { showErr(tt('set_password.pwTooShort', 'Password must be at least 8 characters.')); return; }
      if (p1 !== p2)     { showErr(tt('set_password.pwMismatch', 'Passwords do not match.')); return; }

      btn.disabled = true; btn.style.opacity = '0.6';
      const { error } = await window.sb.auth.updateUser({ password: p1 });
      if (error) {
        showErr(error.message || tt('set_password.couldNotSet', 'Could not set password.'));
        btn.disabled = false; btn.style.opacity = '1';
        return;
      }
      await window.sb.rpc('accept_invitation');   // marca la invitación aceptada
      // New invited users always pass through personal onboarding first. Already-onboarded
      // users are bounced straight to the Hub by profile-onboarding.html's own guard.
      window.location.replace('profile-onboarding.html');
    });

    document.getElementById('pw2').addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  })();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
