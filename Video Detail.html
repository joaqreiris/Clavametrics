<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="video_detail.page_title">Video Detail — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#15803D">
<link rel="apple-touch-icon" href="/assets/clava-app-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<script src="assets/global-search.js" defer></script>
<style>
  body.cm { background: var(--cm-bg); }

  /* ── Topbar (shell comes from sidebar.js) ── */
  .hub-topbar { display:flex; align-items:center; gap:14px; height:56px; padding:0 24px; border-bottom:1px solid var(--cm-border); background:color-mix(in srgb, var(--cm-bg) 92%, transparent); backdrop-filter:saturate(160%) blur(10px); position:sticky; top:0; z-index:50; }
  .hub-crumb { display:flex; align-items:center; gap:8px; color:var(--cm-fg-muted); font:var(--cm-body-sm); }
  .hub-crumb a { color:var(--cm-fg-muted); text-decoration:none; }
  .hub-crumb a:hover { color:var(--cm-fg); }
  .hub-crumb .ti { font-size:14px; }
  .hub-crumb .sep { color:var(--cm-fg-faint); }
  .hub-topbar .spacer { margin-left:auto; }
  .hub-topbar .actions { display:flex; align-items:center; gap:8px; }

  /* ── Page layout: two columns ── */
  .vd-page { padding:22px 32px 96px; max-width:1280px; margin:0 auto; width:100%; }
  .vd-back { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px 0 8px; border-radius:var(--cm-r-3); border:1px solid var(--cm-border); background:var(--cm-surface); color:var(--cm-fg-muted); text-decoration:none; font:500 13px/1 var(--cm-font-sans); margin-bottom:18px; }
  .vd-back:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .vd-back .ti { font-size:16px; }
  .vd-grid { display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start; }
  @media (max-width:1080px){ .vd-grid { grid-template-columns:1fr; } }

  /* ── Player ── */
  .vd-player { position:relative; aspect-ratio:16/9; border-radius:var(--cm-r-5); overflow:hidden; background:#0B0E12; border:1px solid var(--cm-border); box-shadow:var(--cm-shadow-2); }
  .vd-player iframe, .vd-player video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .vd-player .pitch { position:absolute; inset:0; background-size:cover; background-position:center; }
  .vd-player.is-fallback::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,12,16,0.15) 0%, rgba(8,12,16,0) 30%, rgba(8,12,16,0.6) 100%); }
  .vd-fb-overlay { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:24px; }
  .vd-fb-overlay .lock { width:46px; height:46px; border-radius:50%; background:rgba(11,14,18,0.62); backdrop-filter:blur(3px); border:1px solid rgba(255,255,255,0.16); color:#E6E8EB; display:flex; align-items:center; justify-content:center; }
  .vd-fb-overlay .lock .ti { font-size:21px; }
  .vd-fb-overlay h4 { margin:0; font:600 15px/1.3 var(--cm-font-sans); color:#F3F4F6; }
  .vd-fb-overlay p { margin:0; font:var(--cm-body-sm); color:rgba(230,232,235,0.72); max-width:42ch; }
  .vd-embedbadge { position:absolute; top:14px; left:14px; z-index:6; display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; background:rgba(8,12,16,0.55); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.14); color:#E6E8EB; font:600 11px/1 var(--cm-font-sans); }
  .vd-embedbadge .ti { font-size:14px; }
  .vd-embedbadge .dot { width:6px; height:6px; border-radius:50%; background:#3FB97E; box-shadow:0 0 0 3px rgba(63,185,126,0.25); }

  /* actions under player */
  .vd-acts { display:flex; align-items:center; gap:9px; margin-top:14px; flex-wrap:wrap; }

  /* under-player title row */
  .vd-titlecard { margin-top:18px; padding:18px 20px; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-5); box-shadow:var(--cm-shadow-1); }
  .vd-titlecard h1 { margin:0; font:600 21px/1.25 var(--cm-font-sans); letter-spacing:-0.015em; color:var(--cm-fg-strong); }
  .vd-titlecard .row { display:flex; align-items:center; gap:0; margin-top:12px; flex-wrap:wrap; }
  .vd-titlecard .mi { display:inline-flex; align-items:center; gap:7px; font:var(--cm-body-sm); color:var(--cm-fg-muted); }
  .vd-titlecard .mi .ti { font-size:15px; color:var(--cm-fg-faint); }
  .vd-titlecard .mi b { color:var(--cm-fg); font-weight:600; }
  .vd-titlecard .vsep { width:1px; height:15px; background:var(--cm-border-strong); margin:0 14px; }
  .vd-titlecard .src { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px 0 8px; border-radius:999px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); font:600 11.5px/1 var(--cm-font-sans); color:var(--cm-fg); }
  .vd-titlecard .src .ti { font-size:14px; }
  .vd-titlecard .src.drive .ti { color:#1FA463; }
  .vd-titlecard .src.dropbox .ti { color:#0061FF; }
  .vd-titlecard .av { width:22px; height:22px; border-radius:50%; background:var(--cm-violet-bg); color:var(--cm-violet); display:inline-flex; align-items:center; justify-content:center; font:700 9px/1 var(--cm-font-sans); }

  /* ── Right rail ── */
  .vd-rail { display:flex; flex-direction:column; gap:16px; position:sticky; top:74px; }
  .vd-panel { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-5); box-shadow:var(--cm-shadow-1); overflow:hidden; }
  .vd-panel-hd { display:flex; align-items:center; gap:8px; padding:13px 15px; border-bottom:1px solid var(--cm-border); }
  .vd-panel-hd .ti { font-size:16px; color:var(--cm-fg-muted); }
  .vd-panel-hd h2 { flex:1; margin:0; font:600 13px/1 var(--cm-font-sans); letter-spacing:0.01em; color:var(--cm-fg-strong); }
  .vd-panel-hd .add { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px 0 8px; border-radius:var(--cm-r-2); border:1px solid var(--cm-border); background:var(--cm-bg-soft); color:var(--cm-fg); font:600 12px/1 var(--cm-font-sans); cursor:pointer; }
  .vd-panel-hd .add[disabled] { opacity:0.5; cursor:not-allowed; }
  .vd-panel-hd .add .ti { font-size:14px; color:var(--cm-accent); }
  .vd-panel-bd { padding:14px 15px; }

  /* linked-to groups */
  .vd-lgroup + .vd-lgroup { margin-top:14px; }
  .vd-lk-label { font:500 10.5px/1 var(--cm-font-sans); letter-spacing:0.07em; text-transform:uppercase; color:var(--cm-fg-faint); margin-bottom:8px; }
  .vd-lchips { display:flex; flex-wrap:wrap; gap:7px; }
  .vd-lchip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 6px 0 9px; border-radius:var(--cm-r-3); font:500 12.5px/1 var(--cm-font-sans); border:1px solid transparent; max-width:100%; }
  .vd-lchip > span.lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vd-lchip .ti.lead { font-size:14px; flex-shrink:0; }
  .vd-lchip .x { width:18px; height:18px; border-radius:5px; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0.7; flex-shrink:0; border:0; background:transparent; color:inherit; }
  .vd-lchip .x:hover { opacity:1; background:rgba(0,0,0,0.10); }
  .vd-lchip .x .ti { font-size:13px; }
  .vd-lchip.session { background:var(--cm-info-bg); color:var(--cm-info); border-color:var(--cm-info-bd); }
  .vd-lchip.player  { background:var(--cm-violet-bg); color:var(--cm-violet); border-color:var(--cm-violet-bd); }
  .vd-lchip.match   { background:var(--cm-success-bg); color:var(--cm-success); border-color:var(--cm-success-bd); }
  .vd-empty-links { font:var(--cm-body-sm); color:var(--cm-fg-muted); }

  /* notes */
  .vd-notes { width:100%; min-height:96px; resize:vertical; border:1px solid var(--cm-border); border-radius:var(--cm-r-3); background:var(--cm-bg-soft); padding:10px 12px; font:var(--cm-body-sm); color:var(--cm-fg); line-height:1.5; box-sizing:border-box; }
  .vd-notes:focus { outline:none; border-color:var(--cm-accent); box-shadow:0 0 0 3px var(--cm-focus-ring); background:var(--cm-surface); }
  .vd-notes::placeholder { color:var(--cm-fg-faint); }
  .vd-notes-foot { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .vd-notes-foot .saved { font:var(--cm-meta); color:var(--cm-fg-muted); }

  /* details list */
  .vd-dl { display:flex; flex-direction:column; }
  .vd-dl .drow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--cm-border); }
  .vd-dl .drow:last-child { border-bottom:0; }
  .vd-dl .dk { display:inline-flex; align-items:center; gap:8px; width:88px; flex-shrink:0; font:var(--cm-body-sm); color:var(--cm-fg-muted); }
  .vd-dl .dk .ti { font-size:15px; color:var(--cm-fg-faint); }
  .vd-dl .dv { font:var(--cm-body-sm); color:var(--cm-fg-strong); font-weight:500; display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .vd-dl .dv .ti { font-size:14px; }
  .vd-dl .dv a { color:var(--cm-accent); text-decoration:none; }
  .vd-dl .dv a:hover { text-decoration:underline; }
  .vd-dl .dv .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vd-store-note { display:flex; gap:9px; padding:11px 13px; margin-top:12px; border-radius:var(--cm-r-3); background:var(--cm-accent-soft); border:1px solid var(--cm-success-bd); }
  .vd-store-note .ti { font-size:15px; color:var(--cm-accent); flex-shrink:0; margin-top:1px; }
  .vd-store-note p { margin:0; font:var(--cm-meta); color:var(--cm-fg-muted); line-height:1.45; }
  .vd-store-note p b { color:var(--cm-fg); font-weight:600; }

  /* states */
  .vd-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:80px 24px; text-align:center; border:1px dashed var(--cm-border-strong); border-radius:var(--cm-r-5); background:var(--cm-surface); }
  .vd-state .ic { width:52px; height:52px; border-radius:14px; background:var(--cm-bg-sunk); color:var(--cm-fg-muted); display:flex; align-items:center; justify-content:center; }
  .vd-state .ic .ti { font-size:26px; }
  .vd-state h3 { font:600 16px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); margin:0; }
  .vd-state p { font:var(--cm-body-sm); color:var(--cm-fg-muted); margin:0; max-width:340px; }

  .vd-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--cm-fg-strong); color:var(--cm-bg); border-radius:var(--cm-r-3); padding:8px 16px; font:500 13px/1 var(--cm-font-sans); z-index:900; opacity:0; pointer-events:none; transition:opacity 200ms, transform 200ms; }
  .vd-toast.is-show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── Link-video modal ── */
  .vl-backdrop { position:fixed; inset:0; z-index:800; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(8,12,16,0.46); backdrop-filter:blur(7px) saturate(115%); -webkit-backdrop-filter:blur(7px) saturate(115%); }
  .vl-backdrop.is-open { display:flex; }
  .vl-modal { width:min(580px,100%); max-height:92vh; display:flex; flex-direction:column; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-6); box-shadow:var(--cm-shadow-pop); overflow:hidden; }
  .vl-head { display:flex; align-items:flex-start; gap:14px; padding:18px 20px 16px; border-bottom:1px solid var(--cm-border-soft); }
  .vl-head-ic { width:38px; height:38px; flex-shrink:0; border-radius:var(--cm-r-3); background:var(--cm-accent-soft); color:var(--cm-accent); display:flex; align-items:center; justify-content:center; }
  .vl-head-ic .ti { font-size:20px; }
  .vl-head-txt { flex:1; min-width:0; }
  .vl-head-txt h2 { font:600 16px/1.2 var(--cm-font-sans); letter-spacing:-0.01em; color:var(--cm-fg-strong); margin:0; }
  .vl-video { display:flex; align-items:center; gap:8px; margin-top:6px; min-width:0; }
  .vl-video .th { width:40px; height:26px; border-radius:5px; flex-shrink:0; background:radial-gradient(120% 100% at 30% 10%, #6d5224 0%, #4d3a18 50%, #34280f 100%); position:relative; overflow:hidden; }
  .vl-video .th .ti { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; color:rgba(255,255,255,.92); }
  .vl-video .vt { font:600 13px/1.3 var(--cm-font-sans); color:var(--cm-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vl-video .vm { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; font:500 11.5px/1 var(--cm-font-mono); color:var(--cm-fg-faint); }
  .vl-video .vm .ti { font-size:13px; }
  .vl-close { width:30px; height:30px; flex-shrink:0; border:0; background:transparent; border-radius:var(--cm-r-2); color:var(--cm-fg-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background var(--cm-dur-1), color var(--cm-dur-1); }
  .vl-close:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .vl-close .ti { font-size:18px; }
  .vl-body { padding:18px 20px 8px; overflow-y:auto; }
  .vl-block { margin-bottom:18px; }
  .vl-block-label { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
  .vl-block-label .ti { font-size:14px; color:var(--cm-fg-muted); }
  .vl-block-label .lab { font:600 10.5px/1 var(--cm-font-mono); letter-spacing:0.08em; text-transform:uppercase; color:var(--cm-fg-muted); }
  .vl-block-label .multi { margin-left:auto; font:500 11px/1 var(--cm-font-sans); color:var(--cm-fg-faint); }
  .vl-combo { position:relative; }
  .vl-search { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); transition:border-color var(--cm-dur-1), box-shadow var(--cm-dur-1); }
  .vl-search.is-open { border-color:var(--cm-accent); box-shadow:0 0 0 3px var(--cm-focus-ring); }
  .vl-search .ti { font-size:16px; color:var(--cm-fg-muted); }
  .vl-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; font:var(--cm-body); color:var(--cm-fg); }
  .vl-search input::placeholder { color:var(--cm-fg-faint); }
  .vl-menu { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20; background:var(--cm-surface); border:1px solid var(--cm-border-strong); border-radius:var(--cm-r-4); box-shadow:var(--cm-shadow-3); padding:5px; max-height:230px; overflow-y:auto; }
  .vl-menu[hidden] { display:none; }
  .vl-menu-lbl { font:600 10px/1 var(--cm-font-mono); letter-spacing:0.07em; text-transform:uppercase; color:var(--cm-fg-faint); padding:9px 9px 6px; }
  .vl-opt { display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:var(--cm-r-2); cursor:pointer; transition:background var(--cm-dur-1); }
  .vl-opt:hover, .vl-opt.is-focus { background:var(--cm-bg-soft); }
  .vl-opt .oic { width:26px; height:26px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font:600 10.5px/1 var(--cm-font-sans); }
  .vl-opt .oic.player  { background:var(--cm-violet-bg); color:var(--cm-violet); }
  .vl-opt .oic.session { background:var(--cm-info-bg); color:var(--cm-info); }
  .vl-opt .oic.match   { background:var(--cm-success-bg); color:var(--cm-success); }
  .vl-opt .oic .ti { font-size:14px; }
  .vl-opt .obody { flex:1; min-width:0; }
  .vl-opt .on { font:500 13px/1.25 var(--cm-font-sans); color:var(--cm-fg-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vl-opt .om { font:500 11px/1.2 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .vl-opt .oadd { font-size:16px; color:var(--cm-fg-faint); flex-shrink:0; }
  .vl-opt.is-added .oadd { color:var(--cm-accent); }
  .vl-opt.is-added { opacity:.62; }
  .vl-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .vl-chips:empty { display:none; }
  .vl-chip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 6px 0 9px; border-radius:var(--cm-r-2); font:500 12.5px/1 var(--cm-font-sans); border:1px solid transparent; white-space:nowrap; max-width:100%; }
  .vl-chip .lbl { overflow:hidden; text-overflow:ellipsis; }
  .vl-chip .lead { font-size:14px; flex-shrink:0; }
  .vl-chip .av { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:700 9px/1 var(--cm-font-sans); flex-shrink:0; }
  .vl-chip .x { width:18px; height:18px; border:0; background:transparent; border-radius:5px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:currentColor; opacity:.6; flex-shrink:0; }
  .vl-chip .x:hover { opacity:1; background:rgba(0,0,0,0.06); }
  .vl-chip .x .ti { font-size:13px; }
  .vl-chip.session { background:var(--cm-info-bg); color:var(--cm-info); border-color:var(--cm-info-bd); }
  .vl-chip.player  { background:var(--cm-violet-bg); color:var(--cm-violet); border-color:var(--cm-violet-bd); }
  .vl-chip.player .av { background:color-mix(in srgb, var(--cm-violet) 18%, transparent); color:var(--cm-violet); }
  .vl-chip.match   { background:var(--cm-success-bg); color:var(--cm-success); border-color:var(--cm-success-bd); }
  .vl-note { display:flex; align-items:flex-start; gap:10px; padding:11px 13px; margin:2px 0 6px; border-radius:var(--cm-r-3); background:var(--cm-accent-soft); border:1px solid var(--cm-success-bd); }
  .vl-note .ic { width:24px; height:24px; flex-shrink:0; border-radius:7px; background:var(--cm-surface); border:1px solid var(--cm-success-bd); display:flex; align-items:center; justify-content:center; color:var(--cm-accent); }
  .vl-note .ic .ti { font-size:14px; }
  .vl-note p { margin:0; font:var(--cm-body-sm); color:var(--cm-fg-muted); }
  .vl-note p strong { color:var(--cm-fg); font-weight:600; }
  .vl-foot { display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--cm-border-soft); background:var(--cm-bg-soft); }
  .vl-foot .summary { font:var(--cm-meta); color:var(--cm-fg-muted); margin-right:auto; }
  .vl-foot .summary b { color:var(--cm-fg-strong); font-weight:600; }
</style>
</head>
<body class="cm">

<div class="hub-shell" data-screen-label="Video Detail">

  <!-- Sidebar (injected by sidebar.js) -->
  <div id="hub-side-root"></div>

  <main class="hub-main">

    <div class="hub-topbar">
      <div class="hub-crumb">
        <i class="ti ti-home"></i><span data-i18n="video_detail.crumb_technical">Technical</span><span class="sep">/</span>
        <a href="Video%20Room.html" data-i18n="video_detail.crumb_video_room">Video room</a><span class="sep">/</span>
        <span style="color:var(--cm-fg-strong);font-weight:600" data-i18n="video_detail.crumb_detail">Detail</span>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button class="cm-icon-btn" title="Help" data-i18n-attr="title:video_detail.help"><i class="ti ti-help"></i></button>
        <button class="cm-icon-btn" title="Settings" data-open-settings data-i18n-attr="title:video_detail.settings"><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <section class="vd-page">
      <a class="vd-back" href="Video%20Room.html"><i class="ti ti-arrow-left"></i><span data-i18n="video_detail.back_to_library">Back to library</span></a>
      <div id="vdRoot"></div>
    </section>
  </main>
</div>

<div class="vd-toast" id="vdToast"></div>

<!-- Link video modal -->
<div class="vl-backdrop" id="vlBackdrop" role="dialog" aria-modal="true" aria-labelledby="vlTitle">
  <div class="vl-modal">
    <header class="vl-head">
      <div class="vl-head-ic"><i class="ti ti-link"></i></div>
      <div class="vl-head-txt">
        <h2 id="vlTitle" data-i18n="video_detail.link_video_title">Link video</h2>
        <div class="vl-video">
          <span class="th"><i class="ti ti-player-play-filled"></i></span>
          <span class="vt" id="vlVideoTitle"></span>
          <span class="vm" id="vlVideoDur" style="display:none"><i class="ti ti-clock"></i><span></span></span>
        </div>
      </div>
      <button class="vl-close" id="vlClose" aria-label="Close" data-i18n-attr="aria-label:common.close"><i class="ti ti-x"></i></button>
    </header>
    <div class="vl-body">
      <div class="vl-block">
        <div class="vl-block-label"><i class="ti ti-clipboard-list"></i><span class="lab" data-i18n="video_detail.block_session">Session</span><span class="multi" data-i18n="video_detail.single_or_multiple">single or multiple</span></div>
        <div class="vl-combo" data-kind="session">
          <div class="vl-search"><i class="ti ti-search"></i><input placeholder="Search a training session…" data-i18n-ph="video_detail.search_session_ph" autocomplete="off"></div>
          <div class="vl-menu" hidden></div>
        </div>
        <div class="vl-chips" data-chips="session"></div>
      </div>
      <div class="vl-block">
        <div class="vl-block-label"><i class="ti ti-user"></i><span class="lab" data-i18n="common.players">Players</span><span class="multi" data-i18n="video_detail.add_one_or_more">add one or more</span></div>
        <div class="vl-combo" data-kind="player">
          <div class="vl-search"><i class="ti ti-search"></i><input placeholder="Add a player…" data-i18n-ph="video_detail.add_player_ph" autocomplete="off"></div>
          <div class="vl-menu" hidden></div>
        </div>
        <div class="vl-chips" data-chips="player"></div>
      </div>
      <div class="vl-block">
        <div class="vl-block-label"><i class="ti ti-ball-football"></i><span class="lab" data-i18n="video_detail.block_match">Match</span><span class="multi" data-i18n="video_detail.single">single</span></div>
        <div class="vl-combo" data-kind="match">
          <div class="vl-search"><i class="ti ti-search"></i><input placeholder="Search a match…" data-i18n-ph="video_detail.search_match_ph" autocomplete="off"></div>
          <div class="vl-menu" hidden></div>
        </div>
        <div class="vl-chips" data-chips="match"></div>
      </div>
      <div class="vl-note">
        <span class="ic"><i class="ti ti-arrows-exchange"></i></span>
        <p data-i18n-html="video_detail.link_note_html">This link works <strong>both ways</strong> — the video will also appear inside each linked session, player profile and match.</p>
      </div>
    </div>
    <footer class="vl-foot">
      <span class="summary" id="vlSummary"><b>0</b> links selected</span>
      <button class="cm-btn is-secondary" id="vlCancel" data-i18n="common.cancel">Cancel</button>
      <button class="cm-btn is-primary" id="vlSave"><i class="ti ti-link" style="font-size:16px"></i><span data-i18n="video_detail.link_action">Link</span></button>
    </footer>
  </div>
</div>

<div id="tweaks-root"></div>
<div id="settings-host"></div>

<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>window.__CM_TWEAK_DEFAULTS = { theme: "hybrid", accent: "green" };</script>
<script defer src="settings-drawer.js"></script>
<script defer src="tweaks-panel.js"></script>
<script defer src="theme-tweaks.js"></script>

<script>
(async () => {
  if (!(await window.guardModule('video-room'))) return;
  await Promise.all([window.getProfile(), window.getClub()]);
  const clubId = await window.getClubId();
  window.applyClubTheme();

  function tt(key, fallbackEN, vars){ return (window.CM_I18N&&CM_I18N.tt)?CM_I18N.tt(key,fallbackEN,vars):(fallbackEN!=null?fallbackEN:key); }

  const root = document.getElementById('vdRoot');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  function toast(msg) { const t = document.getElementById('vdToast'); t.textContent = msg; t.classList.add('is-show'); setTimeout(() => t.classList.remove('is-show'), 2400); }

  function notFound(title, sub) {
    root.innerHTML = `<div class="vd-state"><span class="ic"><i class="ti ti-video-off"></i></span>
      <h3>${esc(title)}</h3><p>${esc(sub)}</p>
      <a class="cm-btn is-primary is-sm" href="Video%20Room.html"><i class="ti ti-arrow-left" style="font-size:15px"></i>${esc(tt('video_detail.back_to_library', 'Back to library'))}</a></div>`;
  }

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { notFound(tt('video_detail.nf_none_title', 'No video selected'), tt('video_detail.nf_none_body', 'Open a video from the library to see its detail.')); return; }

  // RLS validates club/team access; missing or no-access → maybeSingle returns null.
  const { data: v, error } = await window.sb.from('videos').select('*').eq('id', id).maybeSingle();
  if (error) { console.error('[VideoDetail] load error:', error); notFound(tt('video_detail.nf_load_title', "Couldn't load video"), error.message); return; }
  if (!v) { notFound(tt('video_detail.nf_missing_title', 'Video not found'), tt('video_detail.nf_missing_body', "This video doesn't exist or you don't have access to it.")); return; }

  document.title = `${v.title || tt('video_detail.video_word', 'Video')} — ClavaMetrics`;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const PROV = {
    google_drive: { cls:'drive',   icon:'ti-brand-google-drive', label:'Google Drive', open:tt('video_detail.open_in', 'Open in {name}', { name:'Google Drive' }) },
    dropbox:      { cls:'dropbox', icon:'ti-brand-dropbox',      label:'Dropbox',      open:tt('video_detail.open_in', 'Open in {name}', { name:'Dropbox' }) },
    other:        { cls:'',        icon:'ti-link',               label:tt('video_detail.prov_link', 'Link'), open:tt('video_detail.open_link', 'Open link') },
  };
  const prov = PROV[v.provider] || PROV.other;

  const fmtDate = d => { try { return new Date(d).toLocaleDateString((window.CM_I18N && CM_I18N.current) || 'en-GB', { day:'2-digit', month:'short', year:'numeric' }); } catch { return ''; } };
  const fmtDur = sec => { if (sec == null || isNaN(sec)) return null; const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}`; };
  const initials = name => { const w = (name||'').trim().split(/\s+/).filter(Boolean); return w.length ? w.slice(0,2).map(x => x[0].toUpperCase()).join('') : '–'; };
  function fileLabel() {
    try { const seg = decodeURIComponent(new URL(v.url).pathname.split('/').filter(Boolean).pop() || ''); if (seg && /\.[a-z0-9]{2,4}$/i.test(seg)) return seg; } catch {}
    return v.external_id || '—';
  }

  const isFolder = v.kind === 'folder';

  // Best-effort embeddable URL. The Open button below is always the reliable path.
  function driveId() {
    if (v.external_id) return v.external_id;
    const u = v.url || '';
    return (u.match(/\/file\/d\/([^/]+)/) || u.match(/[?&]id=([^&]+)/) || u.match(/\/d\/([^/]+)/) || [])[1] || null;
  }
  function driveFolderId() {
    const m = (v.url || '').match(/\/folders\/([^/?#]+)/);
    return m ? m[1] : null;
  }
  function embedUrl() {
    if (isFolder) {
      // Drive folders embed as a navigable grid; Dropbox folders have no reliable embed.
      if (v.provider === 'google_drive') { const fid = driveFolderId(); return fid ? `https://drive.google.com/embeddedfolderview?id=${fid}#grid` : null; }
      return null;
    }
    if (v.provider === 'google_drive') { const fid = driveId(); return fid ? `https://drive.google.com/file/d/${fid}/preview` : null; }
    if (v.provider === 'dropbox') {
      const u = v.url || ''; if (!u) return null;
      if (/[?&]dl=\d/.test(u)) return u.replace(/([?&])dl=\d/, '$1raw=1');
      return u + (u.includes('?') ? '&' : '?') + 'raw=1';
    }
    return v.url || null;
  }
  const embed = embedUrl();
  const dur = isFolder ? null : fmtDur(v.duration_seconds);
  const openLabel = isFolder ? tt('video_detail.open_folder_in', `Open folder in ${prov.label}`, { name:prov.label }) : prov.open;
  const embedBadge = isFolder ? tt('video_detail.browsing_folder', `Browsing ${prov.label} folder`, { name:prov.label }) : tt('video_detail.streaming_from', `Streaming from ${prov.label}`, { name:prov.label });

  // ── Player block ─────────────────────────────────────────────────────────────
  const playerHtml = embed
    ? `<div class="vd-player">
         <span class="vd-embedbadge"><span class="dot"></span><i class="ti ${prov.icon}"></i>${esc(embedBadge)}</span>
         <iframe src="${esc(embed)}" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
       </div>`
    : `<div class="vd-player is-fallback">
         ${v.thumbnail_url ? `<div class="pitch" style="background-image:url('${esc(v.thumbnail_url)}')"></div>` : `<div class="pitch" style="background:radial-gradient(120% 100% at 50% -10%, #1f6b3a 0%, #14502a 45%, #0b3119 100%)"></div>`}
         <div class="vd-fb-overlay">
           <div class="lock"><i class="ti ${isFolder ? 'ti-folder' : 'ti-lock'}"></i></div>
           <h4>${isFolder ? esc(tt('video_detail.fb_folder_title', 'Folder preview not available here')) : esc(tt('video_detail.fb_file_title', 'Preview not available here'))}</h4>
           <p>${isFolder ? esc(tt('video_detail.fb_folder_body', `This ${prov.label} folder can't be browsed here. It stays in your club's ${prov.label} — open it there to browse.`, { name:prov.label })) : esc(tt('video_detail.fb_file_body', `This file can't be embedded. It stays in your club's ${prov.label} — open it there to watch.`, { name:prov.label }))}</p>
         </div>
       </div>`;

  // ── Render main + rail skeleton ──────────────────────────────────────────────
  // The player (iframe) is rendered once into #vdPlayerHost so re-renders on
  // language change never reload the video.
  function renderMain() {
  const priorPlayer = document.getElementById('vdPlayerHost');
  root.innerHTML = `
    <div class="vd-grid">
      <div class="vd-col-main">
        <div id="vdPlayerHost">${priorPlayer ? '' : playerHtml}</div>
        <div class="vd-acts">
          <button class="cm-btn is-primary" id="vdOpen"><i class="ti ${prov.icon}" style="font-size:16px"></i>${esc(openLabel)}<i class="ti ti-external-link" style="font-size:15px"></i></button>
          <button class="cm-btn" id="vdCopy"><i class="ti ti-copy" style="font-size:15px"></i>${esc(tt('video_detail.copy_link', 'Copy link'))}</button>
        </div>
        <div class="vd-titlecard">
          <h1>${esc(v.title || tt('video_detail.untitled_video', 'Untitled video'))}</h1>
          <div class="row">
            ${dur ? `<span class="mi"><i class="ti ti-clock"></i><b>${dur}</b></span><span class="vsep"></span>` : ''}
            <span class="mi"><i class="ti ti-calendar-event"></i>${fmtDate(v.created_at)}</span>
            ${v.uploaded_by_name ? `<span class="vsep"></span><span class="mi"><span class="av">${esc(initials(v.uploaded_by_name))}</span>${esc(tt('video_detail.uploaded_by', 'Uploaded by'))} <b>${esc(v.uploaded_by_name)}</b></span>` : ''}
            <span class="vsep"></span>
            <span class="src ${prov.cls}"><i class="ti ${prov.icon}"></i>${esc(prov.label)}</span>
          </div>
        </div>
      </div>

      <aside class="vd-rail">
        <div class="vd-panel">
          <div class="vd-panel-hd">
            <i class="ti ti-link"></i><h2>${esc(tt('video_detail.linked_to', 'Linked to'))}</h2>
            <button class="add" id="vdLinkBtn"><i class="ti ti-plus"></i>${esc(tt('video_detail.link_action', 'Link'))}</button>
          </div>
          <div class="vd-panel-bd" id="vdLinks"><div class="vd-empty-links">${esc(tt('common.loading', 'Loading…'))}</div></div>
        </div>

        <div class="vd-panel">
          <div class="vd-panel-hd"><i class="ti ti-note"></i><h2>${esc(tt('video_detail.notes', 'Notes'))}</h2></div>
          <div class="vd-panel-bd">
            <textarea class="vd-notes" id="vdNotes" placeholder="${esc(tt('video_detail.notes_ph', 'Add notes for the staff…'))}">${esc(v.notes || '')}</textarea>
            <div class="vd-notes-foot">
              <button class="cm-btn is-primary is-sm" id="vdSaveNotes">${esc(tt('common.save', 'Save'))}</button>
              <span class="saved" id="vdNotesSaved"></span>
            </div>
          </div>
        </div>

        <div class="vd-panel">
          <div class="vd-panel-hd"><i class="ti ti-info-circle"></i><h2>${esc(tt('video_detail.details', 'Details'))}</h2></div>
          <div class="vd-panel-bd">
            <div class="vd-dl">
              <div class="drow"><span class="dk"><i class="ti ti-cloud"></i>${esc(tt('video_detail.detail_source', 'Source'))}</span><span class="dv"><i class="ti ${prov.icon}" style="${v.provider==='google_drive'?'color:#1FA463':v.provider==='dropbox'?'color:#0061FF':''}"></i>${esc(prov.label)}</span></div>
              <div class="drow"><span class="dk"><i class="ti ${isFolder ? 'ti-folder' : 'ti-file'}"></i>${isFolder ? esc(tt('video_detail.detail_folder', 'Folder')) : esc(tt('video_detail.detail_file', 'File'))}</span><span class="dv"><span class="truncate">${esc(fileLabel())}</span></span></div>
              <div class="drow"><span class="dk"><i class="ti ti-calendar"></i>${esc(tt('common.date', 'Date'))}</span><span class="dv">${fmtDate(v.created_at)}</span></div>
              <div class="drow"><span class="dk"><i class="ti ti-user-up"></i>${esc(tt('video_detail.detail_author', 'Author'))}</span><span class="dv">${v.uploaded_by_name ? `<span class="av" style="width:20px;height:20px;border-radius:50%;background:var(--cm-violet-bg);color:var(--cm-violet);display:inline-flex;align-items:center;justify-content:center;font:700 8.5px/1 var(--cm-font-sans)">${esc(initials(v.uploaded_by_name))}</span>${esc(v.uploaded_by_name)}` : '—'}</span></div>
              <div class="drow"><span class="dk"><i class="ti ti-external-link"></i>${esc(tt('video_detail.detail_open', 'Open'))}</span><span class="dv"><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(tt('video_detail.view_in', `View in ${prov.label}`, { name:prov.label }))}</a></span></div>
            </div>
            <div class="vd-store-note">
              <i class="ti ti-shield-check"></i>
              <p>${isFolder ? tt('video_detail.store_note_folder', `The folder <b>lives in your club's ${esc(prov.label)}</b>. ClavaMetrics browses &amp; opens it and manages its context — it never stores a copy.`, { name:esc(prov.label) }) : tt('video_detail.store_note_file', `The file <b>lives in your club's ${esc(prov.label)}</b>. ClavaMetrics plays/opens it and manages its context — it never stores a copy.`, { name:esc(prov.label) })}</p>
            </div>
          </div>
        </div>
      </aside>
    </div>`;

  // Preserve the already-mounted player node across re-renders (no iframe reload).
  if (priorPlayer) { const host = document.getElementById('vdPlayerHost'); if (host) host.replaceWith(priorPlayer); }

  // ── Actions ──────────────────────────────────────────────────────────────────
  document.getElementById('vdOpen').addEventListener('click', () => window.open(v.url, '_blank', 'noopener'));
  document.getElementById('vdCopy').addEventListener('click', () => navigator.clipboard?.writeText(v.url).then(() => toast(tt('video_detail.link_copied', 'Link copied'))));

  // ── Notes save ───────────────────────────────────────────────────────────────
  document.getElementById('vdSaveNotes').addEventListener('click', async () => {
    const btn = document.getElementById('vdSaveNotes');
    const notes = document.getElementById('vdNotes').value;
    btn.disabled = true; btn.textContent = tt('common.saving', 'Saving…');
    const { error: e } = await window.sb.from('videos')
      .update({ notes: notes || null, updated_at: new Date().toISOString() }).eq('id', id);
    btn.disabled = false; btn.textContent = tt('common.save', 'Save');
    if (e) { alert(tt('video_detail.notes_save_error', `Error saving notes: ${e.message}`, { msg:e.message })); return; }
    v.notes = notes; document.getElementById('vdNotesSaved').textContent = tt('common.saved', 'Saved');
    setTimeout(() => { const s = document.getElementById('vdNotesSaved'); if (s) s.textContent = ''; }, 2500);
    toast(tt('video_detail.notes_saved', 'Notes saved'));
  });
  }

  renderMain();

  // ── Linked-to ─────────────────────────────────────────────────────────────────
  async function loadLinks() {
    const [vs, vp, vm] = await Promise.all([
      window.sb.from('video_sessions').select('session_id').eq('video_id', id),
      window.sb.from('video_players').select('player_id').eq('video_id', id),
      window.sb.from('video_matches').select('event_id').eq('video_id', id),
    ]);
    const sIds = (vs.data || []).map(r => r.session_id);
    const pIds = (vp.data || []).map(r => r.player_id);
    const eIds = (vm.data || []).map(r => r.event_id);

    const [sMeta, pMeta, eMeta] = await Promise.all([
      sIds.length ? window.sb.from('training_sessions').select('id,title,session_date,match_day_offset').in('id', sIds) : { data: [] },
      pIds.length ? window.sb.from('players').select('id,first_name,last_name').in('id', pIds) : { data: [] },
      eIds.length ? window.sb.from('calendar_events').select('id,opponent,title,date').in('id', eIds) : { data: [] },
    ]);
    const sessionLabel = s => s ? (s.title || (s.match_day_offset != null ? `MD${s.match_day_offset > 0 ? '+' : ''}${s.match_day_offset}` : (s.session_date ? fmtDate(s.session_date) : tt('video_detail.block_session', 'Session')))) : tt('video_detail.block_session', 'Session');
    const playerLabel  = p => (p && (p.last_name || p.first_name)) || '—';
    const matchLabel   = e => (e && (e.opponent || e.title)) || tt('video_detail.block_match', 'Match');

    const groups = [
      { type:'match',   cls:'match',   icon:'ti-ball-football',  col:'event_id',   label:tt('video_detail.block_match', 'Match'),
        items:(eMeta.data||[]).map(e => ({ key:e.id, label: matchLabel(e) })) },
      { type:'session', cls:'session', icon:'ti-clipboard-list', col:'session_id', label:tt('video_detail.block_session', 'Session'),
        items:(sMeta.data||[]).map(s => ({ key:s.id, label: sessionLabel(s) })) },
      { type:'player',  cls:'player',  icon:'ti-user',           col:'player_id',  label:tt('common.players', 'Players'),
        items:(pMeta.data||[]).map(p => ({ key:p.id, label: playerLabel(p) })) },
    ].filter(g => g.items.length);

    const box = document.getElementById('vdLinks');
    if (!groups.length) { box.innerHTML = `<div class="vd-empty-links">${esc(tt('video_detail.no_links', 'No links yet. Linking videos to sessions, players or matches is coming soon.'))}</div>`; return; }

    box.innerHTML = groups.map(g => `
      <div class="vd-lgroup" data-group="${g.type}">
        <div class="vd-lk-label">${g.label}</div>
        <div class="vd-lchips">${g.items.map(it => `
          <span class="vd-lchip ${g.cls}" data-type="${g.type}" data-table="video_${g.type === 'match' ? 'matches' : g.type + 's'}" data-col="${g.col}" data-key="${esc(it.key)}">
            <i class="ti ${g.icon} lead"></i><span class="lbl">${esc(it.label)}</span>
            <button class="x" title="${esc(tt('video_detail.remove_link', 'Remove link'))}"><i class="ti ti-x"></i></button>
          </span>`).join('')}</div>
      </div>`).join('');
  }

  root.addEventListener('click', async e => {
    const x = e.target.closest('#vdLinks .x'); if (!x) return;
    const chip = x.closest('.vd-lchip');
    const { table, col, key } = chip.dataset;
    x.disabled = true;
    const { error: e2 } = await window.sb.from(table).delete().eq('video_id', id).eq(col, key);
    if (e2) { x.disabled = false; alert(tt('video_detail.remove_link_error', `Error removing link: ${e2.message}`, { msg:e2.message })); return; }
    const group = chip.closest('.vd-lgroup');
    chip.remove();
    if (group && !group.querySelector('.vd-lchip')) group.remove();
    if (!document.querySelector('#vdLinks .vd-lchip')) document.getElementById('vdLinks').innerHTML = `<div class="vd-empty-links">${esc(tt('video_detail.no_links', 'No links yet. Linking videos to sessions, players or matches is coming soon.'))}</div>`;
    toast(tt('video_detail.link_removed', 'Link removed'));
  });

  await loadLinks();

  // ── Link video modal ───────────────────────────────────────────────────────
  (function setupLinkModal() {
    const backdrop = document.getElementById('vlBackdrop');
    const kindLabel = k => ({ session:tt('video_detail.kind_sessions', 'Sessions'), player:tt('common.players', 'Players'), match:tt('video_detail.kind_matches', 'Matches') }[k]);
    const KIND_ICON  = { session:'ti-clipboard-list', match:'ti-ball-football' };
    const LISTS = { session:null, player:null, match:null };
    const sel = { session:new Map(), player:new Map(), match:new Map() }; // id -> { id, label, initials? }
    let listsLoaded = false;

    const combos = {};
    backdrop.querySelectorAll('.vl-combo').forEach(c => {
      combos[c.dataset.kind] = {
        kind: c.dataset.kind,
        input: c.querySelector('input'),
        search: c.querySelector('.vl-search'),
        menu: c.querySelector('.vl-menu'),
        chips: backdrop.querySelector(`.vl-chips[data-chips="${c.dataset.kind}"]`),
      };
    });

    async function ensureLists() {
      if (listsLoaded) return;
      const [s, p, m] = await Promise.all([
        window.sb.from('training_sessions').select('id,title,session_date,match_day_offset').eq('club_id', clubId).order('session_date', { ascending: false }),
        window.getActivePlayers(clubId),
        window.sb.from('calendar_events').select('id,opponent,title,date').eq('club_id', clubId).eq('type', 'match').order('date', { ascending: false }),
      ]);
      const sLab = r => r.title || (r.match_day_offset != null ? `MD${r.match_day_offset > 0 ? '+' : ''}${r.match_day_offset}` : (r.session_date ? fmtDate(r.session_date) : tt('video_detail.block_session', 'Session')));
      LISTS.session = (s.data || []).map(r => ({ id:r.id, label:sLab(r), sub:r.session_date ? fmtDate(r.session_date) : '', search:`${r.title || ''} ${sLab(r)}`.toLowerCase() }));
      LISTS.player  = (p || []).map(r => {
        const full = `${r.first_name || ''} ${r.last_name || ''}`.trim();
        const label = `${r.last_name || ''}${r.last_name && r.first_name ? ', ' : ''}${r.first_name || ''}`.trim() || '—';
        return { id:r.id, label, initials:initials(full), sub:[r.number ? `#${r.number}` : '', r.position].filter(Boolean).join(' · '), search:full.toLowerCase() };
      });
      LISTS.match = (m.data || []).map(r => ({ id:r.id, label:r.opponent ? tt('video_detail.vs_opponent', `vs ${r.opponent}`, { name:r.opponent }) : (r.title || tt('video_detail.block_match', 'Match')), sub:r.date ? fmtDate(r.date) : '', search:`${r.opponent || ''} ${r.title || ''}`.toLowerCase() }));
      listsLoaded = true;
    }

    function updateSummary() {
      const n = sel.session.size + sel.player.size + sel.match.size;
      document.getElementById('vlSummary').innerHTML = tt('video_detail.links_selected', `<b>${n}</b> link${n === 1 ? '' : 's'} selected`, { count:n });
    }

    function renderChips(kind) {
      combos[kind].chips.innerHTML = [...sel[kind].values()].map(it => {
        const lead = kind === 'player' ? `<span class="av">${esc(it.initials)}</span>` : `<i class="ti ${KIND_ICON[kind]} lead"></i>`;
        return `<span class="vl-chip ${kind}" data-id="${esc(it.id)}">${lead}<span class="lbl">${esc(it.label)}</span><button class="x" aria-label="Remove"><i class="ti ti-x"></i></button></span>`;
      }).join('');
    }

    function renderMenu(kind, q) {
      const { menu } = combos[kind];
      const items = (LISTS[kind] || []).filter(it => it.search.includes(q));
      if (!items.length) { menu.innerHTML = `<div class="vl-menu-lbl">${esc(tt('video_detail.no_matches', 'No matches'))}</div>`; menu.hidden = false; return; }
      const shown = items.slice(0, 40);
      const addedTxt = tt('video_detail.added', 'added');
      menu.innerHTML = `<div class="vl-menu-lbl">${esc(kindLabel(kind))} · ${esc(tt('video_detail.match_count', `${items.length} match${items.length === 1 ? '' : 'es'}`, { count:items.length }))}</div>` + shown.map(it => {
        const added = sel[kind].has(it.id);
        const oic = kind === 'player' ? `<span class="oic player">${esc(it.initials)}</span>` : `<span class="oic ${kind}"><i class="ti ${KIND_ICON[kind]}"></i></span>`;
        return `<div class="vl-opt ${added ? 'is-added' : ''}" data-id="${esc(it.id)}">${oic}<div class="obody"><div class="on">${esc(it.label)}</div>${it.sub ? `<div class="om">${esc(it.sub)}${added ? ` · ${esc(addedTxt)}` : ''}</div>` : (added ? `<div class="om">${esc(addedTxt)}</div>` : '')}</div><i class="ti ${added ? 'ti-circle-check-filled' : 'ti-circle-plus'} oadd"></i></div>`;
      }).join('');
      menu.hidden = false;
    }

    function toggle(kind, itemId) {
      const it = (LISTS[kind] || []).find(x => x.id === itemId);
      if (!it) return;
      if (sel[kind].has(itemId)) { sel[kind].delete(itemId); }
      else {
        if (kind === 'match') sel.match.clear();   // match is single
        sel[kind].set(itemId, it);
      }
      renderChips(kind); updateSummary();
    }

    // Per-combo wiring
    Object.values(combos).forEach(c => {
      c.input.addEventListener('focus', () => { c.search.classList.add('is-open'); renderMenu(c.kind, c.input.value.trim().toLowerCase()); });
      c.input.addEventListener('input', () => renderMenu(c.kind, c.input.value.trim().toLowerCase()));
      c.menu.addEventListener('click', e => {
        const opt = e.target.closest('.vl-opt'); if (!opt) return;
        toggle(c.kind, opt.dataset.id);
        renderMenu(c.kind, c.input.value.trim().toLowerCase()); // keep open, refresh added-state
        c.input.focus();
      });
      c.chips.addEventListener('click', e => {
        const x = e.target.closest('.x'); if (!x) return;
        const chip = x.closest('.vl-chip');
        sel[c.kind].delete(chip.dataset.id);
        renderChips(c.kind); updateSummary();
        if (!c.menu.hidden) renderMenu(c.kind, c.input.value.trim().toLowerCase());
      });
    });

    // Close menus when clicking elsewhere inside the modal
    backdrop.querySelector('.vl-modal').addEventListener('click', e => {
      if (e.target.closest('.vl-combo')) return;
      Object.values(combos).forEach(c => { c.menu.hidden = true; c.search.classList.remove('is-open'); });
    });

    function open() {
      ['session', 'player', 'match'].forEach(k => { sel[k].clear(); combos[k].input.value = ''; combos[k].menu.hidden = true; combos[k].search.classList.remove('is-open'); renderChips(k); });
      updateSummary();
      document.getElementById('vlVideoTitle').textContent = v.title || tt('video_detail.untitled_video', 'Untitled video');
      const d = fmtDur(v.duration_seconds), durEl = document.getElementById('vlVideoDur');
      if (d) { durEl.style.display = ''; durEl.querySelector('span').textContent = d; } else { durEl.style.display = 'none'; }
      backdrop.classList.add('is-open');
      ensureLists();
    }
    function close() { backdrop.classList.remove('is-open'); }

    root.addEventListener('click', e => { if (e.target.closest('#vdLinkBtn')) open(); });
    document.getElementById('vlClose').addEventListener('click', close);
    document.getElementById('vlCancel').addEventListener('click', close);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('is-open')) close(); });

    document.getElementById('vlSave').addEventListener('click', async () => {
      const jobs = [];
      if (sel.session.size) jobs.push(window.sb.from('video_sessions').upsert([...sel.session.keys()].map(k => ({ video_id:id, session_id:k })), { onConflict:'video_id,session_id', ignoreDuplicates:true }));
      if (sel.player.size)  jobs.push(window.sb.from('video_players').upsert([...sel.player.keys()].map(k => ({ video_id:id, player_id:k })), { onConflict:'video_id,player_id', ignoreDuplicates:true }));
      if (sel.match.size)   jobs.push(window.sb.from('video_matches').upsert([...sel.match.keys()].map(k => ({ video_id:id, event_id:k })), { onConflict:'video_id,event_id', ignoreDuplicates:true }));
      if (!jobs.length) { close(); return; }

      const btn = document.getElementById('vlSave');
      btn.disabled = true; btn.textContent = tt('video_detail.linking', 'Linking…');
      const results = await Promise.all(jobs);
      btn.disabled = false; btn.innerHTML = `<i class="ti ti-link" style="font-size:16px"></i>${esc(tt('video_detail.link_action', 'Link'))}`;
      const err = results.find(r => r.error);
      if (err) { alert(tt('video_detail.link_error', `Error linking: ${err.error.message}`, { msg:err.error.message })); return; }
      close();
      await loadLinks();   // refresh "Linked to" without reload
      toast(tt('video_detail.links_added', 'Links added'));
    });
  })();

  // Re-render JS-built content on language change (player node is preserved).
  document.addEventListener('cm:langchanged', () => { renderMain(); loadLinks(); });
})();
</script>
