<style>
  :root{--sans:'Inter',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--green:#15803D;--green-d:#4ADE80}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100vh;min-height:100dvh}
  body{font-family:var(--sans);background:linear-gradient(180deg,#0A0A0A 0%,#111 100%);color:#EDEDED}
  .ph{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:32px}
  .ph-header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between}
  .ph-header .date{font:500 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#9CA3AF}
  .ph-header .avatar{width:34px;height:34px;border-radius:50%;background:rgba(74,222,128,.18);color:var(--green-d);display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--sans);border:1px solid rgba(74,222,128,.30)}

  .ph-hero h1{font:600 28px/1.1 var(--sans);letter-spacing:-.02em;color:#fff;margin-bottom:6px}
  .ph-hero p{font:400 14px/1.45 var(--sans);color:#9CA3AF}

     primero que ve, con color e icono propios por tipo para que no confunda gym con campo. */

  .now-rating .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.08)}
  .now-rating .ic i{font-size:27px}
  .now-rating .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .now-rating .ey{font:600 10.5px/1 var(--mono);letter-spacing:.10em;text-transform:uppercase;color:#9CA3AF}
  .now-rating strong{font:700 22px/1.15 var(--sans);color:#fff;letter-spacing:-.01em}
  .now-rating .tm{font:500 12.5px/1 var(--mono);color:#9CA3AF}
  .now-rating .step{margin-left:auto;flex-shrink:0;font:700 12px/1 var(--mono);color:#9CA3AF;background:rgba(255,255,255,.07);border-radius:999px;padding:7px 10px}
  .now-rating.is-gym{border-color:rgba(167,139,250,.50);background:rgba(167,139,250,.10)}
  .now-rating.is-gym .ic{background:rgba(167,139,250,.18)}
  .now-rating.is-gym .ic i{color:#A78BFA}
  .now-rating.is-field{border-color:rgba(74,222,128,.50);background:rgba(74,222,128,.10)}
  .now-rating.is-field .ic{background:rgba(74,222,128,.18)}
  .now-rating.is-field .ic i{color:var(--green-d)}
  .now-rating.is-match{border-color:rgba(251,191,36,.50);background:rgba(251,191,36,.10)}
  .now-rating.is-match .ic{background:rgba(251,191,36,.18)}
  .now-rating.is-match .ic i{color:#FBBF24}
  .now-rating.in-done{margin:16px 0 0;width:100%;max-width:380px;text-align:left}
  .ph-section{padding:0 22px;margin-bottom:22px}
  .ph-section .q-label{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ph-section .q-label .ic{width:28px;height:28px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .ph-section .q-label .title{font:600 15px/1.2 var(--sans);color:#fff;flex:1}
  .ph-section .q-label .val{font:600 14px/1 var(--mono);color:var(--green-d)}

  .done-wrap{padding:32px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
  .done-wrap .big{font-size:52px;color:var(--green-d)}

  .done-wrap .sub{font:400 14px/1.4 var(--sans);color:#9CA3AF}
  .d7-card{width:100%;max-width:380px;margin-top:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;text-align:left}
  .d7-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .d7-head .t{font:600 14px/1 var(--sans);color:#fff}
  .d7-head .s{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#9CA3AF}
  .d7-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin-bottom:6px}
  .d7-col{height:100%;display:flex;align-items:flex-end}
  .d7-bar{width:100%;border-radius:5px;background:rgba(255,255,255,.14);min-height:6px}
  .d7-bar.low{background:#F87171}
  .d7-bar.mid{background:#FBBF24}
  .d7-bar.high{background:var(--green-d)}
  .d7-bar.warm{background:#FBBF24}
  .d7-bar.hot{background:#FB923C}
  .d7-bar.today{box-shadow:0 0 0 2px var(--green-d)}
  .d7-lbls{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
  .d7-lbl{font:500 10.5px/1 var(--mono);color:#9CA3AF;text-align:center;text-transform:capitalize}
  .d7-lbl.today{color:var(--green-d);font-weight:700}
  .d7-rows{display:flex;flex-direction:column}
  .d7-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
  .d7-row:last-child{border-bottom:0}
  .d7-row .l{font:500 13px/1 var(--sans);color:#EDEDED}
  .d7-row .v{font:600 13px/1 var(--mono);color:var(--green-d)}
</style>
</head>

  const meta=await sb.rpc('get_survey_meta',{p_token:token});
  if(meta.error||!meta.data?.valid){show404(meta.error?.message);return;}
  scope=meta.data.scope;
  const {data,error}=await sb.rpc('get_survey_players',{p_token:token});
  if(error||!data||!data.length){show404(error?.message);return;}
  players=data;renderPick();
}
function renderPick(){
  app.innerHTML=header()+
    `<div class="ph-hero"><span class="eyebrow"><span class="dot"></span>${L.eyebrow}</span><h1>${L.who}</h1><p>${L.whoSub}</p></div>`+
    `<div class="players">`+players.map((p,i)=>`<button class="player-btn" data-i="${i}"><span class="av">${esc((p.name[0]||'?').toUpperCase())}</span>${esc(p.name)}</button>`).join('')+`</div>`;
  app.querySelectorAll('.player-btn').forEach(b=>b.onclick=async()=>{
    picked=players[+b.dataset.i];
    b.style.opacity='.6';
    await loadSessions();
    renderForm();
  });
}
// Sesiones del día local del jugador (solo RPE con link genérico). Si falla, sessions
// queda vacío y el submit cae al resolver automático del servidor, como siempre.
async function loadSessions(){
  sessions=[];sessPick=null;skipped.clear();   // otro jugador arranca con el candado limpio
  if(scope!=='rpe')return;
  try{
    const r=await sb.rpc('get_survey_sessions',{p_token:token,p_player_id:picked.id,p_tz:new Date().getTimezoneOffset()});
    if(!r.error&&r.data&&!r.data.error)sessions=r.data.sessions||[];
  }catch{}
  sessPick=pickDefault();
}
// Preselección: la última sesión ya iniciada que siga sin responder (el RPE se manda
// después de entrenar); si ninguna empezó, la primera pendiente.
// Checker de convocatoria: una sesión "espera" al jugador si no tiene lista cargada
// (session_participants) o si él figura en ella. Con la RPC vieja (sin has_list/listed)
// todo da true y el comportamiento queda como antes.
const expectsMe=s=>!s.has_list||!!s.listed;
// ── Candado de doble sesión ───────────────────────────────────────────────────
// Obligatorias = aquellas donde el staff lo convocó explícitamente (session_participants)
// y que YA empezaron. Una sesión sin convocatoria armada (el default "entrenan todos los
// disponibles") sigue siendo sugerencia, no candado: si no, un día de gym + campo obligaría
// a dos RPE a quien no fue al gym. Las que todavía no empezaron tampoco traban.
function sessMins(s){
  if(!s.time)return null;
  const h=parseInt(String(s.time).slice(0,2),10),m=parseInt(String(s.time).slice(3,5),10);
  return isNaN(h)?null:h*60+(isNaN(m)?0:m);
}
function hasStarted(s){
  const m=sessMins(s);
  if(m==null)return true;               // sin hora no hay forma de saber → cuenta como iniciada
  const now=new Date();
  return m<=now.getHours()*60+now.getMinutes();
}
const isRequired=s=>!!s.listed&&hasStarted(s);
const requiredAll=()=>sessions.filter(isRequired);
const requiredPending=()=>requiredAll().filter(s=>!s.answered&&!skipped.has(s.id));
function pickDefault(){
  let un=sessions.filter(s=>!s.answered&&!skipped.has(s.id));
  if(!un.length)return null;
  const req=un.filter(isRequired);   // las obligatorias van primero
  const mine=req.length?req:un.filter(expectsMe);
  if(mine.length)un=mine;
  const now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const mins=s=>s.time?parseInt(s.time.slice(0,2),10)*60+parseInt(s.time.slice(3,5),10):null;
  const started=un.filter(s=>mins(s)!=null&&mins(s)<=cur).sort((a,b)=>mins(b)-mins(a));
  return (started[0]||un[0]).id;
}
const sessType=s=>s.type==='gym'?L.sessGym:s.type==='match'?L.sessMatch:L.sessField;
const sessIcon=s=>s.type==='gym'?'ti-barbell':s.type==='match'?'ti-trophy':'ti-run';
const sessTime=s=>s.time?String(s.time).slice(0,5):'';
function sessLabel(s){
  return sessType(s)+(sessTime(s)?' · '+sessTime(s):'');
}
// Cartel grande arriba del formulario: "Estás calificando — GIMNASIO · 18:00". Solo con
// dos o más sesiones en el día, que es cuando se puede confundir gym con campo.
function sessBanner(s,ey,extra){
  const cls=s.type==='gym'?'is-gym':s.type==='match'?'is-match':'is-field';
  const req=requiredAll();
  const step=req.length>=2
    ? `<span class="step">${L.progress(req.filter(x=>x.answered||skipped.has(x.id)).length+1,req.length)}</span>`
    : '';
  return `<div class="now-rating ${cls}${extra||''}"><span class="ic"><i class="ti ${sessIcon(s)}"></i></span>
    <div class="tx"><span class="ey">${ey}</span><strong>${esc(sessType(s))}</strong>${sessTime(s)?`<span class="tm">${esc(sessTime(s))}</span>`:''}</div>${step}</div>`;
}
function nowRatingHtml(){
  if(scope!=='rpe'||sessions.length<2)return '';
  const s=sessions.find(x=>x.id===sessPick);
  return s?sessBanner(s,L.ratingNow):'';
}
// Alarma si la sesión elegida tiene convocatoria y el jugador no figura; si figura en la
// otra pendiente, el aviso lo manda para allá.
function sessWarnHtml(){
  const s=sessions.find(x=>x.id===sessPick);
  if(!s||expectsMe(s))return '';
  const other=sessions.find(x=>x.id!==s.id&&!x.answered&&x.listed);
  return `<div class="sess-warn"><i class="ti ti-alert-triangle"></i><span>${other?L.listedOther(sessLabel(other)):L.notOnList}</span></div>`;
}
function sessHtml(){
  if(scope!=='rpe'||sessions.length<2)return '';
  return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ti-calendar-time"></i></span><span class="title">${L.which}</span></div>
    <div class="sess-row">`+sessions.map(s=>{
      const ic=s.type==='gym'?'ti-barbell':s.type==='match'?'ti-trophy':'ti-run';
      const tag=s.answered?`<span class="tag"><i class="ti ti-check"></i> ${L.sentTag}</span>`
        :(s.listed?`<span class="tag for-you"><i class="ti ti-clipboard-check"></i> ${L.forYou}</span>`:'');
      return `<button class="sess-btn${s.id===sessPick?' is-on':''}${s.answered?' is-done':''}"${s.answered?' disabled':''} onclick="pickSess('${s.id}')">
        <i class="ti ${ic}"></i>${esc(sessLabel(s))}${tag}</button>`;
    }).join('')+`</div>`+sessWarnHtml()+`<div class="sess-hint">${L.whichSub}</div></div>`;
}
window.pickSess=id=>{const s=sessions.find(x=>x.id===id);if(!s||s.answered)return;sessPick=id;renderForm();};
function scaleHtml(key,icon,label,ends,max=10){
  return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ${icon}"></i></span><span class="title">${label}</span><span class="val" id="v_${key}">${state[key]}</span></div>
    <div class="ph-scale" id="sc_${key}" style="grid-template-columns:repeat(${max},1fr)">`+[...Array(max)].map((_,i)=>`<button class="${state[key]===i+1?'is-on':''}" onclick="setScale('${key}',${i+1})">${i+1}</button>`).join('')+`</div>
    <div class="ph-scale-ends"><span>${ends[0]}</span><span>${ends[1]}</span></div></div>`;
}
function bodyHtml(){const parts=Object.keys(L.parts);
  return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ti-pin"></i></span><span class="title">${L.soreQ}</span></div>
    <div class="ph-body-row">`+parts.map(k=>`<button class="ph-body-chip${state.body.has(k)?' is-on':''}" data-k="${k}" onclick="toggleBody('${k}',this)">${L.parts[k]}</button>`).join('')+`</div></div>`;
}
function noteHtml(){return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ti-message"></i></span><span class="title">${L.note}</span></div>
    <textarea placeholder="${L.notePh}" oninput="state.note=this.value"></textarea></div>`;}

function renderForm(){
  // Día con sesiones y todas ya respondidas → no hay nada para calificar.
  if(scope==='rpe'&&sessions.length&&sessions.every(s=>s.answered||skipped.has(s.id))){renderDone(null,true);return;}
  let body;
  if(scope==='rpe'){
    body=sessHtml()+scaleHtml('rpe','ti-flame',L.rpeTitle,L.e_rpe)+bodyHtml()+noteHtml();
  }else{
    body=scaleHtml('sleepQ','ti-moon',L.sleep,L.e_sleep,7)+
         scaleHtml('fatigue','ti-bolt',L.fatigue,L.e_fatigue,7)+
         scaleHtml('stress','ti-brain',L.stress,L.e_stress,7)+
         scaleHtml('soreness','ti-bandage',L.soreness,L.e_soreness,7)+
         scaleHtml('mood','ti-mood-smile',L.mood,L.e_mood,7)+bodyHtml()+noteHtml();
  }
  // El CTA repite la sesión, para que la última cosa que lee antes de enviar sea cuál es.
  const _cur=scope==='rpe'&&sessions.length>1?sessions.find(x=>x.id===sessPick):null;
  const _cta=_cur?L.sendFor(sessType(_cur)):L.send;
  app.innerHTML=`<button class="back" onclick="renderPick()"><i class="ti ti-arrow-left"></i>${L.notme(esc(picked.name))}</button>`+
    header()+`<div class="ph-hero"><span class="eyebrow"><span class="dot"></span>${L.eyebrow}</span><h1>${L.hi(esc(picked.name.split(' ')[0]))}</h1><p>${scope==='rpe'?L.rpeSub:L.formSub}</p></div>`+
    nowRatingHtml()+
    body+`<div class="ph-cta"><button id="submitBtn" onclick="submitForm()">${esc(_cta)}</button></div>`;
}
window.setScale=(k,v)=>{state[k]=v;document.getElementById('v_'+k).textContent=v;
  document.querySelectorAll('#sc_'+k+' button').forEach((b,i)=>b.classList.toggle('is-on',i+1===v));};
window.toggleBody=(k,el)=>{state.body.has(k)?state.body.delete(k):state.body.add(k);el.classList.toggle('is-on');};
window.submitForm=async()=>{
  // Última barrera del checker: enviar a una sesión donde no figura pide confirmación.
  if(sessPick){const s=sessions.find(x=>x.id===sessPick);
    if(s&&!expectsMe(s)&&!confirm(L.confirmNotListed))return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent=L.sending;
  const _tz=new Date().getTimezoneOffset();   // so the one-per-day lock uses the player's local day
  const payload=scope==='rpe'
    ?{rpe:state.rpe,body:[...state.body],note:state.note,tzOffset:_tz,...(sessPick?{sessionId:sessPick}:{})}
    :{scale:'7',sleepQ:state.sleepQ,mood:state.mood,fatigue:state.fatigue,stress:state.stress,soreness:state.soreness,body:[...state.body],note:state.note,tzOffset:_tz};
  const {data,error}=await sb.rpc('submit_survey',{p_token:token,p_player_id:picked.id,p_payload:payload});
  if(error||data?.error){btn.disabled=false;btn.textContent=L.retry;alert(L.sendErr+(error?.message||data?.error));return;}
  const already=data?.already===true;
  if(sessPick){const s=sessions.find(x=>x.id===sessPick);if(s)s.answered=true;}
  // Doble sesión: si todavía le falta alguna donde está convocado, no cerramos el survey.
  if(scope==='rpe'&&requiredPending().length){renderPending(!already);return;}
  await finish(already);
};
// Cierre real: trae el historial de 7 días y muestra la pantalla final.
async function finish(already){
  let hist=null;
  try { const r=await sb.rpc('get_survey_history',{p_token:token,p_player_id:picked.id});
        if(!r.error && r.data && !r.data.error) hist=r.data; } catch {}
  renderDone(hist, already);
}
// Pantalla intermedia: confirma lo enviado y empuja a la sesión que falta. Sin botón de
// "terminar" — la única salida es calificarla o declarar que no estuvo.
function renderPending(sent){
  const pend=requiredPending();
  const next=pend[0];
  app.innerHTML=`<div class="done-wrap">`+
    (sent?`<div class="sent-pill"><i class="ti ti-circle-check"></i>${L.pendSent}</div>`:'')+
    `<i class="ti ti-alert-triangle big warn"></i>`+
    `<div class="hl">${L.pendTitle(pend.length)}</div>`+
    `<div class="sub">${L.pendSub}</div>`+
    sessBanner(next,L.missEy,' in-done')+
    `<div class="next-card is-alert">
      <button onclick="rateNext('${next.id}')">${esc(L.rateBtn(sessType(next)))}</button>
      <button class="skip" onclick="skipSess('${next.id}')">${L.skipBtn}</button></div>`+
    `</div>`;
}
// "No estuve en esta sesión": la saca del candado sin escribir nada en la DB, así el staff
// la sigue viendo como pendiente en el board y decide qué hacer.
window.skipSess=async id=>{
  skipped.add(id);
  if(requiredPending().length){renderPending(false);return;}
  await finish(false);
};
// Si quedó otra sesión del día sin calificar, ofrecerla acá mismo (doble sesión: gym + campo).
function nextHtml(){
  if(scope!=='rpe')return '';
  // Si figura en la convocatoria de una pendiente, esa va primero y el cartel es alarma
  // ("te falta esta"), no una sugerencia.
  // Las que declaró "no estuve" no se vuelven a ofrecer.
  const open=sessions.filter(s=>!s.answered&&!skipped.has(s.id));
  const next=open.find(s=>s.listed)||open[0];
  if(!next)return '';
  const alert=!!next.listed;
  return `<div class="next-card${alert?' is-alert':''}"><div class="q">${alert?`<i class="ti ti-alert-triangle"></i> `+L.missing(sessLabel(next)):L.also(sessLabel(next))}</div>
    <button onclick="rateNext('${next.id}')">${L.alsoBtn}</button></div>`;
}
window.rateNext=id=>{
  sessPick=id;state.rpe=6;state.body=new Set();state.note='';
  renderForm();
};
function renderDone(hist, already){
  const name=esc(picked.name.split(' ')[0]);
  const isRpe=(scope==='rpe');
  const allDone=isRpe&&sessions.length&&sessions.every(s=>s.answered);
  const hl=already?(isRpe?L.alreadyRpe:L.already):L.done(name);
  const sub=already?(isRpe?(allDone?L.allRpeSub:L.alreadyRpeSub):L.alreadySub):L.doneSub;
  if(!hist||!hist.history||!hist.history.length){
    app.innerHTML=`<div class="center"><i class="ti ti-circle-check big"></i><div class="t">${hl}</div><div>${sub}</div>${nextHtml()}</div>`;
    return;
  }
  const items=hist.history, n=items.length;
  const loc=L===T.en?'en-GB':L===T.pt?'pt-BR':'es-ES';
  const maxLoad=isRpe?Math.max(1,...items.map(x=>x.load||0)):10;
  const bars=items.map((x,i)=>{
    const last=i===n-1;let pct,cls;
    if(isRpe){const v=x.load||0;pct=Math.max(8,Math.round(v/maxLoad*100));cls=v>=maxLoad*.8?'hot':v>=maxLoad*.5?'warm':'';}
    else{const v=x.readiness==null?0:x.readiness;pct=Math.max(8,Math.round(v/10*100));cls=v<5?'low':v<7?'mid':'high';}
    return `<div class="d7-col"><div class="d7-bar ${cls}${last?' today':''}" style="height:${pct}%"></div></div>`;
  }).join('');
  const lbls=items.map((x,i)=>{
    const last=i===n-1;
    const wd=last?L.today:new Date(x.d+'T00:00:00').toLocaleDateString(loc,{weekday:'short'});
    return `<div class="d7-lbl${last?' today':''}">${wd}</div>`;
  }).join('');
  const t=items[n-1];
  const sv=v=>v==null?'—':v+' / 10';
  const row=(l,v)=>`<div class="d7-row"><span class="l">${l}</span><span class="v">${v}</span></div>`;
  const rows=isRpe
    ?row(L.rpeLbl,sv(t.rpe))+row(L.durLbl,t.duration!=null?t.duration+'′':'—')+row(L.loadLbl,t.load!=null?t.load+' AU':'—')
    :row(L.sleep,sv(t.sleep_quality))+row(L.mood,sv(t.mood))+row(L.energy,sv(t.fatigue))+row(L.stress,sv(t.stress))+row(L.soreness,sv(t.soreness));
  const cols=`grid-template-columns:repeat(${n},1fr)`;
  app.innerHTML=`<div class="done-wrap"><i class="ti ti-circle-check big"></i><div class="hl">${hl}</div><div class="sub">${sub}</div>`+
    nextHtml()+
    `<div class="d7-card"><div class="d7-head"><span class="t">${L.last7}</span><span class="s">${isRpe?L.loadLbl:L.readiness}</span></div>`+
    `<div class="d7-bars" style="${cols}">${bars}</div><div class="d7-lbls" style="${cols}">${lbls}</div>`+
    `<div class="d7-rows">${rows}</div></div></div>`;
}
init();
</script>
</body>
</html>
