<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Check-in · ClavaMetrics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--sans:'Inter',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--green:#15803D;--green-d:#4ADE80}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100vh;min-height:100dvh}
  body{font-family:var(--sans);background:linear-gradient(180deg,#0A0A0A 0%,#111 100%);color:#EDEDED}
  .ph{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:32px}
  .ph-header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between}
  .ph-header .date{font:500 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#9CA3AF}
  .ph-header .avatar{width:34px;height:34px;border-radius:50%;background:rgba(74,222,128,.18);color:var(--green-d);display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--sans);border:1px solid rgba(74,222,128,.30)}
  .ph-hero{padding:4px 22px 20px}
  .ph-hero .eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);margin-bottom:10px;display:inline-flex;align-items:center;gap:6px}
  .ph-hero .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .ph-hero h1{font:600 28px/1.1 var(--sans);letter-spacing:-.02em;color:#fff;margin-bottom:6px}
  .ph-hero p{font:400 14px/1.45 var(--sans);color:#9CA3AF}
  .ph-section{padding:0 22px;margin-bottom:22px}
  .ph-section .q-label{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ph-section .q-label .ic{width:28px;height:28px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .ph-section .q-label .title{font:600 15px/1.2 var(--sans);color:#fff;flex:1}
  .ph-section .q-label .val{font:600 14px/1 var(--mono);color:var(--green-d)}
  .ph-scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .ph-scale button{appearance:none;border:0;height:38px;border-radius:8px;background:rgba(255,255,255,.05);color:#9CA3AF;font:600 13px/1 var(--mono);cursor:pointer;transition:.12s}
  .ph-scale button.is-on{background:var(--green-d);color:#0A0A0A;transform:scale(1.06);box-shadow:0 4px 12px rgba(74,222,128,.30)}
  .ph-scale-ends{display:flex;justify-content:space-between;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#9CA3AF;margin-top:6px}
  .ph-body-row{display:flex;flex-wrap:wrap;gap:6px}
  .ph-body-chip{appearance:none;border:1px solid rgba(255,255,255,.12);background:transparent;padding:8px 13px;border-radius:999px;font:500 12.5px/1 var(--sans);color:#9CA3AF;cursor:pointer}
  .ph-body-chip.is-on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:12px;color:#EDEDED;padding:12px;font-family:inherit;font-size:14px;resize:vertical;min-height:64px}
  .ph-cta{margin:auto 22px 0;padding-top:8px}
  .ph-cta button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--green-d);color:#0A0A0A;font:700 16px/1 var(--sans);cursor:pointer}
  .ph-cta button:disabled{opacity:.5}
  .players{padding:0 22px;display:flex;flex-direction:column;gap:8px}
  .player-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;color:#EDEDED;font:600 16px/1 var(--sans);cursor:pointer}
  .player-btn .av{width:36px;height:36px;border-radius:50%;background:rgba(74,222,128,.18);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .back{background:none;border:0;color:#9CA3AF;font:500 13px/1 var(--sans);cursor:pointer;display:flex;align-items:center;gap:4px;padding:0 22px;margin-bottom:14px}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;color:#9CA3AF;padding:22px}
  .center .big{font-size:52px;color:var(--green-d)}
  .center .t{font:600 20px/1.3 var(--sans);color:#fff}
  .spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--green-d);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ph" id="app"><div class="center"><div class="spinner"></div></div></div>
<script>
const T={
  en:{invalid:'Invalid link',expired:'This link has expired or been revoked.',notoken:'Missing token in the link.',
    eyebrow:'Daily check-in',who:'Who are you?',whoSub:'Tap your name to start.',notme:n=>"I'm not "+n,
    hi:n=>'Hi, '+n+'.',formSub:'Tell us how you slept and feel. 40 seconds.',rpeSub:'Rate your effort from 1 to 10.',
    sleep:'Sleep quality',mood:'Mood',energy:'Energy',stress:'Stress',soreness:'Muscle soreness',rpeTitle:'How hard was the session?',
    e_sleep:['Poor','Excellent'],e_mood:['Low','High'],e_energy:['Exhausted','Full'],e_stress:['Calm','Stressed'],e_soreness:['None','A lot'],e_rpe:['Very easy','Maximal'],
    soreQ:'Any soreness?',note:'Note (optional)',notePh:"Anything to add…",send:'Send',sending:'Sending…',retry:'Retry',sendErr:'Could not send: ',
    done:n=>'Done, '+n+'!',doneSub:'Your check-in was recorded. Thanks.',
    parts:{hamstring:'Hamstring',quads:'Quads',calves:'Calves',groin:'Groin',knee:'Knee',ankle:'Ankle',shoulder:'Shoulder',back:'Lower back'}},
  es:{invalid:'Link no válido',expired:'Este link expiró o fue revocado.',notoken:'Falta el token en el link.',
    eyebrow:'Check-in diario',who:'¿Quién sos?',whoSub:'Tocá tu nombre para empezar.',notme:n=>'No soy '+n,
    hi:n=>'Hola, '+n+'.',formSub:'Contanos cómo dormiste y cómo te sentís. 40 segundos.',rpeSub:'Calificá tu esfuerzo del 1 al 10.',
    sleep:'Calidad de sueño',mood:'Ánimo',energy:'Energía',stress:'Estrés',soreness:'Dolor muscular',rpeTitle:'¿Qué tan duro fue el entrenamiento?',
    e_sleep:['Mala','Excelente'],e_mood:['Bajo','Alto'],e_energy:['Agotado','Pleno'],e_stress:['Tranquilo','Estresado'],e_soreness:['Ninguno','Mucho'],e_rpe:['Muy suave','Máximo'],
    soreQ:'¿Alguna molestia?',note:'Nota (opcional)',notePh:'Algo que quieras agregar…',send:'Enviar',sending:'Enviando…',retry:'Reintentar',sendErr:'No se pudo enviar: ',
    done:n=>'¡Listo, '+n+'!',doneSub:'Tu check-in se registró. Gracias.',
    parts:{hamstring:'Isquios',quads:'Cuádriceps',calves:'Gemelos',groin:'Aductores',knee:'Rodilla',ankle:'Tobillo',shoulder:'Hombro',back:'Lumbares'}},
  pt:{invalid:'Link inválido',expired:'Este link expirou ou foi revogado.',notoken:'Falta o token no link.',
    eyebrow:'Check-in diário',who:'Quem é você?',whoSub:'Toque no seu nome para começar.',notme:n=>'Não sou '+n,
    hi:n=>'Olá, '+n+'.',formSub:'Conte como dormiu e se sente. 40 segundos.',rpeSub:'Avalie seu esforço de 1 a 10.',
    sleep:'Qualidade do sono',mood:'Humor',energy:'Energia',stress:'Estresse',soreness:'Dor muscular',rpeTitle:'Quão difícil foi o treino?',
    e_sleep:['Ruim','Excelente'],e_mood:['Baixo','Alto'],e_energy:['Exausto','Pleno'],e_stress:['Calmo','Estressado'],e_soreness:['Nenhuma','Muita'],e_rpe:['Muito leve','Máximo'],
    soreQ:'Alguma dor?',note:'Nota (opcional)',notePh:'Algo a adicionar…',send:'Enviar',sending:'Enviando…',retry:'Tentar de novo',sendErr:'Não foi possível enviar: ',
    done:n=>'Pronto, '+n+'!',doneSub:'Seu check-in foi registrado. Obrigado.',
    parts:{hamstring:'Isquiotibiais',quads:'Quadríceps',calves:'Panturrilhas',groin:'Adutores',knee:'Joelho',ankle:'Tornozelo',shoulder:'Ombro',back:'Lombar'}}
};
const _n=(navigator.language||'en').toLowerCase();
// Idioma del survey. Hoy la app está en inglés → forzamos 'en'.
// Futuro: null = auto-detectar por dispositivo · 'es'/'pt' = forzar ese idioma.
const SURVEY_LANG='en';
const L=T[SURVEY_LANG || (_n.startsWith('es')?'es':_n.startsWith('pt')?'pt':'en')];
const SB_URL='https://xesrumijvdmqjrufgeka.supabase.co';
const SB_KEY='sb_publishable_p4DBCWsAm9u-Wf5-_CP-Yw_MYh_3cR6';
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app');
const token=new URLSearchParams(location.search).get('token');
let players=[],picked=null,scope='wellness';
const state={sleepQ:7,mood:7,fatigue:5,stress:3,soreness:3,rpe:6,body:new Set(),note:''};
const today=new Date().toLocaleDateString(L===T.en?'en-GB':'es-ES',{weekday:'long',day:'numeric',month:'short'});

function show404(msg){app.innerHTML=`<div class="center"><i class="ti ti-link-off big"></i><div class="t">${L.invalid}</div><div>${msg||L.expired}</div></div>`;}
function header(){return `<div class="ph-header"><span class="date">${today}</span>${picked?`<span class="avatar">${(picked.name[0]||'?').toUpperCase()}</span>`:''}</div>`;}

async function init(){
  if(!token){show404(L.notoken);return;}
  const meta=await sb.rpc('get_survey_meta',{p_token:token});
  if(meta.error||!meta.data?.valid){show404(meta.error?.message);return;}
  scope=meta.data.scope;
  const {data,error}=await sb.rpc('get_survey_players',{p_token:token});
  if(error||!data||!data.length){show404(error?.message);return;}
  players=data;renderPick();
}
function renderPick(){
  app.innerHTML=header()+
    `<div class="ph-hero"><span class="eyebrow"><span class="dot"></span>${L.eyebrow}</span><h1>${L.who}</h1><p>${L.whoSub}</p></div>`+
    `<div class="players">`+players.map((p,i)=>`<button class="player-btn" data-i="${i}"><span class="av">${(p.name[0]||'?').toUpperCase()}</span>${p.name}</button>`).join('')+`</div>`;
  app.querySelectorAll('.player-btn').forEach(b=>b.onclick=()=>{picked=players[+b.dataset.i];renderForm();});
}
function scaleHtml(key,icon,label,ends){
  return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ${icon}"></i></span><span class="title">${label}</span><span class="val" id="v_${key}">${state[key]}</span></div>
    <div class="ph-scale" id="sc_${key}">`+[...Array(10)].map((_,i)=>`<button class="${state[key]===i+1?'is-on':''}" onclick="setScale('${key}',${i+1})">${i+1}</button>`).join('')+`</div>
    <div class="ph-scale-ends"><span>${ends[0]}</span><span>${ends[1]}</span></div></div>`;
}
function bodyHtml(){const parts=Object.keys(L.parts);
  return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ti-pin"></i></span><span class="title">${L.soreQ}</span></div>
    <div class="ph-body-row">`+parts.map(k=>`<button class="ph-body-chip" data-k="${k}" onclick="toggleBody('${k}',this)">${L.parts[k]}</button>`).join('')+`</div></div>`;
}
function noteHtml(){return `<div class="ph-section"><div class="q-label"><span class="ic"><i class="ti ti-message"></i></span><span class="title">${L.note}</span></div>
    <textarea placeholder="${L.notePh}" oninput="state.note=this.value"></textarea></div>`;}

function renderForm(){
  let body;
  if(scope==='rpe'){
    body=scaleHtml('rpe','ti-flame',L.rpeTitle,L.e_rpe)+bodyHtml()+noteHtml();
  }else{
    body=scaleHtml('sleepQ','ti-moon',L.sleep,L.e_sleep)+scaleHtml('mood','ti-mood-smile',L.mood,L.e_mood)+
         scaleHtml('fatigue','ti-battery-2',L.energy,L.e_energy)+scaleHtml('stress','ti-brain',L.stress,L.e_stress)+
         scaleHtml('soreness','ti-bandage',L.soreness,L.e_soreness)+bodyHtml()+noteHtml();
  }
  app.innerHTML=`<button class="back" onclick="renderPick()"><i class="ti ti-arrow-left"></i>${L.notme(picked.name)}</button>`+
    header()+`<div class="ph-hero"><span class="eyebrow"><span class="dot"></span>${L.eyebrow}</span><h1>${L.hi(picked.name.split(' ')[0])}</h1><p>${scope==='rpe'?L.rpeSub:L.formSub}</p></div>`+
    body+`<div class="ph-cta"><button id="submitBtn" onclick="submitForm()">${L.send}</button></div>`;
}
window.setScale=(k,v)=>{state[k]=v;document.getElementById('v_'+k).textContent=v;
  document.querySelectorAll('#sc_'+k+' button').forEach((b,i)=>b.classList.toggle('is-on',i+1===v));};
window.toggleBody=(k,el)=>{state.body.has(k)?state.body.delete(k):state.body.add(k);el.classList.toggle('is-on');};
window.submitForm=async()=>{
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent=L.sending;
  const payload=scope==='rpe'
    ?{rpe:state.rpe,body:[...state.body],note:state.note}
    :{sleepQ:state.sleepQ,mood:state.mood,fatigue:state.fatigue,stress:state.stress,soreness:state.soreness,body:[...state.body],note:state.note};
  const {data,error}=await sb.rpc('submit_survey',{p_token:token,p_player_id:picked.id,p_payload:payload});
  if(error||data?.error){btn.disabled=false;btn.textContent=L.retry;alert(L.sendErr+(error?.message||data?.error));return;}
  app.innerHTML=`<div class="center"><i class="ti ti-circle-check big"></i><div class="t">${L.done(picked.name.split(' ')[0])}</div><div>${L.doneSub}</div></div>`;
};
init();
</script>
</body>
</html>
