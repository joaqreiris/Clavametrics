            <button data-pclose style="background:transparent;border:0;cursor:pointer;color:var(--cm-fg-muted);font-size:18px"><i class="ti ti-x"></i></button>
          </div>
          <div data-plist style="overflow-y:auto;flex:1;padding:8px"></div>
        </div>`;
        document.body.appendChild(pov);
        const plist = pov.querySelector('[data-plist]');
        const psearch = pov.querySelector('[data-psearch]');
        const close = val => { pov.remove(); resolve(val); };

        const specialRow = (val, icon, label) => `<div data-pick="${val}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer${current===val?';background:var(--cm-bg-soft)':''}">
          <i class="ti ${icon}" style="font-size:16px;color:var(--cm-fg-muted);flex-shrink:0"></i>
          <div style="flex:1;min-width:0;font:500 13.5px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong)">${label}</div>
          ${current===val?'<i class="ti ti-check" style="font-size:16px;color:var(--cm-accent);flex-shrink:0"></i>':''}
        </div>`;
        const exRow = e => {
          const area = (e.field_width && e.field_height) ? e.field_width*e.field_height : null;
          const m2   = (area && e.players_count>0) ? Math.round(area/e.players_count) : null;
          const fieldStr = (e.field_width && e.field_height) ? `${e.field_width}×${e.field_height}m` : null;
          const meta = [e.players_count?tt('exlib.players_meta','{count} players',{count:e.players_count}):null, m2?`${m2} ${tt('exlib.m2_p','m²/p')}`:null, fieldStr].filter(Boolean).join(' · ');
          const sel = current===e.id;
          return `<div data-pick="${e.id}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer${sel?';background:var(--cm-bg-soft)':''}">
            <div style="flex:1;min-width:0"><div style="font:500 13.5px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong)">${esc(e.name)||tt('daily_planning.untitled','Untitled')}</div>${meta?`<div style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted);margin-top:4px">${meta}</div>`:''}</div>
            <i class="ti ${sel?'ti-check':'ti-plus'}" style="font-size:16px;color:var(--cm-accent);flex-shrink:0"></i>
          </div>`;
        };
        function render(){
          const q = (psearch.value||'').trim().toLowerCase();
          const fil = q ? exercises.filter(e => (e.name||'').toLowerCase().includes(q)) : exercises.slice();
          let html = '';
          if (!q) html += specialRow('', 'ti-circle-off', tt('exlib.opt_unmapped','— Unmapped —')) + specialRow('__ignore__', 'ti-eye-off', tt('exlib.ignore','Ignore'));
          html += fil.length ? fil.map(exRow).join('') : `<div style="padding:24px;text-align:center;color:var(--cm-fg-muted);font:var(--cm-body-sm)">${tt('exlib.no_exercises_found','No exercises found.')}</div>`;
          plist.innerHTML = html;
        }
        plist.addEventListener('click', ev => { const r = ev.target.closest('[data-pick]'); if (r) close(r.dataset.pick); });
        psearch.addEventListener('input', render);
        pov.addEventListener('click', ev => { if (ev.target === pov) close(null); });
        pov.querySelector('[data-pclose]').addEventListener('click', () => close(null));
        render();
        psearch.focus();
      });
    }

    // ── Capa 2: manual regrouping. Groups are a VIEW; only period_name→choice
    // matters at save time, so merge/split/move just shuffle names between groups.
    const MINIBTN_CSS = 'padding:2px 8px;border:1px solid var(--cm-border);border-radius:6px;background:var(--cm-bg);color:var(--cm-fg-muted);font:600 10px var(--cm-font-sans);cursor:pointer';
    const DIMINPUT_CSS = 'width:52px;padding:3px 6px;border:1px solid var(--cm-border);border-radius:6px;background:var(--cm-bg);color:var(--cm-fg-strong);font:600 10.5px var(--cm-font-mono)';
    let reassignedCount = 0;

    // ── Capa 3: structured identity — edit width/height/players of the target exercise.
    const dimsTouched = new Set();          // exercise_ids whose dims were edited → persisted on save
    const numOrNull = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
    // Where the dims editor writes: the target exercise (mapped) or a transient
    // object on the group (used by "Create exercise" to seed dims at creation).
    function dimTarget(g){
      if (g.choice && g.choice !== '__ignore__') return exercises.find(e => e.id === g.choice) || null;
      if (g.choice === '') return (g.newDims ||= { field_width:null, field_height:null, players_count:null });
      return null;
    }
    function m2text(t){
      const w = +t.field_width, h = +t.field_height, p = +t.players_count;
      return (w > 0 && h > 0 && p > 0) ? Math.round(w*h/p) : '—';
    }
    // Optional, non-forced hint parsed from the period names (e.g. "40X20", "4V4").
    function parseDimHints(g){
      const txt = ' ' + g.names.map(n => n.period_name).join('  ').toUpperCase() + ' ';
      let w=null, h=null, players=null;
      const pitchRe = /(\d{1,3})\s*[X×]\s*(\d{1,3})/g; let m;
      while ((m = pitchRe.exec(txt))) { const a=+m[1], b=+m[2]; if (a>12 || b>12) { w=a; h=b; break; } }   // pitch: a value > 12
      const pv = txt.match(/(\d{1,2})\s*(?:VS|V|-)\s*(\d{1,2})/);
      if (pv) players = (+pv[1]) + (+pv[2]);
      else { const xm = txt.match(/(\d{1,2})\s*[X×]\s*(\d{1,2})/); if (xm && +xm[1]<=12 && +xm[2]<=12) players = (+xm[1]) + (+xm[2]); }
      return (w != null || players != null) ? { w, h, players } : null;
    }
    function dimsEditorHtml(g, i){
      const t = dimTarget(g);
      if (!t) return '';
      const h = parseDimHints(g);
      const hintVal = `${h&&h.w!=null?`${h.w}×${h.h}`:''}${(h&&h.w!=null&&h.players!=null)?' · ':''}${h&&h.players!=null?`${h.players}p`:''}`;
      const hintBtn = h ? `<button type="button" data-dimhint="${i}" style="${MINIBTN_CSS}">${tt('exlib.use_from_name','Use {val} from name',{val:hintVal})}</button>` : '';
      return `<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 10.5px var(--cm-font-sans);color:var(--cm-fg-muted)">
        <label style="display:flex;align-items:center;gap:4px">${tt('exlib.dim_w','W')} <input data-dim="field_width"   data-gi="${i}" type="number" min="0" value="${t.field_width ?? ''}"   style="${DIMINPUT_CSS}"></label>
        <label style="display:flex;align-items:center;gap:4px">${tt('exlib.dim_h','H')} <input data-dim="field_height"  data-gi="${i}" type="number" min="0" value="${t.field_height ?? ''}"  style="${DIMINPUT_CSS}"></label>
        <label style="display:flex;align-items:center;gap:4px">${tt('exlib.pv_players','Players')} <input data-dim="players_count" data-gi="${i}" type="number" min="0" value="${t.players_count ?? ''}" style="${DIMINPUT_CSS}"></label>
        <span data-m2="${i}">${m2text(t)} ${tt('exlib.m2_p','m²/p')}</span>
        ${hintBtn}
      </div>`;
    }

    function recompute(g){
      if (!g.names.length) { g.repName=''; g.nInst=0; g.avgMin=0; g.key=''; return g; }
      const rep = g.names.slice().sort((a,b)=>(b.n_instances||0)-(a.n_instances||0))[0];
      g.repName = rep.period_name;
      g.nInst = g.names.reduce((s,n)=>s+(n.n_instances||0),0);
      const totMin = g.names.reduce((s,n)=>s+(+n.avg_minutes||0)*(n.n_instances||0),0);
      g.avgMin = g.nInst ? totMin/g.nInst : 0;
      g.key = normName(rep.period_name);
      return g;
    }
    function makeGroup(names, choice){
      return recompute({ names, repName:'', nInst:0, avgMin:0, choice: choice||'', mapped:false, expanded:false, msel:false });
    }
    function updateMergeBar(){
      const n = groups.filter(g=>g.msel).length;
      const btn = ov.querySelector('[data-merge]');
      if (!btn) return;
      btn.style.display = (n>=2 && activeTab !== 'ignored') ? '' : 'none';
      btn.textContent = tt('exlib.merge_selected_n','Merge selected ({count})',{count:n});
    }
    // Sugerencias pendientes (sin mapear + sugerencia cuyo exercise sigue existiendo).
    function pendingSuggestions(){ return groups.filter(g => g.choice === '' && g.suggest && exercises.some(e => e.id === g.suggest.id)); }
    function updateSuggBar(){
      const btn = ov.querySelector('[data-suggall]');
      if (!btn) return;
      const n = pendingSuggestions().length;
      btn.style.display = (n > 0 && activeTab !== 'ignored') ? '' : 'none';
      const lb = btn.querySelector('[data-suggall-label]');
      if (lb) lb.textContent = tt('exlib.accept_all_suggestions','Accept suggestions ({count})',{count:n});
    }
    // A) Merge ticked cards into one; destination = first explicit choice among them.
    function mergeSelected(){
      const idx = groups.map((g,i)=>g.msel?i:-1).filter(i=>i>=0);
      if (idx.length < 2) return;
      const target = groups[idx[0]];
      let chosen = '';
      for (const i of idx){ const c=groups[i].choice; if (c && c!=='__ignore__'){ chosen=c; break; } }
      if (!chosen && idx.some(i=>groups[i].choice==='__ignore__')) chosen='__ignore__';
      for (let k=1;k<idx.length;k++) target.names.push(...groups[idx[k]].names);
      target.choice = chosen; target.msel = false; target.expanded = true;
      recompute(target);
      idx.slice(1).sort((a,b)=>b-a).forEach(i=>groups.splice(i,1));
      modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.merged_groups','Merged {count} groups into "{name}" — confirm the variants below.',{count:idx.length,name:target.repName});
      paint();
    }
    // B) Split ticked names out of a group into a new, unassigned card.
    function splitOut(gi){
      const g = groups[gi];
      const checked = [...listEl.querySelectorAll(`[data-namesel="${gi}"]:checked`)].map(c=>c.value);
      if (!checked.length) { modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.tick_one_split','Tick at least one name to split out.'); return; }
      if (checked.length === g.names.length) { modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.cant_split_whole','Can’t split out the whole group — leave at least one name.'); return; }
      const moving = g.names.filter(n=>checked.includes(n.period_name));
      g.names = g.names.filter(n=>!checked.includes(n.period_name));
      recompute(g);
      const ng = makeGroup(moving, ''); ng.expanded = true;
      groups.splice(gi+1, 0, ng);
      reassignedCount += moving.length;
      modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.split_out_msg','Split out {count} name — assign them below.|Split out {count} names — assign them below.',{count:moving.length});
      paint();
    }
    // C) Move a single period_name to another exercise (its own new card).
    function moveName(gi, periodName, value){
      if (!value) return;
      const g = groups[gi];
      const n = g.names.find(x=>x.period_name===periodName);
      if (!n) return;
      reassignedCount += 1;
      if (g.names.length === 1) { g.choice = value; recompute(g); modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.moved','Moved "{name}".',{name:periodName}); paint(); return; }
      g.names = g.names.filter(x=>x.period_name!==periodName);
      recompute(g);
      groups.splice(gi+1, 0, makeGroup([n], value));
      modalMsg.style.color='var(--cm-fg-muted)'; modalMsg.textContent=tt('exlib.moved','Moved "{name}".',{name:periodName});
      paint();
    }

    function paint(){
      if (!groups.length) {
        listEl.innerHTML = `<div style="padding:36px;text-align:center;color:var(--cm-fg-muted)">${tt('exlib.no_period_data','No GPS period data yet. Sync from Catapult first.')}</div>`;
        updateMergeBar();
        return;
      }
      listEl.innerHTML = groups.map((g,i) => {
        const resolved = g.choice !== '';
        const single = g.names.length === 1;
        const variantsLine = `<div style="font:400 10.5px var(--cm-font-mono);color:var(--cm-fg-muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span>${tt('exlib.n_variants','{count} variant|{count} variants',{count:g.names.length})}${single?' · '+esc(g.names[0].period_name):''}</span>
          <button type="button" data-expand="${i}" style="${MINIBTN_CSS}">${g.expanded?tt('exlib.hide_names','Hide names'):tt('exlib.edit_names','Edit names')}</button>
        </div>`;
        const gps = groupGps(g);
        const gpsLine = gps ? `<div style="font:600 10.5px var(--cm-font-mono);margin-top:4px;color:${gps.absurd?'var(--cm-danger,#dc2626)':'var(--cm-fg-muted)'}">
          ${tt('exlib.gps_preview','GPS preview')} · ${Math.round(gps.tdPerMin)} m/min · ${Math.round(gps.tdAvgM)} m/session · ${tt('exlib.n_valid','{count} valid',{count:gps.n})}${gps.absurd?' · '+tt('exlib.unusually_high','⚠ Unusually high — likely mixed drills'):''}
        </div>` : '';
        const suggEx = (!resolved && g.suggest) ? exercises.find(e => e.id === g.suggest.id) : null;
        const suggLine = suggEx ? `<div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 11.5px var(--cm-font-sans);color:var(--cm-fg-muted)">
          <i class="ti ti-sparkles" style="font-size:13px;color:var(--cm-accent)"></i>
          <span>${tt('exlib.suggested_match','Suggested')}: <b style="color:var(--cm-fg-strong)">${esc(suggEx.name)}</b> · ${Math.round(g.suggest.score*100)}%</span>
          <button type="button" data-sugguse="${i}" style="${MINIBTN_CSS};color:var(--cm-accent);border-color:var(--cm-accent)">${tt('exlib.use_suggestion','Use')}</button>
          <button type="button" data-suggdrop="${i}" style="${MINIBTN_CSS}">${tt('exlib.dismiss','Dismiss')}</button>
        </div>` : '';
        const panel = g.expanded ? `<div style="margin-top:8px;padding:8px 10px;border:1px solid var(--cm-border);border-radius:8px;background:var(--cm-bg-soft,rgba(0,0,0,.02))">
          ${g.names.map(n => `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 0">
            <input type="checkbox" data-namesel="${i}" value="${esc(n.period_name)}">
            <span style="font:500 11px var(--cm-font-mono);color:var(--cm-fg)">${esc(n.period_name)} <span style="color:var(--cm-fg-muted)">· ${n.n_instances||0}×</span></span>
            <button type="button" data-moveone-btn="${i}" data-pn="${esc(n.period_name)}" style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--cm-border);border-radius:7px;background:var(--cm-bg);color:var(--cm-fg-muted);font:600 10.5px var(--cm-font-sans);cursor:pointer">${tt('exlib.move_to','Move to…')}<i class="ti ti-chevron-down" style="font-size:13px"></i></button>
          </div>`).join('')}
          <div style="margin-top:6px;display:flex;justify-content:flex-end">
            <button type="button" data-splitout="${i}" style="${MINIBTN_CSS}">${tt('exlib.split_out_selected','Split out selected →')}</button>
          </div>
        </div>` : '';
        return `<div data-search-row="${esc((g.key+' '+g.names.map(n=>n.period_name).join(' ')).toLowerCase())}" data-gi="${i}" style="padding:10px 0;border-bottom:1px solid var(--cm-border)${resolved?'':';background:var(--cm-warning-bg,rgba(245,158,11,.06))'}">
          <div style="display:grid;grid-template-columns:auto 1.4fr 1.4fr auto;gap:10px;align-items:center">
            <input type="checkbox" data-mergesel="${i}" ${g.msel?'checked':''} title="Select to merge">
            <div>
              <div style="font:600 12.5px var(--cm-font-sans);color:var(--cm-fg)">${esc(g.repName)}${resolved?'':' · <span style="color:var(--cm-warning,#b45309)">'+tt('exlib.unmapped','unmapped')+'</span>'}</div>
              <div style="font:400 10.5px var(--cm-font-mono);color:var(--cm-fg-muted)">${tt('exlib.n_instances','{count} instance|{count} instances',{count:g.nInst})} · ${tt('exlib.min_avg','~{min} min avg',{min:g.avgMin.toFixed(1)})}</div>
            </div>
            <button type="button" data-choice-btn="${i}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 9px;border:1px solid var(--cm-border);border-radius:8px;background:var(--cm-bg);color:${resolved?'var(--cm-fg-strong)':'var(--cm-fg-muted)'};font:inherit;cursor:pointer;text-align:left"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(choiceLabel(g.choice))}</span><i class="ti ti-chevron-down" style="font-size:15px;color:var(--cm-fg-muted);flex-shrink:0"></i></button>
            <button class="cm-btn is-outline is-sm" data-create="${i}" title="${tt('exlib.create_exercise_title','Create an exercise named &quot;{name}&quot; and map to it',{name:esc(g.repName)})}">${tt('exlib.create_exercise','Create exercise')}</button>
          </div>${suggLine}${dimsEditorHtml(g, i)}${gpsLine}${variantsLine}${panel}
        </div>`;
      }).join('');
      listEl.querySelectorAll('[data-choice-btn]').forEach(b => b.addEventListener('click', async () => {
        const i = +b.dataset.choiceBtn, val = await pickExercise(groups[i].choice);
        if (val === null) return;                 // cancelled → leave choice untouched
        groups[i].choice = val; paint();
      }));
      listEl.querySelectorAll('[data-create]').forEach(b => b.addEventListener('click', () => createForGroup(+b.dataset.create)));
      listEl.querySelectorAll('[data-sugguse]').forEach(b => b.addEventListener('click', () => {
        const g = groups[+b.dataset.sugguse]; if (!g || !g.suggest) return;
        g.choice = g.suggest.id; delete g.suggest; paint();
      }));
      listEl.querySelectorAll('[data-suggdrop]').forEach(b => b.addEventListener('click', () => {
        const g = groups[+b.dataset.suggdrop]; if (g) delete g.suggest; paint();
      }));
      listEl.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', () => { const g=groups[+b.dataset.expand]; g.expanded=!g.expanded; paint(); }));
      listEl.querySelectorAll('[data-mergesel]').forEach(c => c.addEventListener('change', () => { groups[+c.dataset.mergesel].msel = c.checked; updateMergeBar(); }));
      listEl.querySelectorAll('[data-splitout]').forEach(b => b.addEventListener('click', () => splitOut(+b.dataset.splitout)));
      listEl.querySelectorAll('[data-moveone-btn]').forEach(b => b.addEventListener('click', async () => {
        const val = await pickExercise('');
        if (val === null || val === '') return;   // cancelled / unmap → no move
        moveName(+b.dataset.moveoneBtn, b.dataset.pn, val);
      }));
      // Capa 3: structured dims — write live to the target, persist on save.
      listEl.querySelectorAll('[data-dim]').forEach(inp => inp.addEventListener('input', () => {
        const gi = +inp.dataset.gi, g = groups[gi], t = dimTarget(g); if (!t) return;
        t[inp.dataset.dim] = inp.value === '' ? null : Number(inp.value);
        if (g.choice && g.choice !== '__ignore__') dimsTouched.add(g.choice);
        const span = listEl.querySelector(`[data-m2="${gi}"]`); if (span) span.textContent = `${m2text(t)} ${tt('exlib.m2_p','m²/p')}`;
      }));
      listEl.querySelectorAll('[data-dimhint]').forEach(b => b.addEventListener('click', () => {
        const gi = +b.dataset.dimhint, g = groups[gi], t = dimTarget(g), h = parseDimHints(g); if (!t || !h) return;
        if (h.w != null) { t.field_width = h.w; t.field_height = h.h; }
        if (h.players != null) t.players_count = h.players;
        if (g.choice && g.choice !== '__ignore__') dimsTouched.add(g.choice);
        paint();
      }));
      updateMergeBar();
      updateSuggBar();
      updateTabs();
      applyFilter();
    }

    function applyFilter(){
      const q = (ov.querySelector('[data-search]').value || '').trim().toLowerCase();
      let shown = 0;
      listEl.querySelectorAll('[data-search-row]').forEach(el => {
        const g = groups[+el.dataset.gi];
        const isIgn = g && g.choice === '__ignore__';
        // Tab filter: 'active' hides ignored groups, 'ignored' shows only them.
        const tabOk = activeTab === 'ignored' ? isIgn : !isIgn;
        const textOk = !q || el.dataset.searchRow.includes(q);
        // Date filter: keep groups that have ≥1 period name with an instance in range.
        const dateOk = !inRangeNames || (g && g.names.some(n => inRangeNames.has(n.period_name)));
        const show = tabOk && textOk && dateOk;
        el.style.display = show ? '' : 'none';
        if (show) shown++;
      });
      // Empty-state for the current tab (distinct from "no period data at all").
      const emptyEl = ov.querySelector('[data-empty]');
      if (groups.length && !shown) {
        emptyEl.style.display = '';
        emptyEl.textContent = activeTab === 'ignored'
          ? tt('exlib.no_ignored','No ignored periods. Set a group to “Ignore” to hide it from here.')
          : tt('exlib.no_match','No drills match.');
      } else {
        emptyEl.style.display = 'none';
      }
    }
    // Tab switch (Active / Ignored) + ignored-count badge.
    function updateTabs(){
      const ignN = groups.filter(g => g.choice === '__ignore__').length;
      const badge = ov.querySelector('[data-ignct]');
      if (badge) badge.textContent = ignN ? `(${ignN})` : '';
      ov.querySelectorAll('[data-tab]').forEach(b => {
        const on = b.dataset.tab === activeTab;
        b.classList.toggle('is-ghost', !on);
      });
    }
    ov.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      activeTab = b.dataset.tab;
      // The merge bar only makes sense in the Active tab.
      const mb = ov.querySelector('[data-merge]'); if (mb && activeTab === 'ignored') mb.style.display = 'none';
      updateSuggBar();
      updateTabs(); applyFilter();
    }));
    ov.querySelector('[data-search]').addEventListener('input', applyFilter);

    // Date-range filter — acota la lista a períodos cuya SESIÓN cae en el rango.
    // inRangeNames = Set de period_names en rango, o null = sin filtro (All).
    let inRangeNames = null;
    async function loadInRangeNames(from, to){
      if (!from && !to) { inRangeNames = null; return; }
      const set = new Set(); let off = 0, page;
      do {
        let q = window.sb.from('gps_period_reports')
          .select('period_name, training_sessions!inner(session_date)')
          .eq('club_id', clubId);
        if (from) q = q.gte('training_sessions.session_date', from);
        if (to)   q = q.lte('training_sessions.session_date', to);
        const { data } = await q.range(off, off + 999);
        page = data || [];
        page.forEach(r => { if (r.period_name) set.add(r.period_name); });
        off += 1000;
      } while (page.length === 1000);
      inRangeNames = set;
    }
    window.CMDateRange.mount(ov.querySelector('[data-daterange]'), {
      presets: true, allLabel: tt('exlib.all_dates','All dates'), clubId,
      onChange: async ({ from, to }) => {
        modalMsg.style.color = 'var(--cm-fg-muted)'; modalMsg.textContent = tt('exlib.filtering','Filtering…');
        await loadInRangeNames(from, to);
        modalMsg.textContent = inRangeNames ? tt('exlib.showing_in_range','Showing periods with sessions in range.') : '';
        applyFilter();
      },
    });

    async function createForGroup(i){
      const g = groups[i];
      modalMsg.style.color = 'var(--cm-fg-muted)'; modalMsg.textContent = tt('exlib.creating_exercise','Creating exercise…');
      const d = g.newDims || {};               // dims seeded in the editor before creating
      const ins = { club_id: clubId, name: g.repName };
      if (numOrNull(d.field_width)   != null) ins.field_width   = numOrNull(d.field_width);
      if (numOrNull(d.field_height)  != null) ins.field_height  = numOrNull(d.field_height);
      if (numOrNull(d.players_count) != null) ins.players_count = numOrNull(d.players_count);
      const { data, error } = await window.sb.from('exercises')
        .insert(ins).select('id,name,field_width,field_height,players_count').single();
      if (error) { modalMsg.style.color = 'var(--cm-danger)'; modalMsg.textContent = tt('exlib.error_msg','Error: {msg}',{msg:error.message}); return; }
      exercises.push({ id: data.id, name: data.name, field_width: data.field_width, field_height: data.field_height, players_count: data.players_count });
      g.newDims = null;
      exercises.sort((a,b) => (a.name||'').localeCompare(b.name||''));
      createdCount++;
      g.choice = data.id;
      modalMsg.textContent = tt('exlib.created','Created "{name}".',{name:data.name});
      paint();
    }

    async function save(){
      const ups = [];
      let mappedN = 0, ignoredN = 0;
      groups.forEach(g => {
        if (g.choice === '') return;                       // sin elección → queda unmapped (no se pierde)
        const ignored = g.choice === '__ignore__';
        g.names.forEach(n => {
          ups.push({ club_id: clubId, period_name: n.period_name, exercise_id: ignored ? null : g.choice, ignored });
          if (ignored) ignoredN++; else mappedN++;
        });
      });
      const saveBtn = ov.querySelector('[data-save]');
      saveBtn.disabled = true; modalMsg.style.color = 'var(--cm-fg-muted)'; modalMsg.textContent = tt('common.saving','Saving…');
      if (ups.length) {
        const { error } = await window.sb.from('gps_drill_map').upsert(ups, { onConflict: 'club_id,period_name' });
        if (error) { modalMsg.style.color = 'var(--cm-danger)'; modalMsg.textContent = tt('exlib.error_msg','Error: {msg}',{msg:error.message}); saveBtn.disabled = false; return; }
      }
      // Capa 3: persist edited structured dimensions onto the target exercises.
      let dimsN = 0;
      for (const exId of dimsTouched) {
        const ex = exercises.find(e => e.id === exId); if (!ex) continue;
        const { error } = await window.sb.from('exercises')
          .update({ field_width: numOrNull(ex.field_width), field_height: numOrNull(ex.field_height), players_count: numOrNull(ex.players_count) })
          .eq('id', exId).eq('club_id', clubId);
        if (error) { modalMsg.style.color = 'var(--cm-danger)'; modalMsg.textContent = tt('exlib.error_saving_dims','Error saving dimensions: {msg}',{msg:error.message}); saveBtn.disabled = false; return; }
        dimsN++;
      }
      modalMsg.style.color = 'var(--cm-success,#16a34a)';
      modalMsg.textContent = tt('exlib.save_summary','{mapped} mapped · {created} created · {ignored} ignored · {reassigned} reassigned',{mapped:mappedN,created:createdCount,ignored:ignoredN,reassigned:reassignedCount}) + (dimsN ? tt('exlib.dims_saved_suffix',' · {count} dims saved',{count:dimsN}) : '') + '.';
      saveBtn.textContent = tt('exlib.done','Done'); saveBtn.disabled = false;
      saveBtn.onclick = () => ov.remove();
    }

    ov.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => ov.remove()));
    ov.querySelector('[data-save]').addEventListener('click', save);
    ov.querySelector('[data-merge]').addEventListener('click', mergeSelected);
    ov.querySelector('[data-suggall]').addEventListener('click', () => {
      const pend = pendingSuggestions();
      if (!pend.length) return;
      pend.forEach(g => { g.choice = g.suggest.id; delete g.suggest; });
      modalMsg.style.color = 'var(--cm-fg-muted)';
      modalMsg.textContent = tt('exlib.suggestions_applied','Applied {count} suggestion — review and save.|Applied {count} suggestions — review and save.',{count:pend.length});
      paint();
    });
    paint();
    loadGpsByName();   // async; re-paints with the GPS preview line when ready
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
