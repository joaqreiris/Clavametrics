<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>My nutrition plan — ClavaMetrics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/nutrition-calc.js"></script>
<style>
  :root{ --acc:#16A34A; --bg:#0b0f14; --card:#11161d; --line:#1f2730; --fg:#e7edf3; --mut:#8b97a5; --faint:#5b6673; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px}
  .head{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
  .head img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--card)}
  .head .club{font:600 13px/1.2 ui-monospace,monospace;color:var(--mut);letter-spacing:.02em}
  .head h1{font:700 22px/1.15 inherit;margin:3px 0 0;letter-spacing:-.02em}
  .head .pos{font:500 12px/1 ui-monospace,monospace;color:var(--faint);margin-top:4px}
  .sec{font:600 11px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:22px 4px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tg .t{display:flex;align-items:center;gap:9px}
  .tg .t i{width:30px;height:30px;border-radius:8px;background:rgba(22,163,74,.14);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:16px}
  .tg .t .l{font:500 11px/1.2 ui-monospace,monospace;color:var(--mut)}
  .tg .t .v{font:700 15px/1.1 inherit;margin-top:2px}
  .meal{display:flex;flex-direction:column;gap:8px}
  .meal-h{display:flex;align-items:center;gap:10px}
  .meal-h .ic{width:30px;height:30px;border-radius:8px;background:#1b232c;color:var(--mut);display:flex;align-items:center;justify-content:center}
  .meal-h .nm{font:600 14px/1.1 inherit}
  .meal-h .tm{font:500 11px/1 ui-monospace,monospace;color:var(--faint);margin-left:auto}
  .meal-h .kc{font:700 13px/1 ui-monospace,monospace;color:var(--acc)}
  .meal-items{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:9px}
  .it{display:flex;justify-content:space-between;gap:10px;font:500 13px/1.3 inherit}
  .it .q{color:var(--mut);font:500 12px/1 ui-monospace,monospace;white-space:nowrap}
  .mac{display:flex;gap:12px;font:500 11px/1 ui-monospace,monospace;color:var(--faint);margin-top:4px}
  .empty{text-align:center;padding:60px 20px;color:var(--mut)}
  .empty i{font-size:42px;color:var(--faint);display:block;margin-bottom:12px}
  .empty strong{display:block;font-size:17px;color:var(--fg);margin-bottom:6px}
  .foot{text-align:center;color:var(--faint);font:500 11px/1.4 ui-monospace,monospace;margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="main"><div class="empty"><i class="ti ti-loader"></i>Loading…</div></div>
<script>
(async () => {
  const SB_URL = 'https://xesrumijvdmqjrufgeka.supabase.co';
  const SB_KEY = 'sb_publishable_p4DBCWsAm9u-Wf5-_CP-Yw_MYh_3cR6';
  const sb = supabase.createClient(SB_URL, SB_KEY);
  const NC = window.nutriCalc;
  const main = document.getElementById('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const mealIcon = name => {
    const n = (name || '').toLowerCase();
    if (n.includes('break')) return 'ti-coffee';
    if (n.includes('lunch')) return 'ti-bowl';
    if (n.includes('dinner')) return 'ti-moon';
    if (n.includes('snack')) return 'ti-apple';
    if (n.includes('train') || n.includes('pre') || n.includes('post')) return 'ti-bolt';
    return 'ti-tools-kitchen-2';
  };
  const show = (icon, title, msg) => {
    main.innerHTML = `<div class="empty"><i class="ti ${icon}"></i><strong>${title}</strong>${msg || ''}</div>`;
  };

  const token = new URLSearchParams(location.search).get('token');
  if (!token) { show('ti-link-off', 'No link', 'This URL is missing its token.'); return; }

  const { data, error } = await sb.rpc('get_shared_nutrition', { p_token: token });
  if (error || !data || data.error) { show('ti-lock', 'Plan not available', 'This link has expired or been revoked.'); return; }

  const club = data.club || {}, player = data.player || {}, t = data.target, plan = data.plan;
  if (club.primary_color) document.documentElement.style.setProperty('--acc', club.primary_color);
  document.title = `${player.name || 'Nutrition plan'} — ${club.name || 'ClavaMetrics'}`;

  let html = `<div class="head">
    ${club.logo_url ? `<img src="${esc(club.logo_url)}" alt="">` : ''}
    <div><div class="club">${esc(club.name || '')}</div>
      <h1>${esc(player.name || 'Player')}</h1>
      <div class="pos">${player.number ? '#' + esc(player.number) + ' · ' : ''}${esc(player.position || '')}</div></div>
  </div>`;

  if (t) {
    const water = t.hydration_ml ? (t.hydration_ml / 1000).toFixed(1) + ' L' : '—';
    html += `<div class="sec">Daily targets</div><div class="card"><div class="tg">
      <div class="t"><i class="ti ti-flame"></i><div><div class="l">Calories</div><div class="v">${t.kcal_target ? Math.round(t.kcal_target).toLocaleString() + ' kcal' : '—'}</div></div></div>
      <div class="t"><i class="ti ti-droplet"></i><div><div class="l">Hydration</div><div class="v">${water}</div></div></div>
      <div class="t"><i class="ti ti-meat"></i><div><div class="l">Protein</div><div class="v">${t.protein_g != null ? Math.round(t.protein_g) + ' g' : '—'}</div></div></div>
      <div class="t"><i class="ti ti-bread"></i><div><div class="l">Carbs</div><div class="v">${t.carbs_g != null ? Math.round(t.carbs_g) + ' g' : '—'}</div></div></div>
      <div class="t"><i class="ti ti-egg"></i><div><div class="l">Fat</div><div class="v">${t.fats_g != null ? Math.round(t.fats_g) + ' g' : '—'}</div></div></div>
      <div class="t"><i class="ti ti-target"></i><div><div class="l">Body fat goal</div><div class="v">${t.body_fat_target_pct != null ? t.body_fat_target_pct + '%' : '—'}</div></div></div>
    </div></div>`;
  }

  if (plan && (plan.meals || []).length) {
    html += `<div class="sec">Meal plan${plan.name ? ' · ' + esc(plan.name) : ''}</div>`;
    plan.meals.forEach(m => {
      const items = (m.items || []);
      const tot = NC.sumMacros(items.map(it => NC.macrosForQuantity(it, it.quantity_g)));
      html += `<div class="card meal">
        <div class="meal-h"><div class="ic"><i class="ti ${mealIcon(m.name)}"></i></div>
          <div class="nm">${esc(m.name)}</div>
          ${m.time_hint ? `<div class="tm">${esc(m.time_hint)}</div>` : ''}
          <div class="kc"${m.time_hint ? ' style="margin-left:10px"' : ' style="margin-left:auto"'}>${Math.round(tot.kcal)} kcal</div></div>
        <div class="meal-items">${items.map(it => `<div class="it"><span>${esc(it.food_name)}</span><span class="q">${Math.round(it.quantity_g)} g</span></div>`).join('') || '<div class="it"><span class="q">No items</span></div>'}</div>
        <div class="mac"><span>C ${Math.round(tot.carbs_g)}g</span><span>P ${Math.round(tot.protein_g)}g</span><span>F ${Math.round(tot.fats_g)}g</span></div>
      </div>`;
    });
  } else if (!t) {
    html += `<div class="empty"><i class="ti ti-salad"></i><strong>No plan yet</strong>Your nutritionist hasn't published a plan here yet.</div>`;
  } else {
    html += `<div class="sec">Meal plan</div><div class="card"><div class="it"><span class="q">No meal plan assigned yet.</span></div></div>`;
  }

  html += `<div class="foot">Shared by your club via ClavaMetrics · for your eyes only</div>`;
  main.innerHTML = html;
})();
</script>
</body>
</html>
