<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>My nutrition plan — ClavaMetrics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/nutrition-calc.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sh-bg:     #F8FAFC;
    --sh-surf:   #FFFFFF;
    --sh-border: #E2E8F0;
    --sh-fg:     #0F172A;
    --sh-fg-2:   #475569;
    --sh-fg-3:   #94A3B8;
    --sh-accent: #2563EB;
    --sh-accent-soft: #EFF6FF;
    --sh-r:      12px;
    --sh-font:   -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sh-mono:   'SF Mono', 'Fira Code', ui-monospace, monospace;
  }
  body { background: var(--sh-bg); color: var(--sh-fg); font-family: var(--sh-font); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* Header */
  .sh-header { background: var(--sh-surf); border-bottom: 1px solid var(--sh-border); padding: 14px 20px; display: flex; align-items: center; gap: 13px; position: sticky; top: 0; z-index: 10; }
  .sh-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: contain; border: 1px solid var(--sh-border); background: var(--sh-surf); flex-shrink: 0; padding: 3px; }
  .sh-logo-fb { width: 42px; height: 42px; border-radius: 50%; background: var(--sh-accent-soft); border: 1px solid var(--sh-border); display: flex; align-items: center; justify-content: center; font: 700 15px/1 var(--sh-font); color: var(--sh-accent); flex-shrink: 0; }
  .sh-club { font: 700 15px/1.2 var(--sh-font); color: var(--sh-fg); }
  .sh-sub { font: 500 11.5px/1.3 var(--sh-mono); color: var(--sh-fg-3); margin-top: 2px; }

  /* Content */
  .sh-main { padding: 22px 16px 64px; max-width: 600px; margin: 0 auto; }
  .sh-player { margin: 2px 2px 20px; }
  .sh-player h1 { font: 700 24px/1.1 var(--sh-font); letter-spacing: -0.02em; color: var(--sh-fg); }
  .sh-player .meta { font: 500 12.5px/1 var(--sh-mono); color: var(--sh-fg-3); margin-top: 6px; }

  .sh-sec { font: 700 11px/1 var(--sh-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--sh-fg-3); margin: 24px 4px 11px; }

  /* Targets */
  .sh-card { background: var(--sh-surf); border: 1px solid var(--sh-border); border-radius: var(--sh-r); padding: 15px 16px; margin-bottom: 11px; }
  .sh-targets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
  .sh-t { display: flex; align-items: center; gap: 10px; }
  .sh-t i { width: 34px; height: 34px; border-radius: 9px; background: var(--sh-accent-soft); color: var(--sh-accent); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .sh-t .l { font: 500 11px/1.2 var(--sh-mono); color: var(--sh-fg-3); }
  .sh-t .v { font: 700 15px/1.1 var(--sh-font); color: var(--sh-fg); margin-top: 3px; }

  /* Meals */
  .sh-meal { display: flex; flex-direction: column; gap: 10px; }
  .sh-meal-h { display: flex; align-items: center; gap: 11px; }
  .sh-meal-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--sh-bg); color: var(--sh-fg-2); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .sh-meal-nm { font: 700 14.5px/1.1 var(--sh-font); color: var(--sh-fg); }
  .sh-meal-tm { font: 500 11px/1 var(--sh-mono); color: var(--sh-fg-3); }
  .sh-meal-kc { font: 700 13px/1 var(--sh-mono); color: var(--sh-accent); margin-left: auto; }
  .sh-items { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--sh-border); padding-top: 11px; }
  .sh-it { display: flex; justify-content: space-between; gap: 12px; font: 500 13.5px/1.3 var(--sh-font); color: var(--sh-fg); }
  .sh-it .q { color: var(--sh-fg-3); font: 500 12px/1 var(--sh-mono); white-space: nowrap; }
  .sh-mac { display: flex; gap: 14px; font: 600 11px/1 var(--sh-mono); color: var(--sh-fg-3); }
  .sh-mac b { color: var(--sh-fg-2); font-weight: 700; }

  /* States */
  .sh-empty { text-align: center; padding: 64px 20px; color: var(--sh-fg-2); }
  .sh-empty i { font-size: 44px; color: var(--sh-fg-3); display: block; margin-bottom: 14px; }
  .sh-empty strong { display: block; font: 700 18px/1.2 var(--sh-font); color: var(--sh-fg); margin-bottom: 6px; }
  .sh-empty span { font: 500 13.5px/1.5 var(--sh-font); }
  .sh-foot { text-align: center; color: var(--sh-fg-3); font: 500 11px/1.4 var(--sh-mono); margin-top: 34px; }
</style>
</head>
<body>
<div id="main"><div class="sh-empty"><i class="ti ti-loader-2"></i>Loading…</div></div>
<script>
(async () => {
  const SB_URL = 'https://xesrumijvdmqjrufgeka.supabase.co';
  const SB_KEY = 'sb_publishable_p4DBCWsAm9u-Wf5-_CP-Yw_MYh_3cR6';
  const sb = supabase.createClient(SB_URL, SB_KEY);
  const NC = window.nutriCalc;
  const main = document.getElementById('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const initials = s => (s || 'C').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const mealIcon = name => {
    const n = (name || '').toLowerCase();
    if (n.includes('break')) return 'ti-coffee';
    if (n.includes('lunch')) return 'ti-bowl';
    if (n.includes('dinner')) return 'ti-moon';
    if (n.includes('snack')) return 'ti-apple';
    if (n.includes('train') || n.includes('pre') || n.includes('post')) return 'ti-bolt';
    return 'ti-tools-kitchen-2';
  };
  const showState = (icon, title, msg) => {
    main.innerHTML = `<div class="sh-empty"><i class="ti ${icon}"></i><strong>${title}</strong><span>${msg || ''}</span></div>`;
  };

  const token = new URLSearchParams(location.search).get('token');
  if (!token) { showState('ti-link-off', 'No link', 'This URL is missing its token.'); return; }

  const { data, error } = await sb.rpc('get_shared_nutrition', { p_token: token });
  if (error || !data || data.error) { showState('ti-lock', 'Plan not available', 'This link has expired or been revoked.'); return; }

  const club = data.club || {}, player = data.player || {}, t = data.target, plan = data.plan;
  if (club.primary_color) {
    document.documentElement.style.setProperty('--sh-accent', club.primary_color);
    document.documentElement.style.setProperty('--sh-accent-soft', `color-mix(in srgb, ${club.primary_color} 11%, #FFFFFF)`);
  }
  document.title = `${player.name || 'Nutrition plan'} — ${club.name || 'ClavaMetrics'}`;

  const logo = club.logo_url
    ? `<img class="sh-logo" src="${esc(club.logo_url)}" alt="">`
    : `<div class="sh-logo-fb">${initials(club.name)}</div>`;

  let html = `<header class="sh-header">${logo}
    <div><div class="sh-club">${esc(club.name || 'ClavaMetrics')}</div><div class="sh-sub">Nutrition plan</div></div>
  </header>
  <main class="sh-main">
    <div class="sh-player"><h1>${esc(player.name || 'Player')}</h1>
      <div class="meta">${player.number ? '#' + esc(player.number) : ''}${player.number && player.position ? ' · ' : ''}${esc(player.position || '')}</div></div>`;

  if (t) {
    const water = t.hydration_ml ? (t.hydration_ml / 1000).toFixed(1) + ' L' : '—';
    html += `<div class="sh-sec">Daily targets</div><div class="sh-card"><div class="sh-targets">
      <div class="sh-t"><i class="ti ti-flame"></i><div><div class="l">Calories</div><div class="v">${t.kcal_target ? Math.round(t.kcal_target).toLocaleString() + ' kcal' : '—'}</div></div></div>
      <div class="sh-t"><i class="ti ti-droplet"></i><div><div class="l">Hydration</div><div class="v">${water}</div></div></div>
      <div class="sh-t"><i class="ti ti-meat"></i><div><div class="l">Protein</div><div class="v">${t.protein_g != null ? Math.round(t.protein_g) + ' g' : '—'}</div></div></div>
      <div class="sh-t"><i class="ti ti-bread"></i><div><div class="l">Carbs</div><div class="v">${t.carbs_g != null ? Math.round(t.carbs_g) + ' g' : '—'}</div></div></div>
      <div class="sh-t"><i class="ti ti-egg"></i><div><div class="l">Fat</div><div class="v">${t.fats_g != null ? Math.round(t.fats_g) + ' g' : '—'}</div></div></div>
      <div class="sh-t"><i class="ti ti-target"></i><div><div class="l">Body fat goal</div><div class="v">${t.body_fat_target_pct != null ? t.body_fat_target_pct + '%' : '—'}</div></div></div>
    </div></div>`;
  }

  if (plan && (plan.meals || []).length) {
    html += `<div class="sh-sec">Meal plan${plan.name ? ' · ' + esc(plan.name) : ''}</div>`;
    plan.meals.forEach(m => {
      const items = (m.items || []);
      const tot = NC.sumMacros(items.map(it => NC.macrosForQuantity(it, it.quantity_g)));
      html += `<div class="sh-card sh-meal">
        <div class="sh-meal-h"><div class="sh-meal-ic"><i class="ti ${mealIcon(m.name)}"></i></div>
          <div><div class="sh-meal-nm">${esc(m.name)}</div>${m.time_hint ? `<div class="sh-meal-tm">${esc(m.time_hint)}</div>` : ''}</div>
          <div class="sh-meal-kc">${Math.round(tot.kcal)} kcal</div></div>
        <div class="sh-items">${items.map(it => `<div class="sh-it"><span>${esc(it.food_name)}</span><span class="q">${Math.round(it.quantity_g)} g</span></div>`).join('') || '<div class="sh-it"><span class="q">No items</span></div>'}</div>
        <div class="sh-mac"><span><b>C</b> ${Math.round(tot.carbs_g)}g</span><span><b>P</b> ${Math.round(tot.protein_g)}g</span><span><b>F</b> ${Math.round(tot.fats_g)}g</span></div>
      </div>`;
    });
  } else if (!t) {
    html += `<div class="sh-empty"><i class="ti ti-salad"></i><strong>No plan yet</strong><span>Your nutritionist hasn't published a plan here yet.</span></div>`;
  } else {
    html += `<div class="sh-sec">Meal plan</div><div class="sh-card"><div class="sh-it"><span class="q">No meal plan assigned yet.</span></div></div>`;
  }

  html += `<div class="sh-foot">Shared by your club via ClavaMetrics · for your eyes only</div></main>`;
  main.innerHTML = html;
})();
</script>
</body>
</html>
