<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">ClavaMetrics × Catapult — del token al dashboard</text>
  <text x="40" y="78" font-size="15" fill="#64748b">Cómo fluye el dato GPS, de punta a punta</text>
  <g transform="translate(1010,34)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="20" cy="15" r="5" fill="#FF5500"/>
    <text x="34" y="20" font-size="13" fill="#9a3412">Fuente: tu cuenta OpenField</text>
  </g>

  <!-- ===================== ZONE A: SETUP ===================== -->
  <rect x="30" y="100" width="1220" height="252" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <g transform="translate(52,128)">
    <circle cx="9" cy="-4" r="11" fill="#2563eb"/>
    <text x="9" y="0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="30" y="1" font-size="15" font-weight="700" letter-spacing="0.5" fill="#1d4ed8">CONFIGURACIÓN — una sola vez por club</text>
  </g>

  <!-- Card 1 -->
  <g transform="translate(55,152)" filter="url(#sh)">
    <rect width="375" height="182" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="30" cy="32" r="15" fill="#dbeafe"/>
    <text x="30" y="37" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">1</text>
    <text x="58" y="30" font-size="17" font-weight="700" fill="#0f172a">Conectar la API</text>
    <text x="58" y="49" font-size="12" font-weight="600" fill="#94a3b8">acción: “Verify”</text>
    <line x1="22" y1="66" x2="353" y2="66" stroke="#f1f5f9"/>
    <text x="22" y="92" font-size="13.5" fill="#334155">• Pegás el token de tu cuenta</text>
    <text x="22" y="116" font-size="13.5" fill="#334155">• Elegís la región (AU)</text>
    <text x="22" y="140" font-size="13.5" fill="#334155">• Catapult responde → queda…</text>
    <g transform="translate(22,154)">
      <rect width="118" height="22" rx="11" fill="#dcfce7"/>
      <text x="59" y="16" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">CONNECTED</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(452,152)" filter="url(#sh)">
    <rect width="375" height="182" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="30" cy="32" r="15" fill="#dbeafe"/>
    <text x="30" y="37" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">2</text>
    <text x="58" y="30" font-size="17" font-weight="700" fill="#0f172a">Mapear atletas</text>
    <text x="58" y="49" font-size="12" font-weight="600" fill="#94a3b8">acción: “Map athletes”</text>
    <line x1="22" y1="66" x2="353" y2="66" stroke="#f1f5f9"/>
    <text x="22" y="92" font-size="13.5" fill="#334155">• Catapult usa su athlete_id</text>
    <text x="22" y="116" font-size="13.5" fill="#334155">• Lo unís a cada jugador tuyo</text>
    <text x="22" y="140" font-size="13.5" fill="#334155">• Se guarda el puente:</text>
    <text x="22" y="164" font-size="13" font-weight="600" fill="#2563eb">athlete_id  ↔  tu jugador</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(850,152)" filter="url(#sh)">
    <rect width="375" height="182" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="30" cy="32" r="15" fill="#dbeafe"/>
    <text x="30" y="37" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">3</text>
    <text x="58" y="30" font-size="17" font-weight="700" fill="#0f172a">Mapear métricas</text>
    <text x="58" y="49" font-size="12" font-weight="600" fill="#94a3b8">acción: “Map metrics”</text>
    <line x1="22" y1="66" x2="353" y2="66" stroke="#f1f5f9"/>
    <text x="22" y="92" font-size="13.5" fill="#334155">• Cada métrica de Catapult…</text>
    <text x="22" y="116" font-size="13" font-weight="600" fill="#2563eb">slug Catapult ↔ tu métrica (+ unidad)</text>
    <text x="22" y="140" font-size="13.5" fill="#334155">• Las 13 base, automáticas</text>
    <text x="22" y="164" font-size="13.5" fill="#334155">• El resto lo mapeás una vez</text>
  </g>

  <!-- arrows within setup -->
  <line x1="430" y1="243" x2="450" y2="243" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="827" y1="243" x2="848" y2="243" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transition pill + down arrow -->
  <line x1="640" y1="352" x2="640" y2="398" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <g transform="translate(560,360)">
    <rect width="160" height="28" rx="14" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="80" y="19" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">Configurado ✓ — listo</text>
  </g>

  <!-- ===================== ZONE B: USE ===================== -->
  <rect x="30" y="408" width="1220" height="300" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <g transform="translate(52,436)">
    <circle cx="9" cy="-4" r="11" fill="#059669"/>
    <text x="9" y="0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="30" y="1" font-size="15" font-weight="700" letter-spacing="0.5" fill="#047857">USO — cada vez que querés datos</text>
  </g>

  <!-- Card 4: Sync engine -->
  <g transform="translate(55,460)" filter="url(#sh)">
    <rect width="765" height="226" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="32" cy="34" r="16" fill="#d1fae5"/>
    <text x="32" y="39" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">4</text>
    <text x="60" y="32" font-size="18" font-weight="700" fill="#0f172a">Sincronizar</text>
    <text x="60" y="51" font-size="12" font-weight="600" fill="#94a3b8">acción: “Sync now”  ·  el motor</text>
    <g transform="translate(560,18)">
      <rect width="178" height="26" rx="13" fill="#fef9c3"/>
      <text x="89" y="18" font-size="11.5" font-weight="700" fill="#854d0e" text-anchor="middle">repetís cuando querés ↻</text>
    </g>
    <line x1="24" y1="68" x2="741" y2="68" stroke="#f1f5f9"/>

    <text x="28" y="98" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#059669">a.</tspan>  Trae las actividades (sesiones) del rango de fechas</text>
    <text x="28" y="126" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#059669">b.</tspan>  Crea / encuentra esa sesión en tu calendario</text>
    <text x="28" y="154" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#059669">c.</tspan>  Traduce:  atleta → jugador   ·   métrica → tu nombre + unidad</text>
    <text x="28" y="182" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#059669">d.</tspan>  Guarda en tu base de datos</text>

    <g transform="translate(28,196)">
      <rect width="330" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="165" y="16" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">Traer-y-guardar — NO es lectura en vivo</text>
    </g>
  </g>

  <!-- arrow 4 -> 5 -->
  <line x1="820" y1="572" x2="842" y2="572" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <!-- Card 5: dashboards -->
  <g transform="translate(845,460)" filter="url(#sh)">
    <rect width="380" height="226" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="32" cy="34" r="16" fill="#d1fae5"/>
    <text x="32" y="39" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">5</text>
    <text x="60" y="32" font-size="18" font-weight="700" fill="#0f172a">Ver en dashboards</text>
    <text x="60" y="51" font-size="12" font-weight="600" fill="#94a3b8">automático</text>
    <line x1="24" y1="68" x2="356" y2="68" stroke="#f1f5f9"/>
    <text x="28" y="98" font-size="13.5" fill="#334155">• Escribe en la MISMA tabla</text>
    <text x="28" y="120" font-size="13.5" fill="#334155">  que el import por CSV</text>
    <text x="28" y="150" font-size="13.5" font-weight="700" fill="#047857">• Tus dashboards se prenden solos</text>
    <text x="28" y="174" font-size="13.5" fill="#334155">  sin tocar una línea de código</text>
    <g transform="translate(28,190)">
      <rect width="332" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="166" y="16" font-size="11.5" fill="#475569" text-anchor="middle">ACWR · Baseline · Perfil · GPS Analysis</text>
    </g>
  </g>

  <!-- Callout -->
  <g transform="translate(30,728)">
    <rect width="1220" height="46" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="34" cy="23" r="13" fill="#f59e0b"/>
    <text x="34" y="28" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">!</text>
    <text x="60" y="28" font-size="14" fill="#92400e"><tspan font-weight="700">Nada se pierde en silencio:</tspan>  si llega una métrica que nadie mapeó, el Sync te la reporta (unmapped) para que la mapees y entre en el próximo sync.</text>
  </g>
</svg>
