<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Reports — ClavaMetrics</title>
<!-- La fuente de iconos entraba por @import DENTRO de clavametrics.css: el
     navegador tenía que bajar y parsear ese CSS antes de descubrir que
     necesitaba otro CSS de un CDN externo, y sólo entonces la fuente. Tres
     saltos en serie, y por eso los iconos aparecían tarde y el menú se veía
     con cuadrados vacíos. Con el link aquí arriba, la petición sale en
     paralelo con el CSS principal. El @import sigue en el CSS como respaldo:
     el navegador deduplica y no la vuelve a pedir. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- El handshake con Supabase (DNS + TLS) es lo primero que necesita CADA página
     autenticada: supabase-init.js crea el cliente y la primera consulta sale
     enseguida. Abrir la conexión aquí ahorra ese ida y vuelta antes de que se
     pida el primer dato. (No se pasan los scripts del <head> a defer porque los
     scripts inline del cuerpo usan window.sb de inmediato y correrían antes.) -->
<link rel="preconnect" href="https://xesrumijvdmqjrufgeka.supabase.co" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<script src="assets/boot-brand.js"></script>
<link rel="stylesheet" href="clavametrics.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D">
  <link rel="apple-touch-icon" href="/assets/clava-app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<style>
  body.cm { background: var(--cm-bg); }

  /* Shared shell */

  /* Topbar */
  .hub-topbar { display:flex; align-items:center; gap:14px; height:56px; padding:0 24px; border-bottom:1px solid var(--cm-border); background:color-mix(in srgb, var(--cm-bg) 92%, transparent); backdrop-filter:saturate(160%) blur(10px); position:sticky; top:0; z-index:50; }
  .hub-crumb { display:flex; align-items:center; gap:8px; color:var(--cm-fg-muted); font:var(--cm-body-sm); }
  .hub-crumb .ti { font-size:14px; }
  .hub-crumb .sep { color:var(--cm-fg-faint); }
  .hub-search { margin-left:auto; width:240px; display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); color:var(--cm-fg-muted); }
  .hub-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; font:var(--cm-body-sm); color:var(--cm-fg); }
  .hub-search .ti { font-size:16px; }
  .hub-topbar .actions { display:flex; align-items:center; gap:8px; }

  /* Page */
  .mr-page { padding:24px 28px 64px; max-width:1600px; width:100%; }

  /* Scoreboard hero */
  .mr-hero {
    background: linear-gradient(135deg, var(--cm-side-bg) 0%, color-mix(in srgb, var(--cm-side-bg) 80%, var(--cm-accent)) 100%);
    color:#fff;
    border-radius:var(--cm-r-5);
    padding:24px 28px;
    margin-bottom:18px;
    box-shadow:var(--cm-shadow-2);
    position:relative;
    overflow:hidden;
  }
  .mr-hero::before {
    content:""; position:absolute; inset:0;
    background-image:url('assets/field.jpg');
    background-size:cover; background-position:center;
    opacity:0.18;
    mix-blend-mode:luminosity;
  }
  .mr-hero > * { position:relative; z-index:1; }

  .mr-hero-top { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .mr-hero-top .league { font:500 11px/1 var(--cm-font-mono); letter-spacing:0.10em; text-transform:uppercase; color:rgba(255,255,255,0.7); }
  .mr-hero-top .sep { color:rgba(255,255,255,0.3); }
  .mr-hero-top .date { font:500 12px/1 var(--cm-font-mono); color:rgba(255,255,255,0.85); }
  .mr-hero-top .venue { font:500 12px/1 var(--cm-font-mono); color:rgba(255,255,255,0.7); }
  .mr-hero-top .right { margin-left:auto; display:flex; gap:6px; }
  .mr-hero-top .pill {
    display:inline-flex; align-items:center; gap:5px;
    height:24px; padding:0 10px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    font:500 11.5px/1 var(--cm-font-sans);
    color:#fff;
  }

  .mr-scoreline {
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:24px;
    margin-bottom:14px;
  }
  .mr-team {
    display:flex; align-items:center; gap:14px;
  }
  .mr-team .crest {
    width:64px; height:64px;
    border-radius:14px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font:700 22px/1 var(--cm-font-sans);
    flex-shrink:0;
  }
  .mr-team .crest.is-home { background:var(--cm-accent); }
  .mr-team .crest.has-img { background:rgba(255,255,255,0.92); border-color:rgba(255,255,255,0.5); padding:6px; }
  .mr-team .crest img { width:100%; height:100%; object-fit:contain; display:block; }
  .mr-team.is-away { flex-direction:row-reverse; text-align:right; }
  .mr-team h2 {
    font:600 22px/1 var(--cm-font-sans);
    letter-spacing:-0.01em;
    color:#fff;
  }
  .mr-team .sub {
    font:500 12px/1 var(--cm-font-mono);
    color:rgba(255,255,255,0.65);
    margin-top:5px;
  }

  .mr-score {
    display:flex; align-items:center; gap:6px;
    font:700 56px/1 var(--cm-font-sans);
    letter-spacing:-0.03em;
    color:#fff;
  }
  .mr-score .dash {
    width:18px; height:3px;
    background:rgba(255,255,255,0.4);
    border-radius:2px;
  }
  .mr-score-meta {
    margin-top:8px;
    text-align:center;
    font:500 11px/1 var(--cm-font-mono);
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.65);
  }
  .mr-score-meta strong { color:#fff; font-weight:600; }

  .mr-scorers { display:flex; gap:36px; margin-top:6px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.12); }
  .mr-scorers > div { flex:1; display:flex; flex-direction:column; gap:4px; font:500 12.5px/1.4 var(--cm-font-sans); color:rgba(255,255,255,0.85); }
  .mr-scorers > div:last-child { text-align:right; align-items:flex-end; }
  .mr-scorer { display:flex; align-items:center; gap:6px; }
  .mr-scorers > div:last-child .mr-scorer { flex-direction:row-reverse; }
  .mr-scorer .min { font:600 10.5px/1 var(--cm-font-mono); color:rgba(255,255,255,0.55); }
  .mr-scorer .ti { font-size:13px; color:#FACC15; }
  .mr-scorer .ti.yellow { color:#FACC15; }
  .mr-scorer .ti.red { color:#DC2626; }

  /* KPI strip */
  .mr-kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
  .mr-kpi { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-4); padding:14px 16px; box-shadow:var(--cm-shadow-1); position:relative; }
  .mr-kpi-l { display:flex; align-items:center; gap:6px; font:500 11.5px/1 var(--cm-font-sans); color:var(--cm-fg-muted); margin-bottom:10px; }
  .mr-kpi-l .ti { font-size:13px; }
  .mr-kpi-cmp { display:flex; align-items:baseline; gap:8px; }
  .mr-kpi-us { font:600 22px/1 var(--cm-font-sans); letter-spacing:-0.02em; color:var(--cm-fg-strong); }
  .mr-kpi-us sub { font:500 12px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-left:3px; }
  .mr-kpi-them { font:600 16px/1 var(--cm-font-mono); color:var(--cm-fg-muted); }
  .mr-kpi-vs { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-faint); margin:0 2px; }
  .mr-kpi-bar { margin-top:10px; height:5px; background:var(--cm-bg-sunk); border-radius:3px; overflow:hidden; display:flex; }
  .mr-kpi-bar .us { background:var(--cm-accent); }
  .mr-kpi-bar .them { background:var(--cm-neutral); opacity:0.45; }

  /* Two-col grid */
  .mr-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:14px; }
  @media (max-width:1100px) { .mr-grid { grid-template-columns:1fr; } .mr-kpis { grid-template-columns:repeat(2,1fr); } }

  .mr-card { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:var(--cm-r-4); box-shadow:var(--cm-shadow-1); }
  .mr-card-h { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--cm-border-soft); }
  .mr-card-h h3 { font:600 14px/1 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .mr-card-h .sub { font:500 12px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-left:6px; }
  .mr-card-h .right { margin-left:auto; display:flex; align-items:center; gap:8px; }

  /* Player table */
  .tscroll-x { overflow-x:auto; }
  .mr-table { width:100%; border-collapse:collapse; }
  .mr-table thead th { text-align:left; padding:9px 12px; font:500 11px/1 var(--cm-font-sans); letter-spacing:0.08em; text-transform:uppercase; color:var(--cm-fg-muted); background:var(--cm-bg-soft); border-bottom:1px solid var(--cm-border); white-space:nowrap; }
  .mr-table th.num { text-align:right; }
  .mr-table tbody td { padding:9px 12px; border-bottom:1px solid var(--cm-border-soft); font:var(--cm-body-sm); color:var(--cm-fg); vertical-align:middle; }
  .mr-table tbody tr:last-child td { border-bottom:0; }
  .mr-table tbody tr:hover td { background:var(--cm-bg-soft); }
  .mr-table td.num { text-align:right; font:500 13px/1 var(--cm-font-mono); }
  .mr-table td.num.good { color:var(--cm-success); }
  .mr-table td.num.warn { color:var(--cm-warning); }

  .mr-player { display:flex; align-items:center; gap:9px; }
  .mr-av { width:26px; height:26px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); color:var(--cm-fg); display:flex; align-items:center; justify-content:center; font:600 10.5px/1 var(--cm-font-sans); flex-shrink:0; }
  .mr-av.tinted { background:var(--cm-accent-soft); color:var(--cm-accent); border-color:transparent; }
  .mr-pname { font:500 13px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .mr-pdorsal { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .mr-pos { display:inline-flex; align-items:center; height:18px; padding:0 6px; border-radius:4px; font:600 10px/1 var(--cm-font-mono); letter-spacing:0.04em; }
  .mr-pos.gk { background:rgba(220,38,38,0.10); color:#B91C1C; }
  .mr-pos.cb { background:rgba(37,99,235,0.10); color:#1D4ED8; }
  .mr-pos.fb { background:rgba(96,165,250,0.14); color:#1D4ED8; }
  .mr-pos.mf { background:rgba(22,163,74,0.12); color:#15803D; }
  .mr-pos.wg { background:rgba(217,119,6,0.12); color:#B45309; }
  .mr-pos.st { background:rgba(220,38,38,0.10); color:#B91C1C; }
  .mr-min { font:500 12px/1 var(--cm-font-mono); color:var(--cm-fg); }
  .mr-min .sub { color:var(--cm-fg-faint); }
  .mr-rating {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:24px;
    border-radius:6px;
    font:600 12.5px/1 var(--cm-font-mono);
    letter-spacing:-0.02em;
  }
  .mr-rating.high { background:var(--cm-success-bg); color:var(--cm-success); }
  .mr-rating.med  { background:var(--cm-warning-bg); color:var(--cm-warning); }
  .mr-rating.low  { background:var(--cm-danger-bg);  color:var(--cm-danger); }
  .mr-rating.neu  { background:var(--cm-bg-soft); color:var(--cm-fg-muted); }
  .mr-goals { display:inline-flex; align-items:center; gap:3px; }
  .mr-goals .ti { font-size:13px; color:var(--cm-warning); }
  .mr-goals span { font:600 13px/1 var(--cm-font-mono); color:var(--cm-fg-strong); }
  .mr-cards { display:inline-flex; gap:3px; }
  .mr-cards .c { width:9px; height:13px; border-radius:1px; }
  .mr-cards .c.y { background:#FACC15; }
  .mr-cards .c.r { background:#DC2626; }

  /* Shot map (mini pitch) */
  .mr-shotmap {
    position:relative;
    aspect-ratio: 105/68;
    background-image:url('assets/field.jpg');
    background-size:cover; background-position:center;
    border-radius:10px;
    margin:16px;
    overflow:hidden;
    border:1px solid var(--cm-border);
  }
  .mr-shotmap::after {
    content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.18) 100%);
    pointer-events:none;
  }
  .shot {
    position:absolute;
    transform:translate(-50%, -50%);
    width:14px; height:14px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .shot.goal      { background:var(--cm-success); width:18px; height:18px; }
  .shot.on-target { background:var(--cm-info); }
  .shot.off       { background:transparent; border-color:var(--cm-warning); }
  .shot.block     { background:var(--cm-neutral); }
  .shot.them      { border-color:rgba(255,255,255,0.7); }
  .shot.them.goal { background:var(--cm-danger); }

  .mr-shotmap-legend {
    display:flex; gap:14px; padding:10px 16px 14px; flex-wrap:wrap;
    font:500 11.5px/1 var(--cm-font-sans); color:var(--cm-fg-muted);
  }
  .mr-shotmap-legend .it { display:flex; align-items:center; gap:6px; }
  .mr-shotmap-legend .d { width:11px; height:11px; border-radius:50%; border:1.5px solid var(--cm-fg-strong); flex-shrink:0; }

  /* Heatmap */
  .mr-heatmap {
    position:relative;
    aspect-ratio: 105/68;
    background-image:url('assets/field.jpg');
    background-size:cover; background-position:center;
    border-radius:10px;
    margin:16px;
    overflow:hidden;
    border:1px solid var(--cm-border);
  }
  .mr-heatmap .blob {
    position:absolute;
    border-radius:50%;
    filter:blur(28px);
    mix-blend-mode:screen;
  }

  /* Stats compare bars */
  .mr-cmp { padding:8px 16px 16px; }
  .mr-cmp-row { display:grid; grid-template-columns: 50px 1fr 50px; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--cm-border-soft); }
  .mr-cmp-row:last-child { border-bottom:0; }
  .mr-cmp-l { font:600 14px/1 var(--cm-font-mono); color:var(--cm-fg-strong); text-align:right; }
  .mr-cmp-r { font:600 14px/1 var(--cm-font-mono); color:var(--cm-fg-strong); text-align:left; }
  .mr-cmp-mid { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .mr-cmp-name { font:500 11px/1 var(--cm-font-mono); letter-spacing:0.06em; text-transform:uppercase; color:var(--cm-fg-muted); }
  .mr-cmp-bars { display:flex; width:100%; height:5px; gap:3px; }
  .mr-cmp-bars .b { height:100%; background:var(--cm-bg-sunk); border-radius:2px; flex:1; position:relative; overflow:hidden; }
  .mr-cmp-bars .b .f { position:absolute; height:100%; background:var(--cm-accent); }
  .mr-cmp-bars .b.them .f { background:var(--cm-neutral); right:0; }
  .mr-cmp-bars .b.us   .f { left:0; }

  /* Timeline */
  .mr-timeline { padding:12px 16px 16px; }
  .tl-track { position:relative; height:6px; background:var(--cm-bg-sunk); border-radius:3px; margin:24px 12px 12px; }
  .tl-half { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--cm-border-strong); left:50%; }
  .tl-half-label { position:absolute; top:-22px; font:500 10px/1 var(--cm-font-mono); letter-spacing:0.06em; text-transform:uppercase; color:var(--cm-fg-muted); }
  .tl-half-label.l { left:0; }
  .tl-half-label.m { left:calc(50% - 8px); }
  .tl-half-label.r { right:0; }
  .tl-evt {
    position:absolute; top:-9px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--cm-surface);
    border:2px solid var(--cm-border-strong);
    transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .tl-evt .ti { font-size:11px; color:var(--cm-fg-muted); }
  .tl-evt.goal { background:var(--cm-success); border-color:var(--cm-success); }
  .tl-evt.goal .ti { color:#fff; }
  .tl-evt.them { background:var(--cm-danger); border-color:var(--cm-danger); }
  .tl-evt.them .ti { color:#fff; }
  .tl-evt.yc { background:#FACC15; border-color:#FACC15; }
  .tl-evt.sub { background:var(--cm-info-bg); border-color:var(--cm-info-bd); }
  .tl-evt.sub .ti { color:var(--cm-info); }
  .tl-min {
    position:absolute; bottom:-26px;
    font:500 10px/1 var(--cm-font-mono); color:var(--cm-fg-muted);
    transform:translateX(-50%);
    white-space:nowrap;
  }

  /* Tabs */
  .mr-tabs { display:flex; gap:2px; padding:8px 12px 0; border-bottom:1px solid var(--cm-border-soft); background:var(--cm-bg-soft); }
  .mr-tab {
    padding:0 14px; height:36px;
    display:inline-flex; align-items:center; gap:6px;
    border:0; background:transparent;
    color:var(--cm-fg-muted);
    font:500 13px/1 var(--cm-font-sans);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  /* Edición de estadísticas por jugador. */
  .mr-edit { width:62px; height:28px; padding:0 7px; text-align:right; background:var(--cm-surface); color:var(--cm-fg-strong); border:1px solid var(--cm-border); border-radius:var(--cm-r-2); font:500 12.5px/1 var(--cm-font-mono); font-variant-numeric:tabular-nums; }
  .mr-edit:focus { outline:none; border-color:var(--cm-accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--cm-accent) 20%, transparent); }
  .mr-edit::-webkit-outer-spin-button, .mr-edit::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .mr-edit-msg { font:500 12px/1.3 var(--cm-font-sans); color:var(--cm-fg-muted); }
  #mrPlayerTools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  /* Los cinco números del partido, arriba de todo. */
  .kpi-strip { display:grid; grid-template-columns:repeat(5,1fr); }
  @media (max-width:900px){ .kpi-strip { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .kpi-strip { grid-template-columns:1fr; } }
  .kpi { padding:14px 16px; border-right:1px solid var(--cm-border-soft); display:flex; flex-direction:column; gap:5px; min-width:0; }
  .kpi:last-child { border-right:0; }
  @media (max-width:900px){ .kpi { border-bottom:1px solid var(--cm-border-soft); } }
  .kpi-l { font:500 10px/1.2 var(--cm-font-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--cm-fg-faint); }
  .kpi-v { font:600 26px/1 var(--cm-font-mono); color:var(--cm-fg-strong); font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .kpi-s { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; font:400 11.5px/1.4 var(--cm-font-sans); color:var(--cm-fg-muted); }
  .kpi-d { font:500 11.5px/1.4 var(--cm-font-mono); color:var(--cm-fg-faint); font-variant-numeric:tabular-nums; }
  .kpi-d.up { color:var(--cm-success); }
  .kpi-d.down { color:var(--cm-danger); }

  /* ── Estadísticas de equipo: nosotros contra el rival ─────────────────────── */
  .ts-empty { padding:28px 16px; text-align:center; color:var(--cm-fg-faint); font:var(--cm-body-sm); }
  .ts-head { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--cm-border-soft); background:var(--cm-bg-soft); }
  .ts-head .nm { font:600 12px/1.3 var(--cm-font-sans); color:var(--cm-fg-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ts-head .nm.r { text-align:right; }
  .ts-head .nm small { display:block; margin-top:2px; font:500 10.5px/1 var(--cm-font-mono); color:var(--cm-fg-faint); }
  .ts-head .vs { font:500 10px/1 var(--cm-font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--cm-fg-faint); }
  .ts-rows { padding:4px 14px 12px; }
  .ts-row { padding:9px 0; border-bottom:1px solid var(--cm-border-soft); }
  .ts-row:last-child { border-bottom:0; }
  .ts-top { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:baseline; margin-bottom:5px; }

        <!-- RIGHT: shot map + heatmap + stat compare -->
        <div style="display:flex;flex-direction:column;gap:14px">

          <!-- Accumulated sanctions: who is close to missing a match. Filled by
               renderSanctions() from card_accumulations; empty when nobody is near. -->
          <div class="mr-card" id="mrSanctionsCard" style="display:none;margin-bottom:14px">
            <div class="mr-card-h">
              <h3 data-i18n="match_reports.sanctions_title">Accumulated sanctions</h3>
              <span class="sub" id="mrSanctionsLeague"></span>
            </div>
            <div id="mrSanctionsBody" style="padding:10px 14px"></div>
          </div>

          <!-- Mapa de tiros y mapa de calor: ocultos.

               Las dos necesitan coordenadas y ninguna de las fuentes que hay las tiene.
               El Excel de equipo de Wyscout llega agregado por tercios, no por punto; el
               XML de eventos no trae una sola coordenada (seis campos por instancia:
               ID, start, end, code, label, text). No es que falte conectarlas: no hay
               dato con qué dibujarlas, y una card que dice "not available yet" para
               siempre es ruido.

               El modelo del mapa de tiros SÍ existe — `public.match_shots`, con x_pct,
               y_pct, minute, outcome y xg — pero nadie la llena. Si algún día entra un
               proveedor con eventos posicionales, o se cargan a mano, esto se
               reactiva y la tabla ya está esperando. -->

          <!-- Match stats compare — filled from team_match_stats (Wyscout team export).
               Stays hidden until someone imports it; there is nothing to compare
               against when only our own side was ever entered by hand. -->
          <div class="mr-card" id="mrTeamStatsCard">
            <div class="mr-card-h">
              <h3 data-i18n="match_reports.match_stats">Match stats</h3>
              <span class="sub" id="mrTeamStatsSub"></span>
            </div>
            <div id="mrTeamStatsBody"></div>
          </div>

        </div>
      </div>

      <!-- Season trend — how the team is trending across every match that has team stats.
           One metric at a time, picked from the select; the current match is marked on
           the line. Hidden until there are at least two matches to compare. -->
      <div class="mr-card" id="mrTrendCard" style="margin-top:14px;display:none">
        <div class="mr-card-h">
          <h3 data-i18n="match_reports.trend_title">Team trend</h3>
          <span class="sub" id="mrTrendSub"></span>
          <div class="right">
            <select id="mrTrendMetric" class="cm-select" style="height:30px;padding:0 8px;background:var(--cm-surface);color:var(--cm-fg);border:1px solid var(--cm-border);border-radius:var(--cm-r-2);font:500 12px/1 var(--cm-font-sans);cursor:pointer"></select>
          </div>
        </div>
        <div id="mrTrendBody"></div>
      </div>

      <!-- Match timeline — no match-events model yet -->
      <div class="mr-card" style="margin-top:14px">
        <div class="mr-card-h"><h3 data-i18n="match_reports.match_timeline">Match timeline</h3></div>
        <div style="padding:28px 16px;text-align:center;color:var(--cm-fg-faint);font:var(--cm-body-sm)" data-i18n="match_reports.not_available_yet">Not available yet</div>
      </div>

    </section>
  </main>
</div>
