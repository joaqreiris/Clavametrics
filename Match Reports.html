<!-- Tweaks + Settings -->
<div id="tweaks-root"></div>
<div id="settings-host"></div>

<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>window.__CM_TWEAK_DEFAULTS = { theme: "hybrid", accent: "green" };</script>
<script defer src="settings-drawer.js"></script>
<script defer src="tweaks-panel.js"></script>
<script defer src="theme-tweaks.js"></script>

<script>
  const POS_MAP = { GK:'gk', CB:'cb', LB:'fb', RB:'fb', LW:'wg', RW:'wg', MF:'mf', CM:'mf', DM:'mf', AM:'mf', ST:'st', CF:'st' };
  // XSS: escapa datos de la base antes de inyectarlos en innerHTML/etc.
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  function tt(key, fallbackEN, vars) {
    const v = (window.CM_I18N && CM_I18N.t) ? CM_I18N.t(key, vars) : null;
    return (v && v !== key) ? v : (fallbackEN != null ? fallbackEN : key);
  }
  function mrLocale(){ return (window.CM_I18N && CM_I18N.current) || document.documentElement.lang || 'en'; }
  // "Sat 3 May 2025"-style date, localized.
  function mrFullDate(d){ try { return new Intl.DateTimeFormat(mrLocale(), { weekday:'short', day:'numeric', month:'short', year:'numeric' }).format(d); } catch(_) { return d.toDateString(); } }
  // "3 May"-style short date, localized.
  function mrShortDate(d){ try { return new Intl.DateTimeFormat(mrLocale(), { day:'numeric', month:'short' }).format(d); } catch(_) { return String(d.getDate()); } }

  async function boot() {
    if (!(await window.guardModule())) return;
    const [profile, club] = await Promise.all([window.getProfile(), window.getClub()]);
    if (club) window.applyClubTheme();
    const clubId = await window.getClubId();
    if (!clubId) return;
    await mrInitTeamSwitch(clubId);

    // Load most recent match session.
    // El tipo se guarda en minúscula ('match') en todo el resto de la app — Availability,
    // Load Planner, day-context y las páginas de GPS lo consultan así. Esta pantalla
    // buscaba 'Match' y por eso no encontraba NINGÚN partido, por muchos que hubiera.
    let _mrMatchQ = window.sb.from('training_sessions')
      .select('id, title, session_date, duration, notes')
      .eq('club_id', clubId)
      .eq('session_type', 'match');
    if (_mrTeamId) _mrMatchQ = _mrMatchQ.eq('team_id', _mrTeamId);
    const { data: matches } = await _mrMatchQ
      .order('session_date', { ascending: false })
      .limit(1);

    const match = matches?.[0];
    let _mrResult = null, _mrStats = [];
    if (match) {
      const dt = new Date(match.session_date);
      document.getElementById('mrDate').textContent = mrFullDate(dt);

      const { data: mr } = await window.sb.from('match_results').select('*')
        .eq('club_id', clubId).eq('session_id', match.id).limit(1);
      _mrResult = mr?.[0] || null;
      if (_mrResult) {
        const { data: ps } = await window.sb.from('player_match_stats')
          .select('player_id, minutes, goals, assists, yellow_cards, red_cards, rating, players(first_name,last_name)')
          .eq('club_id', clubId).eq('match_id', _mrResult.id);
        _mrStats = ps || [];
      }
      await loadGPS(match.id, clubId);
    } else {
      { const h = document.getElementById('mrPlayerHead'); if (h) h.innerHTML = ''; }
      document.getElementById('mrPlayerBody').innerHTML =
        `<tr><td colspan="99" style="text-align:center;padding:32px;color:var(--cm-fg-muted)">${tt('match_reports.no_match_sessions', 'No match sessions found')}</td></tr>`;
    }
    // Los escudos de los rivales que el club fue cargando. Sin esto el hero mostraba
    // iniciales aunque la imagen estuviera guardada.
    let crests = {};
    try {
      const { data } = await window.sb.from('opponent_branding')
        .select('opponent_name, crest_url').eq('club_id', clubId);
      (data || []).forEach(b => { if (b.crest_url) crests[mrNormName(b.opponent_name)] = b.crest_url; });
    } catch (_e) {}

    _mrCtx = { match, result: _mrResult, club, stats: _mrStats, clubId, crests };
    renderSanctions(clubId);
    renderHero(match, _mrResult, club);
    renderScorers(_mrStats);
    // La tendencia no depende de que ESTE partido tenga stats: se dibuja con todos los
    // que sí las tienen, así que se carga aunque el de arriba todavía esté vacío.
    loadTeamStats(clubId, _mrResult ? _mrResult.id : null);
  }

  // Cached context for language re-render.
  let _mrCtx = null;
  document.addEventListener('cm:langchanged', () => {
    if (!_mrCtx) return;
    if (_mrCtx.match) document.getElementById('mrDate').textContent = mrFullDate(new Date(_mrCtx.match.session_date));
    renderHero(_mrCtx.match, _mrCtx.result, _mrCtx.club);
    renderScorers(_mrCtx.stats);
    if (_mrCtx.clubId) loadTeamStats(_mrCtx.clubId, _mrCtx.result ? _mrCtx.result.id : null);
    if (_mrCtx.match && _mrCtx.clubId) loadGPS(_mrCtx.match.id, _mrCtx.clubId);
    else if (!_mrCtx.match) document.getElementById('mrPlayerBody').innerHTML =
      `<tr><td colspan="99" style="text-align:center;padding:32px;color:var(--cm-fg-muted)">${tt('match_reports.no_match_sessions', 'No match sessions found')}</td></tr>`;
  });

  /* La línea de cada jugador en el partido.

     Dos fuentes que no siempre están las dos: `player_match_stats`, que se carga a mano
     o importando, y `gps_reports`, que llega del GPS. Antes la tabla dibujaba las diez
     columnas pasara lo que pasara, así que un informe con GPS y sin estadísticas —el
     caso normal— mostraba media tabla en guiones. Ahora las columnas se arman según lo
     que este partido tenga.

     Los minutos salen del GPS (`time_played`) cuando nadie los cargó a mano: el dato ya
     estaba y la tabla lo ignoraba. Y quien no jugó no aparece: los suplentes traen fila
     de GPS igual (calentamiento), con lo que la lista mezclaba once titulares con media
     docena de registros de 400 metros.

     En modo edición las columnas del deporte se muestran SIEMPRE, aunque estén vacías:
     es justamente cuando se van a llenar. Ahí es donde se cargan las tarjetas, que
     ningún export de Wyscout dice a quién corresponden — y sin jugador el contador de
     sanciones acumuladas no puede hacer su trabajo. */
  let _mrPlayers = null;      // filas ya combinadas (GPS + stats), para redibujar sin reconsultar
  let _mrEditing = false;
  let _mrEdits = {};          // player_id -> { campo: valor } mientras se edita
  let _mrSquad = null;        // el plantel del equipo, sólo se pide al entrar en edición

  /* Al arquero no le ponen GPS, así que no tiene fila en `gps_reports` — y como la
     tabla se arma con lo que el partido registró, no aparecía por ningún lado: no era
     que estuviera filtrado por minutos, es que nunca entraba. Editando hace falta el
     plantel entero, porque justamente se va a cargar a quien no dejó rastro. */
  async function loadSquad(){
    if (_mrSquad || !_mrCtx || !_mrCtx.clubId) return _mrSquad;
    try {
      let q = window.sb.from('players')
        .select('id, first_name, last_name, number, position')
        .eq('club_id', _mrCtx.clubId).is('archived_at', null);
      if (_mrTeamId) q = q.eq('team_id', _mrTeamId);
      const { data } = await q;
      _mrSquad = data || [];
    } catch (_e) { _mrSquad = []; }
    return _mrSquad;
  }

  async function loadGPS(sessionId, clubId) {
    const tbody = document.getElementById('mrPlayerBody');
    if (!tbody) return;

    // 1) El partido y sus estadísticas por jugador
    let result = null, statsByPlayer = {};
    try {
      const { data: mr } = await window.sb.from('match_results').select('id')
        .eq('club_id', clubId).eq('session_id', sessionId).limit(1);
      result = mr?.[0] || null;
      if (result) {
        const { data: ps } = await window.sb.from('player_match_stats')
          .select('player_id, minutes, goals, assists, yellow_cards, red_cards, rating, position, extra, players(first_name,last_name,position)')
          .eq('club_id', clubId).eq('match_id', result.id);
        (ps || []).forEach(s => { statsByPlayer[s.player_id] = s; });
      }
    } catch (_) {}

    // 2) El GPS. `is_invalid` marca registros descartados en la revisión: no son datos.
    const gpsByPlayer = {};
    try {
      const { data } = await window.sb.from('gps_reports')
        .select('player_id, time_played, total_distance, high_speed_distance, very_high_speed_distance, sprint_distance, sprint_count, accelerations, decelerations, max_speed, player_load, distance_per_minute, is_invalid, players(first_name, last_name, position)')
        .eq('session_id', sessionId)
        .eq('club_id', clubId);
      (data || []).forEach(g => { if (!g.is_invalid) gpsByPlayer[g.player_id] = g; });
    } catch (_) {}

    const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
    const ids = Array.from(new Set([...Object.keys(gpsByPlayer), ...Object.keys(statsByPlayer)]));
    _mrPlayers = ids.map(id => {
      const g = gpsByPlayer[id] || null;
      const s = statsByPlayer[id] || null;
      const p = (s && s.players) || (g && g.players) || {};
      const min = num(s && s.minutes) != null ? num(s.minutes) : num(g && g.time_played);
      return { id, g, s, p, min };
    });
    _mrMatchId = result ? result.id : null;
    renderPlayerTable();
  }
  let _mrMatchId = null;

  function renderPlayerTable(){
    const tbody = document.getElementById('mrPlayerBody');
    const thead = document.getElementById('mrPlayerHead');
    const subEl = document.getElementById('mrPlayerSub');
    if (!tbody) return;
    let all = _mrPlayers || [];
    if (_mrEditing && _mrSquad && _mrSquad.length){
      // El plantel manda, con los datos del partido pegados al que los tenga.
      const byId = {};
      all.forEach(r => { byId[r.id] = r; });
      all = _mrSquad.map(p => byId[p.id] || {
        id: p.id, g: null, s: null,
        p: { first_name: p.first_name, last_name: p.last_name, position: p.position },
        min: null,
      });
    }

    if (!all.length) {
      if (subEl) subEl.textContent = '';
      if (thead) thead.innerHTML = '';
      tbody.innerHTML = `<tr><td style="text-align:center;padding:32px;color:var(--cm-fg-muted)">${tt('match_reports.no_match_data', 'No match data for this match')}</td></tr>`;
      return;
    }

    const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);

    // 3) Fuera quien no jugó. Con la salvedad de que si NADIE tiene minutos —un club que
    //    no carga ese dato— filtrar dejaría la tabla vacía: entonces se muestran todos.
    //    Al editar tampoco se filtra: puede haber que cargarle una tarjeta al que entró
    //    y no tiene GPS.
    const anyMinutes = all.some(r => r.min != null && r.min > 0);
    const shown = (anyMinutes && !_mrEditing) ? all.filter(r => r.min != null && r.min > 0) : all;
    const hidden = all.length - shown.length;

    // 4) Orden. Editando conviene el orden de una planilla —arqueros primero, después
    //    por línea— y no el del rendimiento: se va recorriendo el equipo, no leyendo.
    const POS_ORDER = ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'];
    const rows = _mrEditing
      ? shown.slice().sort((a, b) => {
          const pa = POS_ORDER.indexOf(a.p.position), pb = POS_ORDER.indexOf(b.p.position);
          if (pa !== pb) return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
          return String(a.p.last_name || '').localeCompare(String(b.p.last_name || ''));
        })
      : shown.slice().sort((a, b) => {
      const ra = num(a.s && a.s.rating), rb = num(b.s && b.s.rating);
      if (ra != null || rb != null) return (rb == null ? -Infinity : rb) - (ra == null ? -Infinity : ra);
      if ((b.min || 0) !== (a.min || 0)) return (b.min || 0) - (a.min || 0);
      return num(b.g && b.g.total_distance) - num(a.g && a.g.total_distance);
    });

    if (subEl) {
      subEl.textContent = tt('match_reports.player_count', `${rows.length} player${rows.length === 1 ? '' : 's'}`, { count: rows.length })
        + (hidden ? ' · ' + tt('match_reports.n_did_not_play', `${hidden} did not play`, { count: hidden }) : '');
    }

    // 5) Las columnas candidatas. Cada una dice cómo sacar su valor y sólo entra en la
    //    tabla si algún jugador de este partido lo tiene — salvo en edición, donde las
    //    del deporte entran siempre porque son las que se van a llenar.
    const cards = r => {
      let h = '';
      for (let i = 0; i < ((r.s && r.s.yellow_cards) || 0); i++) h += '<span class="c y"></span>';
      for (let i = 0; i < ((r.s && r.s.red_cards) || 0); i++) h += '<span class="c r"></span>';
      return h;
    };
    const gv = (r, k) => num(r.g && r.g[k]);
    const accdec = r => { const a = gv(r, 'accelerations'), d = gv(r, 'decelerations');
                          return (a == null && d == null) ? null : (a || 0) + (d || 0); };

    const CANDIDATES = [
      { key: 'min',    label: tt('match_reports.min', 'Min'), num: false, edit: 'minutes',
        val: r => r.min, cell: r => `<span class="mr-min">${r.min}</span>` },
      { key: 'rating', label: tt('match_reports.rating', 'Rating'), num: false, edit: 'rating', step: '0.1',
        val: r => num(r.s && r.s.rating),
        cell: r => { const v = num(r.s && r.s.rating);
          const cls = v >= 7.5 ? 'high' : (v >= 6 ? 'neu' : 'low');
          return `<span class="mr-rating ${cls}">${v.toFixed(1)}</span>`; } },
      { key: 'goals',  label: tt('match_reports.goals', 'Goals'), num: true, edit: 'goals',
        val: r => (r.s && (r.s.goals || r.s.assists)) ? ((r.s.goals || 0) + (r.s.assists || 0)) : null,
        cell: r => `${(r.s && r.s.goals) || 0}${(r.s && r.s.assists) ? ` <span style="color:var(--cm-fg-faint)">+${r.s.assists}A</span>` : ''}` },
      { key: 'assists', label: tt('match_reports.stat_assists', 'Assists'), num: true, edit: 'assists',
        editOnly: true, val: r => num(r.s && r.s.assists), cell: r => (r.s && r.s.assists) || 0 },
      { key: 'yellow', label: tt('match_reports.stat_yellow_cards', 'Yellow'), num: true, edit: 'yellow_cards', max: '2',
        editOnly: true, val: r => num(r.s && r.s.yellow_cards), cell: r => (r.s && r.s.yellow_cards) || 0 },
      { key: 'red',    label: tt('match_reports.stat_red_cards', 'Red'), num: true, edit: 'red_cards', max: '1',
        editOnly: true, val: r => num(r.s && r.s.red_cards), cell: r => (r.s && r.s.red_cards) || 0 },
      { key: 'dist',   label: tt('match_reports.dist', 'Dist'), num: true, unit: 'km',
        val: r => gv(r, 'total_distance'),
        cell: r => (gv(r, 'total_distance') / 1000).toFixed(1) },
      { key: 'mmin',   label: tt('match_reports.m_min', 'm/min'), num: true,
        val: r => gv(r, 'distance_per_minute'),
        cell: r => Math.round(gv(r, 'distance_per_minute')) },
      { key: 'hsr',    label: tt('match_reports.hsr', 'HSR'), num: true, unit: 'm',
        val: r => gv(r, 'high_speed_distance'),
        cell: r => Math.round(gv(r, 'high_speed_distance')) },
      { key: 'sprint', label: tt('match_reports.sprint', 'Sprint'), num: true, unit: 'm',
        val: r => gv(r, 'sprint_distance'),
        cell: r => Math.round(gv(r, 'sprint_distance')) },
      { key: 'spd',    label: tt('match_reports.top_spd', 'Top spd'), num: true, unit: 'km/h',
        val: r => gv(r, 'max_speed'),
        cell: r => gv(r, 'max_speed').toFixed(1) },
      { key: 'accdec', label: tt('match_reports.acc_dec', 'Acc+Dec'), num: true,
        val: accdec, cell: r => Math.round(accdec(r)) },
      { key: 'load',   label: tt('match_reports.player_load', 'Load'), num: true,
        val: r => gv(r, 'player_load'),
        cell: r => Math.round(gv(r, 'player_load')) },
      { key: 'cards',  label: tt('match_reports.cards', 'Cards'), num: false,
        val: r => ((r.s && r.s.yellow_cards) || 0) + ((r.s && r.s.red_cards) || 0) || null,
        cell: r => `<div class="mr-cards">${cards(r)}</div>` },
    ];
    const cols = CANDIDATES.filter(c => {
      if (_mrEditing) return !!c.edit;            // editar = sólo lo que se puede escribir
      if (c.editOnly) return false;               // amarillas/rojas sueltas viven en "Cards"
      return rows.some(r => c.val(r) != null);
    });

    if (thead) {
      thead.innerHTML = `<th>${esc(tt('common.player', 'Player'))}</th><th>${esc(tt('match_reports.pos', 'Pos'))}</th>`
        + cols.map(c => `<th class="${c.num ? 'num' : ''}">${esc(c.label)}${
            c.unit ? ` <span style="font-weight:400;color:var(--cm-fg-faint);text-transform:none">${esc(c.unit)}</span>` : ''}</th>`).join('');
    }

    tbody.innerHTML = rows.map(r => {
      const p = r.p;
      const name = `${p.first_name || ''} ${p.last_name || ''}`.trim() || tt('match_reports.unknown', 'Unknown');
      const init = `${p.first_name?.[0]||''}${p.last_name?.[0]||''}`.toUpperCase();
      const pos = p.position || (r.s && r.s.position) || '—';
      const posCls = POS_MAP[pos] || 'mf';
      const cells = cols.map(c => {
        if (_mrEditing){
          const edited = _mrEdits[r.id] || {};
          const cur = edited[c.edit] != null ? edited[c.edit]
                    : (c.edit === 'minutes' ? (r.min != null ? r.min : '')
                                            : ((r.s && r.s[c.edit] != null) ? r.s[c.edit] : ''));
          return `<td class="num"><input class="mr-edit" type="number" min="0"${
            c.max ? ` max="${c.max}"` : ''}${c.step ? ` step="${c.step}"` : ' step="1"'
            } data-p="${esc(r.id)}" data-f="${esc(c.edit)}" value="${esc(cur)}"></td>`;
        }
        return `<td class="${c.num ? 'num' : ''}">${c.val(r) != null ? c.cell(r) : '<span style="color:var(--cm-fg-faint)">—</span>'}</td>`;
      }).join('');
      return `<tr>
        <td><div class="mr-player"><div class="mr-av">${esc(init)}</div><div><div class="mr-pname">${esc(name)}</div><div class="mr-pdorsal">${esc(pos)}</div></div></div></td>
        <td><span class="mr-pos ${posCls}">${esc(pos)}</span></td>
        ${cells}
      </tr>`;
    }).join('');

    if (_mrEditing){
      tbody.querySelectorAll('.mr-edit').forEach(inp => {
        inp.addEventListener('input', ev => {
          const t = ev.target, v = t.value.trim();
          _mrEdits[t.dataset.p] = _mrEdits[t.dataset.p] || {};
          _mrEdits[t.dataset.p][t.dataset.f] = v === '' ? null : Number(v);
        });
      });
    }
    renderEditBar();
  }

  /* La barra de edición. Vive en la cabecera de la card: entrar, guardar, cancelar. */
  function renderEditBar(){
    const host = document.getElementById('mrPlayerTools');
    if (!host) return;
    if (!_mrEditing){
      host.innerHTML = `<button class="cm-btn is-outline is-sm" id="mrEditOn" type="button"${
        _mrMatchId ? '' : ' disabled title="' + esc(tt('match_reports.save_match_first', 'Save the match first.')) + '"'
      }><i class="ti ti-pencil" style="font-size:14px"></i>${esc(tt('match_reports.edit_stats', 'Edit stats'))}</button>`;
      const b = document.getElementById('mrEditOn');
      if (b && _mrMatchId) b.onclick = async () => {
        b.disabled = true;
        await loadSquad();
        _mrEditing = true; _mrEdits = {}; renderPlayerTable();
      };
      return;
    }
    host.innerHTML = `<span class="mr-edit-msg" id="mrEditMsg"></span>
      <button class="cm-btn is-outline is-sm" id="mrEditOff" type="button">${esc(tt('common.cancel', 'Cancel'))}</button>
      <button class="cm-btn is-primary is-sm" id="mrEditSave" type="button"><i class="ti ti-device-floppy" style="font-size:14px"></i>${esc(tt('common.save', 'Save'))}</button>`;
    document.getElementById('mrEditOff').onclick = () => { _mrEditing = false; _mrEdits = {}; renderPlayerTable(); };
    document.getElementById('mrEditSave').onclick = savePlayerStats;
  }

  /* Guardar lo editado y recontar las sanciones.

     El recuento no se incrementa: `afterMatchSaved` recalcula desde todos los partidos
     de la competición, así que corregir una tarjeta mal cargada arregla el acumulado en
     vez de sumarle otra. */
  async function savePlayerStats(){
    const msg = document.getElementById('mrEditMsg');
    const ids = Object.keys(_mrEdits);
    if (!ids.length){ _mrEditing = false; renderPlayerTable(); return; }
    if (!_mrMatchId || !_mrCtx || !_mrCtx.clubId) return;
    const btn = document.getElementById('mrEditSave'); if (btn) btn.disabled = true;
    if (msg){ msg.style.color = 'var(--cm-fg-muted)'; msg.textContent = tt('common.saving', 'Saving…'); }

    try {
      const payloads = ids.map(pid => {
        const row = (_mrPlayers || []).find(r => r.id === pid) || {};
        const prev = row.s || {};
        const values = {};
        // Lo ya guardado se conserva; sólo se pisa lo que se tocó en pantalla.
        (window.cmMatchStats ? window.cmMatchStats.fields() : []).forEach(f => {
          const v = _mrEdits[pid][f.key] !== undefined ? _mrEdits[pid][f.key] : prev[f.key];
          if (v != null && v !== '') values[f.key] = v;
        });
        const base = { club_id: _mrCtx.clubId, match_id: _mrMatchId, player_id: pid,
                       position: prev.position || null, extra: prev.extra || {} };
        return window.cmMatchStats ? window.cmMatchStats.toRow(values, base)
                                   : Object.assign(base, values);
      });
      const { error } = await window.sb.from('player_match_stats')
        .upsert(payloads, { onConflict: 'match_id,player_id' });
      if (error) throw error;

      let alerts = [];
      try {
        const names = {};
        (_mrPlayers || []).forEach(r => {
          names[r.id] = `${r.p.first_name || ''} ${r.p.last_name || ''}`.trim();
        });
        alerts = await window.cmSanctionsSync?.afterMatchSaved({ clubId: _mrCtx.clubId, playerNames: names }) || [];
      } catch (_e) {}

      _mrEditing = false; _mrEdits = {};
      await loadGPS(_mrCtx.match.id, _mrCtx.clubId);
      renderSanctions(_mrCtx.clubId);
      const m2 = document.getElementById('mrEditMsg');
      if (m2 && alerts.length){
        m2.style.color = 'var(--cm-warning)';
        m2.textContent = tt('sanctions.n_alerts', `${alerts.length} sanction alert(s)`, { count: alerts.length });
      }
    } catch (e){
      if (btn) btn.disabled = false;
      if (msg){ msg.style.color = 'var(--cm-danger)'; msg.textContent = tt('match_reports.import_error', 'Import error: {msg}', { msg: (e.message || e) }); }
    }
  }

  // ── Hero / scorers from real data ─────────────────────────────
  /* Pinta un escudo en el hero: la imagen si el club la tiene cargada, y si no las
     iniciales de siempre. Si la URL está rota se vuelve a las iniciales en vez de
     dejar el hueco del ícono partido. */
  function mrCrest(id, name, url){
    const el = document.getElementById(id); if (!el) return;
    const ini = mrInitials(name);
    // El color de relleno viene en el style del elemento y taparía el escudo, así que
    // se guarda para poder reponerlo si la imagen no carga.
    if (el.dataset.bg == null) el.dataset.bg = el.style.background || '';
    const restore = () => { el.classList.remove('has-img'); el.style.background = el.dataset.bg; el.textContent = ini; };
    if (!url){ restore(); return; }
    el.textContent = '';
    el.classList.add('has-img');
    el.style.background = '';
    const img = document.createElement('img');
    img.alt = name || '';
    img.onerror = restore;
    img.src = url;
    el.appendChild(img);
  }

  /* El escudo del rival sale de opponent_branding, que ya guarda los que el club fue
     cargando. El nombre del partido no siempre coincide letra por letra con el del
     branding ("Angkor Tiger" contra "Angkor Tiger FC"), así que se compara normalizado
     y se acepta que uno contenga al otro. */
  function mrOpponentCrest(name){
    const map = (_mrCtx && _mrCtx.crests) || null;
    if (!map || !name) return null;
    const n = mrNormName(name);
    if (!n) return null;
    if (map[n]) return map[n];
    const hit = Object.keys(map).find(k => k.indexOf(n) !== -1 || n.indexOf(k) !== -1);
    return hit ? map[hit] : null;
  }
  function mrNormName(s){
    return String(s == null ? '' : s).toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\b(fc|cf|sc|ac|afc|club|deportivo)\b/g, ' ')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function mrInitials(name){
    const w = String(name || '').trim().split(/\s+/).filter(Boolean);
    return ((w[0]?.[0] || '') + (w[1]?.[0] || '')).toUpperCase() || (name ? name.slice(0,2).toUpperCase() : '—');
  }
  function mrShortName(p){
    p = p || {};
    const f = p.first_name || '', l = p.last_name || '';
    if (f && l) return `${f[0]}. ${l}`;
    return (l || f || tt('match_reports.unknown', 'Unknown'));
  }
  function _set(id, txt){ const el = document.getElementById(id); if (el) el.textContent = txt; }

  function renderHero(match, r, club){
    const ourName = club?.name || tt('match_reports.us', 'Us');
    _set('mrHomeName', ourName);
    mrCrest('mrHomeCrest', ourName, club?.logo_url || null);

    const badge  = document.getElementById('mrResultBadge');
    const notice = document.getElementById('mrNotice');
    const crumb  = document.getElementById('mrCrumb');
    const shortDate = match ? mrShortDate(new Date(match.session_date)) : '';

    if (!r) {
      // blank scoreboard; no fabricated values
      _set('mrComp', '—');
      _set('mrVenue', match?.title || '—');
      _set('mrAwayName', '—');
      mrCrest('mrAwayCrest', '', null);
      _set('mrScoreFor', '–');
      _set('mrScoreAgainst', '–');
      _set('mrScoreMeta', '');
      _set('mrHomeSub', '');
      _set('mrAwaySub', '');
      if (badge) badge.style.display = 'none';
      if (notice) {
        if (match) { notice.textContent = tt('match_reports.no_match_data_entered', 'No match data entered for this session yet.'); notice.style.display = ''; }
        else { notice.style.display = 'none'; }
      }
      if (crumb) crumb.textContent = tt('match_reports.match_report', 'Match report');
      const sc = document.getElementById('mrScorers'); if (sc) sc.style.display = 'none';
      return;
    }

    const opponent = r.opponent || '—';
    _set('mrComp', r.competition || '—');
    _set('mrVenue', r.venue || match?.title || '—');
    _set('mrAwayName', opponent);
    mrCrest('mrAwayCrest', opponent === '—' ? '' : opponent,
            opponent === '—' ? null : mrOpponentCrest(opponent));
    _set('mrScoreFor', r.score_for ?? '–');
    _set('mrScoreAgainst', r.score_against ?? '–');
    _set('mrScoreMeta', '');

    const ha = r.home_away; // persisted value: "home" | "away" (do not translate the stored value)
    const homeLabel = ha === 'home' ? tt('match_reports.home', 'Home') : (ha === 'away' ? tt('match_reports.away', 'Away') : '');
    const awayLabel = ha === 'home' ? tt('match_reports.away', 'Away') : (ha === 'away' ? tt('match_reports.home', 'Home') : '');
    _set('mrHomeSub', [homeLabel, r.formation, r.possession != null ? tt('match_reports.possession_pct', `${r.possession}% possession`, { pct: r.possession }) : null].filter(Boolean).join(' · '));
    _set('mrAwaySub', awayLabel);

    if (badge) {
      if (r.score_for != null && r.score_against != null) {
        const isWin = r.score_for > r.score_against, isLoss = r.score_for < r.score_against;
        const resLabel = isWin ? tt('match_reports.win', 'Win') : (isLoss ? tt('match_reports.loss', 'Loss') : tt('match_reports.draw', 'Draw'));
        const ic = isWin ? ['ti-circle-check', '#86EFAC'] : (isLoss ? ['ti-circle-x', '#FCA5A5'] : ['ti-minus', '#FCD34D']);
        badge.innerHTML = `<i class="ti ${ic[0]}" style="font-size:13px;color:${ic[1]}"></i>${tt('match_reports.final', 'Final')} · ${resLabel}`;
        badge.style.display = '';
      } else { badge.style.display = 'none'; }
    }
    if (notice) notice.style.display = 'none';
    if (crumb) crumb.textContent = `${tt('match_reports.vs', 'vs')} ${opponent}${shortDate ? ' · ' + shortDate : ''}`;
    const sc = document.getElementById('mrScorers'); if (sc) sc.style.display = '';
  }

  /* Who is close to a suspension, without waiting for the alarm.
     Shows only players who need attention: at the threshold, or one away. A quiet squad
     hides the card entirely rather than showing a list of zeros. */
  async function renderSanctions(clubId){
    const card = document.getElementById('mrSanctionsCard');
    const body = document.getElementById('mrSanctionsBody');
    if (!card || !body || !window.cmSanctions || !window.cmSanctionsSync) return;
    if (!window.cmSanctions.accumulating().length) { card.style.display='none'; return; }
    let league = null, rows = [];
    try { ({ league, rows } = await window.cmSanctionsSync.standings(clubId)); } catch(_e){}
    if (!rows.length) { card.style.display='none'; return; }

    // Names, so the list reads like a squad and not like a set of ids.
    let names = {};
    try {
      const ids = rows.map(r => r.player_id);
      const { data } = await window.sb.from('players').select('id,first_name,last_name').in('id', ids);
      (data||[]).forEach(p => { names[p.id] = [p.first_name, p.last_name].filter(Boolean).join(' '); });
    } catch(_e){}

    const alerts = window.cmSanctions.alerts(league, rows.map(r => ({
      player_id: r.player_id, name: names[r.player_id] || '—', counts: r.counts,
    })));
    if (!alerts.length) { card.style.display='none'; return; }

    const lbl = document.getElementById('mrSanctionsLeague');
    if (lbl) lbl.textContent = (league && league.name) || '';
    const sName = k => { const t = window.cmSanctions.typeOf(k); return t ? tt(t.i18n, k) : k; };
    body.innerHTML = alerts.map(a => {
      const banned = a.status === 'reached';
      const color  = banned ? 'var(--cm-danger)' : 'var(--cm-warning)';
      const note   = banned
        ? tt('match_reports.sanction_misses', 'misses {n} match(es)', { n: a.banGames })
        : tt('match_reports.sanction_one_away', 'one away', {});
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--cm-border-soft)">
        <span style="width:6px;height:6px;border-radius:50%;background:${color};flex:none"></span>
        <span style="flex:1;min-width:0;font:500 12.5px/1.3 var(--cm-font-sans);color:var(--cm-fg-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</span>
        <span style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted)">${esc(sName(a.sanction))}</span>
        <span style="font:600 12px/1 var(--cm-font-mono);color:${color};font-variant-numeric:tabular-nums">${a.count}/${a.threshold}</span>
        <span style="font:500 10.5px/1 var(--cm-font-sans);color:${color}">${esc(note)}</span>
      </div>`;
    }).join('');
    card.style.display = '';
  }

  function renderScorers(stats){
    const box = document.getElementById('mrScorers');
    const ours = document.getElementById('mrScorersOurs');
    const opp  = document.getElementById('mrScorersOpp');
    if (!box || !ours || !opp) return;
    if (box.style.display === 'none') return; // hidden by renderHero when no match_results
    opp.innerHTML = ''; // we don't track opponent players

    const list = stats || [];
    const goals = list.filter(s => (s.goals || 0) > 0);
    const yellows = list.filter(s => (s.yellow_cards || 0) > 0);
    const reds = list.filter(s => (s.red_cards || 0) > 0);

    if (!goals.length && !yellows.length && !reds.length) {
      ours.innerHTML = `<div class="mr-scorer" style="opacity:.75">${tt('match_reports.no_goals_or_cards', 'No goals or cards recorded.')}</div>`;
      return;
    }
    let html = '';
    goals.forEach(s => { const n = s.goals || 1;
      html += `<div class="mr-scorer"><i class="ti ti-ball-football"></i><strong>${esc(mrShortName(s.players))}</strong>${n > 1 ? `<span class="min">×${n}</span>` : ''}</div>`; });
    yellows.forEach(s => {
      html += `<div class="mr-scorer"><i class="ti ti-square-rotated-filled ti yellow"></i><strong>${esc(mrShortName(s.players))}</strong></div>`; });
    reds.forEach(s => {
      html += `<div class="mr-scorer"><i class="ti ti-square-rotated-filled ti red"></i><strong>${esc(mrShortName(s.players))}</strong></div>`; });
    ours.innerHTML = html;
  }

  boot();

  let _mrTeamId = null;
  /* ═══════════════════════════════════════════════════════════════════════════
     Estadísticas de equipo (team_match_stats) — el partido y la temporada.

     Dos lecturas de lo mismo: la card de la derecha compara este partido contra el
     rival, y la de abajo pone cada partido en una línea para ver hacia dónde va el
     equipo. Las dos salen de la misma tabla, que hoy llena el export de equipo de
     Wyscout.
     ═══════════════════════════════════════════════════════════════════════════ */
  let _mrTrend = null;   // { series: [...], matchId } para redibujar al cambiar métrica
  let _mrTrendBlock = '_summary';   // qué bloque de métricas muestra la tabla de la temporada

  async function loadTeamStats(clubId, currentMatchId){
    const body = document.getElementById('mrTeamStatsBody');
    if (!body || !window.cmWyscoutTeamStats) return;

    let rows = [];
    try {
      const { data } = await window.sb.from('team_match_stats')
        .select('side, team_name, formation, stats, match_id, match_results!inner(id, match_date, opponent, team_id, score_for, score_against, home_away, competition)')
        .eq('club_id', clubId);
      rows = data || [];
    } catch (_e) { rows = []; }

    // El selector de equipo de arriba manda: sin él, la tendencia mezclaría plantel
    // principal y juveniles en la misma línea.
    if (_mrTeamId) rows = rows.filter(r => r.match_results && r.match_results.team_id === _mrTeamId);

    // ── 1. Este partido, contra el rival ──
    const here = rows.filter(r => r.match_id === currentMatchId);
    const us = here.find(r => r.side === 'us'), them = here.find(r => r.side === 'them');
    if (us) {
      renderTeamStatsCompare(us, them);
      renderKpis(us, them, rows);
      hydrateHeroScore(us, them);
    }
    else if (body) {
      body.innerHTML = `<div class="ts-empty">${tt('match_reports.ts_none_yet',
        'No team stats for this match yet — import a Wyscout team export.')}</div>`;
      const sub = document.getElementById('mrTeamStatsSub'); if (sub) sub.textContent = '';
    }

    // ── 2. La temporada ──
    const series = rows.filter(r => r.side === 'us' && r.match_results)
      .map(r => ({
        id: r.match_id,
        date: r.match_results.match_date,
        opponent: r.match_results.opponent || '—',
        score: (r.match_results.score_for != null && r.match_results.score_against != null)
          ? r.match_results.score_for + ':' + r.match_results.score_against : null,
        // Ganado / empatado / perdido, para leer cada número con su resultado al lado.
        res: (r.match_results.score_for == null || r.match_results.score_against == null) ? null
          : (r.match_results.score_for > r.match_results.score_against ? 'w'
            : (r.match_results.score_for < r.match_results.score_against ? 'l' : 'd')),
        ha: r.match_results.home_away || null,
        stats: r.stats || {},
      }))
      .sort((a, b) => String(a.date).localeCompare(String(b.date)));

    _mrTrend = { series, matchId: currentMatchId };
    buildTrendPicker();
  }

  /* Los cinco números del partido, arriba de todo.

     Cada uno lleva su contraste al lado, porque un número solo no dice nada: 12 remates
     puede ser mucho o poco, 12 contra 14 ya es una lectura. El contraste natural es el
     rival —que viene en el mismo archivo— y, cuando hay más partidos cargados, la
     distancia contra el propio promedio.

     xG va primero a propósito: es lo único que habla de la CALIDAD de lo generado, y
     suele contar una historia distinta a la posesión. */
  function renderKpis(us, them, allRows){
    const W = window.cmWyscoutTeamStats;
    const body = document.getElementById('mrKpiBody');
    if (!body || !W) return;
    const A = us.stats || {}, B = (them && them.stats) || {};

    // El promedio de la temporada, para saber si este partido se salió de lo habitual.
    const mine = (allRows || []).filter(r => r.side === 'us').map(r => r.stats || {});
    const avgOf = k => {
      const v = mine.map(s => s[k]).filter(x => x != null).map(Number);
      return v.length > 1 ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };

    const KPIS = [
      { key: 'xg', label: tt('team_stat.xg', 'xG'),
        // El xG del rival ES el xG en contra: por eso se guarda su fila entera.
        vs: B.xg != null ? tt('match_reports.kpi_vs_x', 'vs {v}', { v: W.format('xg', B.xg) }) : null },
      { key: 'shots_on_target', label: tt('match_reports.kpi_on_target', 'Shots on target'),
        vs: A.shots != null ? tt('match_reports.kpi_of_n', 'of {v} shots', { v: A.shots }) : null },
      { key: 'touches_in_penalty_area', label: tt('team_stat.touches_in_penalty_area', 'Touches in the box'),
        vs: B.touches_in_penalty_area != null ? tt('match_reports.kpi_vs_x', 'vs {v}', { v: B.touches_in_penalty_area }) : null },
      { key: 'possession_pct', label: tt('team_stat.possession_pct', 'Possession'),
        vs: A.average_passes_per_possession != null
          ? tt('match_reports.kpi_per_poss', '{v} passes per possession', { v: W.format('average_passes_per_possession', A.average_passes_per_possession) }) : null },
      { key: 'ppda', label: tt('team_stat.ppda', 'PPDA'),
        vs: B.ppda != null ? tt('match_reports.kpi_vs_x', 'vs {v}', { v: W.format('ppda', B.ppda) }) : null },
    ].filter(k => A[k.key] != null);

    if (!KPIS.length) return;

    body.removeAttribute('data-i18n');
    body.style.cssText = '';
    body.className = 'kpi-strip';
    body.innerHTML = KPIS.map(k => {
      const v = A[k.key], avg = avgOf(k.key);
      let delta = '';
      if (avg != null){
        const d = Number(v) - avg;
        const better = W.lowerIsBetter(k.key) ? d < 0 : d > 0;
        const flat = Math.abs(d) < 1e-9;
        // La diferencia contra el promedio de un conteo va con un decimal: "0,67 remates
        // al arco de más" finge una precisión que el dato no tiene.
        const counts = mine.map(s => s[k.key]).filter(x => x != null).every(x => Number.isInteger(Number(x)));
        const amount = counts ? String(Math.round(Math.abs(d) * 10) / 10).replace('.', ',')
                              : W.format(k.key, Math.abs(d));
        delta = `<span class="kpi-d ${flat ? '' : (better ? 'up' : 'down')}">${
          flat ? '=' : (d > 0 ? '↑' : '↓')} ${esc(amount)} ${
          esc(tt('match_reports.kpi_vs_avg', 'vs avg'))}</span>`;
      }
      return `<div class="kpi">
        <div class="kpi-l">${esc(k.label)}</div>
        <div class="kpi-v">${esc(W.format(k.key, v))}</div>
        <div class="kpi-s">${k.vs ? esc(k.vs) : ''}${delta}</div>
      </div>`;
    }).join('');
  }

  /* El encabezado se queda con dos guiones cuando el informe no tiene marcador, aunque
     el archivo importado sí lo traiga. Desde el import se guarda en match_results, pero
     los partidos cargados antes de eso —y cualquiera donde alguien saltee ese campo—
     seguirían en blanco. Acá se completa en pantalla, sin escribir nada: el dato ya
     está en las métricas del equipo. */
  function hydrateHeroScore(us, them){
    if (!_mrCtx || !_mrCtx.result) return;
    const r = _mrCtx.result;
    const A = us.stats || {}, B = (them && them.stats) || {};
    const gf = A.goals, ga = (B.goals != null) ? B.goals : A.conceded_goals;
    const needScore = r.score_for == null && gf != null && ga != null;
    const needPoss  = r.possession == null && A.possession_pct != null;
    if (!needScore && !needPoss) return;

    _mrCtx.result = Object.assign({}, r,
      needScore ? { score_for: Math.round(gf), score_against: Math.round(ga) } : null,
      needPoss  ? { possession: Math.round(A.possession_pct) } : null);
    renderHero(_mrCtx.match, _mrCtx.result, _mrCtx.club);
  }

  function renderTeamStatsCompare(us, them){
    const W = window.cmWyscoutTeamStats;
    const body = document.getElementById('mrTeamStatsBody');
    const sub = document.getElementById('mrTeamStatsSub');
    const A = us.stats || {}, B = (them && them.stats) || {};
    if (sub) sub.textContent = them ? '' : tt('match_reports.ts_no_opponent', 'our side only');

    const head = `
      <div class="ts-head">
        <span class="nm">${mrEsc(us.team_name || tt('match_reports.ts_our_team', 'Our team'))}${
          us.formation ? `<small>${mrEsc(us.formation)}</small>` : ''}</span>
        <span class="vs">${tt('match_reports.ts_vs', 'vs')}</span>
        <span class="nm r">${mrEsc((them && them.team_name) || '—')}${
          (them && them.formation) ? `<small>${mrEsc(them.formation)}</small>` : ''}</span>
      </div>`;

    const rows = W.HIGHLIGHT.filter(k => A[k] != null || B[k] != null).map(k => {
      const a = Number(A[k]) || 0, b = Number(B[k]) || 0, t = a + b;
      // Las barras comparan la parte de cada equipo. Sin rival cargado, la nuestra va
      // llena: no hay contra qué medirla y media barra sugeriría un empate que no existe.
      const pa = them ? (t ? (a / t) * 100 : 50) : 100;
      const pb = them ? (t ? (b / t) * 100 : 50) : 0;
      return `<div class="ts-row">
          <div class="ts-top">
            <span class="ts-v">${A[k] != null ? mrEsc(W.format(k, A[k])) : '—'}</span>
            <span class="ts-k">${mrEsc(W.label(k))}</span>
            <span class="ts-v">${B[k] != null ? mrEsc(W.format(k, B[k])) : '—'}</span>
          </div>
          <div class="ts-bars">
            <span class="l"><i style="width:${pa}%"></i></span>
            <span class="r"><i style="width:${pb}%"></i></span>
          </div>
        </div>`;
    }).join('');

    // Las zonas merecen su propio dibujo: son seis números que sólo se entienden
    // puestos sobre el campo.
    const zoneKeys = ['recoveries_low', 'recoveries_medium', 'recoveries_high',
                      'losses_low', 'losses_medium', 'losses_high'];
    let zones = '';
    if (zoneKeys.some(k => A[k] != null)) {
      const third = (sfx, label) => `
        <div class="ts-third">
          <span class="zl">${mrEsc(label)}</span>
          <span class="zv"><i style="background:var(--cm-success)"></i><b>${A['recoveries_' + sfx] != null ? A['recoveries_' + sfx] : '—'}</b></span>
          <span class="zv"><i style="background:var(--cm-danger)"></i><b>${A['losses_' + sfx] != null ? A['losses_' + sfx] : '—'}</b></span>
        </div>`;
      zones = `
        <div class="ts-zones">
          <div class="ts-zones-h">${tt('match_reports.ts_zones', 'Recoveries and losses by third')}</div>
          <div class="ts-pitch">
            ${third('low', tt('match_reports.ts_zone_own', 'Own third'))}
            ${third('medium', tt('match_reports.ts_zone_mid', 'Middle third'))}
            ${third('high', tt('match_reports.ts_zone_final', 'Final third'))}
          </div>
          <div class="ts-legend">
            <span><i style="background:var(--cm-success)"></i>${tt('team_stat.recoveries', 'Recoveries')}${A.recoveries != null ? ' · ' + A.recoveries : ''}</span>
            <span><i style="background:var(--cm-danger)"></i>${tt('team_stat.losses', 'Losses')}${A.losses != null ? ' · ' + A.losses : ''}</span>
          </div>
        </div>`;
    }

    // El resto de las métricas, por idea y plegadas: la card no puede medir dos metros,
    // pero tampoco tiene sentido guardar 79 datos y no dar manera de mirarlos. El
    // primer bloque abre para que se vea que hay más abajo.
    const sections = W.groups().map((g, i) => {
      const ks = g.keys.filter(k => A[k] != null || B[k] != null);
      if (!ks.length) return '';
      const lines = ks.map(k => `<div class="ts-gr">
          <span class="v">${A[k] != null ? esc(W.format(k, A[k])) : '—'}</span>
          <span class="k" title="${esc(W.originalLabel(k))}">${esc(W.label(k))}</span>
          <span class="v r">${B[k] != null ? esc(W.format(k, B[k])) : '—'}</span>
        </div>`).join('');
      return `<details class="ts-sec"${i === 0 ? ' open' : ''}>
          <summary>${esc(g.label)}<span class="n">${ks.length}</span></summary>
          <div class="ts-grid">${lines}</div>
        </details>`;
    }).join('');

    body.innerHTML = head + `<div class="ts-rows">${rows}</div>` + zones + sections;
  }

  function buildTrendPicker(){
    const W = window.cmWyscoutTeamStats;
    const card = document.getElementById('mrTrendCard');
    const sel = document.getElementById('mrTrendMetric');
    if (!card || !sel || !_mrTrend) return;
    const series = _mrTrend.series;

    // Con un solo partido no hay evolución que mirar; la card se queda guardada hasta
    // que haya un segundo con qué comparar.
    if (series.length < 2){ card.style.display = 'none'; return; }
    card.style.display = '';

    const options = W.TREND.filter(k => series.some(s => s.stats[k] != null));
    if (!options.length){ card.style.display = 'none'; return; }
    const keep = sel.value && options.indexOf(sel.value) !== -1 ? sel.value : options[0];
    sel.innerHTML = options.map(k => `<option value="${k}" ${k === keep ? 'selected' : ''}>${mrEsc(W.label(k))}</option>`).join('');
    sel.onchange = () => renderTrend(sel.value);
    renderTrend(keep);
  }

  function renderTrend(key){
    const W = window.cmWyscoutTeamStats;
    const body = document.getElementById('mrTrendBody');
    const sub = document.getElementById('mrTrendSub');
    if (!body || !_mrTrend) return;

    const pts = _mrTrend.series.filter(s => s.stats[key] != null)
      .map(s => Object.assign({}, s, { v: Number(s.stats[key]) }));
    if (pts.length < 2){ body.innerHTML = `<div class="ts-empty">${tt('match_reports.trend_need_more', 'Not enough matches with this metric yet.')}</div>`; return; }

    if (sub) sub.textContent = tt('match_reports.trend_n_matches', `${pts.length} matches`, { count: pts.length });

    const vals = pts.map(p => p.v);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const last = vals[vals.length - 1], prev = vals[vals.length - 2];
    const lower = W.lowerIsBetter(key);

    // ── KPIs. El signo del cambio no alcanza: en PPDA o pérdidas, bajar es mejorar,
    //    así que la dirección se decide por métrica y se escribe con palabras.
    const delta = last - prev;
    const better = lower ? delta < 0 : delta > 0;
    const same = Math.abs(delta) < 1e-9;
    const arrow = same ? '→' : (delta > 0 ? '↑' : '↓');
    const cls = same ? '' : (better ? 'up' : 'down');
    const word = same ? tt('match_reports.trend_flat', 'no change')
      : (better ? tt('match_reports.trend_better', 'better') : tt('match_reports.trend_worse', 'worse'));
    const best = lower ? Math.min.apply(null, vals) : Math.max.apply(null, vals);

    const kpis = `
      <div class="tr-kpis">
        <div class="tr-kpi"><div class="kl">${tt('match_reports.trend_last', 'Last match')}</div>
          <div class="kv">${mrEsc(W.format(key, last))}</div>
          <div class="kd ${cls}">${arrow} ${mrEsc(W.format(key, Math.abs(delta)))} · ${mrEsc(word)}</div></div>
        <div class="tr-kpi"><div class="kl">${tt('match_reports.trend_avg', 'Season average')}</div>
          <div class="kv">${mrEsc(W.format(key, avg))}</div>
          <div class="kd">${tt('match_reports.trend_over_n', `over ${pts.length} matches`, { count: pts.length })}</div></div>
        <div class="tr-kpi"><div class="kl">${tt('match_reports.trend_best', 'Best')}</div>
          <div class="kv">${mrEsc(W.format(key, best))}</div>
          <div class="kd">${mrEsc((pts.find(p => p.v === best) || {}).opponent || '')}</div></div>
      </div>`;

    // ── El gráfico. Una serie: la identidad la da el título, no hace falta leyenda.
    const n = pts.length;
    const PADL = 46, PADR = 22, PADT = 18, PADB = 30, H = 168;
    // El ancho se toma de la card: con cuatro partidos el gráfico llenaba un tercio y
    // dejaba el resto en blanco. Cuando no entran, el mínimo por partido manda y el
    // contenedor scrollea.
    const avail = Math.max(320, (body.clientWidth || 900) - 32);
    const step = Math.max(58, (avail - PADL - PADR) / Math.max(1, n - 1));
    const W_ = PADL + PADR + step * (n - 1);
    const plotH = H - PADT - PADB;

    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo){ hi = lo + 1; lo = lo - 1; }
    const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
    const x = i => PADL + step * i;
    const y = v => PADT + plotH - ((v - lo) / (hi - lo)) * plotH;

    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const area = `M${x(0).toFixed(1)},${(PADT + plotH).toFixed(1)} `
      + pts.map((p, i) => `L${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')
      + ` L${x(n - 1).toFixed(1)},${(PADT + plotH).toFixed(1)} Z`;

    // Rejilla recesiva: tres referencias, cada una etiquetada con un valor real.
    const ticks = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1];
    const grid = ticks.map(t => `
      <line x1="${PADL}" y1="${y(t).toFixed(1)}" x2="${(W_ - PADR).toFixed(1)}" y2="${y(t).toFixed(1)}"
            stroke="var(--cm-border-soft)" stroke-width="1"/>
      <text x="${PADL - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end"
            font-family="var(--cm-font-mono)" font-size="10" fill="var(--cm-fg-faint)">${mrEsc(W.format(key, t))}</text>`).join('');

    const dots = pts.map((p, i) => {
      const isNow = p.id === _mrTrend.matchId;
      const title = `${p.opponent}${p.score ? ' · ' + p.score : ''} — ${W.format(key, p.v)}`;
      return `<g class="tr-pt">
          <circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${isNow ? 5 : 3.5}"
                  fill="${isNow ? 'var(--cm-accent)' : 'var(--cm-surface)'}"
                  stroke="var(--cm-accent)" stroke-width="2"/>
          <circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="14" fill="transparent">
            <title>${mrEsc(title)}</title>
          </circle>
        </g>`;
    }).join('');

    // Sólo se rotulan los extremos y el partido abierto: un número sobre cada punto
    // tapa la forma de la línea, que es lo que se vino a mirar.
    // Los extremos se anclan al borde en vez de centrarse: centrado, el texto del último
    // punto se sale del viewBox y queda cortado.
    const anchor = i => i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
    const labelIdx = new Set([0, n - 1, pts.findIndex(p => p.id === _mrTrend.matchId)].filter(i => i >= 0));
    const labels = Array.from(labelIdx).map(i => `
      <text x="${x(i).toFixed(1)}" y="${(y(pts[i].v) - 11).toFixed(1)}" text-anchor="${anchor(i)}"
            font-family="var(--cm-font-mono)" font-size="10.5" font-weight="600"
            fill="var(--cm-fg-strong)">${mrEsc(W.format(key, pts[i].v))}</text>`).join('');

    const xlabels = pts.map((p, i) => {
      // Con muchos partidos se alternan las etiquetas para que no se pisen.
      if (n > 9 && i % 2 && i !== n - 1) return '';
      // Cortar a lo bruto deja nombres irreconocibles ("Angkor T"): mejor cortar en el
      // espacio y marcar con puntos suspensivos que quedó recortado.
      const raw = String(p.opponent);
      const nm = raw.length <= 12 ? raw
        : (raw.slice(0, 12).replace(/\s+\S*$/, '') || raw.slice(0, 11)) + '…';
      return `<text x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="${anchor(i)}"
              font-family="var(--cm-font-sans)" font-size="10"
              fill="${p.id === _mrTrend.matchId ? 'var(--cm-fg-strong)' : 'var(--cm-fg-faint)'}">${mrEsc(nm)}</text>`;
    }).join('');

    body.innerHTML = kpis + `
      <div class="tr-chart">
        <svg viewBox="0 0 ${W_.toFixed(0)} ${H}" width="${W_.toFixed(0)}" height="${H}" role="img"
             aria-label="${mrEsc(W.label(key))}">
          <defs><linearGradient id="trFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--cm-accent)" stop-opacity="0.13"/>
            <stop offset="100%" stop-color="var(--cm-accent)" stop-opacity="0"/>
          </linearGradient></defs>
          ${grid}
          <line x1="${PADL}" y1="${y(avg).toFixed(1)}" x2="${(W_ - PADR).toFixed(1)}" y2="${y(avg).toFixed(1)}"
                stroke="var(--cm-fg-faint)" stroke-width="1" stroke-dasharray="3 3"/>
          <path d="${area}" fill="url(#trFill)"/>
          <path d="${line}" fill="none" stroke="var(--cm-accent)" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round"/>
          ${dots}${labels}${xlabels}
        </svg>
      </div>
      <div class="tr-note">${tt('match_reports.trend_note',
        'Dashed line: season average. Filled dot: the match open above. Hover a point for the opponent.')}</div>`
      + renderTrendTable();

    // El selector de bloque se redibuja con la tabla, así que se re-engancha acá.
    const bs = document.getElementById('mrTtBlock');
    if (bs) bs.onchange = () => { _mrTrendBlock = bs.value; renderTrend(key); };
  }

  /* La temporada entera de un vistazo: una fila por partido, las métricas clave en
     columnas, cada celda marcada según esté por encima o por debajo del promedio.
     El gráfico de arriba profundiza UNA métrica; esto sirve para lo contrario —
     encontrar el patrón sin saber de antemano qué se busca. */
  function renderTrendTable(){
    const W = window.cmWyscoutTeamStats;
    if (!_mrTrend || _mrTrend.series.length < 2) return '';

    // El bloque por defecto es el resumen: una métrica por idea (tener, progresar,
    // generar, presionar, arriesgar). Los demás se eligen en el selector — veinte
    // columnas a la vez no dejan leer ningún patrón, pero esconderlas tampoco sirve.
    const SUMMARY = ['possession_pct', 'xg', 'progressive_passes_accurate',
                     'passes_to_final_third_accurate', 'penalty_area_entries',
                     'ppda', 'recoveries_high', 'losses_low'];
    const blocks = [{ key: '_summary', label: tt('match_reports.tt_summary', 'Overview'), keys: SUMMARY }]
      .concat(W.groups())
      .map(g => ({ ...g, keys: g.keys.filter(k => _mrTrend.series.some(s => s.stats[k] != null)) }))
      .filter(g => g.keys.length);
    if (!blocks.length) return '';

    const pick = blocks.some(b => b.key === _mrTrendBlock) ? _mrTrendBlock : blocks[0].key;
    _mrTrendBlock = pick;
    const cols = blocks.find(b => b.key === pick).keys;

    // El promedio es la vara: se calcula sobre los partidos que tienen el dato.
    const avg = {};
    cols.forEach(k => {
      const v = _mrTrend.series.map(s => s.stats[k]).filter(x => x != null).map(Number);
      avg[k] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    });

    const RES = { w: ['w', tt('match_reports.res_w', 'W')], d: ['d', tt('match_reports.res_d', 'D')],
                  l: ['l', tt('match_reports.res_l', 'L')] };

    // Más reciente arriba: es el partido que a uno le importa.
    const rows = _mrTrend.series.slice().reverse().map(s => {
      const cells = cols.map(k => {
        const v = s.stats[k];
        if (v == null) return `<td class="num"><span style="color:var(--cm-fg-faint)">—</span></td>`;
        const d = avg[k] == null ? 0 : Number(v) - avg[k];
        // Sobre el promedio no siempre es bueno: en PPDA y pérdidas es al revés.
        const better = W.lowerIsBetter(k) ? d < 0 : d > 0;
        const mark = Math.abs(d) < 1e-9 ? '' : (better ? 'up' : 'down');
        const arrow = Math.abs(d) < 1e-9 ? '' : (d > 0 ? '↑' : '↓');
        return `<td class="num"><span class="tt-v ${mark}">${esc(W.format(k, v))}<i>${arrow}</i></span></td>`;
      }).join('');
      const r = s.res ? RES[s.res] : null;
      return `<tr class="${s.id === _mrTrend.matchId ? 'is-now' : ''}">
        <td class="tt-opp">${esc(s.opponent)}${s.score ? `<small>${esc(s.score)}</small>` : ''}</td>
        <td>${r ? `<span class="tt-res ${r[0]}">${esc(r[1])}</span>` : ''}</td>
        <td>${s.ha ? `<span class="tt-ha">${esc(s.ha === 'home'
          ? tt('match_reports.ha_h', 'H') : tt('match_reports.ha_a', 'A'))}</span>` : ''}</td>
        ${cells}</tr>`;
    }).join('');

    // El promedio de un conteo lleva un decimal, no dos: "28,2 entradas al área" se lee,
    // "28,20" parece una precisión que el dato no tiene. xG y PPDA sí son decimales de
    // origen y conservan su formato.
    const avgRow = cols.map(k => {
      if (avg[k] == null) return '<td class="num">—</td>';
      const counts = _mrTrend.series.map(s => s.stats[k]).filter(x => x != null).every(x => Number.isInteger(Number(x)));
      const txt = counts ? String(Math.round(avg[k] * 10) / 10).replace('.', ',') : W.format(k, avg[k]);
      return `<td class="num">${esc(txt)}</td>`;
    }).join('');

    return `
      <div class="tt-wrap">
        <div class="tt-h">
          <span>${esc(tt('match_reports.trend_table', 'Match by match'))}</span>
          <select id="mrTtBlock" class="cm-select">${
            blocks.map(b => `<option value="${esc(b.key)}" ${b.key === pick ? 'selected' : ''}>${esc(b.label)}</option>`).join('')}</select>
        </div>
        <div class="tscroll-x">
          <table class="mr-table tt">
            <thead><tr>
              <th>${esc(tt('match_reports.opponent', 'Opponent'))}</th><th></th><th></th>
              ${cols.map(k => `<th class="num" title="${esc(W.label(k))} · ${esc(W.originalLabel(k))}">${esc(W.shortLabel(k))}</th>`).join('')}
            </tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr>
              <td colspan="3">${esc(tt('match_reports.trend_avg', 'Season average'))}</td>${avgRow}
            </tr></tfoot>
          </table>
        </div>
        <div class="tt-legend">
          <span><i class="up">↑</i>${esc(tt('match_reports.tt_better', 'better than your average'))}</span>
          <span><i class="down">↓</i>${esc(tt('match_reports.tt_worse', 'worse'))}</span>
        </div>
      </div>`;
  }

  function mrEsc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  async function mrInitTeamSwitch(clubId) {
    const prof = await window.getProfile();
    const bucket = (prof?.role || prof?.club_role || '').toLowerCase();
    let full = bucket === 'admin' || bucket === 'owner';
    if (!full && window.isSuperAdmin) { try { full = await window.isSuperAdmin(); } catch {} }
    let teams = await window.getTeams(clubId);
    if (!full) { let mine=[]; try{mine=(await window.sb.rpc('my_team_ids')).data||[];}catch{} const s=new Set(mine); teams=teams.filter(t=>s.has(t.id)); }
    const sel = document.getElementById('mrTeamSelect');
    if (!teams.length) { sel.innerHTML='<option value="">No teams</option>'; return; }
    const saved = sessionStorage.getItem('cal_active_team');
    _mrTeamId = (saved && teams.some(t=>t.id===saved)) ? saved : teams[0].id;
    sel.innerHTML = teams.map(t=>`<option value="${t.id}" ${t.id===_mrTeamId?'selected':''}>${esc(t.name)}</option>`).join('');
  }
  function mrOnTeamChange(){ _mrTeamId=document.getElementById('mrTeamSelect').value; sessionStorage.setItem('cal_active_team',_mrTeamId); location.reload(); }
  window.mrOnTeamChange = mrOnTeamChange;
</script>

<script>
  document.querySelectorAll('.mr-tabs').forEach(g => g.querySelectorAll('.mr-tab').forEach(b => b.addEventListener('click', () => {
    g.querySelectorAll('.mr-tab').forEach(o => o.classList.remove('is-on'));
    b.classList.add('is-on');
  })));

  // Import drawer toggle
  const impDrawer = document.getElementById('impDrawer');
  const impOverlay = document.getElementById('impOverlay');
  const open = () => { impDrawer.classList.add('is-open'); impOverlay.classList.add('is-open'); };
  const close = () => { impDrawer.classList.remove('is-open'); impOverlay.classList.remove('is-open'); };
  document.getElementById('impOpen').addEventListener('click', () => {
    open();
    if (window.matchImport) window.matchImport.open(); // (re)build the form with fresh sessions
  });
  document.getElementById('impClose').addEventListener('click', close);
  document.getElementById('impCancel').addEventListener('click', close);
  impOverlay.addEventListener('click', close);
</script>
