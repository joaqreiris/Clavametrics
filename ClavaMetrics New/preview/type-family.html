<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Geist family</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:28px;background:#fff;font:var(--cm-body);}
  .fam{display:grid;grid-template-columns:120px 1fr;gap:16px;margin-bottom:18px;align-items:baseline;}
  .meta{font:500 11px/1 var(--cm-font-mono);color:#8A93A0;letter-spacing:0.06em;text-transform:uppercase;}
  .specimen{font-family:var(--cm-font-sans);font-size:46px;line-height:1;letter-spacing:-0.02em;color:#0A0A0A;}
  .specimen.mono{font-family:var(--cm-font-mono);font-size:36px;letter-spacing:-0.01em;}
  .specimen .weights{display:flex;gap:14px;font-size:18px;color:#6B7280;margin-top:10px;letter-spacing:0;font-weight:400;}
  .specimen .weights span{font-weight:var(--w);}
</style></head><body>
  <div class="fam">
    <div class="meta">Geist · Sans</div>
    <div>
      <div class="specimen">Aa · Performance OS</div>
      <div class="weights">
        <span style="--w:300">300</span><span style="--w:400">400</span><span style="--w:500">500</span><span style="--w:600">600</span><span style="--w:700">700</span>
      </div>
    </div>
  </div>
  <div class="fam">
    <div class="meta">Geist Mono</div>
    <div>
      <div class="specimen mono">0123 · ACWR 1.18</div>
      <div class="weights" style="font-family:var(--cm-font-mono)">
        <span style="--w:400">400</span><span style="--w:500">500</span><span style="--w:600">600</span>
      </div>
    </div>
  </div>
</body></html>
