<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Status palette</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:24px;background:#fff;font:var(--cm-body);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .item{border:1px solid #E5E7EB;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff;}
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:500 11.5px/1 var(--cm-font-sans);width:fit-content;border:1px solid;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .name{font:600 13px/1 var(--cm-font-sans);color:#0A0A0A;}
  .hex{font:500 11px/1 var(--cm-font-mono);color:#8A93A0;}
</style></head><body>
<div class="grid">
  <div class="item">
    <div class="pill" style="background:#ECFDF5;color:#16A34A;border-color:#BBF7D0;"><span class="dot" style="background:#16A34A"></span>Available</div>
    <div class="name">Success</div><div class="hex">#16A34A · ECFDF5 · BBF7D0</div>
  </div>
  <div class="item">
    <div class="pill" style="background:#FFFBEB;color:#D97706;border-color:#FDE68A;"><span class="dot" style="background:#D97706"></span>Partial</div>
    <div class="name">Warning</div><div class="hex">#D97706 · FFFBEB · FDE68A</div>
  </div>
  <div class="item">
    <div class="pill" style="background:#FEF2F2;color:#DC2626;border-color:#FECACA;"><span class="dot" style="background:#DC2626"></span>Injury</div>
    <div class="name">Danger</div><div class="hex">#DC2626 · FEF2F2 · FECACA</div>
  </div>
  <div class="item">
    <div class="pill" style="background:#EFF6FF;color:#2563EB;border-color:#BFDBFE;"><span class="dot" style="background:#2563EB"></span>Nat. team</div>
    <div class="name">Info</div><div class="hex">#2563EB · EFF6FF · BFDBFE</div>
  </div>
  <div class="item">
    <div class="pill" style="background:#F5F3FF;color:#7C3AED;border-color:#DDD6FE;"><span class="dot" style="background:#7C3AED"></span>Illness</div>
    <div class="name">Violet</div><div class="hex">#7C3AED · F5F3FF · DDD6FE</div>
  </div>
  <div class="item">
    <div class="pill" style="background:#F3F4F6;color:#4B5563;border-color:#E5E7EB;"><span class="dot" style="background:#4B5563"></span>Absent</div>
    <div class="name">Neutral</div><div class="hex">#4B5563 · F3F4F6 · E5E7EB</div>
  </div>
</div>
</body></html>
