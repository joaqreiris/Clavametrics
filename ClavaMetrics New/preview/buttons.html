<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:22px;background:#fff;font:var(--cm-body);display:flex;flex-direction:column;gap:18px;}
  :root{--cm-accent:#15803D;--cm-accent-hover:#166534;--cm-accent-soft:#ECFDF5;--cm-fg-on-accent:#fff;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .lbl{font:500 11px/1 var(--cm-font-mono);color:#8A93A0;letter-spacing:0.06em;text-transform:uppercase;width:70px;}
</style></head><body class="cm">
  <div class="row"><span class="lbl">Primary</span>
    <button class="cm-btn is-primary"><i class="ti ti-plus" style="font-size:14px"></i>New session</button>
    <button class="cm-btn is-primary is-sm">Save</button>
    <button class="cm-btn is-primary is-lg">Approve session →</button>
    <button class="cm-btn is-primary" disabled>Disabled</button>
  </div>
  <div class="row"><span class="lbl">Secondary</span>
    <button class="cm-btn is-secondary">Cancel</button>
    <button class="cm-btn is-outline">Outline</button>
    <button class="cm-btn is-ghost">Ghost link</button>
    <button class="cm-btn is-danger">Delete</button>
  </div>
  <div class="row"><span class="lbl">Icon</span>
    <button class="cm-icon-btn"><i class="ti ti-bell"></i></button>
    <button class="cm-icon-btn"><i class="ti ti-search"></i></button>
    <button class="cm-icon-btn"><i class="ti ti-settings"></i></button>
    <button class="cm-icon-btn"><i class="ti ti-dots"></i></button>
    <span class="cm-kbd">⌘</span><span class="cm-kbd">K</span>
  </div>
</body></html>
