<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Inputs</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:24px;background:#fff;font:var(--cm-body);display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  :root{--cm-accent:#15803D;}
</style></head><body class="cm">
  <div class="cm-field">
    <label class="cm-label">Work email</label>
    <div class="cm-input-affix"><i class="ti ti-mail"></i><input placeholder="you@yourteam.com" value="joaquin@clavafc.com"></div>
    <span class="cm-hint">We'll send a verification link.</span>
  </div>
  <div class="cm-field">
    <label class="cm-label">Country</label>
    <select class="cm-select"><option>Argentina</option><option>Brasil</option></select>
  </div>
  <div class="cm-field">
    <label class="cm-label">City</label>
    <div class="cm-input-affix"><i class="ti ti-map-pin"></i><input value="Rosario"></div>
  </div>
  <div class="cm-field">
    <label class="cm-label">Short name</label>
    <input class="cm-input" value="CLA" maxlength="6">
  </div>
</body></html>
