<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Iconography — Tabler</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:22px;background:#fff;font:var(--cm-body);display:grid;grid-template-columns:repeat(10,1fr);gap:10px;}
  .ic{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;border:1px solid #EFEFED;border-radius:8px;}
  .ic .ti{font-size:20px;color:#0A0A0A;}
  .ic span{font:500 9px/1 var(--cm-font-mono);color:#9CA3AF;letter-spacing:0.05em;text-align:center;}
</style></head><body>
  <div class="ic"><i class="ti ti-home"></i><span>home</span></div>
  <div class="ic"><i class="ti ti-clipboard-list"></i><span>planner</span></div>
  <div class="ic"><i class="ti ti-soccer-field"></i><span>field</span></div>
  <div class="ic"><i class="ti ti-users-group"></i><span>squad</span></div>
  <div class="ic"><i class="ti ti-user-check"></i><span>avail</span></div>
  <div class="ic"><i class="ti ti-heartbeat"></i><span>wellness</span></div>
  <div class="ic"><i class="ti ti-activity"></i><span>rpe</span></div>
  <div class="ic"><i class="ti ti-chart-line"></i><span>load</span></div>
  <div class="ic"><i class="ti ti-radar-2"></i><span>gps</span></div>
  <div class="ic"><i class="ti ti-bandage"></i><span>injury</span></div>
  <div class="ic"><i class="ti ti-stethoscope"></i><span>physio</span></div>
  <div class="ic"><i class="ti ti-apple"></i><span>nutrition</span></div>
  <div class="ic"><i class="ti ti-calendar-stats"></i><span>cal</span></div>
  <div class="ic"><i class="ti ti-list-tree"></i><span>library</span></div>
  <div class="ic"><i class="ti ti-message-circle"></i><span>chat</span></div>
  <div class="ic"><i class="ti ti-bell"></i><span>bell</span></div>
  <div class="ic"><i class="ti ti-search"></i><span>search</span></div>
  <div class="ic"><i class="ti ti-settings"></i><span>settings</span></div>
  <div class="ic"><i class="ti ti-user-shield"></i><span>admin</span></div>
  <div class="ic"><i class="ti ti-trophy"></i><span>trophy</span></div>
</body></html>
