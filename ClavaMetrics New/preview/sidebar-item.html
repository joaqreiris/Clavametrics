<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Sidebar item</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;height:100vh;}
  .pane{padding:18px 14px;display:flex;flex-direction:column;gap:4px;}
  .pane.dark{background:#0E1116;color:#E6E8EB;}
  .pane.light{background:#FAFAF9;color:#0A0A0A;}
  .label{font:500 10.5px/1 var(--cm-font-mono);letter-spacing:0.06em;text-transform:uppercase;color:#8A93A0;padding:8px 10px 4px;}
  .pane.light .label{color:#6B7280;}
  .it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font:500 13.5px/1 var(--cm-font-sans);color:inherit;opacity:0.7;}
  .it .ti{font-size:17px;}
  .it .ct{margin-left:auto;font:500 11.5px/1 var(--cm-font-mono);opacity:0.6;}
  .pane.dark .it.on{background:rgba(34,197,94,0.10);color:#4ADE80;opacity:1;}
  .pane.dark .it:hover{background:rgba(255,255,255,0.06);opacity:1;}
  .pane.light .it.on{background:#F0F0EE;color:#0A0A0A;opacity:1;font-weight:600;}
  .pane.light .it:hover{background:#F0F0EE;opacity:1;}
</style></head><body>
<div class="pane dark">
  <div class="label">Technical</div>
  <a class="it on"><i class="ti ti-home"></i>Staff Hub</a>
  <a class="it"><i class="ti ti-calendar-stats"></i>Calendar<span class="ct">⌘K</span></a>
  <a class="it"><i class="ti ti-users-group"></i>Squad</a>
  <a class="it"><i class="ti ti-user-check"></i>Availability<span class="ct">3</span></a>
</div>
<div class="pane light">
  <div class="label">Technical</div>
  <a class="it on"><i class="ti ti-home"></i>Staff Hub</a>
  <a class="it"><i class="ti ti-calendar-stats"></i>Calendar<span class="ct">⌘K</span></a>
  <a class="it"><i class="ti ti-users-group"></i>Squad</a>
  <a class="it"><i class="ti ti-user-check"></i>Availability<span class="ct">3</span></a>
</div>
</body></html>
