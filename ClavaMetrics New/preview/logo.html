<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><title>Logo</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:0;background:#fff;font:var(--cm-body);color:var(--cm-fg);height:100vh;display:grid;grid-template-columns:1fr 1fr;}
  .pane{display:flex;align-items:center;justify-content:center;gap:14px;padding:20px;}
  .pane.dark{background:#0E1116;color:#fff;}
  .mark{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mark svg{width:28px;height:28px;}
  .mark.on-light{background:#15803D;color:#fff;}
  .mark.on-dark{background:#4ADE80;color:#0E1116;}
  .label .name{font:600 18px/1 var(--cm-font-sans);letter-spacing:-0.015em;}
  .label .sub{font:500 11.5px/1 var(--cm-font-mono);color:rgba(0,0,0,0.5);margin-top:5px;}
  .pane.dark .label .sub{color:rgba(255,255,255,0.5);}
</style></head><body>
<div class="pane">
  <div class="mark on-light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V10"/><path d="M12 18V5"/><path d="M19 18v-9"/></svg>
  </div>
  <div class="label"><div class="name" style="color:#0A0A0A">ClavaMetrics</div><div class="sub">Performance OS</div></div>
</div>
<div class="pane dark">
  <div class="mark on-dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V10"/><path d="M12 18V5"/><path d="M19 18v-9"/></svg>
  </div>
  <div class="label"><div class="name">ClavaMetrics</div><div class="sub">Performance OS</div></div>
</div>
</body></html>
