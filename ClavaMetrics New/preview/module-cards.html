<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Module cards</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:20px;background:#FAFAF9;font:var(--cm-body);display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  :root{--cm-accent:#15803D;--cm-accent-soft:#ECFDF5;}
  .m{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .m .top{display:flex;align-items:center;gap:10px;}
  .m .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .m .ic .ti{font-size:18px;}
  .m h5{font:600 14px/1.2 var(--cm-font-sans);color:#0A0A0A;}
  .m p{font:var(--cm-body-sm);color:#6B7280;}
  .m .foot{font:500 12px/1 var(--cm-font-mono);color:#6B7280;display:flex;align-items:center;gap:6px;}
  .arrow{position:absolute;right:14px;bottom:14px;color:#9CA3AF;}
</style></head><body class="cm">
  <a class="m">
    <div class="top">
      <div class="ic" style="background:#EFF6FF;color:#2563EB;"><i class="ti ti-clipboard-list"></i></div>
      <div><h5>Planner</h5><p>Weekly design · tasks · pitch</p></div>
    </div>
    <div class="foot"><i class="ti ti-calendar"></i>MD-3 ready</div>
    <i class="ti ti-arrow-up-right arrow" style="font-size:16px"></i>
  </a>
  <a class="m">
    <div class="top">
      <div class="ic" style="background:#FFFBEB;color:#D97706;"><i class="ti ti-user-check"></i></div>
      <div><h5>Availability</h5><p>Daily presence · session min.</p></div>
    </div>
    <div class="foot" style="color:#D97706"><i class="ti ti-alert-triangle"></i>3 need status</div>
    <i class="ti ti-arrow-up-right arrow" style="font-size:16px"></i>
  </a>
</body></html>
