<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Activity row</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:0;background:#fff;font:var(--cm-body);}
  .row{display:grid;grid-template-columns:32px 1fr 1fr 100px;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #EFEFED;font:500 13px/1.3 var(--cm-font-sans);}
  .row.h{background:#FAFAF9;font:500 11px/1 var(--cm-font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#6B7280;padding:10px 16px;}
  .who{display:flex;align-items:center;gap:10px;min-width:0;}
  .av{width:24px;height:24px;border-radius:50%;background:#F4F4F2;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;font:600 10.5px/1 var(--cm-font-sans);color:#0A0A0A;}
  .name{color:#0A0A0A;font-weight:600;}
  .role{font:500 11.5px/1 var(--cm-font-mono);color:#6B7280;margin-top:2px;}
  .what{color:#0A0A0A;}
  .what .t{color:#6B7280;}
  .when{color:#6B7280;font:500 12px/1 var(--cm-font-mono);text-align:right;}
  .ind{display:flex;align-items:center;justify-content:center;color:#9CA3AF;}
  .ind .ti{font-size:16px;}
</style></head><body>
  <div class="row h"><span></span><span>Who</span><span>Activity</span><span style="text-align:right">When</span></div>
  <div class="row">
    <div class="ind"><i class="ti ti-soccer-field"></i></div>
    <div class="who"><div class="av">PF</div><div><div class="name">Pablo Fierro</div><div class="role">Head coach</div></div></div>
    <div class="what">Published <span class="t">MC 14 — Day 3</span> session</div>
    <div class="when">12 min ago</div>
  </div>
  <div class="row">
    <div class="ind"><i class="ti ti-bandage" style="color:#DC2626"></i></div>
    <div class="who"><div class="av">MA</div><div><div class="name">Dr. Acosta</div><div class="role">Physio</div></div></div>
    <div class="what">Logged injury · <span class="t">Bocanegra · hamstring</span></div>
    <div class="when">1 h ago</div>
  </div>
  <div class="row">
    <div class="ind"><i class="ti ti-radar-2"></i></div>
    <div class="who"><div class="av">SS</div><div><div class="name">StatSports sync</div><div class="role">Integration</div></div></div>
    <div class="what">Imported <span class="t">22 player files</span></div>
    <div class="when">3 h ago</div>
  </div>
</body></html>
