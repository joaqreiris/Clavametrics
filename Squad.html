<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<style>
  body.cm { background: var(--cm-bg); }

  /* Shell (same as Hub) ----------------------------------- */



  /* Topbar -------------------------------------------------- */
  .hub-topbar { display:flex; align-items:center; gap:14px; height:56px; padding:0 24px; border-bottom:1px solid var(--cm-border); background:color-mix(in srgb, var(--cm-bg) 92%, transparent); backdrop-filter:saturate(160%) blur(10px); position:sticky; top:0; z-index:50; }
  .hub-crumb { display:flex; align-items:center; gap:8px; color:var(--cm-fg-muted); font:var(--cm-body-sm); }
  .hub-crumb .ti { font-size:14px; }
  .hub-crumb .sep { color:var(--cm-fg-faint); }
  .hub-search { margin-left:auto; width:280px; display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); color:var(--cm-fg-muted); }
  .hub-search:hover { border-color:var(--cm-border-strong); }
  .hub-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; font:var(--cm-body-sm); color:var(--cm-fg); }
  .hub-search input::placeholder { color:var(--cm-fg-faint); }
  .hub-search .ti { font-size:16px; }
  .hub-topbar .actions { display:flex; align-items:center; gap:8px; }

  /* Page --------------------------------------------------- */
  .sq-page { padding:24px 28px 64px; max-width:1400px; width:100%; }
  .sq-head { display:flex; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .sq-head h1 { font:600 26px/1.1 var(--cm-font-sans); letter-spacing:-0.02em; color:var(--cm-fg-strong); }
  .sq-head p { font:var(--cm-body); color:var(--cm-fg-muted); margin-top:4px; }
  .sq-head .meta { margin-left:auto; display:flex; align-items:center; gap:8px; }

  /* Toolbar ----------------------------------------------- */
  .sq-toolbar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--cm-surface); border:1px solid var(--cm-border);
    border-radius:var(--cm-r-4); padding:10px 12px; box-shadow:var(--cm-shadow-1);
    margin-bottom:14px;
  }
  .sq-search { display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); min-width:240px; flex:1; max-width:340px; }
  .sq-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; font:var(--cm-body-sm); color:var(--cm-fg); }
  .sq-search input::placeholder { color:var(--cm-fg-faint); }
  .sq-search .ti { font-size:16px; color:var(--cm-fg-muted); }

  .sq-segs { display:inline-flex; padding:3px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); gap:2px; }
  .sq-seg { padding:0 12px; height:28px; display:inline-flex; align-items:center; gap:6px; border-radius:5px; font:500 12.5px/1 var(--cm-font-sans); color:var(--cm-fg-muted); cursor:pointer; border:0; background:transparent; }
  .sq-seg:hover { color:var(--cm-fg); }
  .sq-seg.is-on { background:var(--cm-surface); color:var(--cm-fg-strong); box-shadow:var(--cm-shadow-1); }
  .sq-seg .ti { font-size:14px; }
  .sq-seg .ct { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-muted); margin-left:2px; }

  .sq-filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sq-pill-filter {
    display:inline-flex; align-items:center; gap:5px;
    height:28px; padding:0 10px; border-radius:999px;
    border:1px solid var(--cm-border); background:var(--cm-surface);
    color:var(--cm-fg-muted); font:500 12px/1 var(--cm-font-sans);
    cursor:pointer;
  }
  .sq-pill-filter:hover { color:var(--cm-fg); border-color:var(--cm-border-strong); }
  .sq-pill-filter.is-on { background:var(--cm-accent-soft); color:var(--cm-fg-strong); border-color:var(--cm-border-strong); }
  .sq-pill-filter .ti { font-size:13px; }
  .sq-pill-filter .dot { width:7px; height:7px; border-radius:50%; }
  .sq-pill-filter.is-on .ct { color:var(--cm-accent); font-weight:600; }
  .sq-pill-filter .ct { font:500 11px/1 var(--cm-font-mono); color:var(--cm-fg-faint); }

  .sq-toolbar .grow { flex:1; }
  .sq-actions { display:flex; gap:6px; align-items:center; }

  /* Table ---------------------------------------------- */
  .sq-table-wrap {
    background:var(--cm-surface); border:1px solid var(--cm-border);
    border-radius:var(--cm-r-4); box-shadow:var(--cm-shadow-1); overflow:clip;
  }
  .sq-table-scroll { overflow-x:auto; overflow-y:auto; max-height:calc(100vh - 220px); }
  .sq-table { width:100%; border-collapse:collapse; }
  .sq-table thead th {
    text-align:left; padding:9px 12px;
    font:500 11px/1 var(--cm-font-sans);
    letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cm-fg-muted);
    background:var(--cm-bg-soft);
    border-bottom:1px solid var(--cm-border);
    position:sticky; top:0; z-index:1;
    white-space:nowrap;
  }
  .sq-table th.sortable { cursor:pointer; user-select:none; }
  .sq-table th.sortable:hover { color:var(--cm-fg); }
  .sq-table th .ti { font-size:12px; vertical-align:-1px; margin-left:2px; opacity:0.6; }
  .sq-table tbody td {
    padding:10px 12px;
    border-bottom:1px solid var(--cm-border-soft);
    font:var(--cm-body-sm);
    color:var(--cm-fg);
    vertical-align:middle;
  }
  .sq-table tbody tr:last-child td { border-bottom:0; }
  .sq-table tbody tr { cursor:pointer; transition:background var(--cm-dur-1); }
  .sq-table tbody tr:hover { background:var(--cm-bg-soft); }
  .sq-table tbody tr.is-selected { background:var(--cm-accent-soft); }
  .sq-table .col-cb { width:30px; }
  .sq-table .col-num { width:54px; }
  .sq-table .col-pos { width:90px; }
  .sq-table .col-age { width:60px; }
  .sq-table .col-foot { width:80px; }
  .sq-table .col-anthro { width:120px; }
  .sq-table .col-role { width:130px; }
  .sq-table .col-joined { width:110px; }
  .sq-table .col-actions { width:56px; text-align:right; }

  /* Cell internals */
  .sq-num {
    width:30px; height:30px; border-radius:7px;
    background:var(--cm-bg-sunk); border:1px solid var(--cm-border);
    display:inline-flex; align-items:center; justify-content:center;
    font:600 14px/1 var(--cm-font-mono); color:var(--cm-fg-strong);
    letter-spacing:-0.01em;
  }
  .sq-player { display:flex; align-items:center; gap:10px; min-width:0; }
  .sq-av { width:30px; height:30px; border-radius:50%; background:var(--cm-bg-sunk); border:1px solid var(--cm-border); color:var(--cm-fg); display:flex; align-items:center; justify-content:center; font:600 11px/1 var(--cm-font-sans); flex-shrink:0; }
  .sq-av.is-tinted { background:var(--cm-accent-soft); color:var(--cm-accent); border-color:transparent; }
  .sq-name { font:500 13.5px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .sq-name-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .sq-sub { font:500 11.5px/1.2 var(--cm-font-mono); color:var(--cm-fg-muted); margin-top:2px; }
  .sq-flag { width:16px; height:11px; border-radius:2px; background:linear-gradient(180deg, #74acdf 33%, #fff 33% 66%, #74acdf 66%); border:1px solid rgba(0,0,0,0.08); flex-shrink:0; box-shadow:inset 0 -3px 0 transparent; }
  .sq-flag.ar { background:linear-gradient(180deg,#74acdf 33%,#fff 33% 66%,#74acdf 66%); }
  .sq-flag.br { background:#22A040; position:relative; }
  .sq-flag.uy { background:linear-gradient(180deg,#fff 50%, #0038A8 50%); }
  .sq-flag.cl { background:linear-gradient(180deg,#fff 50%, #D52B1E 50%); }
  .sq-flag.es { background:linear-gradient(180deg,#AA151B 25%, #F1BF00 25% 75%, #AA151B 75%); }
  .sq-flag.fr { background:linear-gradient(90deg,#002395 33%, #fff 33% 66%, #ED2939 66%); }
  .sq-flag.co { background:linear-gradient(180deg,#FCD116 50%,#003893 50% 75%,#CE1126 75%); }
  .sq-flag.pe { background:linear-gradient(90deg,#D91023 33%, #fff 33% 66%, #D91023 66%); }

  .sq-pos {
    display:inline-flex; align-items:center; gap:5px;
    height:22px; padding:0 8px; border-radius:5px;
    font:600 11px/1 var(--cm-font-mono);
    letter-spacing:0.04em;
  }
  .sq-pos.gk { background:rgba(220,38,38,0.10); color:#B91C1C; }
  .sq-pos.cb { background:rgba(37,99,235,0.10); color:#1D4ED8; }
  .sq-pos.fb { background:rgba(96,165,250,0.14); color:#1D4ED8; }
  .sq-pos.mf { background:rgba(22,163,74,0.12); color:#15803D; }
  .sq-pos.wg { background:rgba(217,119,6,0.12); color:#B45309; }
  .sq-pos.st { background:rgba(220,38,38,0.10); color:#B91C1C; }

  .sq-anthro { display:flex; align-items:baseline; gap:6px; font:500 13px/1 var(--cm-font-mono); color:var(--cm-fg); }
  .sq-anthro .u { color:var(--cm-fg-faint); font-size:11px; }
  .sq-anthro .sep { color:var(--cm-border-strong); }

  .sq-role-pill {
    display:inline-flex; align-items:center; gap:4px;
    height:20px; padding:0 7px; border-radius:4px;
    font:600 10.5px/1 var(--cm-font-mono);
    letter-spacing:0.04em; text-transform:uppercase;
    background:var(--cm-neutral-bg); color:var(--cm-neutral);
    border:1px solid var(--cm-neutral-bd);
  }
  .sq-role-pill.is-captain { background:var(--cm-warning-bg); color:var(--cm-warning); border-color:var(--cm-warning-bd); }
  .sq-role-pill.is-vice    { background:var(--cm-info-bg);    color:var(--cm-info);    border-color:var(--cm-info-bd); }
  .sq-role-pill.is-academy { background:var(--cm-success-bg); color:var(--cm-success); border-color:var(--cm-success-bd); }
  .sq-role-pill.is-loan    { background:var(--cm-violet-bg);  color:var(--cm-violet);  border-color:var(--cm-violet-bd); }
  .sq-role-pill .ti { font-size:11px; }

  .sq-num-cell, .sq-mono { font:500 13px/1 var(--cm-font-mono); color:var(--cm-fg); text-align:right; }
  .sq-num-cell.is-warn { color:var(--cm-warning); }
  .sq-num-cell.is-danger { color:var(--cm-danger); }
  .sq-num-cell.is-good { color:var(--cm-success); }

  .sq-meter { display:inline-flex; align-items:center; gap:6px; }
  .sq-meter-bar { width:48px; height:4px; border-radius:2px; background:var(--cm-bg-sunk); overflow:hidden; }
  .sq-meter-fill { height:100%; border-radius:2px; }

  .sq-cb { width:14px; height:14px; border-radius:4px; border:1.5px solid var(--cm-border-strong); cursor:pointer; background:var(--cm-surface); display:inline-block; vertical-align:middle; }
  .sq-cb.is-on { background:var(--cm-accent); border-color:var(--cm-accent); position:relative; }
  .sq-cb.is-on::after { content:""; position:absolute; left:2px; top:1px; width:7px; height:3px; border-left:1.5px solid var(--cm-fg-on-accent); border-bottom:1.5px solid var(--cm-fg-on-accent); transform:rotate(-45deg); }

  .sq-row-actions { display:inline-flex; gap:2px; }
  .sq-row-actions button { width:28px; height:28px; border-radius:6px; border:0; background:transparent; color:var(--cm-fg-muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .sq-row-actions button:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .sq-row-actions button .ti { font-size:15px; }

  /* Group header row */
  .sq-table tbody tr.is-group { scroll-margin-top:94px; }
  .sq-table tbody tr.is-group td {
    background:var(--cm-bg-soft);
    border-top:1px solid var(--cm-border);
    padding:8px 12px;
    font:500 11px/1 var(--cm-font-sans);
    letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cm-fg-muted);
  }
  .sq-table tbody tr.is-group td .sq-group-count {
    font:500 11.5px/1 var(--cm-font-mono);
    color:var(--cm-fg-faint);
    margin-left:6px;
    text-transform:none; letter-spacing:0;
  }

  /* Footer */
  .sq-table-foot {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px;
    border-top:1px solid var(--cm-border);
    background:var(--cm-bg-soft);
    font:var(--cm-meta); color:var(--cm-fg-muted);
  }
  .sq-table-foot .grow { flex:1; }

  #tweaks-root { position: fixed; bottom: 16px; right: 16px; z-index: 1000; }

  /* Cards view */
  .sq-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px; padding: 4px 0 16px;
  }
  .sq-card {
    background: var(--cm-surface); border: 1px solid var(--cm-border);
    border-radius: var(--cm-r-4); padding: 16px 14px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer; transition: box-shadow var(--cm-dur-1), border-color var(--cm-dur-1);
  }
  .sq-card:hover { border-color: var(--cm-border-strong); box-shadow: var(--cm-shadow-2); }
  .sq-card-av {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--cm-bg-sunk); border: 1px solid var(--cm-border);
    display: flex; align-items: center; justify-content: center;
    font: 700 18px/1 var(--cm-font-sans); color: var(--cm-fg-strong);
    position: relative;
  }
  .sq-card-num {
    position: absolute; bottom: -4px; right: -4px;
    min-width: 20px; height: 20px; padding: 0 4px;
    border-radius: 6px; background: var(--cm-accent); color: var(--cm-fg-on-accent);
    font: 700 10px/20px var(--cm-font-mono); text-align: center;
    border: 2px solid var(--cm-surface);
  }
  .sq-card-name { font: 600 13px/1.3 var(--cm-font-sans); color: var(--cm-fg-strong); text-align: center; }
  .sq-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }

  /* Depth chart */
  .sq-depth { display: flex; flex-direction: column; gap: 20px; padding: 4px 0 16px; }
  .sq-depth-line { display: flex; flex-direction: column; gap: 8px; }
  .sq-depth-label {
    font: 500 10.5px/1 var(--cm-font-sans); letter-spacing: .08em;
    text-transform: uppercase; color: var(--cm-fg-muted); padding: 0 2px;
  }
  .sq-depth-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sq-depth-slot {
    display: flex; align-items: center; gap: 10px;
    background: var(--cm-surface); border: 1px solid var(--cm-border);
    border-radius: var(--cm-r-3); padding: 8px 12px; cursor: pointer; min-width: 160px;
    transition: border-color var(--cm-dur-1);
  }
  .sq-depth-slot:hover { border-color: var(--cm-border-strong); }
  .sq-depth-av {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--cm-bg-sunk); border: 1px solid var(--cm-border);
    display: flex; align-items: center; justify-content: center;
    font: 600 11px/1 var(--cm-font-sans); color: var(--cm-fg-strong); flex-shrink: 0;
  }
  .sq-depth-info { min-width: 0; }
  .sq-depth-pname { font: 600 13px/1.2 var(--cm-font-sans); color: var(--cm-fg-strong); }
  .sq-depth-psub { font: 500 11px/1.2 var(--cm-font-mono); color: var(--cm-fg-muted); margin-top: 2px; }

  /* Modal */
  .sq-modal-backdrop {
    position:fixed; inset:0; background:rgba(8,10,12,0.5); backdrop-filter:blur(4px);
    z-index:200; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 160ms ease;
  }
  .sq-modal-backdrop.is-open { opacity:1; pointer-events:auto; }
  .sq-modal {
    background:var(--cm-surface); border:1px solid var(--cm-border);
    border-radius:var(--cm-r-5); box-shadow:0 24px 48px rgba(0,0,0,0.18);
    width:520px; max-width:calc(100vw - 32px); max-height:calc(100vh - 64px);
    overflow-y:auto; display:flex; flex-direction:column;
    transform:translateY(8px); transition:transform 160ms ease;
  }
  .sq-modal-backdrop.is-open .sq-modal { transform:translateY(0); }
  .sq-modal-head {
    display:flex; align-items:center; gap:12px;
    padding:18px 20px 16px; border-bottom:1px solid var(--cm-border);
  }
  .sq-modal-head h2 { font:600 16px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); flex:1; }
  .sq-modal-head .sq-modal-close {
    width:28px; height:28px; border-radius:6px; border:0;
    background:transparent; color:var(--cm-fg-muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sq-modal-head .sq-modal-close:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .sq-modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; }
  .sq-modal-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sq-modal-field { display:flex; flex-direction:column; gap:5px; }
  .sq-modal-field label { font:500 11.5px/1 var(--cm-font-sans); color:var(--cm-fg-muted); }
  .sq-modal-field input,
  .sq-modal-field select {
    height:36px; padding:0 10px; border-radius:var(--cm-r-3);
    border:1px solid var(--cm-border); background:var(--cm-bg-soft);
    color:var(--cm-fg); font:var(--cm-body-sm); outline:none;
  }
  .sq-modal-field input:focus,
  .sq-modal-field select:focus { border-color:var(--cm-accent); }
  .sq-modal-foot {
    display:flex; align-items:center; gap:8px;
    padding:14px 20px 18px; border-top:1px solid var(--cm-border);
  }
  .sq-modal-foot .grow { flex:1; }
  .sq-modal-saving { font:var(--cm-meta); color:var(--cm-fg-muted); }
  .sq-toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--cm-fg-strong); color:var(--cm-bg); border-radius:var(--cm-r-3);
    padding:8px 16px; font:500 13px/1 var(--cm-font-sans);
    z-index:500; opacity:0; pointer-events:none;
    transition:opacity 200ms, transform 200ms;
  }
  .sq-toast.is-show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width: 768px) {
    .hub-topbar { padding-left: 56px; }
    .sq-page { padding: 16px 12px 48px; }
    .sq-toolbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 8px; }
    .sq-search { min-width: 160px; max-width: none; }
    .sq-filters { display: flex; flex-shrink: 0; }
    .sq-segs { flex-shrink: 0; }
    .sq-head .meta { flex-wrap: wrap; gap: 6px; }
  }
  @media (max-width: 480px) {
    .sq-head { flex-direction: column; align-items: flex-start; }
    .sq-head .meta { margin-left: 0; }
  }
</style>
</head>
<body class="cm">

<div class="hub-shell" data-screen-label="04 Squad">

  <!-- Sidebar (same as Hub) -->
  <div id="hub-side-root"></div>

  <!-- Main -->
  <main class="hub-main">

    <div class="hub-topbar">
      <div class="hub-crumb">
        <i class="ti ti-home"></i>
        <span id="sqCrumbClub">…</span>
        <span class="sep">/</span>
        <span style="color:var(--cm-fg-strong);font-weight:600">Squad</span>
      </div>
      <div class="hub-search">
        <i class="ti ti-search"></i>
        <input placeholder="Search players, sessions, microcycles…">
      </div>
      <div class="actions">
        <button class="cm-icon-btn" title="Notifications"><i class="ti ti-bell"></i></button>
        <button class="cm-icon-btn" title="Help"><i class="ti ti-help"></i></button>
        <button class="cm-icon-btn" title="Settings" data-open-settings><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <section class="sq-page">

      <header class="sq-head">
        <div>
          <h1>Squad</h1>
          <p id="sqHeadP">27 players · First team 2025/26</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <select id="sqTeamSelect" class="cm-select is-sm" style="min-width:130px">
            <option value="">All teams</option>
          </select>
        </div>
        <div class="meta">
          <button class="cm-btn is-outline is-sm" id="sqImportBtn"><i class="ti ti-file-import" style="font-size:14px"></i>Import CSV</button>
          <button class="cm-btn is-outline is-sm" id="sqExportBtn"><i class="ti ti-file-export" style="font-size:14px"></i>Export</button>
          <button class="cm-btn is-primary is-sm" id="sqAddPlayerBtn"><i class="ti ti-plus" style="font-size:14px"></i>Add player</button>
          <input type="file" id="sqImportFile" accept=".csv" style="display:none">
        </div>
      </header>

      <!-- Toolbar -->
      <div class="sq-toolbar">
        <div class="sq-search">
          <i class="ti ti-search"></i>
          <input placeholder="Filter by name, dorsal or nationality…" aria-label="Filter players by name, dorsal or nationality">
        </div>

        <div class="sq-segs">

<script>
// Position → display config
const POS_CFG = {
  // Abbreviations
  GK:  { group:'Goalkeepers',        icon:'ti-shield',            css:'gk', pill:'GK', order:0 },
  CB:  { group:'Defenders',          icon:'ti-wall',              css:'cb', pill:'CB', order:1 },
  LB:  { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  RB:  { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  FB:  { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  WB:  { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  LWB: { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  RWB: { group:'Defenders',          icon:'ti-wall',              css:'fb', pill:'FB', order:1 },
  DM:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  CDM: { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  CM:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  MF:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  LM:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  RM:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  CAM: { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  AM:  { group:'Midfielders',        icon:'ti-circles-relation',  css:'mf', pill:'MF', order:2 },
  WG:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'wg', pill:'WG', order:3 },
  LW:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'wg', pill:'WG', order:3 },
  RW:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'wg', pill:'WG', order:3 },
  ST:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'st', pill:'ST', order:3 },
  CF:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'st', pill:'ST', order:3 },
  SS:  { group:'Wingers & Forwards', icon:'ti-flame',             css:'st', pill:'ST', order:3 },
  // Full names (from DB)
  GOALKEEPER:  { group:'Goalkeepers',        icon:'ti-shield',           css:'gk', pill:'GK', order:0 },
  DEFENDER:    { group:'Defenders',          icon:'ti-wall',             css:'cb', pill:'CB', order:1 },
  MIDFIELDER:  { group:'Midfielders',        icon:'ti-circles-relation', css:'mf', pill:'MF', order:2 },
  FORWARD:     { group:'Wingers & Forwards', icon:'ti-flame',            css:'st', pill:'ST', order:3 },
  WINGER:      { group:'Wingers & Forwards', icon:'ti-flame',            css:'wg', pill:'WG', order:3 },
};
const GROUPS_ORDER = ['Goalkeepers','Defenders','Midfielders','Wingers & Forwards','Other'];

function calcAge(dob) {
  if (!dob) return '—';
  const d = new Date(dob), now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  if (now < new Date(now.getFullYear(), d.getMonth(), d.getDate())) age--;
  return age;
}
function fmtDob(dob) {
  if (!dob) return '—';
  return new Date(dob).toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
}

let _allPlayers = [];
let _teams = [];
let _currentTeamId = null;
let _activeFilter = 'All';
let _searchQ = '';
let _editingId = null;
let _currentClubId = null;
let _currentClubName = '';

function renderTable() {
  const tbody = document.getElementById('sqTbody');
  const foot  = document.getElementById('sqTableFoot');
  if (!tbody) return;

  const posUpper = _activeFilter.toUpperCase();
  const filtered = _allPlayers.filter(p => {
    const pos = (p.position || '').toUpperCase();
    const cfg = POS_CFG[pos];
    if (_activeFilter !== 'All' && cfg?.pill !== posUpper) return false;
    if (_searchQ) {
      const q = _searchQ.toLowerCase();
      const name = ((p.first_name || '') + ' ' + (p.last_name || '')).toLowerCase();
      const num  = String(p.number || '');
      if (!name.includes(q) && !num.includes(q)) return false;
    }
    return true;
  });

  // Group
  const byGroup = {};
  GROUPS_ORDER.forEach(g => byGroup[g] = []);
  filtered.forEach(p => {
    const cfg = POS_CFG[(p.position || '').toUpperCase()];
    const grp = cfg?.group || 'Other';
    byGroup[grp] = byGroup[grp] || [];
    byGroup[grp].push(p);
  });

  let html = '';
  GROUPS_ORDER.forEach(grp => {
    const list = byGroup[grp] || [];
    if (!list.length) return;
    const cfg = Object.values(POS_CFG).find(c => c.group === grp);
    html += `<tr class="is-group"><td colspan="10"><i class="ti ${cfg?.icon || 'ti-users'}" style="vertical-align:-2px;font-size:13px"></i> ${grp} <span class="sq-group-count">${list.length} player${list.length !== 1 ? 's' : ''}</span></td></tr>`;
    list.forEach(p => {
      const pos     = (p.position || '').toUpperCase();
      const pcfg    = POS_CFG[pos] || { css:'', pill:pos };
      const fullName = ((p.first_name || '') + ' ' + (p.last_name || '')).trim();
      const initials = (((p.first_name||'')[0] || '') + ((p.last_name||'')[0] || '')).toUpperCase() || fullName.slice(0,2).toUpperCase();
      const avInner = p.photo_url
        ? `<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">`
        : initials;
      const num     = p.number || '—';
      const age     = calcAge(p.date_of_birth);
      const foot    = p.dominant_foot || '—';
      const h       = p.height ? `${p.height}<span class="u">cm</span><span class="sep">·</span>` : '';
      const w       = p.weight ? `${p.weight}<span class="u">kg</span>` : '—';
      html += `<tr data-pos="${pcfg.pill}" data-name="${fullName.toLowerCase()}" data-num="${num}">
        <td><span class="sq-cb" data-cb></span></td>
        <td><span class="sq-num">${num}</span></td>
        <td><div class="sq-player">
          <div class="sq-av">${avInner}</div>
          <div><div class="sq-name-row"><span class="sq-name">${fullName || '—'}</span></div>
          <div class="sq-sub">${fmtDob(p.date_of_birth)}</div></div>
        </div></td>
        <td><span class="sq-pos ${pcfg.css}">${p.position || '—'}</span></td>
        <td class="sq-mono">${age}</td>
        <td class="sq-mono">${foot}</td>
        <td><span class="sq-anthro">${h}${w}</span></td>
        <td><span class="sq-role-pill">${(_teams.find(t => t.id === p.team_id)?.name) || '—'}</span></td>
        <td class="sq-mono">—</td>
        <td><div class="sq-row-actions"><button class="sq-edit-btn" data-id="${p.id}" title="Edit profile"><i class="ti ti-edit"></i></button></div></td>
      </tr>`;
    });
  });

  tbody.innerHTML = html;
  // Reset select-all when table re-renders (filter/search change)
  document.querySelector('thead [data-cb]')?.classList.remove('is-on');

  // Edit button handlers
  tbody.querySelectorAll('.sq-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const player = _allPlayers.find(p => p.id === id);
      if (player) openModal(player);
    });
  });

  // Row click opens edit
  tbody.querySelectorAll('tr:not(.is-group)').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('[data-cb]') || e.target.closest('.sq-edit-btn')) return;
      const id = tr.querySelector('.sq-edit-btn')?.dataset.id;
      const player = _allPlayers.find(p => p.id === id);
      if (player) openModal(player);
    });
  });

  // Re-attach checkbox behaviour
  tbody.querySelectorAll('[data-cb]').forEach(cb => {
    cb.addEventListener('click', e => {
      e.stopPropagation();
      cb.classList.toggle('is-on');
      const tr = cb.closest('tr');
      if (tr) tr.classList.toggle('is-selected', cb.classList.contains('is-on'));
    });
  });

  if (foot) {
    const total = _allPlayers.length;
    foot.innerHTML = `Showing <strong style="color:var(--cm-fg)">${filtered.length}</strong> of ${total} players`;
  }
}

async function reloadPlayers() {
  let q = window.sb.from('players')
    .select('id,first_name,last_name,number,position,nationality,date_of_birth,height,weight,dominant_foot,status,photo_url,team_id')
    .eq('club_id', _currentClubId)
    .order('number', { ascending: true, nullsFirst: false });
  if (_currentTeamId) q = q.eq('team_id', _currentTeamId);
  const { data, error } = await q;
  if (error) console.error('[Squad] players query error:', error);

  _allPlayers = data || [];
  const total = _allPlayers.length;
  const headP  = document.getElementById('sqHeadP');
  const listCt = document.getElementById('sqListCt');
  const teamLabel = _currentTeamId
    ? (_teams.find(t => t.id === _currentTeamId)?.name || 'Team')
    : 'All teams';
  if (headP)  headP.textContent = `${total} players · ${teamLabel}`;
  if (listCt) listCt.textContent = total;

  const posCounts = {};
  _allPlayers.forEach(p => {
    const cfg = POS_CFG[(p.position || '').toUpperCase()];
    if (cfg) posCounts[cfg.pill] = (posCounts[cfg.pill] || 0) + 1;
  });
  document.querySelectorAll('.sq-pill-filter').forEach(pill => {
    const ct = pill.querySelector('.ct');
    if (!ct) return;
    const label = pill.textContent.replace(/\d+/, '').trim();
    if (label === 'All') { ct.textContent = total; return; }
    ct.textContent = posCounts[label] || 0;
  });

  renderTable();
}

(async () => {
  const ok = await window.requireAuth();
  if (!ok) return;

  const [profile, club] = await Promise.all([window.getProfile(), window.getClub()]);
  const clubId = await window.getClubId();
  _currentClubId = clubId;

  if (club) {
    window.applyClubTheme();
    _currentClubName = club.name || '';
    const crumb = document.getElementById('sqCrumbClub');
    if (crumb) crumb.textContent = club.name;
  }

  // Load teams and populate selectors
  if (clubId) {
    _teams = await window.getTeams(clubId);
    const teamSel = document.getElementById('sqTeamSelect');
    const modalTeamSel = document.getElementById('sqF_team');
    _teams.forEach(t => {
      teamSel?.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.name}</option>`);
      modalTeamSel?.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.name}</option>`);
    });
    teamSel?.addEventListener('change', async () => {
      _currentTeamId = teamSel.value || null;
      await reloadPlayers();
    });
    // Pre-select current team in selector if filtering
    if (_currentTeamId && teamSel) teamSel.value = _currentTeamId;
  }

  await reloadPlayers();

  // Select-all checkbox (thead — static, wired once)
  document.querySelector('thead [data-cb]')?.addEventListener('click', e => {
    e.stopPropagation();
    const cb = e.currentTarget;
    const isNowOn = !cb.classList.contains('is-on');
    cb.classList.toggle('is-on', isNowOn);
    document.querySelectorAll('#sqTbody [data-cb]').forEach(rowCb => {
      rowCb.classList.toggle('is-on', isNowOn);
      rowCb.closest('tr')?.classList.toggle('is-selected', isNowOn);
    });
  });

  // Filter pills
  document.querySelectorAll('.sq-pill-filter').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.sq-pill-filter').forEach(o => o.classList.remove('is-on'));
      pill.classList.add('is-on');
      const label = pill.textContent.replace(/\d+/g, '').replace('·', '').trim();
      _activeFilter = label;
      if (_activeView === 'list') renderTable();
      else if (_activeView === 'cards') renderCards();
      else if (_activeView === 'depth') renderDepthChart();
    });
  });

  // Search
  document.querySelectorAll('.sq-search input').forEach(inp => {
    inp.addEventListener('input', () => {
      _searchQ = inp.value;
      if (_activeView === 'list') renderTable();
      else if (_activeView === 'cards') renderCards();
      else if (_activeView === 'depth') renderDepthChart();
    });
  });
})();
</script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="theme-tweaks.jsx"></script>

<script>
  // ── Modal helpers ──────────────────────────────────────────────

  function showToast(msg) {
    const t = document.getElementById('sqToast');
    t.textContent = msg;
    t.classList.add('is-show');
    setTimeout(() => t.classList.remove('is-show'), 2800);
  }

  function openModal(player) {
    _editingId = player ? player.id : null;
    const backdrop = document.getElementById('sqModalBackdrop');
    document.getElementById('sqModalTitle').textContent = player ? 'Edit player' : 'Add player';
    document.getElementById('sqModalId').value = player?.id || '';
    document.getElementById('sqF_first_name').value  = player?.first_name    || '';
    document.getElementById('sqF_last_name').value   = player?.last_name     || '';
    document.getElementById('sqF_number').value      = player?.number          || '';
    document.getElementById('sqF_position').value    = player?.position        || '';
    document.getElementById('sqF_dob').value         = player?.date_of_birth   || '';
    document.getElementById('sqF_nationality').value = player?.nationality     || '';
    document.getElementById('sqF_height_cm').value   = player?.height          || '';
    document.getElementById('sqF_weight_kg').value   = player?.weight          || '';
    document.getElementById('sqF_dominant_foot').value = player?.dominant_foot || '';
    document.getElementById('sqF_status').value      = player?.status          || 'available';
    document.getElementById('sqF_team').value         = player?.team_id || _currentTeamId || '';
    document.getElementById('sqModalDelete').style.display = player ? 'inline-flex' : 'none';
    document.getElementById('sqModalSaving').style.display = 'none';
    // Photo preview
    const photoInput = document.getElementById('sqF_photo');
    if (photoInput) photoInput.value = '';
    const preview = document.getElementById('sqF_photoPreview');
    if (preview) {
      if (player?.photo_url) {
        preview.innerHTML = `<img src="${player.photo_url}" style="width:100%;height:100%;object-fit:cover" alt="">`;
      } else {
        preview.textContent = (((player?.first_name||'')[0]||'') + ((player?.last_name||'')[0]||'')).toUpperCase() || '?';
      }
    }
    backdrop.classList.add('is-open');
    document.getElementById('sqF_first_name').focus();
  }

  function closeModal() {
    document.getElementById('sqModalBackdrop').classList.remove('is-open');
    _editingId = null;
  }

  async function saveModal() {
    const saving = document.getElementById('sqModalSaving');
    const saveBtn = document.getElementById('sqModalSave');
    saving.style.display = 'inline';
    saveBtn.disabled = true;

    const payload = {
      first_name:    document.getElementById('sqF_first_name').value.trim(),
      last_name:     document.getElementById('sqF_last_name').value.trim(),
      number:        parseInt(document.getElementById('sqF_number').value) || null,
      position:      document.getElementById('sqF_position').value || null,
      date_of_birth: document.getElementById('sqF_dob').value || null,
      nationality:   document.getElementById('sqF_nationality').value.trim() || null,
      height:        parseFloat(document.getElementById('sqF_height_cm').value) || null,
      weight:        parseFloat(document.getElementById('sqF_weight_kg').value) || null,
      dominant_foot: document.getElementById('sqF_dominant_foot').value || null,
      team_id:       document.getElementById('sqF_team').value || null,
    };

    if (!payload.first_name) {
      showToast('First name is required.');
      saving.style.display = 'none';
      saveBtn.disabled = false;
      return;
    }

    const photoFile = document.getElementById('sqF_photo')?.files?.[0] || null;

    async function uploadPhoto(playerId, clubId) {
      if (!photoFile) return null;
      const ext = photoFile.name.split('.').pop().toLowerCase();
      const path = `${clubId}/${playerId}.${ext}`;
      const { error: upErr } = await window.sb.storage.from('player-photos').upload(path, photoFile, { upsert: true });
      if (upErr) { console.error('Photo upload failed:', upErr); showToast('Photo upload failed: ' + upErr.message); return null; }
      const { data: urlData } = window.sb.storage.from('player-photos').getPublicUrl(path);
      return urlData?.publicUrl || null;
    }

    let error;
    if (_editingId) {
      const photoUrl = await uploadPhoto(_editingId, _currentClubId);
      if (photoUrl) payload.photo_url = photoUrl;
      ({ error } = await window.sb.from('players').update(payload).eq('id', _editingId));
    } else {
      const clubId = _currentClubId || await window.getClubId();
      if (!clubId) { showToast('Error: no club found for your account.'); saving.style.display = 'none'; saveBtn.disabled = false; return; }
      payload.club_id = clubId;
      const { data: inserted, error: insertErr } = await window.sb.from('players').insert(payload).select('id');
      error = insertErr;
      if (!insertErr && inserted?.length) {
        const photoUrl = await uploadPhoto(inserted[0].id, clubId);
        if (photoUrl) await window.sb.from('players').update({ photo_url: photoUrl }).eq('id', inserted[0].id);
      }
    }

    saving.style.display = 'none';
    saveBtn.disabled = false;

    if (error) { showToast('Error: ' + error.message); return; }
    closeModal();
    showToast(_editingId ? 'Player updated.' : 'Player added.');
    await reloadPlayers();
  }

  async function deletePlayer() {
    if (!_editingId) return;
    if (!confirm('Delete this player permanently?')) return;
    const { error } = await window.sb.from('players')
      .delete()
      .eq('id', _editingId);
    if (error) { showToast('Error: ' + error.message); return; }
    closeModal();
    showToast('Player removed.');
    await reloadPlayers();
  }

  // Modal event wiring
  document.getElementById('sqModalClose').addEventListener('click', closeModal);
  document.getElementById('sqModalCancel').addEventListener('click', closeModal);
  document.getElementById('sqModalSave').addEventListener('click', saveModal);
  document.getElementById('sqModalDelete').addEventListener('click', deletePlayer);
  document.getElementById('sqModalBackdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // Add player button
  document.getElementById('sqAddPlayerBtn')?.addEventListener('click', () => openModal(null));

  // ── Views ──────────────────────────────────────────────────────
  let _activeView = 'list';

  function setView(view) {
    _activeView = view;
    document.querySelector('.sq-table-wrap').style.display  = view === 'list'  ? '' : 'none';
    document.getElementById('sqCardsView').style.display    = view === 'cards' ? '' : 'none';
    document.getElementById('sqDepthView').style.display    = view === 'depth' ? '' : 'none';
    if (view === 'cards') renderCards();
    if (view === 'depth') renderDepthChart();
  }

  function getFiltered() {
    const posUpper = _activeFilter.toUpperCase();
    return _allPlayers.filter(p => {
      const pos = (p.position || '').toUpperCase();
      const cfg = POS_CFG[pos];
      if (_activeFilter !== 'All' && cfg?.pill !== posUpper) return false;
      if (_searchQ) {
        const q = _searchQ.toLowerCase();
        const name = ((p.first_name||'') + ' ' + (p.last_name||'')).toLowerCase();
        if (!name.includes(q) && !String(p.number||'').includes(q)) return false;
      }
      return true;
    });
  }

  function renderCards() {
    const grid = document.getElementById('sqCardsGrid');
    if (!grid) return;
    const filtered = getFiltered();
    if (!filtered.length) { grid.innerHTML = '<p style="color:var(--cm-fg-muted);padding:24px">No players found.</p>'; return; }
    grid.innerHTML = filtered.map(p => {
      const fullName = ((p.first_name||'') + ' ' + (p.last_name||'')).trim();
      const initials = (((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'')).toUpperCase();
      const cardAvInner = p.photo_url
        ? `<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">`
        : initials;
      const pos = (p.position||'').toUpperCase();
      const pcfg = POS_CFG[pos] || { css:'', pill: pos };
      const age = calcAge(p.date_of_birth);
      return `<div class="sq-card" data-id="${p.id}">
        <div class="sq-card-av">${cardAvInner}<span class="sq-card-num">${p.number||'—'}</span></div>
        <div class="sq-card-name">${fullName||'—'}</div>
        <div class="sq-card-meta">
          <span class="sq-pos ${pcfg.css}">${p.position||'—'}</span>
          ${age !== '—' ? `<span style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted)">${age}y</span>` : ''}
          ${p.dominant_foot ? `<span style="font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-muted)">${p.dominant_foot[0]}</span>` : ''}
        </div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.sq-card').forEach(card => {
      card.addEventListener('click', () => {
        const player = _allPlayers.find(p => p.id === card.dataset.id);
        if (player) openModal(player);
      });
    });
  }

  function renderDepthChart() {
    const container = document.getElementById('sqDepthChart');
    if (!container) return;
    const lines = [
      { label: 'Goalkeepers',        groups: ['Goalkeepers'] },
      { label: 'Defenders',          groups: ['Defenders'] },
      { label: 'Midfielders',        groups: ['Midfielders'] },
      { label: 'Wingers & Forwards', groups: ['Wingers & Forwards'] },
      { label: 'Other',              groups: ['Other'] },
    ];
    const byGroup = {};
    GROUPS_ORDER.forEach(g => byGroup[g] = []);
    _allPlayers.forEach(p => {
      const cfg = POS_CFG[(p.position||'').toUpperCase()];
      const grp = cfg?.group || 'Other';
      if (!byGroup[grp]) byGroup[grp] = [];
      byGroup[grp].push(p);
    });

    container.innerHTML = lines.map(({ label, groups }) => {
      const players = groups.flatMap(g => byGroup[g] || []);
      if (!players.length) return '';
      const slots = players.map(p => {
        const fullName = ((p.first_name||'') + ' ' + (p.last_name||'')).trim();
        const initials = (((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'')).toUpperCase();
        const pos = (p.position||'').toUpperCase();
        const pcfg = POS_CFG[pos] || { css:'', pill: pos };
        return `<div class="sq-depth-slot" data-id="${p.id}">
          <div class="sq-depth-av">${initials}</div>
          <div class="sq-depth-info">
            <div class="sq-depth-pname">${fullName}</div>
            <div class="sq-depth-psub"><span class="sq-pos ${pcfg.css}" style="height:16px;font-size:10px;padding:0 5px">${p.position||'—'}</span> · #${p.number||'—'}</div>
          </div>
        </div>`;
      }).join('');
      return `<div class="sq-depth-line">
        <div class="sq-depth-label">${label}</div>
        <div class="sq-depth-row">${slots}</div>
      </div>`;
    }).join('');

    container.querySelectorAll('.sq-depth-slot').forEach(slot => {
      slot.addEventListener('click', () => {
        const player = _allPlayers.find(p => p.id === slot.dataset.id);
        if (player) openModal(player);
      });
    });
  }

  // Segment toggle
  document.querySelectorAll('.sq-segs').forEach(group => {
    group.querySelectorAll('.sq-seg').forEach((s, i) => {
      s.addEventListener('click', () => {
        group.querySelectorAll('.sq-seg').forEach(o => o.classList.remove('is-on'));
        s.classList.add('is-on');
        const views = ['list', 'cards', 'depth'];
        setView(views[i] || 'list');
      });
    });
  });

  // ── Photo preview in modal ─────────────────────────────────────
  document.getElementById('sqF_photoBtn')?.addEventListener('click', () => document.getElementById('sqF_photo').click());
  document.getElementById('sqF_photo')?.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const preview = document.getElementById('sqF_photoPreview');
    if (preview) {
      const url = URL.createObjectURL(file);
      preview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover" alt="">`;
    }
  });

  // ── Export CSV ─────────────────────────────────────────────────
  document.getElementById('sqExportBtn')?.addEventListener('click', () => {
    if (!_allPlayers.length) { showToast('No players to export.'); return; }
    const cols = ['number','first_name','last_name','position','date_of_birth','nationality','height','weight','dominant_foot'];
    const header = cols.join(',');
    const rows = _allPlayers.map(p => cols.map(c => {
      const v = String(p[c] ?? '');
      return v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g,'""')}"` : v;
    }).join(','));
    const csv = [header, ...rows].join('\n');
    const date = new Date().toISOString().split('T')[0];
    const club = (_currentClubName || 'squad').replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([csv], { type:'text/csv' })),
      download: `squad_${club}_${date}.csv`
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  // ── Import CSV ─────────────────────────────────────────────────
  const IMPORT_COLS = ['first_name','last_name','number','position','date_of_birth','nationality','height','weight','dominant_foot'];

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[\s\-]/g,'_').replace(/[^a-z_]/g,''));
    return lines.slice(1).filter(l => l.trim()).map(line => {
      const vals = [];
      let cur = '', inQ = false;
      for (const ch of line) {
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      vals.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => { if (IMPORT_COLS.includes(h)) obj[h] = vals[i] || ''; });
      return obj;
    });
  }

  let _importRows = [];

  function openImportModal(rows) {
    _importRows = rows;
    const existingNums = new Set(_allPlayers.map(p => String(p.number)));
    const conflicts = rows.filter(r => r.number && existingNums.has(r.number)).map(r => `#${r.number}`);
    document.getElementById('sqImportInfo').textContent = `${rows.length} player${rows.length !== 1 ? 's' : ''} found in CSV.`;
    const conflictEl = document.getElementById('sqImportConflicts');
    if (conflicts.length) {
      conflictEl.textContent = `⚠ Jersey numbers already in squad: ${[...new Set(conflicts)].join(', ')}. These rows will be imported — resolve conflicts manually if needed.`;
      conflictEl.style.display = '';
    } else {
      conflictEl.style.display = 'none';
    }
    const displayCols = IMPORT_COLS.filter(c => rows.some(r => r[c]));
    document.getElementById('sqImportThead').innerHTML = `<tr>${displayCols.map(c =>
      `<th style="padding:7px 10px;font:500 11px/1 var(--cm-font-sans);letter-spacing:0.06em;text-transform:uppercase;color:var(--cm-fg-muted);border-bottom:1px solid var(--cm-border);white-space:nowrap">${c.replace(/_/g,' ')}</th>`
    ).join('')}</tr>`;
    document.getElementById('sqImportTbody').innerHTML = rows.slice(0,30).map(r =>
      `<tr>${displayCols.map(c =>
        `<td style="padding:7px 10px;border-bottom:1px solid var(--cm-border-soft);color:${r[c]?'var(--cm-fg)':'var(--cm-fg-faint)'}">${r[c]||'—'}</td>`
      ).join('')}</tr>`
    ).join('');
    document.getElementById('sqImportBackdrop').classList.add('is-open');
  }

  function closeImportModal() {
    document.getElementById('sqImportBackdrop').classList.remove('is-open');
    document.getElementById('sqImportFile').value = '';
    _importRows = [];
  }

  async function confirmImport() {
    if (!_importRows.length) return;
    const saving = document.getElementById('sqImportSaving');
    const btn = document.getElementById('sqImportConfirm');
    saving.style.display = 'inline'; btn.disabled = true;
    const rows = _importRows
      .map(r => ({
        club_id:       _currentClubId,
        team_id:       _currentTeamId || null,
        first_name:    r.first_name  || null,
        last_name:     r.last_name   || null,
        number:        parseInt(r.number) || null,
        position:      r.position    || null,
        date_of_birth: r.date_of_birth || null,
        nationality:   r.nationality || null,
        height:        parseFloat(r.height) || null,
        weight:        parseFloat(r.weight) || null,
        dominant_foot: r.dominant_foot || null,
      }))
      .filter(r => r.first_name || r.last_name);
    const { error } = await window.sb.from('players').insert(rows);
    saving.style.display = 'none'; btn.disabled = false;
    if (error) { showToast('Import failed: ' + error.message); return; }
    closeImportModal();
    showToast(`${rows.length} player${rows.length !== 1 ? 's' : ''} imported.`);
    await reloadPlayers();
  }

  document.getElementById('sqImportBtn')?.addEventListener('click', () => document.getElementById('sqImportFile').click());
  document.getElementById('sqImportFile')?.addEventListener('change', async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    const rows = parseCSV(text);
    if (!rows.length) { showToast('CSV empty or no matching columns (expected: first_name, last_name, number…).'); return; }
    openImportModal(rows);
  });
  document.getElementById('sqImportClose')?.addEventListener('click', closeImportModal);
  document.getElementById('sqImportCancel')?.addEventListener('click', closeImportModal);
  document.getElementById('sqImportConfirm')?.addEventListener('click', confirmImport);
  document.getElementById('sqImportBackdrop')?.addEventListener('click', e => { if (e.target === e.currentTarget) closeImportModal(); });
</script>
</body>
</html>
