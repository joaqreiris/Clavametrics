<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Radius scale</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:22px;background:#fff;font:var(--cm-body);display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .sq{width:64px;height:64px;background:#0A0A0A;border:1px solid #E5E7EB;}
  .l{font:500 10.5px/1 var(--cm-font-mono);color:#6B7280;letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  .px{font:500 11px/1 var(--cm-font-mono);color:#9CA3AF;}
</style></head><body>
  <div class="b"><div class="sq" style="border-radius:4px"></div><div class="l">tag</div><div class="px">4 px</div></div>
  <div class="b"><div class="sq" style="border-radius:6px"></div><div class="l">input · sm</div><div class="px">6 px</div></div>
  <div class="b"><div class="sq" style="border-radius:8px"></div><div class="l">button · chip</div><div class="px">8 px</div></div>
  <div class="b"><div class="sq" style="border-radius:10px"></div><div class="l">card · list</div><div class="px">10 px</div></div>
  <div class="b"><div class="sq" style="border-radius:12px"></div><div class="l">panel · modal</div><div class="px">12 px</div></div>
  <div class="b"><div class="sq" style="border-radius:16px"></div><div class="l">hero</div><div class="px">16 px</div></div>
</body></html>
