<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>KPI card</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:18px;background:#FAFAF9;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .kpi{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:14px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .l{display:flex;align-items:center;gap:6px;font:500 12px/1 var(--cm-font-sans);color:#6B7280;margin-bottom:10px;}
  .l .ti{font-size:14px;}
  .v{font:600 26px/1 var(--cm-font-sans);letter-spacing:-0.02em;color:#0A0A0A;}
  .v sub{font:500 13px/1 var(--cm-font-mono);color:#6B7280;margin-left:4px;}
  .t{margin-top:8px;display:flex;align-items:center;gap:6px;font:500 12px/1 var(--cm-font-sans);color:#6B7280;}
  .d{display:inline-flex;align-items:center;gap:3px;font:600 12px/1 var(--cm-font-mono);}
  .d.up{color:#16A34A;} .d.down{color:#DC2626;}
  .sp{position:absolute;right:14px;top:14px;width:76px;height:32px;color:#9CA3AF;}
</style></head><body class="cm">
  <div class="kpi">
    <div class="l"><i class="ti ti-users"></i>Squad size</div>
    <div class="v">27 <sub>players</sub></div>
    <div class="t"><span class="d up"><i class="ti ti-arrow-up-right"></i>+2</span><span>vs last MC</span></div>
    <svg class="sp" viewBox="0 0 76 32" preserveAspectRatio="none"><polyline points="0,24 12,22 24,18 36,20 48,12 60,14 76,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>
  <div class="kpi">
    <div class="l"><i class="ti ti-chart-line"></i>Avg ACWR</div>
    <div class="v">1.18</div>
    <div class="t"><span class="d down"><i class="ti ti-arrow-up-right"></i>+0.06</span><span style="color:#D97706">Sweet-spot</span></div>
    <svg class="sp" viewBox="0 0 76 32" preserveAspectRatio="none"><polyline points="0,22 12,18 24,20 36,14 48,16 60,10 76,12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>
</body></html>
