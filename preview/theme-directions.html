<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Theme directions</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:18px;background:#FAFAF9;font:var(--cm-body);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{border-radius:12px;overflow:hidden;border:1px solid #E5E7EB;display:grid;grid-template-rows:auto 1fr auto;height:200px;}
  .card.dark{border-color:rgba(255,255,255,0.08);}
  .card .body{display:flex;height:100%;}
  .card .side{width:34%;padding:12px;}
  .card .main{flex:1;padding:14px;}
  .card .ttl{font:600 11px/1 var(--cm-font-mono);letter-spacing:0.05em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid currentColor;}
  .nav{display:flex;flex-direction:column;gap:6px;font:500 11px/1 var(--cm-font-sans);}
  .nav .it{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;}
  .nav .it.on{font-weight:600;}
  .h{font:600 14px/1 var(--cm-font-sans);letter-spacing:-0.01em;margin-bottom:8px;}
  .p{font:500 11px/1.4 var(--cm-font-sans);margin-bottom:10px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font:600 11px/1 var(--cm-font-sans);}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .ttllbl{font:500 10px/1 var(--cm-font-mono);letter-spacing:0.06em;text-transform:uppercase;}
</style></head><body>

<!-- LIGHT -->
<div class="card" style="background:#fff;color:#0A0A0A;border-color:#E5E7EB;">
  <div class="ttl" style="border-color:#EFEFED;color:#6B7280;">Light · minimal</div>
  <div class="body">
    <div class="side" style="background:#FAFAF9;border-right:1px solid #EFEFED;">
      <div class="ttllbl" style="color:#9CA3AF;margin-bottom:6px;">Nav</div>
      <div class="nav" style="color:#6B7280;">
        <div class="it on" style="background:#F0F0EE;color:#0A0A0A;"><span class="dot" style="background:#0A0A0A;"></span>Hub</div>
        <div class="it">Squad</div><div class="it">Load</div>
      </div>
    </div>
    <div class="main">
      <div class="h">Microcycle 14</div>
      <div class="p" style="color:#6B7280;">Approve session before 16:00.</div>
      <div class="btn" style="background:#0A0A0A;color:#fff;">Approve →</div>
    </div>
  </div>
</div>

<!-- DARK -->
<div class="card dark" style="background:#0A0A0A;color:#EDEDED;">
  <div class="ttl" style="border-color:rgba(255,255,255,0.08);color:#9CA3AF;">Dark · performance</div>
  <div class="body">
    <div class="side" style="background:#0A0A0A;border-right:1px solid rgba(255,255,255,0.06);">
      <div class="ttllbl" style="color:#6B7280;margin-bottom:6px;">Nav</div>
      <div class="nav" style="color:#9CA3AF;">
        <div class="it on" style="background:rgba(255,255,255,0.06);color:#fff;"><span class="dot" style="background:#fff;"></span>Hub</div>
        <div class="it">Squad</div><div class="it">Load</div>
      </div>
    </div>
    <div class="main">
      <div class="h" style="color:#fff;">Microcycle 14</div>
      <div class="p" style="color:#9CA3AF;">Approve session before 16:00.</div>
      <div class="btn" style="background:#FAFAFA;color:#0A0A0A;">Approve →</div>
    </div>
  </div>
</div>

<!-- HYBRID -->
<div class="card dark" style="background:#FBFBFA;color:#0F1115;border-color:#E7E7E4;">
  <div class="ttl" style="border-color:#EFEFED;color:#5B6470;">Hybrid · pitch-green</div>
  <div class="body">
    <div class="side" style="background:#0E1116;color:#E6E8EB;border-right:1px solid rgba(255,255,255,0.06);">
      <div class="ttllbl" style="color:#8A93A0;margin-bottom:6px;">Nav</div>
      <div class="nav" style="color:#8A93A0;">
        <div class="it on" style="background:rgba(34,197,94,0.10);color:#4ADE80;"><span class="dot" style="background:#4ADE80;"></span>Hub</div>
        <div class="it">Squad</div><div class="it">Load</div>
      </div>
    </div>
    <div class="main">
      <div class="h">Microcycle 14</div>
      <div class="p" style="color:#5B6470;">Approve session before 16:00.</div>
      <div class="btn" style="background:#15803D;color:#fff;">Approve →</div>
    </div>
  </div>
</div>

</body></html>
