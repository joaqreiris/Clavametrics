<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Spacing</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:22px;background:#fff;font:var(--cm-body);display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;gap:12px;}
  .lbl{width:80px;font:500 10.5px/1 var(--cm-font-mono);color:#6B7280;letter-spacing:0.06em;text-transform:uppercase;}
  .bar{height:14px;background:#15803D;border-radius:3px;}
  .px{font:500 11px/1 var(--cm-font-mono);color:#9CA3AF;}
</style></head><body>
  <div class="row"><div class="lbl">s-1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
  <div class="row"><div class="lbl">s-2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="lbl">s-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="lbl">s-4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="lbl">s-5</div><div class="bar" style="width:20px"></div><div class="px">20 px</div></div>
  <div class="row"><div class="lbl">s-6</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="lbl">s-7</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="lbl">s-8</div><div class="bar" style="width:40px"></div><div class="px">40 px</div></div>
  <div class="row"><div class="lbl">s-9</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="lbl">s-10</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
</body></html>
