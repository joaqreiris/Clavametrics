<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><title>Primary colors</title>
<link rel="stylesheet" href="../clavametrics.css">
<style>
  body{margin:0;padding:24px;background:#fff;font:var(--cm-body);}
  h4{font:500 11px/1 var(--cm-font-mono);color:#8A93A0;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 12px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
  .sw{border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;height:88px;border:1px solid rgba(0,0,0,0.06);}
  .sw .name{font:600 12px/1 var(--cm-font-sans);}
  .sw .hex{font:500 11px/1 var(--cm-font-mono);opacity:0.7;}
  .on-light{color:#fff;} .on-dark{color:#0A0A0A;}
</style></head><body>
  <h4>Primary — Pitch Green</h4>
  <div class="row">
    <div class="sw on-dark" style="background:#ECFDF5;"><span class="name">soft</span><span class="hex">#ECFDF5</span></div>
    <div class="sw on-light" style="background:#22C55E;"><span class="name">300</span><span class="hex">#22C55E</span></div>
    <div class="sw on-light" style="background:#16A34A;"><span class="name">500</span><span class="hex">#16A34A</span></div>
    <div class="sw on-light" style="background:#15803D;"><span class="name">600 · accent</span><span class="hex">#15803D</span></div>
    <div class="sw on-light" style="background:#14532D;"><span class="name">800</span><span class="hex">#14532D</span></div>
  </div>
  <h4>Ink — Neutral</h4>
  <div class="row">
    <div class="sw on-dark" style="background:#FAFAF9;border-color:#E5E7EB;"><span class="name">bg</span><span class="hex">#FAFAF9</span></div>
    <div class="sw on-dark" style="background:#E5E7EB;"><span class="name">border</span><span class="hex">#E5E7EB</span></div>
    <div class="sw on-light" style="background:#6B7280;"><span class="name">muted</span><span class="hex">#6B7280</span></div>
    <div class="sw on-light" style="background:#1F1F1F;"><span class="name">fg</span><span class="hex">#1F1F1F</span></div>
    <div class="sw on-light" style="background:#0A0A0A;"><span class="name">ink</span><span class="hex">#0A0A0A</span></div>
  </div>
</body></html>
