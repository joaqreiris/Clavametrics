<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClavaMetrics — Signing in…</title>
  <style>
    body { margin: 0; background: #0f1117; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <span>Signing in…</span>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-init.js"></script>
  <script>
  (async () => {
    const ok = await window.requireAuth('Login.html');
    if (!ok) return;
    const clubId = await window.getClubId();
    window.location.replace(clubId ? 'Hub.html' : 'Onboarding.html');
  })();
  </script>
</body>
</html>
