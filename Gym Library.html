<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Library — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D">
  <link rel="apple-touch-icon" href="/assets/clava-app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<style>
  body.cm{background:var(--cm-bg)}
  .hub-topbar{display:flex;align-items:center;gap:14px;height:56px;padding:0 24px;border-bottom:1px solid var(--cm-border);background:var(--cm-bg);position:sticky;top:0;z-index:50}
  .hub-crumb{display:flex;align-items:center;gap:8px;color:var(--cm-fg-muted);font:var(--cm-body-sm)}
  .hub-crumb .ti{font-size:14px}.hub-crumb .sep{color:var(--cm-fg-faint)}
  .hub-topbar .actions{margin-left:auto;display:flex;gap:8px}

  .gl-page{padding:20px 26px 56px;max-width:1600px}
  .gl-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .gl-head h1{font:600 24px/1.1 var(--cm-font-sans);letter-spacing:-0.02em;color:var(--cm-fg-strong)}
  .gl-head .ctx{font:var(--cm-body);color:var(--cm-fg-muted);margin-top:4px}
  .gl-head .ctx strong{color:var(--cm-fg);font-weight:600}
  .gl-head .meta{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* Toolbar */
  .gl-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:10px 12px;box-shadow:var(--cm-shadow-1);margin-bottom:14px}
  .gl-search{flex:1;min-width:240px;max-width:360px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3)}
  .gl-search input{flex:1;border:0;background:transparent;outline:none;font:var(--cm-body-sm);color:var(--cm-fg)}
  .gl-search .ti{font-size:16px;color:var(--cm-fg-muted)}
  .gl-sel{height:32px;padding:0 12px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);color:var(--cm-fg);font:500 12.5px/1 var(--cm-font-sans);cursor:pointer;outline:none}
  .gl-sel:hover{border-color:var(--cm-border-strong)}
  .gl-sel:disabled{opacity:.45;cursor:not-allowed}
  .gl-toolbar .grow{flex:1}
  .gl-segs{display:inline-flex;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);padding:3px;gap:2px}
  .gl-segs button{border:0;background:transparent;padding:0 11px;height:26px;border-radius:5px;color:var(--cm-fg-muted);cursor:pointer;font:500 12px/1 var(--cm-font-sans);display:inline-flex;align-items:center;gap:5px}
  .gl-segs button.is-on{background:var(--cm-surface);color:var(--cm-fg-strong);box-shadow:var(--cm-shadow-1);font-weight:600}
  .gl-segs .ti{font-size:13px}

  /* Muscle chips strip */
  .gl-muscles{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 14px}
  .gl-m-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-surface);border:1px solid var(--cm-border);color:var(--cm-fg-muted);font:500 12px/1 var(--cm-font-sans);cursor:pointer}
  .gl-m-chip:hover{color:var(--cm-fg);border-color:var(--cm-border-strong)}
  .gl-m-chip.is-on{background:var(--cm-accent-soft);color:var(--cm-fg-strong);border-color:var(--cm-border-strong)}
  .gl-m-chip .ct{font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-faint)}
  .gl-m-chip.is-on .ct{color:var(--cm-accent);font-weight:600}

  /* Count badge */
  .gl-count{font:500 12.5px/1 var(--cm-font-mono);color:var(--cm-fg-muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .gl-count strong{color:var(--cm-fg-strong);font-weight:600}
  .gl-count .clear{margin-left:auto;font:500 12px/1 var(--cm-font-sans);color:var(--cm-accent);cursor:pointer}

  /* Exercise grid */
  .gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .gl-card{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);overflow:hidden;display:flex;flex-direction:column;transition:border-color 120ms,box-shadow 120ms,transform 120ms}
  .gl-card:hover{border-color:var(--cm-border-strong);box-shadow:var(--cm-shadow-2);transform:translateY(-1px)}
  .gl-thumb{position:relative;width:100%;aspect-ratio:16/10;background:var(--cm-bg-soft);overflow:hidden}
  .gl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gl-thumb-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--cm-bg-soft) 0%,var(--cm-bg-sunk) 100%);display:flex;align-items:center;justify-content:center}
  .gl-thumb-ph span{font:700 36px/1 var(--cm-font-sans);letter-spacing:-0.02em;color:var(--cm-fg-faint)}
  .gl-thumb-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);opacity:0;transition:opacity 120ms;cursor:pointer;border:0}
  .gl-card:hover .gl-thumb-play{opacity:1}
  .gl-thumb-play .ti{font-size:18px;margin-left:2px}
  .gl-cplx-badge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;font:700 10px/1 var(--cm-font-mono);letter-spacing:0.06em;text-transform:uppercase;backdrop-filter:blur(6px)}
  .gl-cplx-badge.low{background:rgba(34,197,94,0.85);color:#fff}
  .gl-cplx-badge.med{background:rgba(245,158,11,0.85);color:#fff}
  .gl-cplx-badge.high{background:rgba(220,38,38,0.85);color:#fff}
  .gl-default-pill{position:absolute;top:34px;left:8px;display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:4px;background:rgba(0,0,0,0.5);color:#fff;font:600 9.5px/1 var(--cm-font-mono);letter-spacing:0.06em;text-transform:uppercase;backdrop-filter:blur(6px)}
  .gl-video-tag{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:4px;background:rgba(0,0,0,0.55);color:#fff;font:600 10px/1 var(--cm-font-mono);letter-spacing:0.04em;backdrop-filter:blur(6px)}
  .gl-video-tag .ti{font-size:12px}

  .gl-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .gl-name{font:600 14px/1.25 var(--cm-font-sans);color:var(--cm-fg-strong)}
  .gl-muscles-row{display:flex;flex-wrap:wrap;gap:4px}
  .gl-muscle{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:4px;background:var(--cm-success-bg);color:var(--cm-success);font:600 10.5px/1 var(--cm-font-mono);letter-spacing:0.04em}
  .gl-muscle.sec{background:var(--cm-bg-soft);color:var(--cm-fg-muted);border:1px solid var(--cm-border-soft)}
  .gl-desc{font:var(--cm-body-sm);color:var(--cm-fg-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gl-foot{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--cm-border-soft);margin-top:auto}
  .gl-foot .gl-tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);font:600 10px/1 var(--cm-font-mono);color:var(--cm-fg-muted);letter-spacing:0.04em}
  .gl-foot .grow{flex:1}
  .gl-foot button{width:26px;height:26px;border-radius:5px;border:0;background:transparent;color:var(--cm-fg-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .gl-foot button:hover{background:var(--cm-bg-soft);color:var(--cm-fg)}
  .gl-foot button .ti{font-size:13px}

  /* Add card */
  .gl-add{border:1.5px dashed var(--cm-border-strong);border-radius:var(--cm-r-4);background:transparent;color:var(--cm-fg-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  .gl-add:hover{border-color:var(--cm-accent);color:var(--cm-fg);background:var(--cm-accent-soft)}
  .gl-add .ic{width:40px;height:40px;border-radius:10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);display:flex;align-items:center;justify-content:center}
  .gl-add .ic .ti{font-size:18px}
  .gl-add .l{font:500 13px/1.4 var(--cm-font-sans)}
  .gl-add small{font:500 10.5px/1.4 var(--cm-font-mono);color:var(--cm-fg-faint)}

  /* List view */
  .gl-grid.is-list{grid-template-columns:1fr;gap:6px}
  .gl-grid.is-list .gl-card{flex-direction:row;min-height:76px}
  .gl-grid.is-list .gl-thumb{width:110px;flex-shrink:0;aspect-ratio:unset;height:auto}
  .gl-grid.is-list .gl-body{padding:8px 12px;gap:5px}
  .gl-grid.is-list .gl-desc{-webkit-line-clamp:1}
  .gl-grid.is-list .gl-add{flex-direction:row;gap:10px;padding:12px 16px;justify-content:flex-start}
  .gl-grid.is-list .gl-add small{display:none}

  /* Group separator (By muscle) */
  .gl-group-sep{grid-column:1/-1;padding:14px 0 6px;font:600 11px/1 var(--cm-font-sans);color:var(--cm-fg-muted);text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid var(--cm-border-soft);margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .gl-group-sep .ct{font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-faint)}

  /* Empty state */
  .gl-empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--cm-fg-muted);font:var(--cm-body)}

  /* Overlay / Modal */
  .gl-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
  .gl-overlay.is-open{display:flex}
  .gl-modal-box{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:24px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--cm-shadow-3)}
  .gl-modal-box h2{font:600 16px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong);margin:0}
  .gm-field{display:flex;flex-direction:column;gap:4px}
  .gm-field label{font:500 12px/1 var(--cm-font-sans);color:var(--cm-fg-muted)}
  .gm-field input,.gm-field select,.gm-field textarea{height:34px;padding:0 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);color:var(--cm-fg);font:var(--cm-body-sm);outline:none;width:100%;box-sizing:border-box}
  .gm-field textarea{height:72px;padding:8px 10px;resize:vertical}
  .gm-usable{display:flex;flex-wrap:wrap;gap:8px 14px;padding:2px 0}
  .gm-usable label{display:inline-flex;align-items:center;gap:5px;font:500 12.5px/1 var(--cm-font-sans);color:var(--cm-fg);cursor:pointer}
  .gm-usable input{width:auto;height:auto;accent-color:var(--cm-accent)}
  .gm-field input:focus,.gm-field select:focus,.gm-field textarea:focus{border-color:var(--cm-border-strong)}
  .gm-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0;max-height:150px;overflow-y:auto}
  .gm-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-surface);border:1px solid var(--cm-border);color:var(--cm-fg-muted);font:500 12px/1 var(--cm-font-sans);cursor:pointer}
  .gm-chip:hover{color:var(--cm-fg);border-color:var(--cm-border-strong)}
  .gm-chip.is-on{background:var(--cm-accent-soft);color:var(--cm-fg-strong);border-color:var(--cm-border-strong)}
  .gm-opt{font:500 11px/1 var(--cm-font-sans);color:var(--cm-fg-faint)}
  .gm-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
  .gm-del-box{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--cm-shadow-3)}
  .gm-del-box p{font:var(--cm-body);color:var(--cm-fg-muted);margin:0}

  /* Video lightbox */
  .gl-video-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
  .gl-video-overlay.is-open{display:flex}
  .gl-video-box{position:relative;width:100%;max-width:880px}
  .gl-video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--cm-r-4);overflow:hidden;box-shadow:var(--cm-shadow-3)}
  .gl-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .gl-video-close{position:absolute;top:-40px;right:0;width:32px;height:32px;border-radius:8px;border:0;background:var(--cm-surface);color:var(--cm-fg);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--cm-shadow-2)}
  .gl-video-close:hover{background:var(--cm-bg-soft)}
  .gl-video-close .ti{font-size:18px}

  #tweaks-root{position:fixed;bottom:16px;right:16px;z-index:1000}
  .yt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font:500 12px/1 var(--cm-font-sans);color:var(--cm-fg-muted)}
  .yt-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .yt-row{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--cm-border);border-radius:var(--cm-r-3);cursor:pointer}
  .yt-row img{width:72px;height:40px;object-fit:cover;border-radius:4px;background:var(--cm-bg-soft);flex:none}
  .yt-row .yt-title{font:500 13px/1.3 var(--cm-font-sans);color:var(--cm-fg)}
  .yt-row.is-dup{opacity:.5}
  .yt-row input{accent-color:var(--cm-accent);flex:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<script src="lib/exercise-taxonomy.js"></script>
<script src="assets/global-search.js" defer></script>
</head>
<body class="cm">

<div class="hub-shell" data-screen-label="23 Gym Library">
  <div id="hub-side-root"></div>

  <main class="hub-main">
    <div class="hub-topbar">
      <div class="hub-crumb"><i class="ti ti-home"></i><span>Performance</span><span class="sep">/</span><span style="color:var(--cm-fg-strong);font-weight:600">Gym library</span></div>
      <div class="hub-search"><i class="ti ti-search"></i><input placeholder="Search players, sessions, microcycles…"></div>
      <div class="actions">
        <button class="cm-icon-btn" disabled title="Próximamente"><i class="ti ti-bell"></i></button>
        <button class="cm-icon-btn" data-open-settings><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <section class="gl-page">

      <header class="gl-head">
        <div>
          <h1>Gym library</h1>
          <div class="ctx"><strong><span id="gl-stat-total">0</span> exercises</strong> · indexed by muscle group, category &amp; complexity · <span id="gl-stat-video">0</span> with video</div>
        </div>
        <div class="meta">
          <button class="cm-btn is-outline is-sm" disabled title="Próximamente"><i class="ti ti-file-import" style="font-size:14px"></i>Import CSV</button>
          <button class="cm-btn is-outline is-sm" disabled title="Próximamente"><i class="ti ti-template" style="font-size:14px"></i>Templates</button>
          <button class="cm-btn is-outline is-sm" id="btn-import-yt"><i class="ti ti-brand-youtube" style="font-size:14px"></i>Import YouTube</button>
          <button class="cm-btn is-primary is-sm" id="btn-new-exercise"><i class="ti ti-plus" style="font-size:14px"></i>New exercise</button>
        </div>
      </header>

      <div class="gl-toolbar">
        <div class="gl-search"><i class="ti ti-search"></i><input id="gl-search-input" placeholder="Search exercise name, cues, muscles…"></div>
        <select class="gl-sel" id="gl-sel-muscle"><option value="">All muscles</option></select>
        <select class="gl-sel" id="gl-sel-complexity">
          <option value="">All complexity</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
        <select class="gl-sel" id="gl-sel-equipment"><option value="">All equipment</option></select>
        <select class="gl-sel" id="gl-sel-purpose"><option value="">All purposes</option></select>
        <select class="gl-sel" id="gl-sel-pattern"><option value="">All patterns</option></select>
        <select class="gl-sel" id="gl-sel-usable">
          <option value="">All modules</option>
          <option value="gym">Gym</option>
          <option value="individual">Individual</option>
          <option value="rehab">Rehab</option>
          <option value="preventive">Preventive</option>
        </select>
        <div class="grow"></div>
        <div class="gl-segs">
          <button class="is-on" data-view="grid"><i class="ti ti-grid-dots"></i>Grid</button>
          <button data-view="list"><i class="ti ti-list"></i>List</button>
          <button data-view="muscle"><i class="ti ti-layout-rows"></i>By muscle</button>
        </div>
      </div>

      <div class="gl-muscles" id="gl-muscles-strip"></div>

      <div class="gl-count">
        Showing <strong id="gl-visible">0</strong> of <strong id="gl-total">0</strong> exercises
        <span class="clear">Clear filters</span>
      </div>

      <div class="gl-grid" id="gl-grid"></div>

    </section>
  </main>
</div>

<!-- Exercise modal (create / edit) -->
<div class="gl-overlay" id="gl-modal">
  <div class="gl-modal-box">
    <h2 id="gl-modal-title">New exercise</h2>
    <form id="gm-form" onsubmit="return false">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="gm-field">
          <label>Name <span style="color:var(--cm-danger)">*</span></label>
          <input id="gm-name" placeholder="e.g. Back squat" maxlength="120">
        </div>
        <div class="gm-field">
          <label>Primary purpose <span style="color:var(--cm-danger)">*</span></label>
          <select id="gm-primary-purpose"><option value="">Select…</option></select>
        </div>
        <div class="gm-field">
          <label>Muscle groups <span style="color:var(--cm-danger)">*</span></label>
          <div class="gm-chips" id="gm-muscle-chips"></div>
        </div>
        <div class="gm-field">
          <label>Movement patterns</label>
          <div class="gm-chips" id="gm-pattern-chips"></div>
        </div>
        <div class="gm-field">
          <label>Type</label>
          <select id="gm-category-type">
            <option value="strength">Strength</option>
            <option value="power">Power</option>
            <option value="olympic">Olympic</option>
            <option value="mobility">Mobility</option>
            <option value="activation">Activation</option>
            <option value="core">Core</option>
            <option value="balance">Balance</option>
            <option value="conditioning">Conditioning</option>
            <option value="prehab">Prehab</option>
            <option value="speed">Speed</option>
            <option value="cooldown">Cooldown</option>
          </select>
        </div>
        <div class="gm-field">
          <label>Complexity</label>
          <select id="gm-complexity">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="gm-field">
          <label>Equipment <span class="gm-opt">· empty = bodyweight</span></label>
          <div class="gm-chips" id="gm-equipment-chips"></div>
        </div>
        <div class="gm-field">
          <label>Purpose — additional <span class="gm-opt">(optional)</span></label>
          <div class="gm-chips" id="gm-purpose-chips"></div>
        </div>
        <div class="gm-field">
          <label>Contraction type <span class="gm-opt">(optional)</span></label>
          <div class="gm-chips" id="gm-contraction-chips"></div>
        </div>
        <div class="gm-field">
          <label>Movement speed <span class="gm-opt">(optional)</span></label>
          <div class="gm-chips" id="gm-speed-chips"></div>
        </div>
        <div class="gm-field">
          <label>Plane <span class="gm-opt">(optional)</span></label>
          <div class="gm-chips" id="gm-plane-chips"></div>
        </div>
        <div class="gm-field">
          <label>Myofascial chains <span class="gm-opt">(optional)</span></label>
          <div class="gm-chips" id="gm-chain-chips"></div>
        </div>
        <div class="gm-field">
          <label>Usable in</label>
          <div class="gm-usable">
            <label><input type="checkbox" class="gm-usable-cb" value="gym" checked> Gym</label>
            <label><input type="checkbox" class="gm-usable-cb" value="individual"> Individual</label>
            <label><input type="checkbox" class="gm-usable-cb" value="rehab"> Rehab</label>
            <label><input type="checkbox" class="gm-usable-cb" value="preventive"> Preventive</label>
          </div>
        </div>
        <div class="gm-field">
          <label>Description</label>
          <textarea id="gm-desc" placeholder="Coaching cues, execution notes…" maxlength="600"></textarea>
        </div>
        <div class="gm-field">
          <label>Video URL</label>

<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>window.__CM_TWEAK_DEFAULTS = { theme: "hybrid", accent: "green" };</script>
<script defer src="settings-drawer.js"></script>
<script defer src="tweaks-panel.js"></script>
<script defer src="theme-tweaks.js"></script>
<script>
const CPLX_CSS = { Low:'low', Medium:'med', High:'high' };
const CATEGORY_ORDER = ['strength','power','olympic','mobility','activation','core','balance','conditioning','prehab','speed','cooldown'];
let ALL_EXERCISES = [];
let CLUB_ID = null;
let activeFilters = { search:'', muscle:'', complexity:'', category:'', equipment:'', purpose:'', pattern:'', usableIn:'', view:'grid' };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
let editingId = null;
let _gmMediaFile = null;
let _gmMediaRemove = false;

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function youtubeId(url) {
  if (!url) return null;
  const patterns = [
    /youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/,
    /youtu\.be\/([\w-]{11})/,
    /youtube\.com\/embed\/([\w-]{11})/,
    /youtube\.com\/shorts\/([\w-]{11})/
  ];
  for (const re of patterns) { const m = url.match(re); if (m) return m[1]; }
  return null;
}

function openVideo(url) {
  const id = youtubeId(url);
  if (!id) { window.open(url, '_blank'); return; }  // non-YouTube → fallback to new tab
  document.getElementById('gl-video-iframe').src =
    `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
  document.getElementById('gl-video-modal').classList.add('is-open');
}

function closeVideo() {
  const modal = document.getElementById('gl-video-modal');
  if (!modal.classList.contains('is-open')) return;
  modal.classList.remove('is-open');
  document.getElementById('gl-video-iframe').src = '';  // stop playback
}

async function boot() {
  if (!(await window.guardModule())) return;
  const [, club] = await Promise.all([window.getProfile(), window.getClub()]);
  CLUB_ID = await window.getClubId();
  if (club) window.applyClubTheme();
  await reloadExercises(false);
  attachListeners();
}

async function reloadExercises(rebuild = true) {
  const { data } = await window.sb.from('gym_exercises')
    .select('id,name,description,muscle_group,category,complexity,equipment,usable_in,video_url,is_default,media_type,media_ref,primary_purpose,purposes,equipment_tags,muscle_groups,movement_patterns,video_id,source')
    .eq('club_id', CLUB_ID)
    .order('name');
  ALL_EXERCISES = data || [];
  try {
    const paths = ALL_EXERCISES.filter(e => e.media_type === 'image' && e.media_ref).map(e => e.media_ref);
    let signed = {};
    if (paths.length) {
      const { data: urls } = await window.sb.storage.from('gym-exercise-media').createSignedUrls(paths, 3600);
      (urls || []).forEach(u => { if (u && u.path && u.signedUrl) signed[u.path] = u.signedUrl; });
    }
    ALL_EXERCISES.forEach(e => { e._mediaImg = (e.media_type === 'image' && e.media_ref) ? (signed[e.media_ref] || null) : null; });
  } catch (_) {}
  if (rebuild) {
    renderStats();
    renderCategoryChips();
    renderMuscleSelect();
    renderEquipmentSelect();
    renderPurposeSelect(); renderPatternSelect();
    applyFilters();
  } else {
    buildUI();
  }
}

function buildUI() {
  renderStats();
  renderCategoryChips();
  renderMuscleSelect();
  renderEquipmentSelect();
  renderPurposeSelect(); renderPatternSelect();
  applyFilters();
}

function renderStats() {
  const total = ALL_EXERCISES.length;
  const withVideo = ALL_EXERCISES.filter(e => e.video_url).length;
  document.getElementById('gl-stat-total').textContent = total;
  document.getElementById('gl-stat-video').textContent = withVideo;
}

function muscleCounts() {
  const counts = {};
  for (const e of ALL_EXERCISES) {
    const m = e.muscle_group || 'Other';
    counts[m] = (counts[m]||0) + 1;
  }
  return counts;
}

function categoryCounts() {
  const counts = {};
  for (const e of ALL_EXERCISES) {
    const c = e.category || 'other';
    counts[c] = (counts[c]||0) + 1;
  }
  return counts;
}

function renderCategoryChips() {
  const counts = categoryCounts();
  const total = ALL_EXERCISES.length;
  const strip = document.getElementById('gl-muscles-strip');
  // canonical order first, then any unexpected category alphabetically
  const ordered = CATEGORY_ORDER.filter(c => counts[c] != null)
    .concat(Object.keys(counts).filter(c => !CATEGORY_ORDER.includes(c)).sort());
  const isAll = activeFilters.category === '';
  let html = `<button class="gl-m-chip${isAll?' is-on':''}" data-category="">All <span class="ct">${total}</span></button>`;
  html += ordered.map(c => {
    const on = activeFilters.category === c ? ' is-on' : '';
    return `<button class="gl-m-chip${on}" data-category="${esc(c)}">${esc(cap(c))} <span class="ct">${counts[c]}</span></button>`;
  }).join('');
  strip.innerHTML = html;
  strip.querySelectorAll('.gl-m-chip').forEach(ch => ch.addEventListener('click', () => {
    activeFilters.category = ch.dataset.category;
    syncChips();
    applyFilters();
  }));
}

function tokenCounts(col) {
  const counts = {};
  for (const e of ALL_EXERCISES) for (const t of (e[col] || [])) counts[t] = (counts[t]||0)+1;
  return counts;
}
function fillCanonSelect(selId, dimension, col, curVal, allLabel) {
  const counts = tokenCounts(col);
  const order = CMTaxonomy.tokens(dimension).filter(t => counts[t] != null);
  const sel = document.getElementById(selId);
  sel.innerHTML = `<option value="">${allLabel} · ${order.length}</option>` +
    order.map(t => `<option value="${esc(t)}"${curVal===t?' selected':''}>${esc(CMTaxonomy.label(dimension,t))} · ${counts[t]}</option>`).join('');
}
function renderMuscleSelect()    { fillCanonSelect('gl-sel-muscle','muscle_group','muscle_groups',activeFilters.muscle,'All muscles'); }
function renderEquipmentSelect() { fillCanonSelect('gl-sel-equipment','equipment','equipment_tags',activeFilters.equipment,'All equipment'); }
function renderPurposeSelect()   { fillCanonSelect('gl-sel-purpose','purpose','purposes',activeFilters.purpose,'All purposes'); }
function renderPatternSelect()   { fillCanonSelect('gl-sel-pattern','movement_pattern','movement_patterns',activeFilters.pattern,'All patterns'); }

function syncChips() {
  document.getElementById('gl-muscles-strip').querySelectorAll('.gl-m-chip').forEach(c => {
    c.classList.toggle('is-on', c.dataset.category === activeFilters.category);
  });
}

function applyFilters() {
  const search = activeFilters.search.toLowerCase();
  const muscle = activeFilters.muscle;
  const complexity = activeFilters.complexity;
  const category = activeFilters.category;
  const equipment = activeFilters.equipment;
  const purpose = activeFilters.purpose;
  const pattern = activeFilters.pattern;
  const usableIn = activeFilters.usableIn;

  const visible = ALL_EXERCISES.filter(e => {
    if (muscle && !(e.muscle_groups || []).includes(muscle)) return false;
    if (complexity && e.complexity !== complexity) return false;
    if (category && e.category !== category) return false;
    if (equipment && !(e.equipment_tags || []).includes(equipment)) return false;
    if (purpose && !(e.purposes || []).includes(purpose)) return false;
    if (pattern && !(e.movement_patterns || []).includes(pattern)) return false;
    if (usableIn && !(e.usable_in || []).includes(usableIn)) return false;
    if (search) {
      const hay = `${e.name||''} ${e.description||''} ${e.muscle_group||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  renderGrid(visible);
  updateCount(visible.length, ALL_EXERCISES.length);
}

function renderGrid(exercises) {
  const grid = document.getElementById('gl-grid');
  const view = activeFilters.view;

  if (view === 'muscle') {
    grid.className = 'gl-grid';
    renderByMuscle(exercises, grid);
    return;
  }

  grid.className = view === 'list' ? 'gl-grid is-list' : 'gl-grid';

  if (!exercises.length) {
    grid.innerHTML = '<div class="gl-empty">No exercises match your filters.</div>';
    appendAddCard(grid);
    return;
  }

  grid.innerHTML = exercises.map(cardHTML).join('');
  appendAddCard(grid);
  attachCardListeners();
  highlightFromURL();
}

function renderByMuscle(exercises, grid) {
  const groups = {};
  for (const e of exercises) {
    const g = (e.muscle_groups && e.muscle_groups.length)
      ? CMTaxonomy.label('muscle_group', e.muscle_groups[0])
      : (e.muscle_group || 'Other');
    if (!groups[g]) groups[g] = [];
    groups[g].push(e);
  }

  if (!exercises.length) {
    grid.innerHTML = '<div class="gl-empty">No exercises match your filters.</div>';
    appendAddCard(grid);
    return;
  }

  let html = '';
  for (const [group, list] of Object.entries(groups).sort()) {
    html += `<div class="gl-group-sep">${esc(group)} <span class="ct">${list.length}</span></div>`;
    html += list.map(cardHTML).join('');
  }
  grid.innerHTML = html;
  appendAddCard(grid);
  attachCardListeners();
  highlightFromURL();
}

function appendAddCard(grid) {
  const btn = document.createElement('button');
  btn.className = 'gl-add';
  btn.innerHTML = '<div class="ic"><i class="ti ti-plus"></i></div><div class="l">Add a new exercise</div><small>Name · target muscles · complexity · video URL</small>';
  btn.addEventListener('click', () => openModal());
  grid.appendChild(btn);
}

function labelsFor(e, dimension, col, legacy) {
  const toks = e[col] || [];
  if (toks.length) return toks.map(t => CMTaxonomy.label(dimension, t));
  return legacy ? [legacy] : [];
}
function purposeLabel(e) {
  if (e.primary_purpose) return CMTaxonomy.label('purpose', e.primary_purpose);
  return e.category ? cap(e.category) : '';
}

function cardHTML(e) {
  const initials = (e.name||'').split(' ').map(w => w[0]||'').join('').slice(0,2).toUpperCase();
  const cplxCss = CPLX_CSS[e.complexity] || 'med';
  const hasVideo = !!e.video_url;
  const muscleLabels = labelsFor(e, 'muscle_group', 'muscle_groups', e.muscle_group);
  const videoEsc = hasVideo ? esc(e.video_url) : '';
  const vidId = hasVideo ? youtubeId(e.video_url) : null;

  return `<div class="gl-card" data-id="${esc(e.id)}">
    <div class="gl-thumb">
      ${e._mediaImg
        ? `<img src="${esc(e._mediaImg)}" alt="" loading="lazy">`
        : vidId
          ? `<img src="https://img.youtube.com/vi/${vidId}/hqdefault.jpg" alt="" loading="lazy">`
          : `<div class="gl-thumb-ph"><span>${initials}</span></div>`}
      ${e.complexity ? `<span class="gl-cplx-badge ${cplxCss}">${esc(e.complexity)}</span>` : ''}
      ${e.is_default ? `<span class="gl-default-pill">Default</span>` : ''}
      ${hasVideo ? `<span class="gl-video-tag"><i class="ti ti-brand-youtube"></i>Video</span><button class="gl-thumb-play btn-play" data-video="${videoEsc}"><i class="ti ti-player-play"></i></button>` : ''}
    </div>
    <div class="gl-body">
      <div class="gl-name">${esc(e.name||'Unnamed')}</div>
      <div class="gl-muscles-row">${muscleLabels.map(m => `<span class="gl-muscle">${esc(m)}</span>`).join('')}</div>
      <div class="gl-desc">${esc(e.description||'')}</div>
      <div class="gl-foot">
        ${purposeLabel(e) ? `<span class="gl-tag">${esc(purposeLabel(e))}</span>` : ''}
        ${labelsFor(e, 'equipment', 'equipment_tags', e.equipment).filter(x => x !== 'Bodyweight').map(q => `<span class="gl-tag">${esc(q)}</span>`).join('')}
        <span class="grow"></span>
        <button class="btn-add-plan" title="Add to plan"><i class="ti ti-plus"></i></button>
        <button class="btn-edit" data-id="${esc(e.id)}" title="Edit exercise"><i class="ti ti-edit"></i></button>
        <button class="btn-del" data-id="${esc(e.id)}" title="Delete exercise"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>`;
}

function attachCardListeners() {
  document.querySelectorAll('#gl-grid .btn-edit').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    openModal(b.dataset.id);
  }));
  document.querySelectorAll('#gl-grid .btn-del').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    confirmDelete(b.dataset.id);
  }));
  document.querySelectorAll('#gl-grid .btn-play').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    if (b.dataset.video) openVideo(b.dataset.video);
  }));
}

function highlightFromURL() {
  const hlId = new URLSearchParams(location.search).get('highlight');
  if (!hlId) return;
  requestAnimationFrame(() => {
    const card = document.querySelector(`#gl-grid .gl-card[data-id="${hlId}"]`);
    if (card) { card.scrollIntoView({ behavior:'smooth', block:'center' }); card.classList.add('gs-highlight'); }
  });
}

function updateCount(visible, total) {
  document.getElementById('gl-visible').textContent = visible;
  document.getElementById('gl-total').textContent = total;
}

// ── Modal helpers ──────────────────────────────────────────────────

function setMediaPreview(url) {
  const img = document.getElementById('gm-media-preview');
  const rm = document.getElementById('gm-media-remove');
  if (url) { img.src = url; img.style.display = ''; rm.style.display = ''; }
  else { img.removeAttribute('src'); img.style.display = 'none'; rm.style.display = 'none'; }
}

function populatePurposeSelect() {
  document.getElementById('gm-primary-purpose').innerHTML =
    `<option value="">Select…</option>` +
    CMTaxonomy.PURPOSE.map(p => `<option value="${esc(p.token)}">${esc(p.label)}</option>`).join('');
}
function renderChipCloud(containerId, dimension, selected) {
  const sel = new Set(selected || []);
  document.getElementById(containerId).innerHTML =
    CMTaxonomy.LISTS[dimension].map(it =>
      `<button type="button" class="gm-chip${sel.has(it.token)?' is-on':''}" data-token="${esc(it.token)}">${esc(it.label)}</button>`
    ).join('');
}
function readChipCloud(containerId) {
  return [...document.querySelectorAll(`#${containerId} .gm-chip.is-on`)].map(b => b.dataset.token);
}
function renderAllChips(ex) {
  const pp = ex ? ex.primary_purpose : '';
  renderChipCloud('gm-muscle-chips','muscle_group', ex && ex.muscle_groups);
  renderChipCloud('gm-pattern-chips','movement_pattern', ex && ex.movement_patterns);
  renderChipCloud('gm-equipment-chips','equipment', ex && ex.equipment_tags);
  renderChipCloud('gm-purpose-chips','purpose', ex ? (ex.purposes||[]).filter(p=>p!==pp) : []);
  renderChipCloud('gm-contraction-chips','contraction_type', ex && ex.contraction_types);
  renderChipCloud('gm-speed-chips','movement_speed', ex && ex.movement_speeds);
  renderChipCloud('gm-plane-chips','plane', ex && ex.planes);
  renderChipCloud('gm-chain-chips','myofascial_chain', ex && ex.myofascial_chains);
}

function openModal(id) {
  editingId = id || null;
  _gmMediaFile = null;
  _gmMediaRemove = false;
  document.getElementById('gm-media').value = '';
  const titleEl = document.getElementById('gl-modal-title');
  const saveBtn = document.getElementById('gm-save');

  if (id) {
    const ex = ALL_EXERCISES.find(e => e.id === id);
    if (!ex) return;
    titleEl.textContent = 'Edit exercise';
    saveBtn.textContent = 'Save';
    document.getElementById('gm-name').value = ex.name || '';
    document.getElementById('gm-primary-purpose').value = ex.primary_purpose || '';
    document.getElementById('gm-category-type').value = ex.category || 'strength';
    document.getElementById('gm-complexity').value = ex.complexity || 'Low';
    document.getElementById('gm-desc').value = ex.description || '';
    document.getElementById('gm-video').value = ex.video_url || '';
    setMediaPreview(ex._mediaImg || null);
    const usable = ex.usable_in || [];
    document.querySelectorAll('.gm-usable-cb').forEach(cb => { cb.checked = usable.includes(cb.value); });
    renderAllChips(ex);
  } else {
    titleEl.textContent = 'New exercise';
    saveBtn.textContent = 'Create';
    document.getElementById('gm-form').reset();
    document.getElementById('gm-primary-purpose').value = '';
    setMediaPreview(null);
    renderAllChips(null);
  }

  document.getElementById('gl-modal').classList.add('is-open');
  document.getElementById('gm-name').focus();
}

function closeModal() {
  document.getElementById('gl-modal').classList.remove('is-open');
  editingId = null;
  _gmMediaFile = null;
  _gmMediaRemove = false;
}

async function saveExercise() {
  const name = document.getElementById('gm-name').value.trim();
  if (!name) { document.getElementById('gm-name').focus(); return; }

  const primaryPurpose = document.getElementById('gm-primary-purpose').value;
  const muscleGroups = readChipCloud('gm-muscle-chips');
  if (!primaryPurpose) { alert('Pick a primary purpose.'); return; }
  if (!muscleGroups.length) { alert('Pick at least one muscle group.'); return; }

  let usableIn = [...document.querySelectorAll('.gm-usable-cb')].filter(cb => cb.checked).map(cb => cb.value);
  if (!usableIn.length) usableIn = ['gym'];

  const eqTags = (readChipCloud('gm-equipment-chips').length ? readChipCloud('gm-equipment-chips') : ['bodyweight']);
  const patterns = readChipCloud('gm-pattern-chips');
  const purposes = [...new Set([primaryPurpose, ...readChipCloud('gm-purpose-chips')])];
  const contraction = readChipCloud('gm-contraction-chips');
  const speeds = readChipCloud('gm-speed-chips');
  const planesSel = readChipCloud('gm-plane-chips');
  const chains = readChipCloud('gm-chain-chips');
  const lbl = (dim, toks) => toks.map(t => CMTaxonomy.label(dim, t));

  const payload = {
    club_id: CLUB_ID,
    name,
    category: document.getElementById('gm-category-type').value,
    complexity: document.getElementById('gm-complexity').value,
    usable_in: usableIn,
    description: document.getElementById('gm-desc').value.trim() || null,
    video_url: document.getElementById('gm-video').value.trim() || null,
    primary_purpose: primaryPurpose,
    purposes,
    muscle_groups: muscleGroups,
    movement_patterns: patterns.length ? patterns : null,
    equipment_tags: eqTags,
    contraction_types: contraction.length ? contraction : null,
    movement_speeds: speeds.length ? speeds : null,
    planes: planesSel.length ? planesSel : null,
    myofascial_chains: chains.length ? chains : null,
    muscle_group: lbl('muscle_group', muscleGroups).join(' / ') || null,
    equipment: lbl('equipment', eqTags.filter(t => t !== 'bodyweight')).join(' / ') || null,
  };

  const saveBtn = document.getElementById('gm-save');
  saveBtn.disabled = true;
  saveBtn.textContent = editingId ? 'Saving…' : 'Creating…';

  let error, insertedId = null;
  if (editingId) {
    ({ error } = await window.sb.from('gym_exercises').update(payload).eq('id', editingId).eq('club_id', CLUB_ID));
  } else {
    const { data: row, error: insErr } = await window.sb.from('gym_exercises').insert(payload).select('id').single();
    error = insErr;
    insertedId = row ? row.id : null;
  }

  if (error) {
    saveBtn.disabled = false;
    saveBtn.textContent = editingId ? 'Save' : 'Create';
    alert('Error saving exercise: ' + error.message);
    return;
  }

  // Media: upload new image/GIF, or clear it. Row stays saved even if upload fails.
  const exId = editingId || insertedId;
  if (_gmMediaFile && exId) {
    try {
      const ext = (_gmMediaFile.name.split('.').pop() || 'png').toLowerCase();
      const path = `${CLUB_ID}/${exId}.${ext}`;
      const up = await window.sb.storage.from('gym-exercise-media').upload(path, _gmMediaFile, { upsert: true, contentType: _gmMediaFile.type });
      if (!up.error) await window.sb.from('gym_exercises').update({ media_type: 'image', media_ref: path }).eq('id', exId).eq('club_id', CLUB_ID);
      else alert('Image upload failed: ' + up.error.message);
    } catch (err) { alert('Image upload failed: ' + (err && err.message || err)); }
  } else if (_gmMediaRemove && exId) {
    await window.sb.from('gym_exercises').update({ media_type: null, media_ref: null }).eq('id', exId).eq('club_id', CLUB_ID);
  }

  saveBtn.disabled = false;
  saveBtn.textContent = editingId ? 'Save' : 'Create';
  closeModal();
  await reloadExercises();
}

function confirmDelete(id) {
  const ex = ALL_EXERCISES.find(e => e.id === id);
  if (!ex) return;
  document.getElementById('gl-del-name').textContent = ex.name;
  const modal = document.getElementById('gl-del-modal');
  modal.dataset.delId = id;
  modal.classList.add('is-open');
}

async function doDelete() {
  const id = document.getElementById('gl-del-modal').dataset.delId;
  const btn = document.getElementById('gm-del-confirm');
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  const { error } = await window.sb.from('gym_exercises').delete().eq('id', id).eq('club_id', CLUB_ID);
  btn.disabled = false;
  btn.textContent = 'Delete';
  if (error) { alert('Error deleting exercise: ' + error.message); return; }
  document.getElementById('gl-del-modal').classList.remove('is-open');
  await reloadExercises();
}

function clearFilters() {
  activeFilters.search = '';
  activeFilters.muscle = '';
  activeFilters.complexity = '';
  activeFilters.category = '';
  activeFilters.equipment = '';
  activeFilters.purpose = '';
  activeFilters.pattern = '';
  activeFilters.usableIn = '';
  document.getElementById('gl-search-input').value = '';
  document.getElementById('gl-sel-muscle').value = '';
  document.getElementById('gl-sel-complexity').value = '';
  document.getElementById('gl-sel-equipment').value = '';
  document.getElementById('gl-sel-purpose').value = '';
  document.getElementById('gl-sel-pattern').value = '';
  document.getElementById('gl-sel-usable').value = '';
  syncChips();
  applyFilters();
}

let ytVideos = [];
function openYtModal() {
  document.getElementById('yt-url').value = '';
  document.getElementById('yt-list').innerHTML = '';
  document.getElementById('yt-status').textContent = '';
  document.getElementById('yt-all').checked = true;
  const ib = document.getElementById('yt-import-btn');
  ib.disabled = true; ib.textContent = 'Import';
  ytVideos = [];
  document.getElementById('yt-modal').classList.add('is-open');
  document.getElementById('yt-url').focus();
}
function closeYtModal() { document.getElementById('yt-modal').classList.remove('is-open'); }
function renderYtList(existing) {
  document.getElementById('yt-list').innerHTML = ytVideos.map((v, i) => {
    const dup = existing.has(v.videoId);
    return `<label class="yt-row${dup?' is-dup':''}">
      <input type="checkbox" class="yt-cb" data-i="${i}" ${dup?'disabled':'checked'}>
      ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" loading="lazy">` : ''}
      <span class="yt-title">${esc(v.title)}${dup?' · already imported':''}</span>
    </label>`;
  }).join('');
}
async function ytFetch() {
  const url = document.getElementById('yt-url').value.trim();
  if (!url) return;
  const status = document.getElementById('yt-status');
  const fb = document.getElementById('yt-fetch-btn');
  fb.disabled = true; status.textContent = 'Fetching playlist…';
  document.getElementById('yt-list').innerHTML = '';
  try {
    const { data, error } = await window.sb.functions.invoke('youtube-import', { body: { playlistUrl: url } });
    if (error) throw error;
    if (data && data.error) throw new Error(data.error);
    ytVideos = (data && data.videos) || [];
    const existing = new Set(ALL_EXERCISES.map(e => e.video_id).filter(Boolean));
    renderYtList(existing);
    const importable = ytVideos.filter(v => !existing.has(v.videoId)).length;
    status.textContent = `${ytVideos.length} videos · ${importable} new`;
    document.getElementById('yt-import-btn').disabled = importable === 0;
  } catch (err) {
    status.textContent = 'Error: ' + (err.message || err);
  } finally {
    fb.disabled = false;
  }
}
async function ytImport() {
  const checked = [...document.querySelectorAll('#yt-list .yt-cb:checked')].map(cb => ytVideos[+cb.dataset.i]);
  if (!checked.length) return;
  const btn = document.getElementById('yt-import-btn');
  btn.disabled = true; btn.textContent = 'Importing…';
  const rows = checked.map(v => ({
    club_id: CLUB_ID,
    name: v.title,
    description: v.description || null,
    video_url: `https://www.youtube.com/watch?v=${v.videoId}`,
    video_id: v.videoId,
    source: 'youtube',
    usable_in: ['gym'],
    is_default: false,
  }));
  const { error } = await window.sb.from('gym_exercises')
    .upsert(rows, { onConflict: 'club_id,video_id', ignoreDuplicates: true });
  if (error) {
    document.getElementById('yt-status').textContent = 'Error: ' + error.message;
    btn.disabled = false; btn.textContent = 'Import';
    return;
  }
  closeYtModal();
  await reloadExercises();
}

function attachListeners() {
  populatePurposeSelect();
  document.getElementById('gm-form').addEventListener('click', e => {
    const chip = e.target.closest('.gm-chip');
    if (chip) chip.classList.toggle('is-on');
  });
  document.getElementById('gl-search-input').addEventListener('input', e => {
    activeFilters.search = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-muscle').addEventListener('change', e => {
    activeFilters.muscle = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-complexity').addEventListener('change', e => {
    activeFilters.complexity = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-equipment').addEventListener('change', e => {
    activeFilters.equipment = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-purpose').addEventListener('change', e => {
    activeFilters.purpose = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-pattern').addEventListener('change', e => {
    activeFilters.pattern = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-usable').addEventListener('change', e => {
    activeFilters.usableIn = e.target.value;
    applyFilters();
  });

  document.querySelectorAll('.gl-segs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.gl-segs button').forEach(o => o.classList.remove('is-on'));
    b.classList.add('is-on');
    activeFilters.view = b.dataset.view;
    applyFilters();
  }));

  document.querySelector('.clear').addEventListener('click', clearFilters);

  document.getElementById('btn-new-exercise').addEventListener('click', () => openModal());

  document.getElementById('btn-import-yt').addEventListener('click', openYtModal);
  document.getElementById('yt-fetch-btn').addEventListener('click', ytFetch);
  document.getElementById('yt-import-btn').addEventListener('click', ytImport);
  document.getElementById('yt-cancel').addEventListener('click', closeYtModal);
  document.getElementById('yt-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeYtModal(); });
  document.getElementById('yt-all').addEventListener('change', e => {
    document.querySelectorAll('#yt-list .yt-cb:not(:disabled)').forEach(cb => cb.checked = e.target.checked);
  });
  document.getElementById('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') ytFetch(); });

  document.getElementById('gm-save').addEventListener('click', saveExercise);
  document.getElementById('gm-cancel').addEventListener('click', closeModal);

  document.getElementById('gm-media').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    _gmMediaFile = file;
    _gmMediaRemove = false;
    setMediaPreview(URL.createObjectURL(file));
  });
  document.getElementById('gm-media-remove').addEventListener('click', () => {
    _gmMediaFile = null;
    _gmMediaRemove = true;
    document.getElementById('gm-media').value = '';
    setMediaPreview(null);
  });
  document.getElementById('gl-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeVideo(); document.getElementById('gl-del-modal').classList.remove('is-open'); } });

  document.getElementById('gl-video-close').addEventListener('click', closeVideo);
  document.getElementById('gl-video-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeVideo(); });

  document.getElementById('gm-del-confirm').addEventListener('click', doDelete);
  document.getElementById('gm-del-cancel').addEventListener('click', () => document.getElementById('gl-del-modal').classList.remove('is-open'));
  document.getElementById('gl-del-modal').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('gl-del-modal').classList.remove('is-open'); });
}

boot();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    });
  }
