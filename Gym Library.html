<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Library — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
<style>
  body.cm{background:var(--cm-bg)}
  .hub-topbar{display:flex;align-items:center;gap:14px;height:56px;padding:0 24px;border-bottom:1px solid var(--cm-border);background:var(--cm-bg);position:sticky;top:0;z-index:50}
  .hub-crumb{display:flex;align-items:center;gap:8px;color:var(--cm-fg-muted);font:var(--cm-body-sm)}
  .hub-crumb .ti{font-size:14px}.hub-crumb .sep{color:var(--cm-fg-faint)}
  .hub-topbar .actions{margin-left:auto;display:flex;gap:8px}

  .gl-page{padding:20px 26px 56px;max-width:1600px}
  .gl-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .gl-head h1{font:600 24px/1.1 var(--cm-font-sans);letter-spacing:-0.02em;color:var(--cm-fg-strong)}
  .gl-head .ctx{font:var(--cm-body);color:var(--cm-fg-muted);margin-top:4px}
  .gl-head .ctx strong{color:var(--cm-fg);font-weight:600}
  .gl-head .meta{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* Toolbar */
  .gl-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:10px 12px;box-shadow:var(--cm-shadow-1);margin-bottom:14px}
  .gl-search{flex:1;min-width:240px;max-width:360px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3)}
  .gl-search input{flex:1;border:0;background:transparent;outline:none;font:var(--cm-body-sm);color:var(--cm-fg)}
  .gl-search .ti{font-size:16px;color:var(--cm-fg-muted)}
  .gl-sel{height:32px;padding:0 12px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);color:var(--cm-fg);font:500 12.5px/1 var(--cm-font-sans);cursor:pointer;outline:none}
  .gl-sel:hover{border-color:var(--cm-border-strong)}
  .gl-sel:disabled{opacity:.45;cursor:not-allowed}
  .gl-toolbar .grow{flex:1}
  .gl-segs{display:inline-flex;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);padding:3px;gap:2px}
  .gl-segs button{border:0;background:transparent;padding:0 11px;height:26px;border-radius:5px;color:var(--cm-fg-muted);cursor:pointer;font:500 12px/1 var(--cm-font-sans);display:inline-flex;align-items:center;gap:5px}
  .gl-segs button.is-on{background:var(--cm-surface);color:var(--cm-fg-strong);box-shadow:var(--cm-shadow-1);font-weight:600}
  .gl-segs .ti{font-size:13px}

  /* Muscle chips strip */
  .gl-muscles{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 14px}
  .gl-m-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--cm-surface);border:1px solid var(--cm-border);color:var(--cm-fg-muted);font:500 12px/1 var(--cm-font-sans);cursor:pointer}
  .gl-m-chip:hover{color:var(--cm-fg);border-color:var(--cm-border-strong)}
  .gl-m-chip.is-on{background:var(--cm-accent-soft);color:var(--cm-fg-strong);border-color:var(--cm-border-strong)}
  .gl-m-chip .ct{font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-faint)}
  .gl-m-chip.is-on .ct{color:var(--cm-accent);font-weight:600}

  /* Count badge */
  .gl-count{font:500 12.5px/1 var(--cm-font-mono);color:var(--cm-fg-muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .gl-count strong{color:var(--cm-fg-strong);font-weight:600}
  .gl-count .clear{margin-left:auto;font:500 12px/1 var(--cm-font-sans);color:var(--cm-accent);cursor:pointer}

  /* Exercise grid */
  .gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .gl-card{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);overflow:hidden;display:flex;flex-direction:column;transition:border-color 120ms,box-shadow 120ms,transform 120ms}
  .gl-card:hover{border-color:var(--cm-border-strong);box-shadow:var(--cm-shadow-2);transform:translateY(-1px)}
  .gl-thumb{position:relative;width:100%;aspect-ratio:16/10;background:var(--cm-bg-soft);overflow:hidden}
  .gl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gl-thumb-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--cm-bg-soft) 0%,var(--cm-bg-sunk) 100%);display:flex;align-items:center;justify-content:center}
  .gl-thumb-ph span{font:700 36px/1 var(--cm-font-sans);letter-spacing:-0.02em;color:var(--cm-fg-faint)}
  .gl-thumb-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);opacity:0;transition:opacity 120ms;cursor:pointer;border:0}
  .gl-card:hover .gl-thumb-play{opacity:1}
  .gl-thumb-play .ti{font-size:18px;margin-left:2px}
  .gl-cplx-badge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;font:700 10px/1 var(--cm-font-mono);letter-spacing:0.06em;text-transform:uppercase;backdrop-filter:blur(6px)}
  .gl-cplx-badge.low{background:rgba(34,197,94,0.85);color:#fff}
  .gl-cplx-badge.med{background:rgba(245,158,11,0.85);color:#fff}
  .gl-cplx-badge.high{background:rgba(220,38,38,0.85);color:#fff}
  .gl-video-tag{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:4px;background:rgba(0,0,0,0.55);color:#fff;font:600 10px/1 var(--cm-font-mono);letter-spacing:0.04em;backdrop-filter:blur(6px)}
  .gl-video-tag .ti{font-size:12px}

  .gl-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .gl-name{font:600 14px/1.25 var(--cm-font-sans);color:var(--cm-fg-strong)}
  .gl-muscles-row{display:flex;flex-wrap:wrap;gap:4px}
  .gl-muscle{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:4px;background:var(--cm-success-bg);color:var(--cm-success);font:600 10.5px/1 var(--cm-font-mono);letter-spacing:0.04em}
  .gl-muscle.sec{background:var(--cm-bg-soft);color:var(--cm-fg-muted);border:1px solid var(--cm-border-soft)}
  .gl-desc{font:var(--cm-body-sm);color:var(--cm-fg-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gl-foot{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--cm-border-soft);margin-top:auto}
  .gl-foot .gl-tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--cm-bg-soft);border:1px solid var(--cm-border-soft);font:600 10px/1 var(--cm-font-mono);color:var(--cm-fg-muted);letter-spacing:0.04em}
  .gl-foot .grow{flex:1}
  .gl-foot button{width:26px;height:26px;border-radius:5px;border:0;background:transparent;color:var(--cm-fg-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .gl-foot button:hover{background:var(--cm-bg-soft);color:var(--cm-fg)}
  .gl-foot button .ti{font-size:13px}

  /* Add card */
  .gl-add{border:1.5px dashed var(--cm-border-strong);border-radius:var(--cm-r-4);background:transparent;color:var(--cm-fg-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  .gl-add:hover{border-color:var(--cm-accent);color:var(--cm-fg);background:var(--cm-accent-soft)}
  .gl-add .ic{width:40px;height:40px;border-radius:10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);display:flex;align-items:center;justify-content:center}
  .gl-add .ic .ti{font-size:18px}
  .gl-add .l{font:500 13px/1.4 var(--cm-font-sans)}
  .gl-add small{font:500 10.5px/1.4 var(--cm-font-mono);color:var(--cm-fg-faint)}

  /* List view */
  .gl-grid.is-list{grid-template-columns:1fr;gap:6px}
  .gl-grid.is-list .gl-card{flex-direction:row;min-height:76px}
  .gl-grid.is-list .gl-thumb{width:110px;flex-shrink:0;aspect-ratio:unset;height:auto}
  .gl-grid.is-list .gl-body{padding:8px 12px;gap:5px}
  .gl-grid.is-list .gl-desc{-webkit-line-clamp:1}
  .gl-grid.is-list .gl-add{flex-direction:row;gap:10px;padding:12px 16px;justify-content:flex-start}
  .gl-grid.is-list .gl-add small{display:none}

  /* Group separator (By muscle) */
  .gl-group-sep{grid-column:1/-1;padding:14px 0 6px;font:600 11px/1 var(--cm-font-sans);color:var(--cm-fg-muted);text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid var(--cm-border-soft);margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .gl-group-sep .ct{font:500 11px/1 var(--cm-font-mono);color:var(--cm-fg-faint)}

  /* Empty state */
  .gl-empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--cm-fg-muted);font:var(--cm-body)}

  /* Overlay / Modal */
  .gl-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
  .gl-overlay.is-open{display:flex}
  .gl-modal-box{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:24px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--cm-shadow-3)}
  .gl-modal-box h2{font:600 16px/1.2 var(--cm-font-sans);color:var(--cm-fg-strong);margin:0}
  .gm-field{display:flex;flex-direction:column;gap:4px}
  .gm-field label{font:500 12px/1 var(--cm-font-sans);color:var(--cm-fg-muted)}
  .gm-field input,.gm-field select,.gm-field textarea{height:34px;padding:0 10px;background:var(--cm-bg-soft);border:1px solid var(--cm-border);border-radius:var(--cm-r-3);color:var(--cm-fg);font:var(--cm-body-sm);outline:none;width:100%;box-sizing:border-box}
  .gm-field textarea{height:72px;padding:8px 10px;resize:vertical}
  .gm-field input:focus,.gm-field select:focus,.gm-field textarea:focus{border-color:var(--cm-border-strong)}
  .gm-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
  .gm-del-box{background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-r-4);padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--cm-shadow-3)}
  .gm-del-box p{font:var(--cm-body);color:var(--cm-fg-muted);margin:0}

  #tweaks-root{position:fixed;bottom:16px;right:16px;z-index:1000}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<script src="assets/global-search.js" defer></script>

<div class="hub-shell" data-screen-label="23 Gym Library">
  <div id="hub-side-root"></div>

  <main class="hub-main">
    <div class="hub-topbar">
      <div class="hub-crumb"><i class="ti ti-home"></i><span>Performance</span><span class="sep">/</span><span style="color:var(--cm-fg-strong);font-weight:600">Gym library</span></div>

      <div class="actions">
        <button class="cm-icon-btn" disabled title="Próximamente"><i class="ti ti-bell"></i></button>
        <button class="cm-icon-btn" data-open-settings><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <section class="gl-page">

      <header class="gl-head">
        <div>
          <h1>Gym library</h1>
          <div class="ctx"><strong><span id="gl-stat-total">0</span> exercises</strong> · indexed by muscle group &amp; complexity · <span id="gl-stat-video">0</span> with video</div>

          <button class="cm-btn is-outline is-sm" disabled title="Próximamente"><i class="ti ti-file-import" style="font-size:14px"></i>Import CSV</button>

      <div class="gl-count">

      <div class="gl-grid" id="gl-grid"></div>

    </section>
  </main>
</div>

<!-- Exercise modal (create / edit) -->

  <div class="gl-modal-box">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__CM_TWEAK_DEFAULTS = { theme: "hybrid", accent: "green" };</script>
<script type="text/babel" src="settings-drawer.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="theme-tweaks.jsx"></script>
<script>
const CPLX_CSS = { Low:'low', Medium:'med', High:'high' };
let ALL_EXERCISES = [];
let CLUB_ID = null;
let activeFilters = { search:'', muscle:'', complexity:'', view:'grid' };
let editingId = null;

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function boot() {
  const ok = await window.guardModule();
  if (!ok) return;
  const [, club] = await Promise.all([window.getProfile(), window.getClub()]);
  CLUB_ID = await window.getClubId();
  if (club) window.applyClubTheme();
  await reloadExercises(false);
  attachListeners();
}

async function reloadExercises(rebuild = true) {
  const { data } = await window.sb.from('gym_exercises')
    .select('id,name,description,muscle_group,category,video_url')
    .eq('club_id', CLUB_ID)
    .order('name');
  ALL_EXERCISES = data || [];
  if (rebuild) {
    renderStats();
    renderMuscleChips();
    renderMuscleSelect();
    applyFilters();
  } else {
    buildUI();
  }
}

function buildUI() {
  renderStats();
  renderMuscleChips();
  renderMuscleSelect();
  applyFilters();
}

function renderStats() {
  const total = ALL_EXERCISES.length;
  const withVideo = ALL_EXERCISES.filter(e => e.video_url).length;
  document.getElementById('gl-stat-total').textContent = total;
  document.getElementById('gl-stat-video').textContent = withVideo;
}

function muscleCounts() {
  const counts = {};
  for (const e of ALL_EXERCISES) {
    const m = e.muscle_group || 'Other';
    counts[m] = (counts[m]||0) + 1;
  }
  return counts;
}

function renderMuscleChips() {
  const counts = muscleCounts();
  const total = ALL_EXERCISES.length;
  const strip = document.getElementById('gl-muscles-strip');
  const isAll = activeFilters.muscle === '';
  let html = `<button class="gl-m-chip${isAll?' is-on':''}" data-muscle="">All <span class="ct">${total}</span></button>`;
  html += Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([m,c]) => {
    const on = activeFilters.muscle === m ? ' is-on' : '';
    return `<button class="gl-m-chip${on}" data-muscle="${esc(m)}">${esc(m)} <span class="ct">${c}</span></button>`;
  }).join('');
  strip.innerHTML = html;
  strip.querySelectorAll('.gl-m-chip').forEach(c => c.addEventListener('click', () => {
    activeFilters.muscle = c.dataset.muscle;
    syncChips();
    syncMuscleSelect();
    applyFilters();
  }));
}

function renderMuscleSelect() {
  const counts = muscleCounts();
  const groupCount = Object.keys(counts).length;
  const sel = document.getElementById('gl-sel-muscle');
  const cur = activeFilters.muscle;
  sel.innerHTML = `<option value="">All muscles · ${groupCount}</option>` +
    Object.keys(counts).sort().map(m =>
      `<option value="${esc(m)}"${cur===m?' selected':''}>${esc(m)}</option>`
    ).join('');
}

function syncChips() {
  document.getElementById('gl-muscles-strip').querySelectorAll('.gl-m-chip').forEach(c => {
    c.classList.toggle('is-on', c.dataset.muscle === activeFilters.muscle);
  });
}

function syncMuscleSelect() {
  document.getElementById('gl-sel-muscle').value = activeFilters.muscle;
}

function applyFilters() {
  const search = activeFilters.search.toLowerCase();
  const muscle = activeFilters.muscle;
  const complexity = activeFilters.complexity;

  const visible = ALL_EXERCISES.filter(e => {
    if (muscle && e.muscle_group !== muscle) return false;
    if (complexity && e.category !== complexity) return false;
    if (search) {
      const hay = `${e.name||''} ${e.description||''} ${e.muscle_group||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  renderGrid(visible);
  updateCount(visible.length, ALL_EXERCISES.length);
}

function renderGrid(exercises) {
  const grid = document.getElementById('gl-grid');
  const view = activeFilters.view;

  if (view === 'muscle') {
    grid.className = 'gl-grid';
    renderByMuscle(exercises, grid);
    return;
  }

  grid.className = view === 'list' ? 'gl-grid is-list' : 'gl-grid';

  if (!exercises.length) {
    grid.innerHTML = '<div class="gl-empty">No exercises match your filters.</div>';
    appendAddCard(grid);
    return;
  }

  grid.innerHTML = exercises.map(cardHTML).join('');
  appendAddCard(grid);
  attachCardListeners();
  highlightFromURL();
}

function renderByMuscle(exercises, grid) {
  const groups = {};
  for (const e of exercises) {
    const g = e.muscle_group || 'Other';
    if (!groups[g]) groups[g] = [];
    groups[g].push(e);
  }

  if (!exercises.length) {
    grid.innerHTML = '<div class="gl-empty">No exercises match your filters.</div>';
    appendAddCard(grid);
    return;
  }

  let html = '';
  for (const [group, list] of Object.entries(groups).sort()) {
    html += `<div class="gl-group-sep">${esc(group)} <span class="ct">${list.length}</span></div>`;
    html += list.map(cardHTML).join('');
  }
  grid.innerHTML = html;
  appendAddCard(grid);
  attachCardListeners();
  highlightFromURL();
}

function appendAddCard(grid) {
  const btn = document.createElement('button');
  btn.className = 'gl-add';
  btn.innerHTML = '<div class="ic"><i class="ti ti-plus"></i></div><div class="l">Add a new exercise</div><small>Name · target muscles · complexity · video URL</small>';
  btn.addEventListener('click', () => openModal());
  grid.appendChild(btn);
}

function cardHTML(e) {
  const initials = (e.name||'').split(' ').map(w => w[0]||'').join('').slice(0,2).toUpperCase();
  const cplxCss = CPLX_CSS[e.category] || 'med';
  const hasVideo = !!e.video_url;
  const muscle = e.muscle_group || '';
  const videoEsc = hasVideo ? esc(e.video_url) : '';

  return `<div class="gl-card" data-id="${esc(e.id)}">
    <div class="gl-thumb">
      <div class="gl-thumb-ph"><span>${initials}</span></div>
      <span class="gl-cplx-badge ${cplxCss}">${esc(e.category||'—')}</span>
      ${hasVideo ? `<span class="gl-video-tag"><i class="ti ti-brand-youtube"></i>Video</span><button class="gl-thumb-play btn-play" data-video="${videoEsc}"><i class="ti ti-player-play"></i></button>` : ''}
    </div>
    <div class="gl-body">
      <div class="gl-name">${esc(e.name||'Unnamed')}</div>
      <div class="gl-muscles-row">${muscle ? `<span class="gl-muscle">${esc(muscle)}</span>` : ''}</div>
      <div class="gl-desc">${esc(e.description||'')}</div>
      <div class="gl-foot"><span class="grow"></span>
        <button class="btn-add-plan" title="Add to plan"><i class="ti ti-plus"></i></button>
        <button class="btn-edit" data-id="${esc(e.id)}" title="Edit exercise"><i class="ti ti-edit"></i></button>
        <button class="btn-del" data-id="${esc(e.id)}" title="Delete exercise"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>`;
}

function attachCardListeners() {
  document.querySelectorAll('#gl-grid .btn-edit').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    openModal(b.dataset.id);
  }));
  document.querySelectorAll('#gl-grid .btn-del').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    confirmDelete(b.dataset.id);
  }));
  document.querySelectorAll('#gl-grid .btn-play').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    if (b.dataset.video) window.open(b.dataset.video, '_blank');
  }));
}

function highlightFromURL() {
  const hlId = new URLSearchParams(location.search).get('highlight');
  if (!hlId) return;
  requestAnimationFrame(() => {
    const card = document.querySelector(`#gl-grid .gl-card[data-id="${hlId}"]`);
    if (card) { card.scrollIntoView({ behavior:'smooth', block:'center' }); card.classList.add('gs-highlight'); }
  });
}

function updateCount(visible, total) {
  document.getElementById('gl-visible').textContent = visible;
  document.getElementById('gl-total').textContent = total;
}

// ── Modal helpers ──────────────────────────────────────────────────

function openModal(id) {
  editingId = id || null;
  const titleEl = document.getElementById('gl-modal-title');
  const saveBtn = document.getElementById('gm-save');

  if (id) {
    const ex = ALL_EXERCISES.find(e => e.id === id);
    if (!ex) return;
    titleEl.textContent = 'Edit exercise';
    saveBtn.textContent = 'Save';
    document.getElementById('gm-name').value = ex.name || '';
    document.getElementById('gm-muscle').value = ex.muscle_group || '';
    document.getElementById('gm-category').value = ex.category || 'Low';
    document.getElementById('gm-desc').value = ex.description || '';
    document.getElementById('gm-video').value = ex.video_url || '';
  } else {
    titleEl.textContent = 'New exercise';
    saveBtn.textContent = 'Create';
    document.getElementById('gm-form').reset();
  }

  document.getElementById('gl-modal').classList.add('is-open');
  document.getElementById('gm-name').focus();
}

function closeModal() {
  document.getElementById('gl-modal').classList.remove('is-open');
  editingId = null;
}

async function saveExercise() {
  const name = document.getElementById('gm-name').value.trim();
  if (!name) { document.getElementById('gm-name').focus(); return; }

  const payload = {
    club_id: CLUB_ID,
    name,
    muscle_group: document.getElementById('gm-muscle').value.trim() || null,
    category: document.getElementById('gm-category').value,
    description: document.getElementById('gm-desc').value.trim() || null,
    video_url: document.getElementById('gm-video').value.trim() || null,
  };

  const saveBtn = document.getElementById('gm-save');
  saveBtn.disabled = true;
  saveBtn.textContent = editingId ? 'Saving…' : 'Creating…';

  let error;
  if (editingId) {
    ({ error } = await window.sb.from('gym_exercises').update(payload).eq('id', editingId).eq('club_id', CLUB_ID));
  } else {
    ({ error } = await window.sb.from('gym_exercises').insert(payload));
  }

  saveBtn.disabled = false;
  saveBtn.textContent = editingId ? 'Save' : 'Create';

  if (error) { alert('Error saving exercise: ' + error.message); return; }
  closeModal();
  await reloadExercises();
}

function confirmDelete(id) {
  const ex = ALL_EXERCISES.find(e => e.id === id);
  if (!ex) return;
  document.getElementById('gl-del-name').textContent = ex.name;
  const modal = document.getElementById('gl-del-modal');
  modal.dataset.delId = id;
  modal.classList.add('is-open');
}

async function doDelete() {
  const id = document.getElementById('gl-del-modal').dataset.delId;
  const btn = document.getElementById('gm-del-confirm');
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  const { error } = await window.sb.from('gym_exercises').delete().eq('id', id).eq('club_id', CLUB_ID);
  btn.disabled = false;
  btn.textContent = 'Delete';
  if (error) { alert('Error deleting exercise: ' + error.message); return; }
  document.getElementById('gl-del-modal').classList.remove('is-open');
  await reloadExercises();
}

function clearFilters() {
  activeFilters.search = '';
  activeFilters.muscle = '';
  activeFilters.complexity = '';
  document.getElementById('gl-search-input').value = '';
  document.getElementById('gl-sel-muscle').value = '';
  document.getElementById('gl-sel-complexity').value = '';
  syncChips();
  applyFilters();
}

function attachListeners() {
  document.getElementById('gl-search-input').addEventListener('input', e => {
    activeFilters.search = e.target.value;
    applyFilters();
  });

  document.getElementById('gl-sel-muscle').addEventListener('change', e => {
    activeFilters.muscle = e.target.value;
    syncChips();
    applyFilters();
  });

  document.getElementById('gl-sel-complexity').addEventListener('change', e => {
    activeFilters.complexity = e.target.value;
    applyFilters();
  });

  document.querySelectorAll('.gl-segs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.gl-segs button').forEach(o => o.classList.remove('is-on'));
    b.classList.add('is-on');
    activeFilters.view = b.dataset.view;
    applyFilters();
  }));

  document.querySelector('.clear').addEventListener('click', clearFilters);

  document.getElementById('btn-new-exercise').addEventListener('click', () => openModal());

  document.getElementById('gm-save').addEventListener('click', saveExercise);
  document.getElementById('gm-cancel').addEventListener('click', closeModal);
  document.getElementById('gl-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); document.getElementById('gl-del-modal').classList.remove('is-open'); } });

  document.getElementById('gm-del-confirm').addEventListener('click', doDelete);
  document.getElementById('gm-del-cancel').addEventListener('click', () => document.getElementById('gl-del-modal').classList.remove('is-open'));
  document.getElementById('gl-del-modal').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('gl-del-modal').classList.remove('is-open'); });
}

boot();
</script>
