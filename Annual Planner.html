<!DOCTYPE html>
<html lang="en" data-theme="hybrid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annual planner — ClavaMetrics</title>
<link rel="stylesheet" href="clavametrics.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D">
  <link rel="apple-touch-icon" href="/assets/clava-app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClavaMetrics">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" defer></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/sidebar.js"></script>
<script src="assets/global-search.js" defer></script>
<style>
  body.cm { background: var(--cm-bg); }

  .hub-topbar { display:flex; align-items:center; gap:14px; height:56px; padding:0 24px; border-bottom:1px solid var(--cm-border); background:color-mix(in srgb, var(--cm-bg) 92%, transparent); backdrop-filter:saturate(160%) blur(10px); position:sticky; top:0; z-index:50; }
  .hub-crumb { display:flex; align-items:center; gap:8px; color:var(--cm-fg-muted); font:var(--cm-body-sm); }
  .hub-crumb .ti { font-size:14px; }
  .hub-crumb .sep { color:var(--cm-fg-faint); }
  .hub-search { margin-left:auto; width:280px; display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:var(--cm-r-3); color:var(--cm-fg-muted); }
  .hub-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; font:var(--cm-body-sm); color:var(--cm-fg); }
  .hub-search .ti { font-size:16px; }
  .hub-topbar .actions { display:flex; align-items:center; gap:8px; }

  .ap-page { padding:24px 28px 64px; max-width:1100px; width:100%; }
  .ap-head { display:flex; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .ap-head h1 { font:600 26px/1.1 var(--cm-font-sans); letter-spacing:-0.02em; color:var(--cm-fg-strong); }
  .ap-head .sub { font:var(--cm-body-sm); color:var(--cm-fg-muted); }

  .ap-card { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:14px; padding:20px 22px; }
  .ap-card-h { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .ap-card-h .ic { width:32px; height:32px; border-radius:8px; background:var(--cm-bg-soft); display:flex; align-items:center; justify-content:center; }
  .ap-card-h .t { font:600 15px/1.2 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .ap-card-h .d { font:var(--cm-body-sm); color:var(--cm-fg-muted); }

  .ap-grid3 { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:12px; }
  .ap-field label { display:block; font:600 10px/1 var(--cm-font-sans); letter-spacing:.05em; text-transform:uppercase; color:var(--cm-fg-muted); margin-bottom:5px; }
  .ap-field input, .ap-field select { width:100%; box-sizing:border-box; height:36px; padding:0 10px; background:var(--cm-bg-soft); color:var(--cm-fg-strong); border:1px solid var(--cm-border); border-radius:8px; font:500 13px/1 var(--cm-font-sans); }

  .ap-btn { height:34px; padding:0 16px; border-radius:8px; font:600 13px/1 var(--cm-font-sans); cursor:pointer; border:1px solid var(--cm-border); background:var(--cm-bg-soft); color:var(--cm-fg-strong); }
  .ap-btn.primary { background:var(--cm-accent, #2f6fed); color:#fff; border:none; }
  .ap-empty { text-align:center; padding:30px 16px; color:var(--cm-fg-muted); }
  .ap-empty .ti { font-size:26px; color:var(--cm-fg-faint); margin-bottom:8px; }
  .ap-row { display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--cm-bg-soft); border-radius:9px; cursor:pointer; border:1px solid transparent; }
  .ap-row + .ap-row { margin-top:7px; }
  .ap-row:hover { border-color:var(--cm-border); }
  .ap-row.is-sel { border-color:var(--cm-accent, #2f6fed); background:color-mix(in srgb, var(--cm-accent, #2f6fed) 7%, var(--cm-bg-soft)); }
  .ap-pill { font:600 10px/1 var(--cm-font-sans); letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; }
  .ap-pill.active { background:rgba(34,197,94,0.12); color:var(--cm-success,#16a34a); }
  .ap-pill.archived { background:var(--cm-bg); color:var(--cm-fg-muted); }

  /* Phases */
  .ap-timeline { position:relative; height:40px; background:var(--cm-bg-soft); border:1px solid var(--cm-border); border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .ap-tl-seg { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font:600 10px/1 var(--cm-font-sans); color:#fff; overflow:hidden; white-space:nowrap; box-shadow:inset -1px 0 0 rgba(255,255,255,.25); }
  .ap-tl-seg.no-count { background-image:repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,.20) 5px, rgba(255,255,255,.20) 10px); }
  .ap-tl-today { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--cm-fg-strong); z-index:3; }
  .ap-tl-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:var(--cm-body-sm); color:var(--cm-fg-faint); }

  .ap-phase-row { display:flex; align-items:center; gap:11px; padding:9px 12px; background:var(--cm-bg-soft); border-radius:8px; }
  .ap-phase-row + .ap-phase-row { margin-top:6px; }
  .ap-dot { width:11px; height:11px; border-radius:3px; flex:0 0 auto; }
  .ap-dot-input { width:24px; height:24px; padding:0; border:1px solid var(--cm-border); border-radius:6px; background:none; cursor:pointer; flex:0 0 auto; }
  .ap-switch { display:inline-flex; align-items:center; gap:6px; font:500 11px/1 var(--cm-font-sans); color:var(--cm-fg-muted); cursor:pointer; user-select:none; }
  .ap-iconbtn { width:28px; height:28px; border-radius:7px; border:1px solid var(--cm-border); background:var(--cm-surface); color:var(--cm-fg-muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .ap-iconbtn:hover { color:var(--cm-danger,#dc2626); border-color:var(--cm-danger,#dc2626); }
  .ap-iconbtn.is-edit:hover { color:var(--cm-accent,#2f6fed); border-color:var(--cm-accent,#2f6fed); }
  .ap-grid5 { display:grid; grid-template-columns:1.1fr 1.1fr .95fr .95fr 54px auto; gap:10px; align-items:end; }
  .ap-grid-comp { display:grid; grid-template-columns:1.6fr 1fr 54px auto; gap:10px; align-items:end; }
  .ap-badge { font:600 10px/1 var(--cm-font-sans); letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; }

  /* Import */
  .ap-dropzone { display:block; border:1.5px dashed var(--cm-border); border-radius:10px; padding:18px; text-align:center; color:var(--cm-fg-muted); cursor:pointer; transition:border-color .15s, background .15s; }
  .ap-dropzone:hover, .ap-dropzone.drag { border-color:var(--cm-accent,#2f6fed); background:color-mix(in srgb, var(--cm-accent,#2f6fed) 5%, transparent); }
  .ap-ta { width:100%; box-sizing:border-box; min-height:92px; padding:8px 10px; border:1px solid var(--cm-border); border-radius:8px; background:var(--cm-surface); color:var(--cm-fg-strong); font:500 12.5px/1.5 var(--cm-font-mono); resize:vertical; outline:none; }
  .ap-imp-wrap { border:1px solid var(--cm-border); border-radius:9px; overflow:hidden; }
  .ap-imp-table { width:100%; border-collapse:collapse; font:500 12.5px/1.3 var(--cm-font-sans); }
  .ap-imp-table th { text-align:left; padding:7px 9px; font:600 10px/1 var(--cm-font-sans); letter-spacing:.04em; text-transform:uppercase; color:var(--cm-fg-muted); background:var(--cm-bg-soft); }
  .ap-imp-table td { padding:7px 9px; border-top:1px solid var(--cm-border); color:var(--cm-fg-strong); }
  .ap-imp-table tr.bad td { background:color-mix(in srgb, var(--cm-danger,#dc2626) 9%, transparent); }

  /* Timeline */
  .ap-tl-axis { position:relative; height:15px; margin-bottom:4px; }
  .ap-tl-lane-lbl { font:600 9.5px/1 var(--cm-font-sans); letter-spacing:.04em; text-transform:uppercase; color:var(--cm-fg-faint); margin:9px 0 3px; }
  .ap-tl-track { position:relative; }
  .ap-tl-band { position:absolute; top:0; bottom:0; border-radius:4px; display:flex; align-items:center; justify-content:center; font:600 9.5px/1 var(--cm-font-sans); color:#fff; overflow:hidden; white-space:nowrap; }
  .ap-tl-band.nocount { background-image:repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,.22) 4px, rgba(255,255,255,.22) 8px); }
  .ap-tl-dot { position:absolute; top:50%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:50%; }
  .ap-tl-today { position:absolute; top:0; bottom:0; width:2px; background:var(--cm-fg-strong); z-index:5; }
  .ap-tl-hint { position:absolute; left:2px; top:50%; transform:translateY(-50%); font:var(--cm-body-sm); color:var(--cm-fg-faint); }

  /* Date picker */
  .ap-datebtn { width:100%; box-sizing:border-box; height:36px; padding:0 10px; background:var(--cm-bg-soft); color:var(--cm-fg-strong); border:1px solid var(--cm-border); border-radius:8px; font:500 13px/1 var(--cm-font-sans); text-align:left; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .ap-datebtn:hover { border-color:var(--cm-border-strong, var(--cm-border)); }
  .ap-datebtn .ti { font-size:15px; color:var(--cm-fg-muted); flex:0 0 auto; }
  .ap-datebtn .lbl.ph { color:var(--cm-fg-faint); }
  .ap-cal { position:absolute; z-index:200; background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:12px; box-shadow:var(--cm-shadow-pop, 0 12px 40px rgba(0,0,0,.18)); padding:12px; width:248px; }
  .ap-cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .ap-cal-head button { width:28px; height:28px; border:none; background:transparent; border-radius:7px; cursor:pointer; color:var(--cm-fg-muted); display:flex; align-items:center; justify-content:center; }
  .ap-cal-head button:hover { background:var(--cm-bg-soft); color:var(--cm-fg); }
  .ap-cal-title { font:600 13px/1 var(--cm-font-sans); color:var(--cm-fg-strong); }
  .ap-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .ap-cal-dow { text-align:center; font:600 10px/1 var(--cm-font-mono); color:var(--cm-fg-faint); padding:4px 0; }
  .ap-cal-day { aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font:500 12px/1 var(--cm-font-sans); color:var(--cm-fg); border-radius:7px; cursor:pointer; border:1px solid transparent; }
  .ap-cal-day:hover { background:var(--cm-bg-soft); }
  .ap-cal-day.is-sel { background:var(--cm-accent,#2f6fed); color:#fff; }
  .ap-cal-day.is-today { border-color:var(--cm-accent,#2f6fed); }
  .is-hidden { display:none !important; }
  #tweaks-root { position: fixed; bottom: 16px; right: 16px; z-index: 1000; }
</style>
</head>
<body class="cm">

  <div class="hub-shell" data-screen-label="Annual planner">
    <div id="hub-side-root"></div>
    <main class="hub-main">
    <div class="hub-topbar">
      <div style="display:flex;align-items:center;gap:7px">
        <i class="ti ti-users-group" style="font-size:16px;color:var(--cm-fg-muted)"></i>
        <select id="apTeamSelect" onchange="apOnTeamChange()" style="height:34px;padding:0 10px;background:var(--cm-surface);color:var(--cm-fg-strong);border:1px solid var(--cm-border);border-radius:8px;font:600 13px/1 var(--cm-font-sans);cursor:pointer"><option value="">Loading…</option></select>
      </div>
      <div class="hub-crumb">
        <i class="ti ti-home"></i><span id="apClubName">Club</span><span class="sep">/</span>
        <span style="color:var(--cm-fg-strong);font-weight:600">Annual planner</span>
      </div>
      <div class="hub-search">
        <i class="ti ti-search"></i>
        <input placeholder="Search players, sessions…">
      </div>
      <div class="actions">
        <button class="cm-icon-btn"><i class="ti ti-bell"></i></button>
        <button class="cm-icon-btn"><i class="ti ti-help"></i></button>
        <button class="cm-icon-btn" data-open-settings><i class="ti ti-settings"></i></button>
      </div>
    </div>

    <section class="ap-page">
      <header class="ap-head">
        <h1>Annual planner</h1>
        <span class="sub" id="apSeasonSub">Season setup</span>
      </header>

      <!-- ── Season setup ──────────────────────────────────────── -->
      <div class="ap-card">
        <div class="ap-card-h">
          <div class="ic"><i class="ti ti-calendar-cog" style="font-size:18px;color:var(--cm-fg-muted)"></i></div>
          <div>
            <div class="t">Season setup</div>
            <div class="d">Each category has its own season</div>
          </div>
          <button class="ap-btn" id="apNewSeasonBtn" onclick="apShowForm()" style="margin-left:auto">New season</button>
        </div>

        <!-- Existing seasons list -->
        <div id="apSeasonsList"></div>

        <!-- Create / edit form -->
        <div id="apSeasonForm" class="is-hidden" style="margin-top:14px">
          <div class="ap-grid3" style="margin-bottom:14px">
            <div class="ap-field"><label>Season name</label><input type="text" id="apName" placeholder="2025/26"></div>
            <div class="ap-field"><label>Start</label><input type="date" id="apStart" style="display:none"><button type="button" class="ap-datebtn" id="apStart_btn" onclick="apOpenCal('apStart', this)"><i class="ti ti-calendar"></i><span class="lbl ph">Select date</span></button></div>
            <div class="ap-field"><label>End</label><input type="date" id="apEnd" style="display:none"><button type="button" class="ap-datebtn" id="apEnd_btn" onclick="apOpenCal('apEnd', this)"><i class="ti ti-calendar"></i><span class="lbl ph">Select date</span></button></div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px">
            <button class="ap-btn" onclick="apHideForm()">Cancel</button>
            <button class="ap-btn primary" onclick="apSaveSeason()">Save season</button>
          </div>
        </div>

        <!-- Phases placeholder removed — phases live in their own card below -->
      </div>

      <!-- ── Phases ────────────────────────────────────────────── -->
      <div class="ap-card is-hidden" id="apPhasesCard" style="margin-top:16px">
        <div class="ap-card-h">
          <div class="ic"><i class="ti ti-layout-rows" style="font-size:18px;color:var(--cm-fg-muted)"></i></div>
          <div>
            <div class="t">Phases</div>
            <div class="d" id="apPhasesSub">—</div>
          </div>
        </div>

        <div class="ap-timeline" id="apTimeline"></div>
        <div id="apPhasesList"></div>

        <div style="margin-top:16px;padding-top:15px;border-top:1px solid var(--cm-border)">
          <div class="ap-grid5">
            <div class="ap-field"><label>Phase type</label><select id="apPhaseType" onchange="apOnPhaseTypeChange()"></select></div>
            <div class="ap-field"><label>Name</label><input id="apPhaseName" placeholder="Preseason"></div>
            <div class="ap-field"><label>Start</label><input type="date" id="apPhaseStart" style="display:none"><button type="button" class="ap-datebtn" id="apPhaseStart_btn" onclick="apOpenCal('apPhaseStart', this)"><i class="ti ti-calendar"></i><span class="lbl ph">Select date</span></button></div>
            <div class="ap-field"><label>End</label><input type="date" id="apPhaseEnd" style="display:none"><button type="button" class="ap-datebtn" id="apPhaseEnd_btn" onclick="apOpenCal('apPhaseEnd', this)"><i class="ti ti-calendar"></i><span class="lbl ph">Select date</span></button></div>
            <div class="ap-field"><label>Color</label><input type="color" id="apPhaseColor" value="#0F6E56" style="height:36px;padding:2px;cursor:pointer"></div>
            <button class="ap-btn primary" onclick="apAddPhase()">Add phase</button>
          </div>
          <label class="ap-switch" style="margin-top:11px"><input type="checkbox" id="apPhaseCounts" checked> Counts for availability <span style="color:var(--cm-fg-faint)">· off for break / off-season</span></label>
        </div>
      </div>

      <!-- ── Competitions ──────────────────────────────────────── -->
      <div class="ap-card is-hidden" id="apCompsCard" style="margin-top:16px">
        <div class="ap-card-h">
          <div class="ic"><i class="ti ti-trophy" style="font-size:18px;color:var(--cm-fg-muted)"></i></div>
          <div>
            <div class="t">Competitions</div>
            <div class="d" id="apCompsSub">—</div>
          </div>
        </div>

        <div id="apCompsList"></div>

        <div style="margin-top:16px;padding-top:15px;border-top:1px solid var(--cm-border)">
          <div class="ap-grid-comp">
            <div class="ap-field"><label>Name</label><input id="apCompName" placeholder="New competition"></div>
            <div class="ap-field"><label>Type</label><select id="apCompType" onchange="apOnCompTypeChange()">
              <option value="league">League</option>
              <option value="cup">Cup</option>
              <option value="international">International</option>
              <option value="friendly">Friendly</option>
              <option value="supercup">Supercup</option>
            </select></div>
            <div class="ap-field"><label>Color</label><input type="color" id="apCompColor" value="#185FA5" style="height:36px;padding:2px;cursor:pointer"></div>
            <button class="ap-btn primary" onclick="apAddComp()">Add</button>
          </div>
        </div>
      </div>

      <!-- ── Matches ───────────────────────────────────────────── -->
      <div class="ap-card is-hidden" id="apMatchesCard" style="margin-top:16px">
        <div class="ap-card-h">
          <div class="ic"><i class="ti ti-ball-football" style="font-size:18px;color:var(--cm-fg-muted)"></i></div>
          <div>
            <div class="t">Matches</div>
            <div class="d" id="apMatchesSub">—</div>
          </div>
          <button class="ap-btn" id="apImportToggle" onclick="apToggleImport()" style="margin-left:auto"><i class="ti ti-file-import" style="font-size:14px;vertical-align:-2px"></i> Import fixtures</button>
        </div>

        <div id="apImportPanel" class="is-hidden" style="margin-bottom:16px;padding:14px;background:var(--cm-bg-soft);border-radius:10px">
          <div style="font:600 10px/1 var(--cm-font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--cm-fg-muted);margin-bottom:8px">Drop a file (CSV, Excel or PDF) or browse</div>
          <label class="ap-dropzone" id="apDrop">
            <i class="ti ti-upload" style="font-size:20px"></i>
            <div style="font:500 12.5px/1.4 var(--cm-font-sans);margin-top:6px" id="apDropLabel">Drag &amp; drop a CSV, Excel or PDF here, or click to choose</div>
            <input type="file" id="apImpFile" accept=".csv,.txt,.xlsx,.xls,.pdf" style="display:none">
          </label>
          <div style="display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--cm-fg-faint);font:var(--cm-body-sm)"><span style="flex:1;height:1px;background:var(--cm-border)"></span>or paste<span style="flex:1;height:1px;background:var(--cm-border)"></span></div>
          <textarea class="ap-ta" id="apImpPaste" placeholder="date, opponent, home_away, competition, time&#10;2025-08-18, Real Madrid, home, La Liga, 21:00&#10;25/08/2025, Sevilla, away, La Liga"></textarea>
          <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="ap-btn" onclick="apImportParse()"><i class="ti ti-scan" style="font-size:14px;vertical-align:-2px"></i> Parse &amp; preview</button></div>

          <div id="apImpPreview" class="is-hidden" style="margin-top:14px">
            <div id="apImpNewComps"></div>
            <div class="ap-imp-wrap" style="margin-top:10px"><table class="ap-imp-table"><thead><tr><th>Date</th><th>Opponent</th><th style="text-align:center">H/A</th><th>Competition</th><th style="text-align:center"></th></tr></thead><tbody id="apImpBody"></tbody></table></div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
              <span id="apImpSummary" style="font:var(--cm-body-sm);color:var(--cm-fg-muted)"></span>
              <span style="margin-left:auto;display:inline-flex;gap:8px">
                <button class="ap-btn" onclick="apToggleImport()">Cancel</button>
                <button class="ap-btn primary" id="apImpConfirm" onclick="apImportConfirm()">Import</button>
              </span>
            </div>
          </div>
        </div>

        <div id="apMatchesList"></div>
      </div>

      <!-- ── Timeline ──────────────────────────────────────────── -->
      <div class="ap-card is-hidden" id="apTimelineCard" style="margin-top:16px">
        <div class="ap-card-h">
          <div class="ic"><i class="ti ti-timeline" style="font-size:18px;color:var(--cm-fg-muted)"></i></div>
          <div>
            <div class="t">Timeline</div>
            <div class="d" id="apTimelineSub">—</div>
          </div>
        </div>
        <div id="apTimelineBody"></div>
        <div id="apTimelineLegend" style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-top:1px solid var(--cm-border);margin-top:12px;padding-top:11px;font:var(--cm-body-sm);color:var(--cm-fg-faint)"></div>
      </div>
    </section>
    </main>
  </div>

<script>
let _apClubId = null, _apTeamId = null;
let _apSeasons = [];
let _apSeasonId = null, _apSeasonStart = null, _apSeasonEnd = null;
let _apPhaseTypes = [], _apPhases = [];

function apOnTeamChange(){
  const v = document.getElementById('apTeamSelect').value;
  if (v) { sessionStorage.setItem('cal_active_team', v); localStorage.setItem('cal_active_team', v); }
  location.reload();
}

async function apInitTeam(){
  const sel = document.getElementById('apTeamSelect');
  let teams = [];
  try {
    const { data } = await window.sb.from('teams').select('id,name').eq('club_id', _apClubId).order('name');
    teams = data || [];
  } catch(_) {}

  // Coach: restringir a sus categorías (mismo patrón que el resto de módulos).
  try {
    const profile = await window.getProfile();
    const role = (profile?.role || '').toLowerCase();
    const fullAccess = ['admin','owner','super-admin','super_admin'].includes(role) || profile?.is_super_admin;
    if (!fullAccess) {
      const mine = (await window.sb.rpc('my_team_ids')).data || [];
      if (mine.length) teams = teams.filter(t => mine.includes(t.id));
    }
  } catch(_) {}

  const saved = sessionStorage.getItem('cal_active_team') || localStorage.getItem('cal_active_team');
  _apTeamId = (saved && teams.some(t => t.id === saved)) ? saved : (teams[0]?.id || null);

  sel.innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('') || '<option value="">No teams</option>';
  if (_apTeamId) sel.value = _apTeamId;
}

/* ── Phases ───────────────────────────────────────────────── */
function apDays(a, b){ return Math.max(0, (Date.parse(b) - Date.parse(a)) / 86400000); }
function apClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

async function apLoadPhases(){
  const { data } = await window.sb.from('season_phases').select('*').eq('season_id', _apSeasonId).order('start_date');
  _apPhases = data || [];
  apRenderTimeline();
  apRenderPhasesList();
}

function apRenderTimeline(){
  const tl = document.getElementById('apTimeline');
  const total = apDays(_apSeasonStart, _apSeasonEnd) || 1;
  let html = '';
  if (!_apPhases.length) {
    html = `<div class="ap-tl-empty">No phases yet — add one below</div>`;
  } else {
    _apPhases.forEach(p => {
      let left = apClamp(apDays(_apSeasonStart, p.start_date) / total * 100, 0, 100);
      let width = apClamp(apDays(p.start_date, p.end_date) / total * 100, 0, 100 - left);
      const noCount = p.counts_availability ? '' : ' no-count';
      const lbl = width > 9 ? p.name : '';
      html += `<div class="ap-tl-seg${noCount}" style="left:${left}%;width:${width}%;background:${p.color}" title="${p.name}">${lbl}</div>`;
    });
  }
  const today = new Date().toISOString().slice(0,10);
  if (today >= _apSeasonStart && today <= _apSeasonEnd) {
    const pos = apClamp(apDays(_apSeasonStart, today) / total * 100, 0, 100);
    html += `<div class="ap-tl-today" style="left:${pos}%" title="Today"></div>`;
  }
  tl.innerHTML = html;
}

function apToggleImport(){

function apParseDate(s){
  s = (s || '').trim();
  let m;
  if (m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if (m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function apNormHA(s){
  s = (s || '').trim().toLowerCase();
  return ['away','a','visitante','v','fuera'].includes(s) ? 'away' : 'home';
}
function apNormTime(s){
  const m = (s || '').trim().match(/^(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : '';
}

function apParseDelimited(text){
  const lines = (text || '').replace(/\r/g,'').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  const head = lines[0].split(delim).map(s => s.trim().toLowerCase());
  const KNOWN = ['date','opponent','rival','home_away','home/away','h/a','ha','competition','comp','time','kickoff'];
  const hasHeader = head.some(h => KNOWN.includes(h));
  let cols = { date:0, opp:1, ha:2, comp:3, time:4 }, start = 0;
  if (hasHeader) {
    cols = {};
    head.forEach((h,i) => {
      if (h==='date') cols.date=i;
      else if (h==='opponent'||h==='rival') cols.opp=i;
      else if (h==='home_away'||h==='home/away'||h==='h/a'||h==='ha') cols.ha=i;
      else if (h==='competition'||h==='comp') cols.comp=i;
      else if (h==='time'||h==='kickoff') cols.time=i;
    });
    start = 1;
  }
  const rows = [];
  for (let i = start; i < lines.length; i++){
    const p = lines[i].split(delim).map(s => s.trim());
    const date = apParseDate(p[cols.date] ?? '');
    const opponent = (cols.opp != null ? (p[cols.opp] ?? '') : '').trim();
    rows.push({
      raw: lines[i],
      rawDate: (p[cols.date] ?? '').trim(),
      date, opponent,
      home_away: apNormHA(cols.ha != null ? p[cols.ha] : ''),
      competition: (cols.comp != null ? (p[cols.comp] ?? '') : '').trim(),
      time: (cols.time != null ? apNormTime(p[cols.time] ?? '') : ''),
      valid: !!date && !!opponent
    });
  }
  return rows;
}

function apImportParse(){
  const text = document.getElementById('apImpPaste').value;
  _apImportRows = apParseDelimited(text);
  const existing = new Set(_apComps.map(c => (c.name || '').toLowerCase()));
  _apImportNewComps = [...new Set(
    _apImportRows.filter(r => r.competition).map(r => r.competition)
      .filter(n => !existing.has(n.toLowerCase()))
  )];
  apRenderImportPreview();
}

function apRenderImportPreview(){
  const prev = document.getElementById('apImpPreview');
  if (!_apImportRows.length) { prev.classList.add('is-hidden'); alert('Nothing to parse. Check the format.'); return; }

      <i class="ti ti-alert-circle" style="font-size:16px;flex:0 0 auto;margin-top:1px;color:var(--cm-warning,#d97706)"></i>
      <span>${_apImportNewComps.length} new competition${_apImportNewComps.length>1?'s':''} will be created: <b>${_apImportNewComps.join('</b>, <b>')}</b>. You can edit type/color afterwards.</span></div>`;
  } else nc.innerHTML = '';

  document.getElementById('apImpBody').innerHTML = _apImportRows.map(r => `
    <tr class="${r.valid?'':'bad'}">
      <td style="font-family:var(--cm-font-mono)">${r.valid ? apFmtDate(r.date) : (r.rawDate || '—')}</td>
      <td>${r.opponent || '—'}</td>
      <td style="text-align:center">${r.home_away==='away'?'A':'H'}</td>
      <td>${r.competition || '<span style="color:var(--cm-fg-faint)">—</span>'}</td>
      <td style="text-align:center">${r.valid
        ? '<i class="ti ti-check" style="color:var(--cm-success,#16a34a);font-size:15px"></i>'
        : '<i class="ti ti-alert-triangle" style="color:var(--cm-danger,#dc2626);font-size:15px" title="Unparseable date or missing opponent"></i>'}</td>
    </tr>`).join('');

  const ok = _apImportRows.filter(r => r.valid).length, bad = _apImportRows.length - ok;
  document.getElementById('apImpSummary').textContent = `${ok} valid${bad?` · ${bad} flagged (skipped)`:''}`;
  document.getElementById('apImpConfirm').textContent = ok ? `Import ${ok} match${ok>1?'es':''}` : 'Import';
}

async function apImportConfirm(){
  const valid = _apImportRows.filter(r => r.valid);
  if (!valid.length) { alert('No valid rows to import.'); return; }
  const btn = document.getElementById('apImpConfirm');
  btn.disabled = true;

  const compByName = {}, compTypeByName = {};
  _apComps.forEach(c => { compByName[(c.name || '').toLowerCase()] = c.id; compTypeByName[(c.name || '').toLowerCase()] = c.comp_type; });
  for (const name of _apImportNewComps){
    const { data, error } = await window.sb.from('competitions')
      .insert({ season_id: _apSeasonId, name, comp_type: 'league', color: COMP_TYPES.league.color })
      .select('id').single();
    if (error) { btn.disabled = false; alert(`Could not create competition "${name}": ${error.message}`); return; }
    compByName[name.toLowerCase()] = data.id;
    compTypeByName[name.toLowerCase()] = 'league';
  }

  // calendar_events.competition is a constrained CLASS (league/cup/international/friendly), not the name.
  // The real competition (name + color) lives in competition_id.
  const LEGACY_COMP = { league:'league', cup:'cup', international:'international', friendly:'friendly', supercup:'cup' };
  const legacyComp = (f) => {
    const ct = f.competition ? compTypeByName[f.competition.toLowerCase()] : null;
    return ct ? (LEGACY_COMP[ct] || null) : null;
  };

  const rows = valid.map(f => ({
    id: crypto.randomUUID(),
    club_id: _apClubId, team_id: _apTeamId, season_id: _apSeasonId,
    competition_id: f.competition ? (compByName[f.competition.toLowerCase()] || null) : null,
    title: `vs ${f.opponent}`, type: 'match', date: f.date,
    opponent: f.opponent, home_away: f.home_away,
    competition: legacyComp(f), start_time: f.time || null,
    duration_minutes: null
  }));
  const { error } = await window.sb.from('calendar_events').insert(rows);
  btn.disabled = false;
  if (error) { alert('Could not import: ' + error.message); return; }

  apToggleImport();
  await apLoadComps();
  await apLoadMatches();
}

function apWireImport(){
  const drop = document.getElementById('apDrop'), file = document.getElementById('apImpFile');
  if (!drop || !file) return;
  ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','dragend'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('drag')));
  drop.addEventListener('drop', async e => { e.preventDefault(); drop.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) await apReadFile(f); });
  file.addEventListener('change', async function(){ if (this.files[0]) await apReadFile(this.files[0]); });
}
async function apReadFile(f){
  document.getElementById('apDropLabel').textContent = f.name;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') return apReadXlsx(f);
  if (ext === 'pdf') return apReadPdf(f);
  const text = await f.text();
  document.getElementById('apImpPaste').value = text;
  apImportParse();
}

async function apReadXlsx(f){
  if (!window.XLSX) { alert('Excel support is still loading — try again in a moment.'); return; }
  try {
    const buf = await f.arrayBuffer();
    const wb  = XLSX.read(buf, { type: 'array' });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const csv = XLSX.utils.sheet_to_csv(ws);
    document.getElementById('apImpPaste').value = csv;
    apImportParse();
  } catch (e) { alert('Could not read the Excel file: ' + e.message); }
}

async function apReadPdf(f){
  if (!window.pdfjsLib) { alert('PDF support is still loading — try again in a moment.'); return; }
  try {
    if (pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
    const buf = await f.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const lines = [];
    for (let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const byY = {};
      content.items.forEach(it => {
        const y = Math.round(it.transform[5]);
        (byY[y] = byY[y] || []).push(it);
      });
      Object.keys(byY).sort((a,b) => b - a).forEach(y => {
        const row = byY[y].sort((a,b) => a.transform[4] - b.transform[4]).map(it => it.str.trim()).filter(Boolean);
        if (row.length) lines.push(row.join(', '));
      });
    }
    document.getElementById('apImpPaste').value = lines.join('\n');
    apImportParse();
  } catch (e) { alert('Could not read the PDF: ' + e.message + '. If it is a scanned PDF, paste the fixtures as text instead.'); }
}

/* ── Timeline (static render) ──────────────────────────────── */
let _apTL = { phases:[], matches:[], comps:[], macros:[], mesos:[], micros:[] };

async function apLoadTimeline(){
  const sStart = _apSeasonStart, sEnd = _apSeasonEnd;
  let miq = window.sb.from('microcycles').select('name,start_date,end_date').lte('start_date', sEnd).gte('end_date', sStart).order('start_date');
  if (_apTeamId) miq = miq.eq('team_id', _apTeamId);
  const [ma, me, mi] = await Promise.all([
    window.sb.from('macrocycles').select('name,objective,start_date,end_date,color').eq('season_id', _apSeasonId).order('start_date'),
    window.sb.from('mesocycles').select('name,objective,start_date,end_date,macrocycles!inner(season_id)').eq('macrocycles.season_id', _apSeasonId).order('start_date'),
    miq
  ]);
  _apTL = {
    phases: _apPhases || [],
    matches: _apMatches || [],
    comps: _apComps || [],
    macros: ma.data || [], mesos: me.data || [], micros: mi.data || []
  };
  apTLRender();
}

function apTLpos(start, end){
  const total = apDays(_apSeasonStart, _apSeasonEnd) || 1;
  const left = apClamp(apDays(_apSeasonStart, start) / total * 100, 0, 100);
  const width = apClamp(apDays(start, end) / total * 100, 0, 100 - left);
  return { left, width };
}

function apTLMonthMarks(){
  const start = new Date(_apSeasonStart + 'T00:00:00'), end = new Date(_apSeasonEnd + 'T00:00:00');
  const total = apDays(_apSeasonStart, _apSeasonEnd) || 1;
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const marks = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  while (cur <= end){
    const next = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    const segStart = cur < start ? start : cur;
    const segEnd = next > end ? end : next;
    const left = (segStart - start) / 86400000 / total * 100;
    const width = (segEnd - segStart) / 86400000 / total * 100;
    marks.push({ left, width, label: MON[cur.getMonth()] });
    cur = next;
  }
  return marks;
}

function apTLRender(){
  const total = apDays(_apSeasonStart, _apSeasonEnd) || 1;
  const marks = apTLMonthMarks();
  const compColor = {}; _apTL.comps.forEach(c => compColor[c.id] = c.color);
  const today = new Date().toISOString().slice(0,10);
  const todayPos = (today >= _apSeasonStart && today <= _apSeasonEnd) ? apClamp(apDays(_apSeasonStart, today) / total * 100, 0, 100) : null;

  const axis = marks.map(m => `<span style="position:absolute;left:${m.left}%;width:${m.width}%;text-align:center;font:500 10px/1 var(--cm-font-mono);color:var(--cm-fg-faint)">${m.label}</span>`).join('');
  const grid = marks.map(m => `<div style="position:absolute;top:0;bottom:0;left:${m.left}%;width:1px;background:var(--cm-border-soft,var(--cm-border));opacity:.45"></div>`).join('');

  const phases = _apTL.phases.length ? _apTL.phases.map(p => {
    const { left, width } = apTLpos(p.start_date, p.end_date);
    return `<div class="ap-tl-band${p.counts_availability?'':' nocount'}" style="left:${left}%;width:${width}%;background:${p.color}" title="${p.name}${p.counts_availability?'':' · does not count'}">${width>8?p.name:''}</div>`;
  }).join('') : `<span class="ap-tl-hint">No phases yet</span>`;

  const matches = _apTL.matches.length ? _apTL.matches.map(m => {
    const pos = apClamp(apDays(_apSeasonStart, m.date) / total * 100, 0, 100);
    const col = compColor[m.competition_id] || 'var(--cm-fg-muted)';
    return `<span class="ap-tl-dot" style="left:${pos}%;background:${col}" title="${apFmtDate(m.date)} · ${m.home_away==='away'?'@ ':'vs '}${m.opponent||''}"></span>`;
  }).join('') : `<span class="ap-tl-hint">No matches yet</span>`;

  const macros = _apTL.macros.length ? _apTL.macros.map(mc => {
    const { left, width } = apTLpos(mc.start_date, mc.end_date);
    const col = mc.color || '#534AB7';
    return `<div style="position:absolute;left:${left}%;width:${width}%;top:0;bottom:0;background:color-mix(in srgb, ${col} 16%, transparent);border:.5px solid ${col};border-radius:5px;padding:0 7px;display:flex;flex-direction:column;justify-content:center;overflow:hidden" title="${mc.name}${mc.objective?' · '+mc.objective:''}"><span style="font:600 10px/1.1 var(--cm-font-sans);color:var(--cm-fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${mc.name}</span>${mc.objective?`<span style="font:500 8.5px/1.2 var(--cm-font-sans);color:var(--cm-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${mc.objective}</span>`:''}</div>`;
  }).join('') : `<span class="ap-tl-hint">No macrocycles yet — add them in Periodization</span>`;

  const mesos = _apTL.mesos.length ? _apTL.mesos.map(ms => {
    const { left, width } = apTLpos(ms.start_date, ms.end_date);
    return `<div style="position:absolute;left:${left}%;width:${width}%;top:0;bottom:0;background:var(--cm-bg-soft);border:.5px solid var(--cm-border);border-radius:4px;display:flex;align-items:center;justify-content:center;font:500 9px/1 var(--cm-font-sans);color:var(--cm-fg-muted);overflow:hidden;white-space:nowrap;padding:0 4px" title="${ms.name}${ms.objective?' · '+ms.objective:''}">${width>6?ms.name:''}</div>`;
  }).join('') : `<span class="ap-tl-hint">No mesocycles yet</span>`;

  const micros = _apTL.micros.length ? _apTL.micros.map(mi => {
    const { left, width } = apTLpos(mi.start_date, mi.end_date);
    return `<div style="position:absolute;left:${left}%;width:${Math.max(width,0.4)}%;top:2px;bottom:2px;background:var(--cm-border);border-radius:2px" title="${mi.name||'Microcycle'} · ${mi.start_date} → ${mi.end_date}"></div>`;
  }).join('') : `<span class="ap-tl-hint">No microcycles in this range</span>`;

  const todayLine = todayPos != null ? `<div class="ap-tl-today" style="left:${todayPos}%"></div>` : '';

  document.getElementById('apTimelineSub').textContent = `${_apTL.matches.length} match${_apTL.matches.length===1?'':'es'} · ${_apTL.micros.length} microcycle${_apTL.micros.length===1?'':'s'}`;
  document.getElementById('apTimelineBody').innerHTML = `
    <div class="ap-tl-axis">${axis}</div>
    <div style="position:relative">
      ${grid}${todayLine}
      <div class="ap-tl-lane-lbl">Phases</div><div class="ap-tl-track" style="height:22px">${phases}</div>
      <div class="ap-tl-lane-lbl">Matches</div><div class="ap-tl-track" style="height:16px">${matches}</div>
      <div class="ap-tl-lane-lbl">Macrocycles</div><div class="ap-tl-track" style="height:30px">${macros}</div>
      <div class="ap-tl-lane-lbl">Mesocycles</div><div class="ap-tl-track" style="height:20px">${mesos}</div>
      <div class="ap-tl-lane-lbl">Microcycles · synced with Calendar</div><div class="ap-tl-track" style="height:12px">${micros}</div>
    </div>`;

  const leg = document.getElementById('apTimelineLegend');
  leg.innerHTML = _apTL.comps.length
    ? _apTL.comps.map(c => `<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${c.color}"></span>${c.name}</span>`).join('')
    : '<span>No competitions yet</span>';
}

/* ── Date picker (calendar popover) ───────────────────────── */
function apFmtDate(v){
  if(!v) return null;
  const d = new Date(v + 'T00:00:00');
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return `${dow}, ${d.getDate()} ${mon} ${d.getFullYear()}`;
}
function apSyncDateBtn(id){
  const inp = document.getElementById(id), btn = document.getElementById(id + '_btn');
  if(!inp || !btn) return;
  const lbl = btn.querySelector('.lbl');
  if(inp.value){ lbl.textContent = apFmtDate(inp.value); lbl.classList.remove('ph'); }
  else { lbl.textContent = 'Select date'; lbl.classList.add('ph'); }
}
let _apCalEl = null, _apCalFor = null, _apCalMonth = null;
function apOpenCal(id, anchor){
  if(_apCalEl && _apCalFor === id){ apCloseCal(); return; }
  apCloseCal();
  _apCalFor = id;
  const inp = document.getElementById(id);
  const base = inp.value ? new Date(inp.value + 'T00:00:00') : new Date();
  _apCalMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  _apCalEl = document.createElement('div');
  _apCalEl.className = 'ap-cal';
  document.body.appendChild(_apCalEl);
  apRenderCal();
  const r = anchor.getBoundingClientRect();
  _apCalEl.style.top  = (window.scrollY + r.bottom + 6) + 'px';
  _apCalEl.style.left = (window.scrollX + r.left) + 'px';
  setTimeout(() => document.addEventListener('click', apCalOutside), 0);
}
function apCalOutside(e){
  if(_apCalEl && !_apCalEl.contains(e.target) && !e.target.closest('.ap-datebtn')) apCloseCal();
}
function apCloseCal(){
  if(_apCalEl){ _apCalEl.remove(); _apCalEl = null; _apCalFor = null; document.removeEventListener('click', apCalOutside); }
}
function apCalNav(delta){
  _apCalMonth = new Date(_apCalMonth.getFullYear(), _apCalMonth.getMonth() + delta, 1);
  apRenderCal();
}
function apRenderCal(){
  const y = _apCalMonth.getFullYear(), m = _apCalMonth.getMonth();
  const monNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const selV = document.getElementById(_apCalFor).value;
  const today = new Date().toISOString().slice(0,10);
  const first = new Date(y, m, 1).getDay();
  const daysIn = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for(let i = 0; i < first; i++) cells += '<div></div>';
  for(let d = 1; d <= daysIn; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = 'ap-cal-day' + (ds === selV ? ' is-sel' : '') + (ds === today ? ' is-today' : '');
    cells += `<div class="${cls}" onclick="apPickDay('${ds}')">${d}</div>`;
  }
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => `<div class="ap-cal-dow">${d}</div>`).join('');
  _apCalEl.innerHTML =
    `<div class="ap-cal-head">
       <button type="button" onclick="event.stopPropagation(); apCalNav(-1)"><i class="ti ti-chevron-left"></i></button>
       <span class="ap-cal-title">${monNames[m]} ${y}</span>
       <button type="button" onclick="event.stopPropagation(); apCalNav(1)"><i class="ti ti-chevron-right"></i></button>
     </div>
     <div class="ap-cal-grid">${dows}${cells}</div>`;
}
function apPickDay(ds){
  const inp = document.getElementById(_apCalFor);
  inp.value = ds;
  apSyncDateBtn(_apCalFor);
  apCloseCal();
}
